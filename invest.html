<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<script src="jag-theme.js?v=2"></script>
<title>Portal de Inversionista — JAG Real Estate</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w==" crossorigin="anonymous" referrerpolicy="no-referrer">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
:root{
  --ink:#17161c; --paper:#fff; --card:#f5f5f7; --line:#dddde3;
  --buy:#c8102e; --buy-d:#a30d26; --buy-t:#fdecef;
  --loan:#2653d9; --loan-t:#eaf0ff;
  --ok:#1a5c31; --ok-bg:#e9f5ec;
  --warn:#8a5a00; --warn-bg:#fff4dc;
  --muted:#5f5e68; --soft:#85848d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--loan);outline-offset:2px}
[hidden]{display:none!important}

header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1200}
.hin{height:60px;padding:0 20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.hl,.hr{display:flex;align-items:center;gap:6px}
.hr{justify-content:flex-end}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;justify-self:center}
.lock{display:flex;flex-direction:column;line-height:1;align-items:center}
.lock small{font-size:7px;letter-spacing:.32em;font-weight:700;color:var(--muted);text-transform:uppercase}
.lock b{font-size:25px;font-weight:800;letter-spacing:-.02em;color:var(--buy)}
.lock i{font-style:normal;font-size:8px;letter-spacing:.3em;font-weight:700;text-transform:uppercase}
.brok{font-size:10.5px;font-weight:700;color:var(--muted);border-left:1px solid var(--line);padding-left:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:#fff;border-radius:20px;padding:5px 10px}
.pill i{font-style:normal;background:var(--buy);border-radius:10px;padding:1px 6px;font-size:10px}
.langs{display:flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden;margin-left:6px}
.langs button{border:0;background:transparent;font-size:12px;font-weight:800;padding:6px 10px}
.langs button.on{background:var(--ink);color:#fff}

.wrap{max-width:1180px;margin:0 auto;padding:0 20px 60px}
.hello{padding:28px 0 4px}
.hello h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px;line-height:1.15}
.hello p{margin:0;color:var(--muted)}

.gate{max-width:560px;margin:60px auto;text-align:center;background:var(--card);border-radius:18px;padding:34px 26px}
.gate h1{font-size:26px;margin:0 0 8px;letter-spacing:-.02em}
.gate p{color:var(--muted);margin:0 0 18px}
.lockic{width:54px;height:54px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;margin:0 auto 14px}
.lockic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;background:var(--buy);color:#fff;font-weight:800;padding:12px 18px;text-decoration:none}
.btn:hover{background:var(--buy-d)}
.btn:disabled{opacity:.55;cursor:default}
.btn.alt{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.alt:hover{background:var(--card)}
.btn.dark{background:var(--ink)}
.lnk{border:0;background:none;font-weight:700;color:var(--loan);padding:4px;text-decoration:none;font-size:14px}

.search{display:flex;gap:10px;margin:18px 0 6px;flex-wrap:wrap}
.search input{flex:1;min-width:240px;border:1.5px solid var(--ink);border-radius:12px;padding:14px 16px;font-size:16px;background:#fff}
.search .btn{padding:14px 22px;font-size:16px}
.fix{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.fix summary{cursor:pointer;font-weight:700;color:var(--loan);display:inline}
.fixrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.fixrow label{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.fixrow input{width:110px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
.meta{font-size:13px;color:var(--soft);margin-top:6px}

.busy{display:flex;gap:12px;align-items:center;padding:30px 0;color:var(--muted);font-weight:600}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--buy);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:var(--buy-t);color:var(--buy-d);border-radius:12px;padding:14px 16px;font-weight:600;margin:14px 0}

.card{background:#fff;border-radius:16px;box-shadow:0 0 0 1px var(--line);padding:20px;margin-top:18px}
.card h2{font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
.card .sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:800;text-transform:uppercase;color:var(--buy)}

.prop{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.prop .addr{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.25;margin:2px 0 8px}
.specs{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14.5px}
.specs b{font-weight:800}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-top:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700;text-align:right}
.asis{background:var(--card);border-radius:12px;padding:14px 16px}
.asis .big{font-size:24px;font-weight:800;letter-spacing:-.01em}
.asis small{display:block;color:var(--muted);font-size:12.5px}

.scen{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sc{border-radius:14px;padding:16px;background:var(--card);position:relative}
.sc.mid{background:var(--ink);color:#fff}
.sc.mid .lab,.sc.mid .ps{color:#c9c8d0}
.sc .lab{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sc .v{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.sc .ps{font-size:13px;color:var(--muted)}
.sc .pf{margin-top:10px;padding-top:10px;border-top:1px solid rgba(127,127,140,.3);font-size:14px;display:flex;justify-content:space-between;gap:8px}
.sc .pf b{font-size:16px}
.pos{color:var(--ok)}
.neg{color:var(--buy)}
.sc.mid .pos{color:#7ee2a0}
.sc.mid .neg{color:#ff8a9b}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.chip{font-size:12.5px;font-weight:700;border-radius:20px;padding:4px 10px;background:var(--card);color:var(--muted)}
.chip.hi{background:var(--ok-bg);color:var(--ok)}
.chip.md{background:var(--warn-bg);color:var(--warn)}
.chip.lo{background:var(--buy-t);color:var(--buy-d)}
.note{font-size:12.5px;color:var(--soft);margin-top:10px}

.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px;align-items:start}
.fs{border:0;margin:0 0 16px;padding:0}
.fs legend{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;padding:0}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.f3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fl,.calc>*,.comps>*,.prop>*{min-width:0}
.fl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden}
.inp span{padding:0 0 0 10px;color:var(--soft);font-weight:700}
.inp span.r{padding:0 10px 0 0}
.inp input,.inp select{border:0;background:transparent;padding:9px 10px;width:100%;min-width:0;font-weight:700;color:var(--ink);font-size:15px}
.inp input:focus,.inp select:focus{outline:none}
.inp:focus-within{box-shadow:0 0 0 2px var(--loan)}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:0;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.hint{font-size:12px;color:var(--soft);margin-top:4px}

.res{position:sticky;top:76px}
.grade{display:flex;align-items:center;gap:14px;border-radius:14px;padding:14px 16px;margin-bottom:12px}
.grade .g{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:26px;font-weight:800;color:#fff;flex:none}
.grade b{display:block;font-size:17px}
.grade span{font-size:13.5px}
.grade.A{background:var(--ok-bg)} .grade.A .g{background:var(--ok)}
.grade.B{background:var(--loan-t)} .grade.B .g{background:var(--loan)}
.grade.C{background:var(--warn-bg)} .grade.C .g{background:#b77900}
.grade.D{background:var(--buy-t)} .grade.D .g{background:var(--buy)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:6px 0 6px 8px;font-weight:800}
table.t th:first-child{text-align:left;padding-left:0}
table.t td{padding:7px 0 7px 8px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
table.t td:first-child{text-align:left;padding-left:0;color:var(--muted);font-weight:600;white-space:normal}
table.t tr.tot td{font-weight:800;color:var(--ink);font-size:15px}
table.t td.m{background:rgba(127,127,140,.08)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.kpi{background:var(--card);border-radius:12px;padding:12px 14px}
.kpi small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.kpi b{font-size:20px;letter-spacing:-.01em}
.kpi em{font-style:normal;display:block;font-size:12px;color:var(--soft)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

.comps{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
#map{height:460px;border-radius:12px;background:var(--card)}
.leaflet-container{font-family:inherit}
.clist{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.cp{display:flex;gap:10px;padding:10px;border-bottom:1px solid var(--line);align-items:flex-start}
.cp:last-child{border-bottom:0}
.cp.off{opacity:.45}
.cp input{margin-top:6px;width:18px;height:18px;accent-color:var(--buy);flex:none}
.cp .th{width:78px;height:58px;border-radius:8px;background:#e9e9ee center/cover no-repeat;flex:none;position:relative}
.cp .th i{position:absolute;top:4px;left:4px;font-style:normal;font-size:11px;font-weight:800;background:rgba(23,22,28,.85);color:#fff;border-radius:5px;padding:0 5px}
.cp .tx{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.cp .tx b{color:var(--ink);font-size:15px}
.cp .tx .a{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:5px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.tag.rem{background:var(--ok-bg);color:var(--ok)}
.tag.fix{background:var(--warn-bg);color:var(--warn)}
.tag.out{background:var(--buy-t);color:var(--buy-d)}
.cp .adj{font-size:12.5px;font-weight:700;color:var(--loan)}
.pin{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.subj{width:32px;height:32px;background:var(--buy);font-size:14px}

.lola{display:flex;gap:14px;align-items:flex-start}
.lola .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#c8102e,#6a0a1a);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
.lola .bx{flex:1;min-width:0}
.lola pre{white-space:pre-wrap;font-family:inherit;font-size:15px;line-height:1.6;margin:10px 0 0;background:var(--card);border-radius:12px;padding:14px 16px}
.lola pre strong{display:block;margin-top:6px}

.hist{display:flex;flex-direction:column}
.hi{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);text-decoration:none;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.hi:hover{background:var(--card)}
.hi .tx{flex:1;min-width:0}
.hi .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi .tx span{font-size:12.5px;color:var(--soft)}
.hi .nm{font-weight:800;text-align:right;font-size:14px}
.hi .nm small{display:block;font-size:12px;font-weight:700}
.disc{font-size:12px;color:var(--soft);margin-top:26px;line-height:1.55}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:10px;padding:11px 16px;font-weight:700;opacity:0;transition:.2s;z-index:3000;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}

/* round 2: flood, stress, rental, next steps, pipeline, finder, sheet */
.flood{margin-top:10px;border-radius:12px;padding:12px 14px;font-size:13.5px;background:var(--card)}
.flood b{display:block;font-size:15px;margin-bottom:2px}
.flood.high{background:var(--buy-t)} .flood.high b{color:var(--buy-d)}
.flood.moderate{background:var(--warn-bg)} .flood.moderate b{color:var(--warn)}
.flood.minimal{background:var(--ok-bg)} .flood.minimal b{color:var(--ok)}
.flood a{color:var(--loan);font-weight:700}
.items{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
.it:last-child{border-bottom:0}
.it input[type=checkbox]{width:17px;height:17px;accent-color:var(--buy);flex:none}
.it .nm{flex:1;min-width:0}
.it .nm small{display:block;color:var(--soft);font-size:11.5px}
.it .inp{width:118px;flex:none}
.it.off .nm{color:var(--soft)}
.itt{display:flex;justify-content:space-between;padding:10px;background:var(--card);font-weight:800}
.tabs2{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap;align-items:center}
.tabs2 button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font-weight:700;font-size:13.5px;color:var(--muted)}
.tabs2 button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs2 .sw2{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;cursor:pointer}
.tabs2 .sw2 input{width:17px;height:17px;accent-color:var(--loan)}
.femanote{font-size:12px;color:var(--soft);margin-top:8px}
.femanote a{color:var(--loan);font-weight:700}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.ok3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.st{width:100%;border-collapse:collapse;font-size:14px}
.st th{text-align:right;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 0 6px 8px}
.st th:first-child{text-align:left;padding-left:0}
.st td{padding:9px 0 9px 8px;border-top:1px solid var(--line);text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.st td:first-child{text-align:left;padding-left:0;font-weight:600;color:var(--muted)}
.st tr.base td{background:rgba(127,127,140,.07)}
.pst{display:flex;flex-wrap:wrap;gap:6px}
.pst button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;font-weight:700;font-size:13px;color:var(--muted)}
.pst button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.req{margin-top:12px;background:var(--card);border-radius:12px;padding:14px}
.req textarea,.wf input,.wf select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;font:inherit;resize:vertical}
.badge{display:inline-block;font-size:11px;font-weight:800;border-radius:10px;padding:2px 8px;background:var(--card);color:var(--muted);white-space:nowrap}
.badge.offer,.badge.contract{background:var(--loan-t);color:var(--loan)}
.badge.rehab,.badge.listed{background:var(--warn-bg);color:var(--warn)}
.badge.sold{background:var(--ok-bg);color:var(--ok)}
.badge.passed{background:var(--buy-t);color:var(--buy-d)}
.hf{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 8px}
.hf button{border:0;background:var(--card);border-radius:16px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--muted)}
.hf button.on{background:var(--ink);color:#fff}
.wl{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.w1{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.w1 .tx{flex:1;min-width:180px}
.w1 .tx b{display:block}
.w1 .tx span{font-size:12.5px;color:var(--soft)}
.wf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:var(--card);border-radius:12px;padding:14px}
.wf .full{grid-column:1/-1}
.fds{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:12px}
.fd{border-radius:12px;box-shadow:0 0 0 1px var(--line);overflow:hidden;background:#fff;display:flex;flex-direction:column}
.fd .ph{aspect-ratio:16/10;background:#e9e9ee center/cover no-repeat}
.fd .bd{padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.fd .why{font-size:11.5px;font-weight:800;color:var(--buy)}
.fd .a{font-weight:700}
.fd .n3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--muted);margin-top:4px}
.fd .n3 b{display:block;color:var(--ink);font-size:14.5px}
.fd .acts{margin-top:auto;padding-top:8px}
.fd .acts .btn{padding:9px 12px;font-size:14px}
.sheet{display:none}
@media print{
  @page{margin:12mm}
  body.printing > *:not(#sheet){display:none!important}
  body.printing #sheet{display:block}
}
.sheet{font-family:'Plus Jakarta Sans',Arial,sans-serif;color:#17161c;font-size:11.5px;line-height:1.4}
.sheet .sh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #c8102e;padding-bottom:8px;margin-bottom:10px}
.sheet .sh b{font-size:22px;color:#c8102e;letter-spacing:-.02em}
.sheet h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#6a6972;margin:12px 0 5px}
.sheet .g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sheet table{width:100%;border-collapse:collapse}
.sheet td,.sheet th{padding:3px 4px;border-bottom:1px solid #e3e3e8;text-align:right}
.sheet td:first-child,.sheet th:first-child{text-align:left}
.sheet .big{font-size:18px;font-weight:800}
.sheet .foot{margin-top:12px;font-size:9.5px;color:#6a6972;border-top:1px solid #e3e3e8;padding-top:6px}
@media (max-width:900px){

}

<body>
<header>
  <div class="hin">
    <div class="hl"><span class="pill"><span data-t="badge"></span><i>BETA</i></span></div>
    <a class="logo" href="index.html" aria-label="JAG Real Estate">
      <span class="lock"><small>Est. 2018</small><b>JAG</b><i>Real Estate</i></span>
      <span class="brok">eXp Realty</span>
    </a>
    <div class="hr">
      <span id="acct"></span>
      <span class="langs" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button>

  </div>
</header>

<main class="wrap">
  <div id="loading" class="busy" style="justify-content:center;padding:80px 0"><div class="spin"></div></div>

  <!-- signed out -->
  <div id="g_in" class="gate" hidden>
    <div class="lockic"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h1 data-t="gi_h"></h1>
    <p data-t="gi_p"></p>
    <button class="btn" type="button" id="g_in_btn" data-t="gi_btn"></button>
  </div>
  <!-- signed in, not invited -->
  <div id="g_no" class="gate" hidden>
    <div class="lockic"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h1 data-t="gn_h"></h1>
    <p data-t="gn_p"></p>
    <p style="font-size:13.5px" id="g_no_em"></p>
    <a class="btn alt" href="tel:+18327023574">(832) 702-3574</a>
  </div>

  <!-- the portal -->
  <div id="app" hidden>
    <div class="hello">
      <h1 id="hi"></h1>
      <p data-t="hi_p"></p>
    </div>
    <form class="search" id="sform" autocomplete="off">
      <input id="addr" type="text" inputmode="text" autocomplete="street-address" required minlength="6" data-tp="ph_addr" aria-label="Address">
      <button class="btn" type="submit" id="go" data-t="go"></button>
    </form>
    <details class="fix" id="fixd">
      <summary data-t="fix_s"></summary> <span data-t="fix_p"></span>
      <div class="fixrow">
        <label><span data-t="sqft"></span><input id="o_sqft" type="number" inputmode="numeric" min="300" max="20000"></label>
        <label><span data-t="beds"></span><input id="o_beds" type="number" inputmode="numeric" min="0" max="12"></label>
        <label><span data-t="baths"></span><input id="o_baths" type="number" inputmode="decimal" step="0.5" min="0" max="12"></label>
      </div>
    </details>
    <div class="meta" id="left"></div>

    <div id="busy" class="busy" hidden><div class="spin"></div><span data-t="busy"></span></div>
    <div id="err" class="err" hidden></div>

    <div id="out" hidden>
      <!-- property -->
      <section class="card">
        <div class="prop">
          <div>
            <div class="eyebrow" data-t="h_prop"></div>
            <div class="addr" id="p_addr"></div>
            <div class="specs" id="p_specs"></div>
            <dl class="kv" id="p_kv"></dl>
          </div>
          <div>
            <div class="asis" id="p_asis"></div>
            <div class="asis" id="p_fixer" style="margin-top:10px" hidden></div>
            <div class="flood" id="p_flood" hidden></div>
          </div>
        </div>
      </section>

      <!-- ARV -->
      <section class="card">
        <h2 data-t="h_arv"></h2>
        <p class="sub" data-t="h_arv_p"></p>
        <div class="scen" id="scen"></div>
        <div class="chips" id="arvchips"></div>
        <div class="fixrow" style="margin-top:12px">
          <label style="width:min(100%,320px)"><span data-t="own_arv"></span><span class="inp"><span>$</span><input id="own_arv" type="text" inputmode="numeric" data-tp="ph_own"></span></label>
        </div>
        <div class="note" id="arvnote"></div>
      </section>

      <!-- calculator -->
      <section class="card">
        <h2 data-t="h_calc"></h2>
        <p class="sub" data-t="h_calc_p"></p>
        <div class="calc">
          <div id="inputs">
            <fieldset class="fs"><legend data-t="l_buy"></legend>
              <div class="f2">
                <label class="fl"><span data-t="i_price"></span><span class="inp"><span>$</span><input data-k="price" type="text" inputmode="numeric"></span></label>
                <label class="fl"><span data-t="i_fee"></span><span class="inp"><span>$</span><input data-k="fee" type="text" inputmode="numeric"></span></label>
                <label class="fl"><span data-t="i_bclose"></span><span class="inp"><input data-k="bclose" type="text" inputmode="decimal"><span class="r">%</span></span></label>
              </div>
            </fieldset>
            <fieldset class="fs"><legend data-t="l_rehab"></legend>
              <div class="seg" id="rlevel">
                <button type="button" data-v="light"></button><button type="button" data-v="medium"></button><button type="button" data-v="heavy"></button><button type="button" data-v="items"></button><button type="button" data-v="custom"></button>
              </div>
              <div class="f2" style="margin-top:10px">
                <label class="fl"><span data-t="i_rate"></span><span class="inp"><span>$</span><input data-k="rate" type="text" inputmode="numeric"><span class="r" data-t="per_sf"></span></span></label>
                <label class="fl"><span data-t="i_rehab"></span><span class="inp"><span>$</span><input data-k="rehab" type="text" inputmode="numeric"></span></label>
                <label class="fl"><span data-t="i_cont"></span><span class="inp"><input data-k="cont" type="text" inputmode="decimal"><span class="r">%</span></span></label>
              </div>
              <div class="hint" id="rehabhint"></div>
              <div class="items" id="items" hidden></div>
            </fieldset>
            <fieldset class="fs"><legend data-t="l_fin"></legend>
              <div class="seg" id="fin"><button type="button" data-v="hm"></button><button type="button" data-v="cash"></button></div>
              <div class="f3" style="margin-top:10px" id="hmrow">
                <label class="fl"><span data-t="i_ltv"></span><span class="inp"><input data-k="ltv" type="text" inputmode="decimal"><span class="r">%</span></span></label>
                <label class="fl"><span data-t="i_rfin"></span><span class="inp"><input data-k="rfin" type="text" inputmode="decimal"><span class="r">%</span></span></label>
                <label class="fl"><span data-t="i_rate_i"></span><span class="inp"><input data-k="irate" type="text" inputmode="decimal"><span class="r">%</span></span></label>
                <label class="fl"><span data-t="i_pts"></span><span class="inp"><input data-k="pts" type="text" inputmode="decimal"><span class="r">%</span></span></label>
                <label class="fl"><span data-t="i_lfee"></span><span class="inp"><span>$</span><input data-k="lfee" type="text" inputmode="numeric"></span></label>
              </div>
            </fieldset>
            <fieldset class="fs"><legend data-t="l_hold"></legend>
              <div class="f3">
                <label class="fl"><span data-t="i_months"></span><span class="inp"><input data-k="months" type="text" inputmode="decimal"></span></label>
                <label class="fl"><span data-t="i_tax"></span><span class="inp"><span>$</span><input data-k="tax" type="text" inputmode="numeric"></span></label>
                <label class="fl"><span data-t="i_ins"></span><span class="inp"><span>$</span><input data-k="ins" type="text" inputmode="numeric"></span></label>
                <label class="fl"><span data-t="i_util"></span><span class="inp"><span>$</span><input data-k="util" type="text" inputmode="numeric"></span></label>
                <label class="fl"><span data-t="i_hoa"></span><span class="inp"><span>$</span><input data-k="hoa" type="text" inputmode="numeric"></span></label>
              </div>
            </fieldset>
            <fieldset class="fs"><legend data-t="l_sell"></legend>
              <div class="f3">
                <label class="fl"><span data-t="i_comm"></span><span class="inp"><input data-k="comm" type="text" inputmode="decimal"><span class="r">%</span></span></label>
                <label class="fl"><span data-t="i_sclose"></span><span class="inp"><input data-k="sclose" type="text" inputmode="decimal"><span class="r">%</span></span></label>
                <label class="fl"><span data-t="i_conc"></span><span class="inp"><input data-k="conc" type="text" inputmode="decimal"><span class="r">%</span></span></label>
              </div>
            </fieldset>
            <fieldset class="fs"><legend data-t="l_target"></legend>
              <div class="f2">
                <label class="fl"><span data-t="i_tpct"></span><span class="inp"><input data-k="tpct" type="text" inputmode="decimal"><span class="r">%</span></span></label>
                <label class="fl"><span data-t="i_tmin"></span><span class="inp"><span>$</span><input data-k="tmin" type="text" inputmode="numeric"></span></label>
              </div>
            </fieldset>
            <button type="button" class="lnk" id="reset" data-t="reset"></button>
          </div>
          <div class="res">
            <div class="grade" id="grade"></div>
            <table class="t" id="tbl"></table>
            <div class="kpis" id="kpis"></div>
            <div class="acts">
              <button type="button" class="btn dark" id="save" data-t="save"></button>
              <button type="button" class="btn alt" id="print" data-t="sheet"></button>
            </div>
          </div>
        </div>
      </section>

      <!-- stress test -->
      <section class="card" id="stresscard">
        <h2 data-t="h_stress"></h2>
        <p class="sub" data-t="h_stress_p"></p>
        <table class="st" id="stress"></table>
        <div class="kpis" id="bevens"></div>
      </section>

      <!-- rental / BRRRR -->

            <fieldset class="fs"><legend data-t="l_rentin"></legend>
              <div class="f3">
                <label class="fl"><span data-t="r_rent"></span><span class="inp"><span>$</span><input data-r="rent" type="text" inputmode="numeric"><span class="r" data-t="per_mo"></span></span></label>

                <label class="fl"><span data-t="r_capex"></span><span class="inp"><input data-r="capex" type="text" inputmode="decimal"><span class="r">%</span></span></label>

              <div class="hint" id="rentsrc"></div>

            <fieldset class="fs"><legend data-t="l_refi"></legend>

          <div class="acts"><button type="button" class="btn" id="reqsend" data-t="req_send"></button><button type="button" class="lnk" id="reqcancel" data-t="cancel"></button></div>
        </div>
      </section>

      <section class="card" id="lolacard">
        <div class="lola">
          <div class="av">L</div>
          <div class="bx">
            <h2 data-t="h_lola"></h2>
            <p class="sub" style="margin:0" data-t="h_lola_p"></p>

            <pre id="lolatx" hidden></pre>
            <div class="note" id="lolaat"></div>
          </div>
        </div>
      </section>

      <!-- comps -->
      <section class="card">
        <h2 data-t="h_comps"></h2>
        <p class="sub" id="compsub"></p>
        <div class="tabs2" id="ctabs">
          <button type="button" data-v="sold" class="on"></button><button type="button" data-v="active"></button>
          <label class="sw2"><input type="checkbox" id="femaon"><span data-t="fema_layer"></span></label>
        </div>
        <div class="comps">
          <div>
            <div id="map"></div>
            <div class="femanote" id="femanote"></div>
          </div>
          <div>
            <div class="clist" id="clist"></div>
            <div class="clist" id="alist" hidden></div>
          </div>
        </div>
      </section>
    </div>

    <section class="card" id="histcard" hidden>
      <h2 data-t="h_hist"></h2>
      <div class="hf" id="hfilter"></div>
      <div class="hist" id="hist"></div>
    </section>

    <section class="card" id="finder">
      <div class="eyebrow" data-t="f_eye"></div>
      <h2 data-t="h_finder"></h2>
      <p class="sub" data-t="h_finder_p"></p>
      <div class="wl" id="wlist"></div>
      <button type="button" class="btn alt" id="wnew" data-t="w_new"></button>
      <form class="wf" id="wform" hidden autocomplete="off">
        <input type="hidden" id="w_id">
        <label class="fl full"><span data-t="w_areas"></span><input id="w_areas" type="text" required data-tp="w_areas_ph"></label>
        <label class="fl"><span data-t="w_label"></span><input id="w_label" type="text" maxlength="60" data-tp="w_label_ph"></label>
        <label class="fl"><span data-t="w_min"></span><input id="w_min" type="text" inputmode="numeric" data-tp="any"></label>
        <label class="fl"><span data-t="w_max"></span><input id="w_max" type="text" inputmode="numeric" data-tp="any"></label>
        <label class="fl"><span data-t="w_beds"></span><select id="w_beds"><option value="">—</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
        <label class="fl"><span data-t="w_profit"></span><input id="w_profit" type="text" inputmode="numeric"></label>
        <label class="fl"><span data-t="w_sqft"></span><input id="w_sqmin" type="text" inputmode="numeric" data-tp="any"></label>
        <div class="acts full"><button type="submit" class="btn" data-t="w_save"></button><button type="button" class="lnk" id="wcancel" data-t="cancel"></button></div>
        <div class="err full" id="werr" hidden></div>
      </form>
      <h3 style="margin:22px 0 0;font-size:16px" data-t="f_found"></h3>
      <div class="fds" id="flist"></div>
    </section>

    <p class="disc" data-t="disc"></p>
  </div>
</main>

  function lang(){ try{ var v=localStorage.getItem('jag_lang'); if(v==='en'||v==='es') return v; }catch(e){} return 'es'; }
  function t(k, vars){ var s=(W[lang()]||W.es)[k]; if(s==null) s=W.es[k]||k; if(vars) Object.keys(vars).forEach(function(x){ s=s.split('{'+x+'}').join(vars[x]); }); return s; }
  function paintWords(){
    document.documentElement.lang=lang();
    document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent=t(el.getAttribute('data-t')); });
    document.querySelectorAll('[data-tp]').forEach(function(el){ el.placeholder=t(el.getAttribute('data-tp')); });
    document.querySelectorAll('.langs [data-lang]').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-lang')===lang()); });
    ['light','medium','heavy','items','custom'].forEach(function(v){ var b=document.querySelector('#rlevel [data-v="'+v+'"]'); if(b) b.textContent=t('lv_'+v); });
    document.querySelector('#fin [data-v="hm"]').textContent=t('fin_hm'); document.querySelector('#fin [data-v="cash"]').textContent=t('fin_cash');
    $('rehabhint').textContent=t('rehab_hint');
    if(ME){ paintHello(); paintFinder(); }
    if(RUN) paintAll();
  }
  document.querySelectorAll('.langs [data-lang]').forEach(function(b){ b.addEventListener('click',function(){ try{ localStorage.setItem('jag_lang', b.getAttribute('data-lang')); }catch(e){} paintWords(); if(A) A.relabel(); }); });

        '&bboxSR=3857&imageSR=3857&size='+ts.x+','+ts.y+'&layers=show:28&format=png32&transparent=true&f=image';
    }});
    return new FT('',{ opacity:.55, minZoom:11, maxZoom:19, attribution:'Flood zones: <a href="https://www.fema.gov/flood-maps/national-flood-hazard-layer" target="_blank" rel="noopener">FEMA NFHL</a>' });

  // when the server could not reach FEMA, the browser asks FEMA directly (FEMA allows it)

      var f=(j.features||[])[0]; if(!f) return { zone:null, risk:'unmapped' };
      var a=f.attributes||{}, z=String(a.FLD_ZONE||'').trim(), sub=a.ZONE_SUBTY||'', hi=a.SFHA_TF==='T'||/^(A|V)/.test(z), mod=!hi&&/0\.2 PCT|500/i.test(sub);
      return { zone:z, subtype:sub, sfha:hi, risk:hi?'high':mod?'moderate':z==='D'?'undetermined':'minimal', bfe:a.STATIC_BFE>-9000?a.STATIC_BFE:null };
    }).catch(function(){ return null; });

    var rc=(rr&&rr.comps)||[];
    $('rcomps').hidden=!rc.length;
    $('rcomps').innerHTML=rc.length?'<div class="cp" style="font-weight:800">'+esc(t('rc_h'))+'</div>'+rc.map(function(c){
      return '<div class="cp"><div class="tx"><b>'+money(c.rent)+esc(t('per_mo'))+'</b><div class="a">'+esc(c.address||'')+'</div><div>'+[c.beds!=null?c.beds+'/'+(c.baths!=null?c.baths:'?'):'', c.sqft?Number(c.sqft).toLocaleString('en-US')+' '+t('sqft').toLowerCase():'', c.miles!=null?t('mi',{n:c.miles}):''].filter(Boolean).map(esc).join(' · ')+'</div></div></div>'; }).join(''):'';
  }
  $('rinputs').addEventListener('input', function(e){ var k=e.target.getAttribute('data-r'); if(!k) return; RIN[k]=num(e.target.value); paintRent(); });
  $('rinputs').addEventListener('change', function(e){ var k=e.target.getAttribute('data-r'); if(k==='rent') e.target.value=RIN.rent?Math.round(RIN.rent).toLocaleString('en-US'):''; });

  /* ---------- next step: pipeline status, actual numbers, requests to Jason ---------- */
  function paintNext(){
    $('pstatus').innerHTML=PS.map(function(k){ return '<button type="button" data-s="'+k+'" class="'+(STATUS===k?'on':'')+'">'+esc(t('ps_'+k))+'</button>'; }).join('');
    var showA=['contract','rehab','listed','sold'].indexOf(STATUS)>=0;
    $('actual').hidden=!showA;
    document.querySelectorAll('#actual [data-a]').forEach(function(el){ var k=el.getAttribute('data-a'), v=ACT[k]; el.value=v==null||v===''?'':(k==='date'?v:Math.round(num(v)).toLocaleString('en-US')); });
    paintActual();
  }
  function paintActual(){
    if($('actual').hidden||!LAST) { if($('acmp')) $('acmp').innerHTML=''; return; }
    var est=LAST.D.mid.profit, sale=num(ACT.sale), I=IN;
    var real=sale?sale-sale*(I.comm+I.sclose+I.conc)/100-num(ACT.buy)-num(ACT.rehab)-num(ACT.other):null;
    $('acmp').innerHTML='<div class="kpi"><small>'+esc(t('ac_est'))+'</small><b>'+money(est)+'</b></div>'+
      '<div class="kpi"><small>'+esc(t('ac_real'))+'</small><b class="'+(real==null?'':real>=0?'pos':'neg')+'">'+(real==null?'—':money(real))+'</b><em>'+esc(t('ac_real_p'))+'</em></div>'+
      (real!=null?'<div class="kpi"><small>'+esc(t('ac_diff'))+'</small><b class="'+(real-est>=0?'pos':'neg')+'">'+money(real-est)+'</b></div>':'');
  }
  function saveStatus(quiet){
    if(!RUN||!RUN.id) return;
    A.rpc('jag_investor_set_status',{ p_id:RUN.id, p_status:STATUS, p_actual:ACT }).then(function(){ if(!quiet) toast(t('st_saved')); refreshMe(); }).catch(function(){ toast(t('e_gen')); });
  }
  $('pstatus').addEventListener('click', function(e){ var b=e.target.closest('[data-s]'); if(!b) return; STATUS=b.getAttribute('data-s'); paintNext(); saveStatus(false); });
  var actT;
  $('actual').addEventListener('input', function(e){ var k=e.target.getAttribute('data-a'); if(!k) return; ACT[k]=k==='date'?e.target.value:num(e.target.value); paintActual(); clearTimeout(actT); actT=setTimeout(function(){ saveStatus(true); },900); });
  $('actual').addEventListener('change', function(e){ var k=e.target.getAttribute('data-a'); if(k&&k!=='date') e.target.value=ACT[k]?Math.round(ACT[k]).toLocaleString('en-US'):''; });
  var REQ=null;
  function openReq(kind){
    REQ=kind; $('reqform').hidden=false; $('reqh').textContent=t(kind==='list'?'req_h_list':'req_h_lender'); $('reqdl').textContent=t(kind==='list'?'req_d_list':'req_d_lender');
    $('reqdate').value=''; $('reqnote').value=''; $('reqform').scrollIntoView({ behavior:'smooth', block:'center' });
  }
  $('reqlist').onclick=function(){ openReq('list'); };
  $('reqlender').onclick=function(){ openReq('lender'); };
  $('reqcancel').onclick=function(){ $('reqform').hidden=true; };
  $('reqsend').onclick=function(){
    if(!RUN||!RUN.id||!REQ) return; var b=$('reqsend'); b.disabled=true;
    saveDeal(true).then(function(){ return A.rpc('jag_investor_request',{ p_run:RUN.id, p_kind:REQ, p_note:$('reqnote').value.trim()||null, p_date:$('reqdate').value||null }); })
      .then(function(j){ if(!j||!j.ok) throw j; $('reqform').hidden=true; toast(t('req_ok')); })
      .catch(function(){ toast(t('e_gen')); }).then(function(){ b.disabled=false; });
  };
  $('sheetbtn').onclick=printSheet;

  /* ---------- comps tabs + FEMA layer ---------- */
  $('ctabs').addEventListener('click', function(e){ var b=e.target.closest('button[data-v]'); if(!b||!RUN) return; TAB=b.getAttribute('data-v'); paintActive(); drawMap(); });
  $('femaon').addEventListener('change', function(){ if(!RUN) return; drawMap(); if($('femaon').checked&&map&&map.getZoom()<12) map.setZoom(13); });

  /* ---------- deal finder ---------- */
  function paintFinder(){
    var W2=(ME&&ME.watches)||[], F=(ME&&ME.finds)||[];
    $('wlist').innerHTML=W2.map(function(w){
      var desc=t('w_desc',{a:(w.areas||[]).join(', '),p:w.max_price?k$(w.max_price):t('any').toLowerCase(),b:w.min_beds||0,g:k$(w.min_profit||30000)});
      return '<div class="w1"><div class="tx"><b>'+esc(w.label||(w.areas||[]).join(', '))+' <span class="badge '+(w.active?'sold':'')+'">'+esc(t(w.active?'w_on':'w_off'))+'</span></b><span>'+esc(desc)+' · '+esc(w.last_run_at?t('w_last',{d:dfmt(w.last_run_at)}):t('w_never'))+'</span></div>'+
        '<button type="button" class="lnk" data-wr="'+w.id+'">'+esc(t('w_run'))+'</button><button type="button" class="lnk" data-wt="'+w.id+'">'+esc(t(w.active?'w_off':'w_on'))+'</button>'+
        '<button type="button" class="lnk" data-we="'+w.id+'">'+esc(t('w_edit'))+'</button><button type="button" class="lnk" style="color:var(--buy)" data-wd="'+w.id+'">'+esc(t('w_del'))+'</button></div>';
    }).join('');
    $('wnew').hidden=W2.length>=5;
    var whyT=function(x){ return x==='fixer'?t('why_fixer'):x==='low_ppsf'?t('why_low'):x.indexOf('price_cut:')===0?t('why_cut',{v:k$(num(x.split(':')[1]))}):x.indexOf('dom:')===0?t('why_dom',{n:x.split(':')[1]}):x; };
    $('flist').innerHTML=F.length?F.map(function(f){
      var e=f.est||{}, ok=(e.profit&&e.profit.mid)>=(e.target||30000);
      return '<div class="fd"><div class="ph" style="'+(f.photo?'background-image:url(\''+CDN+esc(f.photo)+'?class=medium\')':'')+'"></div><div class="bd">'+
        '<div class="why">'+esc((f.why||[]).map(whyT).join(' · '))+'</div><div class="a">'+esc(f.address||'')+'</div>'+
        '<div class="n3"><span>'+esc(t('f_list'))+'<b>'+k$(f.list_price)+'</b></span><span>'+esc(t('f_arv'))+'<b>'+k$(f.arv&&f.arv.mid)+'</b></span><span>'+esc(t('f_offer'))+'<b class="pos">'+k$(e.max_offer)+'</b></span></div>'+
        '<div class="note" style="margin-top:4px">'+esc(ok?t('f_at_list',{v:money(e.profit.mid)}):t('f_need',{v:money(e.max_offer),p:e.below_list_pct,g:k$(e.target)}))+'</div>'+
        '<div class="acts"><button type="button" class="btn" data-fa="'+esc(f.address||'')+'">'+esc(t('f_analyze'))+'</button><button type="button" class="lnk" data-fd="'+f.id+'">'+esc(t('f_dismiss'))+'</button></div></div></div>';
    }).join(''):'<div class="note">'+esc(t('f_none'))+'</div>';
  }
  function watchForm(w){
    $('wform').hidden=false; $('werr').hidden=true;
    $('w_id').value=w?w.id:''; $('w_areas').value=w?(w.areas||[]).join(', '):''; $('w_label').value=w&&w.label||'';
    $('w_min').value=w&&w.min_price?Math.round(w.min_price).toLocaleString('en-US'):''; $('w_max').value=w&&w.max_price?Math.round(w.max_price).toLocaleString('en-US'):'';
    $('w_beds').value=w&&w.min_beds?String(w.min_beds):''; $('w_profit').value=Math.round((w&&w.min_profit)||30000).toLocaleString('en-US');
    $('w_sqmin').value=w&&w.min_sqft?Math.round(w.min_sqft).toLocaleString('en-US'):'';
    $('w_areas').focus();
  }
  $('wnew').onclick=function(){ watchForm(null); };
  $('wcancel').onclick=function(){ $('wform').hidden=true; };
  $('wform').addEventListener('submit', function(e){
    e.preventDefault();
    var areas=$('w_areas').value.split(',').map(function(x){ return x.trim(); }).filter(Boolean);
    if(!areas.length){ $('werr').textContent=t('w_needarea'); $('werr').hidden=false; return; }
    var cur=((ME&&ME.watches)||[]).filter(function(w){ return String(w.id)===$('w_id').value; })[0];
    var p={ id:$('w_id').value||null, areas:areas, label:$('w_label').value.trim()||null, min_price:num($('w_min').value)||null, max_price:num($('w_max').value)||null,
      min_beds:$('w_beds').value||null, min_profit:num($('w_profit').value)||30000, min_sqft:num($('w_sqmin').value)||null, active:cur?cur.active:true };
    A.rpc('jag_investor_watch_save',{ p:p }).then(function(j){
      if(!j||!j.ok){ $('werr').textContent=j&&j.reason==='max'?t('w_max5'):j&&j.reason==='areas'?t('w_needarea'):t('e_gen'); $('werr').hidden=false; return; }
      $('wform').hidden=true; refreshMe().then(function(){ if(!$('w_id').value) runWatch(j.id); });
    }).catch(function(){ $('werr').textContent=t('e_gen'); $('werr').hidden=false; });
  });
  function runWatch(id){
    toast(t('w_running'));
    call({ action:'scan_mine', watch_id:id }).then(function(j){
      var w=(j.watches||[])[0]||{};
      toast(w.skipped==='recent'?t('w_recent'):t('w_ran',{n:w.found||0})); refreshMe();
    }).catch(function(){ toast(t('e_gen')); });
  }
  $('wlist').addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return;
    var W2=(ME&&ME.watches)||[], get=function(attr){ var id=b.getAttribute(attr); return W2.filter(function(w){ return String(w.id)===id; })[0]; };
    if(b.hasAttribute('data-wr')) runWatch(Number(b.getAttribute('data-wr')));
    else if(b.hasAttribute('data-we')) watchForm(get('data-we'));
    else if(b.hasAttribute('data-wt')){ var w=get('data-wt'); A.rpc('jag_investor_watch_save',{ p:Object.assign({}, w, { active:!w.active }) }).then(refreshMe); }
    else if(b.hasAttribute('data-wd')){ if(b.dataset.sure){ A.rpc('jag_investor_watch_remove',{ p_id:Number(b.getAttribute('data-wd')) }).then(refreshMe); } else { b.dataset.sure='1'; b.textContent=lang()==='en'?'Tap again to remove':'Toque otra vez para quitar'; } }
  });
  $('flist').addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return;
    if(b.hasAttribute('data-fa')){ $('addr').value=b.getAttribute('data-fa'); window.scrollTo({ top:0, behavior:'smooth' }); analyze(); }
    if(b.hasAttribute('data-fd')){ A.rpc('jag_investor_find_dismiss',{ p_id:Number(b.getAttribute('data-fd')) }).then(refreshMe); }
  });

  /* ---------- one-page deal sheet (print / save as PDF) ---------- */
  function printSheet(){
    if(!RUN||!LAST) return;
    var r=RUN.result, s=r.subject||{}, D=LAST.D, I=IN, arv=LAST.arv, f=r.flood||{}, rent=LAST.rent;
    var row=function(a,b){ return '<tr><td>'+esc(a)+'</td><td>'+b+'</td></tr>'; };
    var kept=(r.comps||[]).filter(function(c){ return !EXCL[cid(c)] && c.cond!=='fixer'; }).slice(0,6);
    var lola=String(RUN.lola||'').split('\n').filter(Boolean).slice(0,2).join(' ');
    $('sheet').innerHTML='<div class="sh"><div><b>JAG</b> <span style="font-weight:700;letter-spacing:.2em;font-size:9px">REAL ESTATE · eXp REALTY</span><div style="font-size:16px;font-weight:800;margin-top:4px">'+esc(t('sh_title'))+' · '+esc(s.address||RUN.address)+'</div></div>'+
      '<div style="text-align:right">'+esc(new Date().toLocaleDateString(lang()==='en'?'en-US':'es-MX',{year:'numeric',month:'long',day:'numeric'}))+(ME&&ME.name?'<br>'+esc(t('sh_for'))+' '+esc(ME.name):'')+'</div></div>'+
      '<div class="g2"><div><h3>'+esc(t('h_prop'))+'</h3><table>'+
        row(t('beds')+' / '+t('baths'),esc((s.beds!=null?s.beds:'—')+' / '+(s.baths!=null?s.baths:'—')))+row(t('sqft'),s.sqft?Number(s.sqft).toLocaleString('en-US'):'—')+row(t('k_year'),esc(s.year||'—'))+
        row(t('k_sub'),esc(s.subdivision||'—'))+row(t('k_tax',{y:s.tax&&s.tax.year||''}),s.tax&&s.tax.total?money(s.tax.total):'—')+
        row('FEMA',esc((f.zone||'—')+(f.risk?' · '+t(f.risk==='high'?'fl_high':f.risk==='moderate'?'fl_moderate':'fl_minimal').split(/[.:]/)[0]:'')))+
        row(t('asis'),r.as_is?money(r.as_is.value):'—')+'</table></div>'+
      '<div><h3>'+esc(t('h_arv'))+'</h3><table><tr><th></th><th>'+esc(t('worst'))+'</th><th>'+esc(t('mid'))+'</th><th>'+esc(t('best'))+'</th></tr>'+
        '<tr><td>ARV</td><td>'+money(arv.worst)+'</td><td><b>'+money(arv.mid)+'</b></td><td>'+money(arv.best)+'</td></tr>'+
        '<tr><td>'+esc(t('t_profit'))+'</td><td>'+money(D.worst.profit)+'</td><td><b>'+money(D.mid.profit)+'</b></td><td>'+money(D.best.profit)+'</td></tr>'+
        '<tr><td>'+esc(t('s_margin'))+'</td><td>'+pctf(D.worst.margin,1)+'</td><td>'+pctf(D.mid.margin,1)+'</td><td>'+pctf(D.best.margin,1)+'</td></tr></table>'+
        '<div style="margin-top:6px">'+esc(t('g_'+LAST.g))+' ('+LAST.g+') · '+esc(t('conf_'+(r.confidence||'low')))+'</div></div></div>'+
      '<div class="g2"><div><h3>'+esc(t('h_calc'))+'</h3><table>'+
        row(t('i_price'),money(I.price))+(I.fee?row(t('i_fee'),money(I.fee)):'')+row(t('t_rehab'),money(D.rehabT))+row(t('t_bclose'),money(D.bclose))+
        (FIN==='hm'?row(t('t_fin'),money(D.fin)):'')+row(t('t_hold')+' ('+I.months+')',money(D.hold))+row(t('k_allin'),'<b>'+money(D.allin)+'</b>')+
        row(t('k_cash'),'<b>'+money(D.cash)+'</b>')+row(t('k_mao'),money(Math.max(0,LAST.mao)))+row(t('k_max'),LAST.M.price==null?'—':money(LAST.M.price))+'</table></div>'+
      '<div><h3>'+esc(t('h_stress'))+'</h3><table>'+Object.keys(LAST.stress||{}).map(function(k){ return row(t(k),money(LAST.stress[k])); }).join('')+
        row(t('be_price'),LAST.bePrice==null?'—':money(LAST.bePrice))+'</table>'+
        (rent&&RIN.rent?'<h3>'+esc(t('h_rent').split('(')[0])+'</h3><table>'+row(t('r_rent'),money(RIN.rent))+row(t('ro_cf'),money(rent.cf))+row(t('ro_dscr'),rent.dscr?rent.dscr.toFixed(2):'—')+row(t('ro_left'),money(Math.max(0,rent.left)))+'</table>':'')+'</div></div>'+
      '<h3>'+esc(t('h_comps'))+'</h3><table><tr><th>'+esc(lang()==='en'?'Address':'Dirección')+'</th><th>'+esc(lang()==='en'?'Sold':'Vendida')+'</th><th>'+esc(lang()==='en'?'Adjusted':'Ajustada')+'</th><th>'+esc(t('sqft'))+'</th><th>mi</th></tr>'+
        kept.map(function(c){ return '<tr><td>'+esc(c.address||'')+(c.sold_date?' · '+esc(dfmt(c.sold_date)):'')+'</td><td>'+money(c.sold_price)+'</td><td>'+money(c.adj!=null?c.adj:c.sold_price)+'</td><td>'+(c.sqft?Number(c.sqft).toLocaleString('en-US'):'')+'</td><td>'+(c.miles!=null?c.miles:'')+'</td></tr>'; }).join('')+'</table>'+
      (lola?'<h3>Lola</h3><div>'+esc(lola)+'</div>':'')+
      '<div class="foot">'+esc(t('sh_prep'))+' · Jason Aguirre Group · eXp Realty · (832) 702-3574 · jasonaguirregroup.company<br>'+esc(t('disc'))+'</div>';
    document.body.classList.add('printing');
    var done=function(){ document.body.classList.remove('printing'); window.removeEventListener('afterprint',done); };
    window.addEventListener('afterprint',done);
    setTimeout(function(){ window.print(); setTimeout(done,1500); },60);
  }

  function show(which){ ['loading','g_in','g_no','app'].forEach(function(id){ $(id).hidden=id!==which; }); }
  function boot(){
    var u=A.user();
    if(!u){ show('g_in'); return; }
    A.rpc('jag_investor_me').then(function(j){
      if(j&&j.ok){ ME=j; show('app'); paintHello(); paintFinder(); var q=new URLSearchParams(location.search).get('a'); if(q){ $('addr').value=q; analyze(); }
        else if(location.hash==='#finder') setTimeout(function(){ $('finder').scrollIntoView({ behavior:'smooth' }); },200); }
      else { $('g_no_em').textContent=t('gn_em',{e:u.email}); show('g_no'); }
    }).catch(function(e){ if(String(e&&e.message)==='signed_out'){ show('g_in'); } else { $('g_no_em').textContent=''; show('g_no'); } });
  }
  A.mountButton($('acct'));
  A.onChange(function(u){ if(!u){ ME=null; RUN=null; $('out').hidden=true; show('g_in'); } else if($('g_in').hidden===false){ boot(); } });
  paintWords();
  boot();
})();
</script>
</body>
