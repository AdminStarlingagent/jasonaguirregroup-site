<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<script src="jag-theme.js?v=1"></script>
<title>Mi cuenta — JAG Real Estate</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JAG Casas">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17161c; --paper:#fff; --card:#f5f5f7; --line:#dddde3;
  --buy:#c8102e; --buy-d:#a30d26; --buy-t:#fdecef;
  --loan:#2653d9; --loan-t:#eaf0ff;
  --ok:#1a5c31; --ok-bg:#e9f5ec;
  --muted:#5f5e68; --soft:#85848d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--loan);outline-offset:2px}

header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hin{height:60px;padding:0 20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.hl,.hr{display:flex;align-items:center;gap:4px}
.hr{justify-content:flex-end}
.hin a.n{font-size:14px;font-weight:600;text-decoration:none;padding:8px 10px;border-radius:6px}
.hin a.n:hover{color:var(--buy)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;justify-self:center}
.lock{display:flex;flex-direction:column;line-height:1;align-items:center}
.lock small{font-size:7px;letter-spacing:.32em;font-weight:700;color:var(--muted);text-transform:uppercase}
.lock b{font-size:25px;font-weight:800;letter-spacing:-.02em;color:var(--buy)}
.lock i{font-style:normal;font-size:8px;letter-spacing:.3em;font-weight:700;text-transform:uppercase}
.brok{font-size:10.5px;font-weight:700;color:var(--muted);border-left:1px solid var(--line);padding-left:10px}
.langs{display:flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden;margin-left:10px}
.langs button{border:0;background:transparent;font-size:12px;font-weight:800;padding:6px 10px}
.langs button.on{background:var(--ink);color:#fff}
#acct{margin-left:10px}

.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.hello{padding:30px 0 6px}
.hello h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px;line-height:1.15}
.hello p{margin:0;color:var(--muted)}
.prem{max-width:620px;margin-top:16px}
.prem:empty{display:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 22px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{text-decoration:none;font-weight:700;padding:12px 14px;border-bottom:3px solid transparent;white-space:nowrap;color:var(--muted)}
.tabs a.on{color:var(--ink);border-color:var(--buy)}
.tabs a .ct{display:inline-block;min-width:20px;border-radius:10px;background:var(--card);font-size:12px;padding:1px 7px;margin-left:6px;color:var(--ink);text-align:center}
.tabs a .ct.hot{background:var(--buy);color:#fff}
section[data-pane]{display:none;padding-bottom:40px}
section[data-pane].on{display:block}
.sub{color:var(--muted);margin:-8px 0 18px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.c{border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 1px var(--line);background:#fff;display:flex;flex-direction:column;text-decoration:none}
.c:hover{box-shadow:0 6px 20px rgba(0,0,0,.14),0 0 0 1px var(--line)}
.c .ph{aspect-ratio:3/2;background:#e9e9ee center/cover no-repeat;position:relative}
.c .tg{position:absolute;top:10px;left:10px;background:rgba(23,22,28,.85);color:#fff;font-size:11.5px;font-weight:800;border-radius:6px;padding:4px 8px}
.c .tg.red{background:var(--buy)}
.c .tg.grn{background:var(--ok)}
.c .rm{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.c .rm svg{width:18px;height:18px;fill:var(--buy);stroke:var(--buy);stroke-width:2}
.c .bd{padding:12px 14px 14px}
.c .pr{font-size:21px;font-weight:800;letter-spacing:-.01em}
.c .pr s{font-size:14px;color:var(--soft);font-weight:600;margin-left:6px}
.c .sp{font-size:14px;margin:2px 0}
.c .sp b{font-weight:800}
.c .ad{font-size:13.5px;color:var(--muted)}
.c .why{font-size:12.5px;color:var(--loan);font-weight:700;margin-top:6px}

.empty{background:var(--card);border-radius:14px;padding:28px 22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.btn{display:inline-block;border:0;border-radius:10px;background:var(--buy);color:#fff;font-weight:800;padding:12px 18px;text-decoration:none}
.btn:hover{background:var(--buy-d)}
.btn.alt{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.alt:hover{background:var(--card)}
.empty .btn{margin-top:14px}

.ss{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;flex-wrap:wrap}
.ss .tx{flex:1;min-width:200px}
.ss .tx b{display:block;font-size:16px}
.ss .tx span{font-size:13px;color:var(--muted)}
.sw{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;cursor:pointer;user-select:none}
.sw input{appearance:none;width:42px;height:24px;border-radius:12px;background:#c9c8d0;position:relative;margin:0;cursor:pointer;transition:background .15s}
.sw input::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw input:checked{background:var(--ok)}
.sw input:checked::after{left:21px}
.lnk{border:0;background:none;font-weight:700;color:var(--loan);padding:6px 4px;text-decoration:none;font-size:14px}
.lnk.del{color:var(--buy)}

.al{display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0;text-decoration:none}
.al .th{width:86px;height:64px;border-radius:8px;background:#e9e9ee center/cover no-repeat;flex:none}
.al .tx{flex:1;min-width:0}
.al .tx b{display:block}
.al .tx span{font-size:13.5px;color:var(--muted)}
.al .new{width:9px;height:9px;border-radius:50%;background:var(--buy);flex:none}
.al time{font-size:12.5px;color:var(--soft);white-space:nowrap}

.form{max-width:560px}
.form label{display:block;font-weight:700;font-size:13.5px;margin:0 0 5px}
.form input[type=text],.form input[type=tel],.form input[type=email],.form select{width:100%;border:1.5px solid #c9c8d0;border-radius:10px;padding:11px 12px;font-size:16px;margin:0 0 14px;background:#fff}
.form input[readonly]{background:var(--card);color:var(--muted)}
.form label.radio{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:12px;margin:0 0 8px;cursor:pointer;font-weight:400;font-size:14px}
.radio input{margin-top:2px;accent-color:var(--buy);width:18px;height:18px;flex:none}
.radio b{display:block;font-weight:800}
.radio span span{font-size:13px;color:var(--muted)}
.radio:has(input:checked){border-color:var(--ink)}
.saved{color:var(--ok);font-weight:700;margin-left:10px;display:none}
.saved.on{display:inline}
.danger{margin-top:34px;border:1.5px solid #f0c6cd;background:#fffafb;border-radius:12px;padding:18px}
.danger h3{margin:0 0 4px;font-size:17px}
.danger p{margin:0 0 12px;color:var(--muted);font-size:14px}
.danger .btn{background:#fff;color:var(--buy);box-shadow:inset 0 0 0 1.5px var(--buy)}
.danger .btn:hover{background:var(--buy-t)}
.gate{max-width:560px;margin:50px auto;text-align:center}
.gate h1{font-size:30px;margin:0 0 8px;font-weight:800;letter-spacing:-.02em}
.gate p{color:var(--muted);margin:0 0 20px}
.gate ul{text-align:left;display:inline-block;margin:0 0 22px;padding-left:20px}
.gate li{margin:4px 0}

.dlg{position:fixed;inset:0;background:rgba(15,14,20,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:9500}
.dlg.on{display:flex}
.dlg .bx{background:#fff;border-radius:16px;max-width:430px;width:100%;padding:24px 22px}
.dlg h3{margin:0 0 8px;font-size:20px}
.dlg p{color:var(--muted);margin:0 0 14px;font-size:14px}
.dlg input{width:100%;border:1.5px solid #c9c8d0;border-radius:10px;padding:11px 12px;font-size:16px;margin:0 0 14px}
.dlg .row{display:flex;gap:10px;justify-content:flex-end}
.dlg .btn.red{background:var(--buy)}
.dlg .btn[disabled]{opacity:.5;cursor:default}
.loading{color:var(--muted);padding:20px 0}

footer{border-top:1px solid var(--line);padding:22px 0 30px;color:var(--muted);font-size:12.5px}
footer nav{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0}
footer b{color:var(--ink)}

@media(max-width:760px){
  .hin{grid-template-columns:auto 1fr;padding:0 14px}
  .hl{display:none}
  .logo{justify-self:start}
  .brok{display:none}
  .hello h1{font-size:25px}
  .wrap{padding:0 16px}
  .grid{grid-template-columns:1fr}
}
.of-empty{background:#f6f5f3;border-radius:22px;padding:24px;text-align:center}
.of-empty p{margin:0 0 14px;color:#45444c}
.of-card{border:2px solid #ebe9e5;border-radius:22px;padding:18px 18px 16px;margin:0 0 16px;display:flex;flex-direction:column;gap:6px}
.of-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.of-st{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;border-radius:99px;padding:5px 10px;background:#17161c;color:#fff}
.of-st.of-submitted,.of-st.of-reviewing,.of-st.of-sent{background:#f0eeeb;color:#17161c}
.of-st.of-declined,.of-st.of-withdrawn{background:#f0eeeb;color:#6a6972}
.of-when{font-size:11px;color:#6a6972}
.of-price{font-size:clamp(34px,8vw,44px);font-weight:800;letter-spacing:-.05em;line-height:1;margin-top:4px}
.of-addr{font-size:14px;color:#2c2b31}
.of-meta{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#5b5a62}
.of-note{background:#f6f5f3;border-radius:14px;padding:10px 12px;font-size:14px;margin-top:4px}
.of-note b{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#5b5a62;margin-bottom:3px}
.of-m{background:#f6f5f3;border-radius:16px;padding:14px;margin-top:6px}
.of-cmp{border-top:1px dashed #d9d6d1;margin-top:12px;padding-top:12px}
.of-fine{font-size:11px;color:#6a6972;margin:10px 0 0}
.of-link{display:inline-block;margin-top:10px;color:var(--buy);font-weight:800;text-decoration:none;font-size:14px;min-height:24px}
.pf{background:#f6f5f3;border-radius:22px;padding:20px;margin-top:8px}
.pf h2{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#5b5a62;margin:0 0 8px}
.pf p{margin:0 0 14px;font-size:14px;color:#2c2b31}
.pf-prio{display:inline-block;background:#17161c;color:#fff;border-radius:99px;font-size:12px;font-weight:800;padding:6px 12px;margin:0 0 10px}
.pf-btns{display:flex;flex-wrap:wrap;gap:10px}
.pf-b{cursor:pointer;min-height:48px;display:inline-flex;align-items:center}
.btn.alt.pf-b{box-shadow:inset 0 0 0 2px var(--buy);color:var(--buy)}
.pf-msg{font-size:13px;font-weight:700;margin-top:10px;min-height:18px}
.pf-list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.pf-list li{background:#fff;border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;font-size:13px}
.pf-list li b{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#5b5a62}
.pf-list em{font-style:normal;font-weight:800}
.pf-list em.pf-verified{color:#17161c}.pf-list em.pf-pending{color:#6a6972}.pf-list em.pf-rejected{color:var(--buy)}
.pf-list small{flex-basis:100%;color:#5b5a62}

/* ---------- client app shell (side rail on computer, bottom tabs on phone) ---------- */
body.has-rail main.wrap{max-width:1180px;padding-left:108px}
.rail{position:fixed;left:0;top:60px;bottom:0;width:84px;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;z-index:15}
.rail a{width:72px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:12px;text-decoration:none;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.rail a svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;padding:5px;box-sizing:content-box;border-radius:10px}
.rail a:hover{color:var(--ink)}
.rail a.on{color:var(--buy);font-weight:800}
.rail a.on svg{background:var(--buy-t)}
.rail a.on[data-tab="saved"] svg{fill:var(--buy)}
.rail .bdg{position:absolute;top:2px;right:12px;min-width:19px;height:19px;border-radius:10px;background:var(--buy);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.rail .bdg:empty{display:none}
.pt{font-size:clamp(30px,4vw,40px);font-weight:800;letter-spacing:-.03em;margin:26px 0 4px;line-height:1.1}
.ps{color:var(--muted);margin:0 0 20px}
.h2{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:34px 0 12px}
.h2 .ct{font-size:13px;background:var(--card);border-radius:10px;padding:1px 8px;margin-left:6px;vertical-align:middle}.h2 .ct:empty{display:none}
section[data-pane]{padding-bottom:50px}
/* plan */
.prog{display:flex;align-items:center;gap:10px;margin:-6px 0 20px;font-size:13.5px;font-weight:700;color:var(--muted)}
.prog .bar{flex:0 1 220px;height:8px;border-radius:9px;background:#eee;overflow:hidden}.prog .bar i{display:block;height:100%;background:var(--buy);border-radius:9px}
.plan{display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px;align-items:start}
.steps{display:flex;flex-direction:column;gap:12px}
.st{display:grid;grid-template-columns:44px 1fr;gap:4px 14px;align-items:start;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.05);font:inherit;width:100%}
.st:hover{border-color:#c9c8d0}
.st.on{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink) inset;background:#fbfbfc}
.st .ic{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;background:var(--ink);color:#fff;grid-row:span 2;font-size:20px}
.st.done .ic{background:#1a5c31}
.st b{font-size:18px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.st span{color:var(--muted);font-size:14px}
.st em{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:3px 8px;background:var(--card);color:var(--muted)}
.st.done em{background:#e9f5ec;color:#1a5c31}.st.now em{background:var(--buy-t);color:var(--buy-d)}
.sb > div[data-step]{display:none}.sb > div[data-step].on{display:block}
.hero{background:var(--ink);color:#fff;border-radius:18px;padding:24px;margin-bottom:14px}
.hero h3{color:#ff8a9b;font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
.hero > p{margin:0 0 16px;color:#e6e5ea;font-size:15px}
.hero .inner{background:#fff;color:var(--ink);border-radius:14px;padding:16px}
.hero .go2{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border-radius:12px;background:var(--buy);color:#fff;font-weight:800;text-decoration:none;margin-top:14px;border:0;font-size:16px}
.hero .go2:hover{background:var(--buy-d)}
.hero .go2.ghost{background:#fff;color:var(--ink)}
.track{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative}
.track div{text-align:center;font-size:12.5px;font-weight:700;color:var(--muted);position:relative;padding-top:30px}
.track div::before{content:'';position:absolute;top:4px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;border:2.5px solid #d6d5dc;background:#fff;z-index:1}
.track div::after{content:'';position:absolute;top:13px;left:calc(50% + 12px);right:calc(-50% + 12px);height:2.5px;background:#d6d5dc}
.track div:last-child::after{display:none}
.track div.ok{color:var(--ink)}.track div.ok::before{background:#1a5c31;border-color:#1a5c31}.track div.ok::after{background:#1a5c31}
.track div.cur{color:var(--buy-d)}.track div.cur::before{border-color:var(--buy);box-shadow:0 0 0 4px var(--buy-t)}
.trnote{margin:14px 0 0;font-size:14px;color:#3d3c44;text-align:center}
.tiles{display:grid;gap:12px}
.tile{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff;text-decoration:none;color:inherit;font:inherit;text-align:left;width:100%}
.tile:hover{border-color:#c9c8d0}
.tile .ti{font-size:22px;grid-column:1;grid-row:1/span 2}
.tile b{font-size:16.5px;font-weight:800;grid-column:2;grid-row:1}
.tile span{color:var(--muted);font-size:14px;grid-column:2;grid-row:2}
.tile i{font-style:normal;color:var(--buy);font-weight:800;font-size:22px;grid-row:1/span 2;grid-column:3}
.chk2{list-style:none;margin:0;padding:0}
.chk2 li{display:grid;grid-template-columns:28px 1fr;gap:2px 10px;padding:12px 0;border-bottom:1px solid #eee}
.chk2 li::before{content:'';width:20px;height:20px;border-radius:6px;border:2px solid #c9c8d0;grid-row:span 2;margin-top:2px}
.chk2 li b{font-weight:800}.chk2 li span{color:var(--muted);font-size:14px}
.learn{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.lc{border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff;text-align:left;font:inherit;cursor:pointer}
.lc:hover{border-color:#c9c8d0}
.lc .li{font-size:26px}
.lc b{display:block;font-size:17px;font-weight:800;margin:8px 0 4px;letter-spacing:-.01em}
.lc span{color:var(--muted);font-size:14px;display:block}
.lc u{color:var(--loan);font-weight:800;text-decoration:none;display:block;margin-top:10px}
.mdl{position:fixed;inset:0;background:rgba(15,14,20,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:9550}
.mdl.on{display:flex}
.mdl .bx2{background:#fff;border-radius:18px;max-width:760px;width:100%;max-height:calc(100vh - 28px);overflow:auto}
.mdl .mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.mdl .mh b{font-size:19px;font-weight:800}
.mdl .mh button{border:0;background:var(--card);width:38px;height:38px;border-radius:50%;font-size:20px}
.mdl .mb{padding:18px 24px 26px}
.mdl .mb h4{font-size:18px;font-weight:800;margin:18px 0 6px}
.mdl .mb ul{margin:0;padding-left:20px}.mdl .mb li{margin:5px 0}
.mdl .mb p{margin:0 0 8px;color:#3d3c44}
.pcard{border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;max-width:720px}
.pcard h3{margin:0 0 14px;font-size:19px;font-weight:800}
.st-row{display:flex;align-items:center;justify-content:space-between;gap:12px 18px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.st-row:first-of-type{border-top:0;padding-top:0}
.st-tx{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}.st-tx b{font-size:15px}.st-tx span{font-size:13.5px;color:var(--muted)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px;background:var(--card)}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--muted);min-height:38px}
.seg button[aria-checked="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:2px solid var(--buy);outline-offset:1px}
.st-ok{margin:8px 0 0;font-size:13.5px;font-weight:700;color:var(--ok);min-height:1em}
.msgph{max-width:720px}
.hero .inner.prem-slot{padding:0;background:transparent}.hero .inner.prem-slot .jp-card{margin:0}
#ct_saved{display:none}
/* Mensajes: one conversation with the client's agent */
.mx{max-width:760px;border:1px solid var(--line);border-radius:18px;background:#fff;display:flex;flex-direction:column;height:calc(100vh - 210px);height:calc(100dvh - 210px);min-height:440px;overflow:hidden}
.mx-h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.av{width:46px;height:46px;border-radius:50%;flex:none;object-fit:cover;background:var(--buy-t);color:var(--buy-d);display:grid;place-items:center;font-weight:800;font-size:17px}
.mx-h .who{flex:1;min-width:0}.mx-h .who b{display:block;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx-h .who span{display:block;color:var(--muted);font-size:13.5px}
.mx-h .acts{display:flex;gap:8px}
.ib{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 13px;font:inherit;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;white-space:nowrap}
.ib:hover{border-color:var(--ink)}.ib svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mx-l{flex:1;overflow-y:auto;padding:16px 16px 8px;background:#fafafb;display:flex;flex-direction:column;gap:4px}
.mx-day{align-self:center;font-size:12px;font-weight:700;color:var(--muted);background:#efeff2;border-radius:999px;padding:3px 10px;margin:12px 0 6px}
.mr{display:flex;flex-direction:column;max-width:80%}
.mr.me{align-self:flex-end;align-items:flex-end}.mr.them{align-self:flex-start;align-items:flex-start}
.bb{padding:10px 14px;border-radius:18px;font-size:16px;line-height:1.42;white-space:pre-wrap;overflow-wrap:anywhere}
.me .bb{background:var(--buy);color:#fff;border-bottom-right-radius:5px}
.them .bb{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.me .bb a{color:#fff}.them .bb a{color:var(--buy-d)}
.mr .tm{font-size:11.5px;color:var(--muted);margin:3px 6px 6px}
.mr.fail .bb{opacity:.6}.mr.fail .tm{color:var(--buy-d);font-weight:700;cursor:pointer}
.mr.sending .bb{opacity:.75}
.mx-e{margin:auto;text-align:center;max-width:430px;padding:20px 6px}
.mx-e .av{width:72px;height:72px;font-size:26px;margin:0 auto 12px}
.mx-e h3{margin:0 0 6px;font-size:20px;font-weight:800}.mx-e p{margin:0 0 16px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14.5px;cursor:pointer}
.chips button:hover{border-color:var(--buy);color:var(--buy-d)}
.mx-c{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#fff}
.mx-c textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:22px;padding:11px 16px;font:inherit;font-size:16px;line-height:1.35;max-height:140px;min-height:46px;outline:0}
.mx-c textarea:focus{border-color:var(--ink)}
.mx-c button{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--buy);color:#fff;display:grid;place-items:center;cursor:pointer}
.mx-c button:disabled{background:#d6d5dc;cursor:default}
.mx-c button svg{width:20px;height:20px;fill:currentColor}
.mx-n{max-width:760px;font-size:13.5px;color:var(--muted);margin:10px 4px 0}.mx-n a{color:var(--ink);font-weight:700}
.mcard{display:flex;flex-direction:column;width:280px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--ink);margin-top:4px}
.mcard:hover{border-color:#c9c8d0}.mc-ph{display:block;height:150px;background:var(--card) center/cover no-repeat}.mc-ic{display:grid;place-items:center;font-size:40px;height:90px}
.mc-tx{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px;font-size:14px}.mc-tx b{font-size:20px;font-weight:800;letter-spacing:-.02em}.mc-tx span{color:#3d3c44}
.mc-tx u{text-decoration:none;color:var(--buy-d);font-weight:800;margin-top:6px}
.mx-x{max-width:760px;font-size:14px;color:var(--buy-d);margin:8px 4px 0;font-weight:700}.mx-x:empty{display:none}
.chk{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;cursor:pointer}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--buy)}
.chk b{display:block;font-weight:800}.chk small{display:block;color:var(--muted);font-size:13px;margin-top:4px;line-height:1.45}
.chk.off{opacity:.55;cursor:default}
.hint{margin:10px 0 0;font-size:14px;color:#3d3c44}.hint:empty{display:none}
body.on-msgs .jc-b,body.on-msgs .jc{display:none!important}
@media(max-width:980px){ .plan{grid-template-columns:1fr} .steps{flex-direction:row;overflow-x:auto;scrollbar-width:none;padding-bottom:4px} .steps::-webkit-scrollbar{display:none}

  .pt{margin-top:18px}
  .st{min-width:210px;padding:12px;grid-template-columns:36px 1fr}.st .ic{width:36px;height:36px;font-size:17px}.st b{font-size:16px}

  .mr{max-width:86%}
}

function num(n){ return Number(n).toLocaleString('en-US'); }

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent=t(el.getAttribute('data-t')); });
  document.querySelectorAll('[data-tp]').forEach(function(el){ el.placeholder=t(el.getAttribute('data-tp')); });
  document.querySelectorAll('.langs button').forEach(function(b){ b.classList.toggle('on',b.getAttribute('data-lang')===lang); });
  if(A) A.relabel();
  paintAll(); paintSettings();
}
document.querySelectorAll('.langs button').forEach(function(b){ b.onclick=function(){ lang=b.getAttribute('data-lang'); try{ localStorage.setItem('jag_lang',lang); }catch(e){} applyLang(); }; });

/* ---------- cards ---------- */
function specs(s){ return [s.beds!=null?'<b>'+s.beds+'</b> '+t('bd'):'',s.baths!=null?'<b>'+s.baths+'</b> '+t('ba'):'',s.sqft?'<b>'+num(s.sqft)+'</b> '+t('sqft'):''].filter(Boolean).join(' | '); }
function statusTag(mls){
  var a=(D.alerts||[]).filter(function(x){ return x.mls===mls&&x.kind!=='new'; })[0]; if(!a) return '';
  var d=a.detail||{};
  if(a.kind==='price') return d.new_price<d.old_price?'<span class="tg red">'+t('st_price')+' '+money(d.old_price-d.new_price)+'</span>':'<span class="tg">'+t('st_up')+'</span>';
  var s=String(d.new_status||'').toLowerCase();
  if(s.indexOf('pending')>-1) return '<span class="tg">'+t('st_pend')+'</span>';
  if(s.indexOf('closed')>-1||s.indexOf('sold')>-1) return '<span class="tg">'+t('st_sold')+'</span>';
  if(s==='active') return '<span class="tg grn">'+t('st_back')+'</span>';
  return '<span class="tg">'+t('st_off')+'</span>';
}
function card(mls, s, opts){
  opts=opts||{};
  return '<a class="c" href="homes#'+encodeURIComponent(mls)+'" data-mls="'+esc(mls)+'">'+
    '<div class="ph" style="background-image:url(\''+img(s.photo)+'\')">'+(opts.tag||'')+(opts.rm?'<button class="rm" type="button" aria-label="'+t('rm')+'">'+HEART+'</button>':'')+'</div>'+
    '<div class="bd"><div class="pr">'+money(s.price)+(opts.old?'<s>'+money(opts.old)+'</s>':'')+'</div><div class="sp">'+specs(s)+'</div>'+
    '<div class="ad">'+esc([s.addr,s.city].filter(Boolean).join(', '))+(s.zip?' '+esc(s.zip):'')+'</div>'+(opts.why?'<div class="why">'+esc(opts.why)+'</div>':'')+'</div></a>';
}
function emptyBox(h,p,go){ return '<div class="empty" style="grid-column:1/-1"><b>'+t(h)+'</b>'+t(p)+(go?'<br><a class="btn" href="homes">'+t('e_go')+'</a>':'')+'</div>'; }

function paintSaved(){
  var el=$('saved'); if(!D.favs){ el.innerHTML='<p class="loading">'+t('loading')+'</p>'; return; }
  $('ct_saved').textContent=D.favs.length||'';
  el.innerHTML=D.favs.length?D.favs.map(function(f){ var s=Object.assign({},f.snap||{}); if(f.last_price) s.price=f.last_price; return card(f.mls,s,{rm:true,tag:statusTag(f.mls)}); }).join(''):emptyBox('e_saved','e_saved_p',true);
}
$('saved').addEventListener('click',function(e){
  var b=e.target.closest('.rm'); if(!b) return; e.preventDefault();
  var mls=b.closest('.c').getAttribute('data-mls');
  A.removeFavorite(mls).then(function(){ D.favs=D.favs.filter(function(f){ return f.mls!==mls; }); try{ var lf=JSON.parse(localStorage.getItem('jag_favs')||'{}'); delete lf[mls]; localStorage.setItem('jag_favs',JSON.stringify(lf)); }catch(x){} paintSaved(); }).catch(function(){ alert(t('err')); });
});

function searchUrl(s){
  var u=(s.params&&s.params.ui)||{}, q=new URLSearchParams();
  if(u.q) q.set('q',u.q); if(u.type==='lease') q.set('type','lease');
  ['minp','maxp','beds','baths'].forEach(function(k){ if(u[k]) q.set(k,u[k]); });
  if(u.kinds&&u.kinds.length&&u.kinds.join(',')!=='Residential') q.set('kinds',u.kinds.join(','));
  if(u.b) q.set('b',u.b); if(u.newc) q.set('newc','1');
  return 'homes'+(q.toString()?'?'+q.toString():'');
}
function paintSearches(){
  var el=$('searches'); if(!D.searches){ el.innerHTML='<p class="loading">'+t('loading')+'</p>'; return; }
  $('ct_searches').textContent=D.searches.length||'';
  el.innerHTML=D.searches.length?D.searches.map(function(s){
    return '<div class="ss" data-id="'+esc(s.id)+'"><div class="tx"><b>'+esc(s.label||'—')+'</b><span>'+t('created')+new Date(s.created_at).toLocaleDateString(lang==='es'?'es-MX':'en-US',{month:'short',day:'numeric'})+'</span></div>'+
      '<label class="sw"><input type="checkbox" '+(s.alerts?'checked':'')+'>'+t('alerts_on')+'</label>'+
      '<a class="lnk" href="'+esc(searchUrl(s))+'">'+t('view')+'</a><button class="lnk del" type="button">'+t('del')+'</button></div>';
  }).join(''):emptyBox('e_ss','e_ss_p',true);
}
$('searches').addEventListener('change',function(e){
  var cb=e.target.closest('input[type=checkbox]'); if(!cb) return; var id=cb.closest('.ss').getAttribute('data-id');
  A.updateSearch(id,{alerts:cb.checked}).then(function(){ D.searches.forEach(function(s){ if(s.id===id) s.alerts=cb.checked; }); }).catch(function(){ cb.checked=!cb.checked; alert(t('err')); });
});
$('searches').addEventListener('click',function(e){
  var b=e.target.closest('.del'); if(!b) return; var id=b.closest('.ss').getAttribute('data-id');
  A.removeSearch(id).then(function(){ D.searches=D.searches.filter(function(s){ return s.id!==id; }); paintSearches(); }).catch(function(){ alert(t('err')); });
});

function alertText(a){
  var d=a.detail||{};
  if(a.kind==='new') return '<b>'+t(d.smart?'a_smart':'a_new')+'</b><span>'+esc(d.label||'')+'</span>';
  if(a.kind==='price') return '<b>'+t('a_price')+': '+money(d.old_price)+' → '+money(d.new_price)+'</b><span>'+esc((d.snap||{}).addr||'')+'</span>';
  return '<b>'+t('a_status')+': '+esc(d.new_status||'')+'</b><span>'+esc((d.snap||{}).addr||'')+'</span>';
}
function paintAlerts(){
  var el=$('alerts'); if(!D.alerts){ el.innerHTML='<p class="loading">'+t('loading')+'</p>'; return; }
  var unseen=D.alerts.filter(function(a){ return !a.seen_at; }).length;
  var ct=$('ct_alerts'); ct.textContent=unseen||''; ct.classList.toggle('hot',!!unseen);
  el.innerHTML=D.alerts.length?D.alerts.map(function(a){ var s=(a.detail||{}).snap||{};
    return '<a class="al" href="homes#'+encodeURIComponent(a.mls)+'">'+(a.seen_at?'':'<i class="new" aria-hidden="true"></i>')+'<span class="th" style="background-image:url(\''+img(s.photo)+'\')"></span>'+
      '<span class="tx">'+alertText(a)+'</span><time>'+new Date(a.created_at).toLocaleDateString(lang==='es'?'es-MX':'en-US',{month:'short',day:'numeric'})+'</time></a>';
  }).join(''):'<div class="empty"><b>'+t('e_al')+'</b>'+t('e_al_p')+'</div>';
}

/* ---------- recommendations ----------
   From the last 90 days of views, searches and saved homes: the ZIP codes they keep coming back to,
   the typical bedrooms/bathrooms, and a price band around what they look at. Newest matching
   listings in those ZIPs, minus anything already saved or viewed. */
function median(a){ a=a.filter(function(x){ return x!=null&&isFinite(x); }).map(Number).sort(function(x,y){ return x-y; }); return a.length?a[Math.floor((a.length-1)/2)]:null; }
function buildTaste(){
  var since=Date.now()-90*864e5, rows=[];
  (D.activity||[]).forEach(function(a){ if(new Date(a.created_at).getTime()>since && !/lease/i.test(a.ptype||'')) rows.push({zip:a.zip,price:a.price,beds:a.beds,baths:a.baths,w:a.kind==='view'?1:2}); });
  (D.favs||[]).forEach(function(f){ var s=f.snap||{}; if(s.type!=='Lease') rows.push({zip:s.zip,price:f.last_price||s.price,beds:s.beds,baths:s.baths,w:3}); });
  var zc={}; rows.forEach(function(r){ if(r.zip&&/^\d{5}$/.test(r.zip)) zc[r.zip]=(zc[r.zip]||0)+r.w; });
  var zips=Object.keys(zc).sort(function(a,b){ return zc[b]-zc[a]; }).slice(0,3);
  var priced=rows.filter(function(r){ return r.price>20000; });
  return { zips:zips, beds:median(rows.map(function(r){ return r.beds; })), baths:median(rows.map(function(r){ return r.baths; })),
           price:median(priced.map(function(r){ return r.price; })) };
}
function loadPicks(){
  var tz=buildTaste();
  if(!tz.zips.length){ D.picks=[]; D.taste=tz; paintPicks(); return; }
  var skip={}; (D.favs||[]).forEach(function(f){ skip[f.mls]=1; }); (D.activity||[]).forEach(function(a){ if(a.mls) skip[a.mls]=1; });
  Promise.all(tz.zips.map(function(z){

    (window.JagPremium?'<button type="button" class="ib" id="mx_tour" aria-label="'+esc(t('m_tour'))+'">'+SVG_CAL+'<span>'+t('m_tour')+'</span></button>':'')+'</div>';
  var tb=$('mx_tour'); if(tb) tb.onclick=function(){ JagPremium.openShowing({homes:D.favs||[],onDone:loadPrem}); };
  var s=M.status||{};
  $('mx_n').innerHTML=esc(fill(t(s.sms_live&&s.sms_ok?'m_note2':'m_note'),{a:nm}))+(s.sms_live&&!s.sms_ok?' <a href="#perfil" data-smsgo>'+t('m_sms')+' ›</a>':'');
  var all=(M.thread||[]).concat(M.pending), sig=lang+'|'+nm+'|'+(M.thread?'1':'0')+'|'+all.map(function(m){ return (m.id||m.tmp)+(m.read?'r':'')+(m.fail?'f':''); }).join(',');
  if(sig===M.sig&&!M.bottom) return; M.sig=sig;
  if(!M.thread){ l.innerHTML='<div class="mx-e"><p>'+t('loading')+'</p></div>'; return; }
  if(!all.length){
    l.innerHTML='<div class="mx-e">'+avatar(a)+'<h3>'+esc(fill(t('m_eh'),{a:nm}))+'</h3><p>'+esc(fill(t('m_ep'),{a:nm}))+'</p><div class="chips">'+
      t('m_chips').map(function(c){ return '<button type="button" data-chip>'+esc(c)+'</button>'; }).join('')+'</div></div>';
    return;
  }
  var html='', last='', lastMine=-1;
  all.forEach(function(m,i){ if(m.from==='client'&&!m.fail) lastMine=i; });
  all.forEach(function(m,i){
    var d=new Date(m.at), dk=d.toDateString(), me=m.from==='client';
    if(dk!==last){ html+='<div class="mx-day">'+esc(dayLabel(d))+'</div>'; last=dk; }
    var tm=d.toLocaleTimeString(loc(),{hour:'numeric',minute:'2-digit'});
    var st=m.fail?t('m_fail'):(m.tmp&&!m.id)?t('m_sending'):((!me&&m.name&&m.name!==nm?m.name+' · ':'')+tm+(me&&i===lastMine&&m.read?' · '+t('m_seen'):''));
    var showBody=!(m.card&&m.body===m.card.title);
    html+='<div class="mr '+(me?'me':'them')+(m.fail?' fail':(m.tmp&&!m.id)?' sending':'')+'"'+(m.fail?' data-retry="'+m.tmp+'" role="button" tabindex="0"':'')+'>'+(showBody?'<div class="bb">'+linkify(m.body)+'</div>':'')+(m.card?msgCard(m.card):'')+'<div class="tm">'+esc(st)+'</div></div>';
  });
  var stick=M.bottom||l.scrollHeight-l.scrollTop-l.clientHeight<90;
  l.innerHTML=html; if(stick){ l.scrollTop=l.scrollHeight; } M.bottom=false;
}
/* a home or search the agent sent to this account */
function msgCard(c){
  var home=c.kind!=='search'&&c.kind!=='site', url=c.url||(c.mls?'homes#'+encodeURIComponent(c.mls):'homes');
  url=url.replace(/^https:\/\/(www\.)?jasonaguirregroup\.(company|us)\//,'');
  var sp=[c.beds!=null?c.beds+' '+t('bd'):'',c.baths!=null?c.baths+' '+t('ba'):'',c.sqft?num(c.sqft)+' '+t('sqft'):''].filter(Boolean).join(' · ');
  return '<a class="mcard" href="'+esc(url)+'">'+(c.photo?'<span class="mc-ph" style="background-image:url(\''+img(c.photo,'small')+'\')"></span>':'<span class="mc-ph mc-ic">'+(home?'🏠':'🔎')+'</span>')+
    '<span class="mc-tx">'+(c.price?'<b>'+money(c.price)+'</b>':'')+(sp?'<span>'+esc(sp)+'</span>':'')+'<span>'+esc(c.title||(home?'':t('m_srch')))+'</span>'+
    '<u>'+t(home?'m_see':'m_seeS')+' ›</u></span></a>';
}
function loadThread(){
  if(!A||!A.user()) return Promise.resolve();
  if(M.busy){ M.again=true; return Promise.resolve(); }
  M.busy=true;
  return A.rpc('jag_msg_thread').then(function(j){
    if(!j||!j.ok) throw new Error('thread');
    if(!M.thread) M.bottom=true;
    M.thread=j.messages||[]; M.agent=j.agent||M.agent;
    var ids={}; M.thread.forEach(function(m){ ids[m.id]=1; });
    M.pending=M.pending.filter(function(p){ return !(p.id&&ids[p.id]); });
    M.status=M.status||{}; M.status.unread=0; M.status.sms_ok=!!j.sms_ok;
    $('mx_x').textContent='';
  }).catch(function(){ if(!M.thread) $('mx_x').textContent=t('m_load'); })
  .then(function(){ M.busy=false; paintMsgs(); if(M.again){ M.again=false; loadThread(); } });
}
function loadMsgStatus(){
  if(!A||!A.user()) return Promise.resolve();
  return A.rpc('jag_msg_status').then(function(s){ if(s&&typeof s==='object'){ var keep=tab==='messages'&&M.status?M.status.unread:null; M.status=s; if(keep!==null) M.status.unread=keep; paintMsgs(); paintSms(); } }).catch(function(){});
}
function sendMsg(body){
  body=String(body||'').trim(); if(!body) return;
  var m={tmp:'t'+(++M.seq),from:'client',body:body.slice(0,2000),at:new Date().toISOString()};
  M.pending.push(m); M.bottom=true; $('mx_x').textContent=''; paintMsgs();
  A.rpc('jag_msg_send',{p_body:m.body}).then(function(j){
    if(j&&j.ok){ m.id=j.id; M.bottom=true; paintMsgs(); return loadThread(); }
    m.fail=true; if(j&&j.reason==='limit') $('mx_x').textContent=t('m_limit'); paintMsgs();
  }).catch(function(){ m.fail=true; paintMsgs(); });
}
function sizeBox(){ var x=$('mx_in'); x.style.height='auto'; x.style.height=Math.min(x.scrollHeight+3,140)+'px'; $('mx_go').disabled=!x.value.trim(); }
$('mx_in').addEventListener('input',sizeBox);
$('mx_in').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!matchMedia('(pointer:coarse)').matches){ e.preventDefault(); $('mx_f').requestSubmit?$('mx_f').requestSubmit():$('mx_go').click(); }
});
$('mx_f').addEventListener('submit',function(e){ e.preventDefault(); var x=$('mx_in'); if(!x.value.trim()) return; sendMsg(x.value); x.value=''; sizeBox(); x.focus(); });
$('mx_l').addEventListener('click',function(e){
  var c=e.target.closest('[data-chip]'); if(c){ var x=$('mx_in'); x.value=c.textContent; sizeBox(); x.focus(); x.setSelectionRange(x.value.length,x.value.length); return; }
  var r=e.target.closest('[data-retry]'); if(r){ var p=M.pending.filter(function(q){ return q.tmp===r.getAttribute('data-retry'); })[0]; if(p){ M.pending.splice(M.pending.indexOf(p),1); sendMsg(p.body); } }
});
$('mx_n').addEventListener('click',function(e){ if(e.target.closest('[data-smsgo]')) setTimeout(function(){ var c=$('sm_card'); if(c&&!c.hidden) c.scrollIntoView({behavior:'smooth',block:'center'}); },80); });
/* text alerts opt-in (shown only once client texts are turned on in ops.settings) */
function paintSms(){
  var c=$('sm_card'); if(!c) return; var s=M.status||{};
  c.hidden=!s.sms_live; if(!s.sms_live) return;
  var ph=D.profile&&D.profile.phone, cb=$('sm_on');
  cb.checked=!!s.sms_ok; cb.disabled=!ph&&!s.sms_ok; $('sm_lbl').classList.toggle('off',cb.disabled);
  $('sm_hint').textContent=cb.disabled?t('sm_need'):(M.smsMsg?t(M.smsMsg):'');
}
$('sm_on').addEventListener('change',function(){
  var cb=this, on=cb.checked; cb.disabled=true;
  A.rpc('jag_msg_sms',{p_on:on}).then(function(j){
    M.status=M.status||{}; M.status.sms_ok=!!(j&&j.sms_ok); M.smsMsg=M.status.sms_ok?'sm_yes':'sm_no';  }).catch(function(){ cb.checked=!on; alert(t('err')); }).then(function(){ cb.disabled=false; paintSms(); paintMsgs(); });
});
/* keep the conversation fresh: every 15 s while it's open, the unread badge every minute otherwise */
var msgTick=0;
setInterval(function(){
  if(!A||!A.user()||document.hidden) return; msgTick++;
  if(tab==='messages') loadThread(); else if(msgTick%4===0) loadMsgStatus();
},15000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&A&&A.user()){ if(tab==='messages') loadThread(); else loadMsgStatus(); } });

/* ---------- offers + proof (pre-approval / proof of funds) ---------- */
function money(n){ return '$'+Math.round(Number(n)||0).toLocaleString('en-US'); }
function loadOffers(){
  return A.rpc('jag_my_offers').then(function(j){ D.offers=(j&&j.offers)||[]; D.proof=(j&&j.proof)||[]; }).catch(function(){ D.offers=D.offers||[]; D.proof=D.proof||[]; }).then(paintOffers);
}
function verifiedKind(){ var v=(D.proof||[]).filter(function(p){ return p.status==='verified'; }); return v.length?v[0].kind:null; }
function paintOffers(){
  var box=$('offers'), pb=$('proof'); if(!box) return;
  var ct=$('ct_offers'); if(ct) ct.textContent=D.offers&&D.offers.length?D.offers.length:'';
  if(!D.offers){ box.innerHTML=''; pb.innerHTML=''; return; }
  var vk=verifiedKind(), L=window.JagOffer?JagOffer.text():null;
  if(!D.offers.length) box.innerHTML='<div class="of-empty"><p>'+t('of_none')+'</p><a class="btn" href="homes">'+t('of_find')+'</a></div>';
  else box.innerHTML=D.offers.map(function(o){
    var proofOk=vk&&((o.financing==='cash'&&vk==='pof')||(o.financing!=='cash'&&vk==='preapproval'));
    var so={offer_price:o.offer_price,list_price:o.list_price,earnest:o.earnest,financing:o.financing,proof:proofOk?'yes':o.proof,proof_verified:!!proofOk,
      contingencies:o.contingencies||[],option_days:o.option_days,close_date:o.close_date};
    var st=JagOffer.strength(so), cmp=JagOffer.compare(so);
    var when=new Date(o.created_at).toLocaleDateString(lang==='es'?'es-MX':'en-US',{month:'short',day:'numeric'});
    return '<article class="of-card">'+
      '<div class="of-top"><span class="of-st of-'+esc(o.status)+'">'+esc(JagOffer.statusText(o.status))+'</span><span class="of-when">'+t('of_sent')+esc(when)+'</span></div>'+
      '<div class="of-price">'+money(o.offer_price)+'</div>'+
      '<div class="of-addr">'+esc(o.address||'')+'</div>'+
      (o.list_price?'<div class="of-meta">'+t('of_list')+money(o.list_price)+(o.mls?' · MLS '+esc(o.mls):'')+'</div>':'')+
      (o.status_note?'<div class="of-note"><b>'+t('of_note')+'</b>'+esc(o.status_note)+'</div>':'')+
      '<div class="of-m">'+JagOffer.meter(st.level)+
      (!proofOk&&cmp.better&&/^(submitted|reviewing|countered)$/.test(o.status)?'<div class="of-cmp">'+JagOffer.meter(cmp.with.level,{title:cmp.label})+
        (o.financing!=='cash'?'<a class="of-link" href="apply.html?'+new URLSearchParams({lang:lang,home:o.address||'',mls:o.mls||'',price:String(Math.round(o.offer_price||0))}).toString()+'">'+t('of_pre')+' →</a>':'')+'</div>':'')+
      '<p class="of-fine">'+L.fine+'</p></div>'+
      (o.mls?'<a class="of-link" href="homes#'+encodeURIComponent(o.mls)+'">'+(lang==='es'?'Ver la casa':'See the home')+' →</a>':'')+
    '</article>';
  }).join('');
  var K=T[lang];
  pb.innerHTML='<div class="pf"><h2>'+t('pf_h')+'</h2>'+(vk?'<div class="pf-prio">'+t('pf_prio')+'</div>':'')+'<p>'+t('pf_p')+'</p>'+
    '<div class="pf-btns"><label class="btn pf-b">'+t('pf_pre')+'<input type="file" accept="application/pdf,image/*" data-kind="preapproval" hidden></label>'+
    '<label class="btn alt pf-b">'+t('pf_pof')+'<input type="file" accept="application/pdf,image/*" data-kind="pof" hidden></label></div>'+
    '<div class="pf-msg" id="pf_msg" role="status"></div>'+
    ((D.proof||[]).length?'<ul class="pf-list">'+D.proof.map(function(p){
      return '<li><span><b>'+esc(K.pf_kind[p.kind]||p.kind)+'</b>'+esc(p.file_name||'')+'</span><em class="pf-'+esc(p.status)+'">'+esc(K.pf_st[p.status]||p.status)+'</em>'+
        (p.note?'<small>'+esc(p.note)+'</small>':'')+'</li>'; }).join('')+'</ul>':'')+'</div>';
  pb.querySelectorAll('input[type=file]').forEach(function(inp){ inp.onchange=function(){ if(inp.files&&inp.files[0]) uploadProof(inp.dataset.kind, inp.files[0]); inp.value=''; }; });
}
function uploadProof(kind, file){
  var msg=$('pf_msg');
  if(file.size>10485760){ msg.textContent=t('pf_big'); return; }
  if(!/^(application\/pdf|image\/(jpeg|png|heic|heif|webp))$/.test(file.type||'')){ msg.textContent=t('pf_type'); return; }
  msg.textContent=t('pf_up');
  var u=A.user(), safe=(file.name||'doc').replace(/[^A-Za-z0-9._-]/g,'_').slice(-80), path=u.id+'/'+Date.now()+'-'+safe;
  A.token().then(function(tk){
    return fetch('https://nyaxywghbpphjhwcmspd.supabase.co/storage/v1/object/client-proof/'+path,{method:'POST',
      headers:{apikey:'sb_publishable_a3LN_l283LN8J-bJTEO8hQ_U40t09eh',Authorization:'Bearer '+tk,'Content-Type':file.type,'x-upsert':'false'},body:file});
  }).then(function(r){ if(!r.ok) throw new Error('up'); return A.rpc('jag_proof_add',{p_kind:kind,p_path:path,p_name:file.name||safe}); })
    .then(function(j){ if(!j||!j.ok) throw new Error('add'); return loadOffers(); })
    .then(function(){ var m=$('pf_msg'); if(m) m.textContent=t('pf_ok'); })
    .catch(function(){ var m=$('pf_msg'); if(m) m.textContent=t('pf_err'); });
}

function start(){
  var u=A&&A.user();
  $('gate').hidden=!!u; $('app').hidden=!u; document.body.classList.toggle('has-rail',!!u);
  if(!u) return;
  D={favs:null,searches:null,alerts:null,activity:null,picks:null,offers:null,proof:null,plan:null,profile:A.profile()}; planStep=null;
  M.thread=null; M.agent=null; M.pending=[]; M.status=null; M.sig=''; M.smsMsg='';
  paintAll(); setTab(location.hash.slice(1));
  A.getProfile().then(function(p){ D.profile=p; paintProfile(); }).catch(function(){});
  Promise.all([
    A.favorites().then(function(r){ D.favs=r||[]; }).catch(function(){ D.favs=[]; }),
    A.searches().then(function(r){ D.searches=r||[]; }).catch(function(){ D.searches=[]; }),
    A.alerts().then(function(r){ D.alerts=r||[]; }).catch(function(){ D.alerts=[]; }),
    A.activity(300).then(function(r){ D.activity=r||[]; }).catch(function(){ D.activity=[]; })
  ]).then(function(){ paintAll(); setTab(location.hash.slice(1)||tab); loadPicks(); });
  loadOffers().then(paintPlan); loadPrem(); loadPlan(); loadMsgStatus();
}
$('gatebtn').onclick=function(){ A.requireSignIn().catch(function(){}); };
if(A){ A.mountButton($('acct')); A.onChange(start); }
applyLang(); start();
