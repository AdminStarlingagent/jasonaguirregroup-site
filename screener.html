<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<title>JAG Call Screener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: same system as JAG Home Loans (apply.html) — one question per screen in a 562px column, big option cards, soft fields, pill buttons, red progress bar. Single light theme by design, like the app. */
:root{
  --accent:#c8102e;      /* JAG red: progress, logo rule, send button */
  --ink:#17161c;         /* headings, primary buttons, selected states */
  --card:#f5f5f7;        /* option cards + fields */
  --card-hov:#ededf1;
  --paper:#ffffff;
  --line:#e7e7ec;
  --mut:#5b5a63;
  --ok:#1d7a3f;  --ok-bg:#e9f5ec;
  --warn:#8a6a12; --warn-bg:#fdf6e7; --warn-bd:#f1e0b8;
  --prep:#2f5d9e; --prep-bg:#eaf0fa;
  --font:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:16px;
  color-scheme: light;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
header.site{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:22px;max-width:1100px;margin:0 auto}
.lock{display:flex;flex-direction:column;line-height:1;text-decoration:none;color:var(--ink);cursor:pointer;background:none;border:0;padding:0}
.lock small{font-size:7.5px;letter-spacing:.32em;font-weight:700;color:#6a6972;text-transform:uppercase}
.lock b{font-size:24px;font-weight:800;letter-spacing:-.045em;margin:1px 0}
.lock i{font-style:normal;font-size:8px;letter-spacing:.4em;font-weight:700;text-transform:uppercase;border-top:2px solid var(--accent);padding-top:3px}
.hright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hbadge{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;padding:9px 16px;border-radius:99px;background:var(--card);color:var(--mut);border:0}
.hbadge .d{width:8px;height:8px;border-radius:50%;background:#b7b6c0}
.hbadge[data-lane="listo"]{background:var(--ok-bg);color:var(--ok)} .hbadge[data-lane="listo"] .d{background:var(--ok)}
.hbadge[data-lane="revision"]{background:var(--warn-bg);color:var(--warn)} .hbadge[data-lane="revision"] .d{background:var(--warn)}
.hbadge[data-lane="prep"]{background:var(--prep-bg);color:var(--prep)} .hbadge[data-lane="prep"] .d{background:var(--prep)}
.navbtn{border:1.5px solid #d6d5dd;background:#fff;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.navbtn:hover{border-color:var(--ink)}
.navbtn .n{display:inline-block;min-width:20px;margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--accent);color:#fff;font-size:12px}

/* Progress */
.progress-wrap{max-width:610px;margin:8px auto 0}
.track{height:4px;background:#e9e9ee;border-radius:99px;overflow:hidden}
.fill{height:100%;width:3%;background:var(--accent);border-radius:99px;transition:width .5s cubic-bezier(.3,.7,.3,1)}
.prog-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;min-height:38px}
.backbtn{width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:#2a2930;display:grid;place-items:center;cursor:pointer}
.backbtn:hover{background:#f1f1f4}
.backbtn svg{width:22px;height:22px}
.pct{font-size:14px;font-weight:500;color:#3f3e46}
.sect{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8a8992}

/* Stage */
#stage{max-width:610px;margin:30px auto 80px}
.step{animation:up .35s cubic-bezier(.2,.7,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1.title{font-size:clamp(26px,4.6vw,34px);font-weight:600;letter-spacing:-.015em;line-height:1.22;margin:0 0 12px;text-wrap:balance}
h2.q{font-size:clamp(21px,3.6vw,26px);font-weight:600;letter-spacing:-.01em;line-height:1.28;margin:0 0 20px;text-wrap:balance}
.lead{font-size:16px;color:#4a4952;margin:0 0 24px;line-height:1.55}

/* "Say it like this" bubble */
.say{display:flex;flex-direction:column;gap:6px;margin:0 0 22px}
.say .k{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.say .bub{background:var(--card);color:#26252c;border-radius:16px;border-top-left-radius:6px;padding:14px 18px;font-size:16px;line-height:1.55;max-width:100%}

/* Option cards */
.opt{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--card);border:1.5px solid transparent;border-radius:var(--r);padding:17px 20px;margin-bottom:12px;cursor:pointer;user-select:none;color:var(--ink);font-size:16.5px;font-weight:500;transition:background .15s,border-color .15s,transform .06s}
.opt:hover{background:var(--card-hov)}
.opt:active{transform:scale(.995)}
.opt .sub{display:block;font-size:13.5px;font-weight:400;color:var(--mut);margin-top:2px}
.opt .circ{margin-left:auto;width:26px;height:26px;flex:0 0 26px;border-radius:50%;border:1.5px solid #b7b6c0;background:#fff;display:grid;place-items:center}
.opt.multi .circ{border-radius:8px}
.opt.sel{background:#fff;border-color:var(--ink)}
.opt.sel .circ{border-color:var(--ink)}
.opt.sel .circ::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--ink)}
.opt.multi.sel .circ::after{border-radius:4px}
.opt:focus-visible,.next:focus-visible,.ghost:focus-visible,.navbtn:focus-visible,.backbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

/* Fields */
.field{background:var(--card);border-radius:14px;padding:12px 18px 10px;margin-bottom:14px;box-shadow:inset 0 0 0 1.5px transparent;transition:background .15s,box-shadow .15s}
.field label{display:block;font-size:13px;font-weight:500;color:var(--mut);margin-bottom:2px}
.field input,.field textarea{width:100%;border:0;outline:0;background:transparent;font-size:17px;font-weight:500;color:var(--ink);padding:2px 0}
.field textarea{min-height:84px;resize:vertical;font-size:16px;line-height:1.5}
.field input::placeholder,.field textarea::placeholder{color:#a3a2ac;font-weight:400}
.field:focus-within{background:#fff;box-shadow:inset 0 0 0 1.5px var(--ink)}
.inrow{display:flex;align-items:center;gap:6px}
.inrow .pre{font-size:17px;font-weight:500}
.helper{font-size:14px;color:var(--mut);margin:-4px 0 16px 4px;line-height:1.5}

/* Info cards (same as app) */
.infocard{display:flex;align-items:flex-start;gap:12px;background:var(--warn-bg);border:1px solid var(--warn-bd);color:#3f3416;border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.5;margin:0 0 20px}
.infocard b{display:block;font-weight:700;margin-bottom:2px;color:#2e2610}
.infocard p{margin:0}
.infocard ul{margin:6px 0 0;padding-left:18px}
.notecard{display:flex;gap:10px;background:var(--ok-bg);color:#1a5c31;border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.5;margin:0 0 18px}
.notecard svg{width:20px;height:20px;flex:0 0 20px;margin-top:1px}

/* Buttons */
.next{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:200px;height:58px;padding:0 34px;margin-top:18px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:16.5px;font-weight:600;cursor:pointer;transition:background .15s,transform .06s}
.next:hover{background:#000}
.next:active{transform:scale(.98)}
.next.red{background:var(--accent)} .next.red:hover{background:#a30d26}
.next[disabled]{opacity:.6;cursor:default}
.ghost{background:none;border:0;color:var(--mut);font-weight:700;font-size:14px;cursor:pointer;text-decoration:underline;padding:10px 4px}
.ghost:hover{color:var(--ink)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.msg{color:var(--warn);font-size:14.5px;font-weight:500;margin:10px 0 0 4px;min-height:1.2em}
@media (max-width:640px){.next{width:100%}}

/* Result */
.route{border-radius:22px;padding:24px 22px;text-align:center;margin:6px 0 18px}
.route[data-lane="listo"]{background:var(--ok-bg)} .route[data-lane="revision"]{background:var(--warn-bg)} .route[data-lane="prep"]{background:var(--prep-bg)}
.route .k{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.route .n{font-size:clamp(36px,9vw,48px);font-weight:800;letter-spacing:-.045em;line-height:1.05;margin:8px 0 10px}
.route[data-lane="listo"] .n{color:var(--ok)} .route[data-lane="revision"] .n{color:var(--warn)} .route[data-lane="prep"] .n{color:var(--prep)}
.route .p{margin:0 auto;font-size:15.5px;line-height:1.5;max-width:440px}
.route .fine{margin:10px 0 0;font-size:12.5px;color:var(--mut)}
.box{border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.box h3{margin:0 0 12px;font-size:15px;font-weight:700}
ul.reasons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.reasons li{display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;font-size:15px;line-height:1.45}
ul.reasons .dot{width:9px;height:9px;border-radius:50%;margin-top:6px}
.dot.prep{background:var(--prep)} .dot.rev{background:var(--warn)} .dot.ok{background:var(--ok)} .dot.info{background:#a3a2ac}
.recap div{display:flex;justify-content:space-between;gap:18px;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:15px}
.recap div:last-child{border-bottom:0}
.recap span{color:var(--mut)} .recap b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:13.5px;line-height:1.55;background:var(--card);border-radius:12px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;margin:0 0 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.edits{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid #d6d5dd;background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--ink)}

/* Sent list */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.item{border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center}
.item .who{font-size:16.5px;font-weight:700}
.item .meta{font-size:13.5px;color:var(--mut)}
.item .why{grid-column:1/-1;font-size:14px;color:#37363e;line-height:1.45}
.item .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;margin-right:8px;vertical-align:2px}
.tag.listo{background:var(--ok-bg);color:var(--ok)} .tag.revision{background:var(--warn-bg);color:var(--warn)} .tag.prep{background:var(--prep-bg);color:var(--prep)} .tag.done{background:var(--card);color:var(--mut)}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:30px 20px;text-align:center;color:var(--mut);font-size:15px;line-height:1.55}
footer.legal{max-width:760px;margin:0 auto 40px;text-align:center;font-size:12.5px;color:#8a8992;line-height:1.65}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script src="jag-capture.js?v=3"></script>
</head>

<style>
.langsw{display:inline-flex;background:var(--card);border-radius:99px;padding:3px}
.langsw button{border:0;background:transparent;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--mut);cursor:pointer}
.langsw button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.langsw button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}

  let refreshing = null, refreshTimer = null;
  function saveSession() { try { sessionStorage.setItem('jag_admin', JSON.stringify({ t: sess.token, e: sess.email, r: sess.refresh, x: sess.exp })); } catch (e) {} }
  function setSession(j, email) {
    sess.token = j.access_token; if (j.refresh_token) sess.refresh = j.refresh_token;
    sess.exp = j.expires_at ? j.expires_at * 1000 : Date.now() + ((j.expires_in || 3600) * 1000);
    if (email) sess.email = email; saveSession();
    clearTimeout(refreshTimer); if (sess.refresh) refreshTimer = setTimeout(refreshSession, Math.max(5000, sess.exp - Date.now() - 300000));
  }
  function refreshSession() {
    if (refreshing) return refreshing;
    if (!sess.refresh) return Promise.resolve(false);
    refreshing = fetch(BASE + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: CRM.anonKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: sess.refresh }) })
      .then(r => r.json()).then(j => { refreshing = null; if (j && j.access_token) { setSession(j); return true; } return false; })
      .catch(() => { refreshing = null; return false; });
    return refreshing;
  }
  async function api(path, opts) {
    opts = opts || {};
    if (sess.refresh && sess.exp && sess.exp - Date.now() < 60000) await refreshSession();
    const go = () => fetch(BASE + path, { method: opts.method || 'GET', headers: Object.assign({ apikey: CRM.anonKey, Authorization: 'Bearer ' + sess.token, 'Content-Type': 'application/json' }, opts.headers || {}), body: opts.body });
    let res = await go();
    if (res.status === 401 && await refreshSession()) res = await go();
    return res;
  }
  function renderLogin(msg) {
    show('login');
    stage.innerHTML = `<div class="step"><h1 class="title">${t('Entra con tu cuenta del equipo', 'Sign in with your team account')}</h1>
      <p class="lead">${t('Es la misma cuenta del admin de JAG. Si no tienes una, pídesela a Jason.', "It's the same login as the JAG admin. If you don't have one, ask Jason.")}</p>
      ${field('li_email', ['Correo', 'Email'], 'txt')}
      <div class="field"><label for="li_pass">${t('Contraseña', 'Password')}</label><input id="li_pass" type="password" autocomplete="current-password"></div>
      <button class="next" type="button" id="li_btn">${t('Entrar', 'Sign in')}</button><p class="msg" id="msg">${esc(msg || '')}</p></div>`;
    const go = async () => {
      const email = ($('#li_email').value || '').trim(), pass = $('#li_pass').value;
      if (!email || !pass) { $('#msg').textContent = t('Escribe tu correo y contraseña.', 'Enter your email and password.'); return; }
      $('#li_btn').disabled = true;
      try {
        const r = await fetch(BASE + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: CRM.anonKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password: pass }) });
        const j = await r.json();
        if (j && j.access_token) { setSession(j, email); boot(); return; }
        $('#msg').textContent = t('Correo o contraseña incorrectos.', 'Wrong email or password.');
      } catch (e) { $('#msg').textContent = t('No hay conexión. Inténtalo otra vez.', 'No connection. Try again.'); }
      $('#li_btn').disabled = false;
    };
    $('#li_btn').onclick = go;
    $('#li_pass').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  }
  function signOut() { clearTimeout(refreshTimer); sess.token = sess.refresh = sess.email = null; sess.exp = 0; try { sessionStorage.removeItem('jag_admin'); } catch (e) {} renderLogin(); }
  $('#signout').onclick = signOut;

  // ===== Submit: save in Supabase, then log in Follow Up Boss =====
  let current = null;   // the saved row being shown
  function fubBox() {
    if (!current) return '';
    const st = current.fub_status;
    if (st === 'sent') return `<div class="notecard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><div><b>${current.fub_created ? t('Cliente nuevo creado en Follow Up Boss', 'New client created in Follow Up Boss') : t('Registrado en el cliente que ya estaba en Follow Up Boss', 'Logged on the client already in Follow Up Boss')}</b><br>${current.fub_created ? t('Sin agente asignado, en el pond Calls, etapa Applied. ', 'Unassigned, in the Calls pond, stage Applied. ') : ''}${t('Con nota, etiquetas y tarea de seguimiento si pusiste fecha. ', 'With the note, tags, and a follow-up task if you set a date. ')}<a href="https://jasonhoustonrealty.followupboss.com/2/people/view/${encodeURIComponent(current.fub_person_id)}" target="_blank" rel="noopener">${t('Abrir en Follow Up Boss', 'Open in Follow Up Boss')}</a></div></div>`;
    if (st === 'error') return `<div class="infocard"><div><b>${t('Guardado, pero no entró a Follow Up Boss', "Saved, but it didn't reach Follow Up Boss")}</b><p>${esc(current.fub_error || '')}</p><button class="chip" type="button" id="retry" style="margin-top:8px">${t('Reintentar', 'Try again')}</button></div></div>`;
    return `<div class="infocard"><div><b>${t('Registrando en Follow Up Boss…', 'Logging in Follow Up Boss…')}</b></div></div>`;
  }
  async function sendToFub(id) {
    try {
      const r = await api('/functions/v1/jag-screening-fub', { method: 'POST', body: JSON.stringify({ id }) });
      const j = await r.json().catch(() => ({}));
      if (j && j.ok) { current.fub_status = 'sent'; current.fub_person_id = j.person_id; current.fub_created = j.created; }
      else { current.fub_status = 'error'; current.fub_error = (j && j.error) || ('HTTP ' + r.status); }
    } catch (e) { current.fub_status = 'error'; current.fub_error = t('Sin conexión con el servidor.', 'No connection to the server.'); }
    paintFub();
  }
  function paintFub() { const b = $('#fubbox'); if (b) { b.innerHTML = fubBox(); const rb = $('#retry'); if (rb) rb.onclick = () => { current.fub_status = 'pending'; paintFub(); sendToFub(current.id); }; } }
  async function submit() {
    if (mode === 'example') { $('#msg').textContent = t('Este es el ejemplo. Toca "Nueva llamada" para empezar uno real.', 'This is the example. Tap "New call" to start a real one.'); return; }
    if (!(s.c_phone || '').replace(/\D/g, '') && !(s.c_email || '').includes('@')) { $('#msg').textContent = t('Agrega el teléfono o el correo del cliente para encontrarlo en Follow Up Boss.', "Add the client's phone or email so we can find them in Follow Up Boss."); return; }
    const r = evaluate(s), btn = $('#submit'); btn.disabled = true;
    const answers = Object.fromEntries(Object.entries(s).filter(([k]) => !k.startsWith('__')));
    let follow = null; if (s.follow) { const d = new Date(s.follow); if (!isNaN(d)) follow = d.toISOString(); }
    try {
      const res = await api('/rest/v1/jag_screenings', { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify({
        screener: s.screener || '', client_name: s.c_name || '', phone: s.c_phone || null, email: (s.c_email || '').trim() || null, lang: LANG, lane: r.lane,
        answers, reasons: r.sig.filter(x => x.lvl !== 'ok').map(x => x.t), missing: r.missing, note: fubNote(s, r), follow_at: follow }) });
      if (!res.ok) throw new Error(res.status === 401 || res.status === 403 ? 'auth' : 'save');
      current = (await res.json())[0];
      try { localStorage.setItem('jag-screener-caller', s.screener || ''); } catch (e) {}
      clearDraft(); mode = 'view';
      btn.textContent = t('Enviado', 'Sent');
      $('#msg').textContent = t('Guardado. Katherine lo ve en Enviadas.', 'Saved. Katherine sees it under Submitted.');
      paintFub(); sendToFub(current.id);
      try { history.replaceState(null, '', '#s=' + current.id); } catch (e) {}
    } catch (e) {
      btn.disabled = false;
      $('#msg').textContent = e.message === 'auth' ? t('Tu cuenta no tiene permiso. Pídele acceso a Jason.', "Your account doesn't have access. Ask Jason.") : t('No se pudo guardar. Revisa tu conexión e inténtalo otra vez.', "Couldn't save. Check your connection and try again.");
    }
  }

  // ===== Submitted list =====
  let sent = [], filter = 'pending';
  async function loadSent() {
    const res = await api('/rest/v1/jag_screenings?select=id,created_at,screener,client_name,phone,lane,status,fub_status,fub_person_id,fub_created,fub_error,answers&order=created_at.desc&limit=200');
    sent = res.ok ? await res.json() : [];
    const n = sent.filter(d => d.status !== 'revisada').length;
    $('#sent-n').hidden = !n; $('#sent-n').textContent = n;
    return res.ok;
  }
  async function renderSent() {
    show('sent');
    stage.innerHTML = `<div class="step"><h1 class="title">${t('Enviadas a revisión', 'Sent for review')}</h1><p class="lead">${t('Cargando…', 'Loading…')}</p></div>`;
    const ok = await loadSent();
    const fl = [['pending', ['Por revisar', 'To review']], ['all', ['Todas', 'All']], ['listo', ['Listo', 'Ready']], ['revision', ['Revisión', 'Review']], ['prep', ['Preparación', 'Prep']]];
    const rows = sent.filter(d => filter === 'all' || (filter === 'pending' ? d.status !== 'revisada' : d.lane === filter));
    stage.innerHTML = `<div class="step"><h1 class="title">${t('Enviadas a revisión', 'Sent for review')}</h1><p class="lead">${t('Las llamadas que el equipo mandó a revisar, la más reciente arriba.', 'Calls the team sent for review, newest first.')}</p>
      <div class="filters">${fl.map(([k, l]) => `<button class="chip${k === filter ? ' on' : ''}" type="button" data-f2="${k}">${esc(tx(l))}</button>`).join('')}</div>
      <div id="rows"></div><button class="ghost" type="button" id="backcall">${t('Nueva llamada', 'New call')}</button></div>`;
    stage.querySelectorAll('[data-f2]').forEach(b => b.onclick = () => { filter = b.dataset.f2; renderSent(); });
    $('#backcall').onclick = newCall;
    const box = $('#rows');
    if (!ok) { box.innerHTML = `<div class="empty">${t('No se pudieron cargar los envíos. Recarga la página.', "Couldn't load submissions. Reload the page.")}</div>`; return; }
    if (!rows.length) { box.innerHTML = `<div class="empty">${sent.length ? t('Nada en este filtro.', 'Nothing in this filter.') : t('Todavía no hay envíos. Al terminar una llamada, toca <b>Enviar a revisión</b> y aparece aquí.', 'No submissions yet. At the end of a call, tap <b>Send for review</b> and it shows up here.')}</div>`; return; }
    rows.forEach(d => {
      const el = document.createElement('div'); el.className = 'item';
      const when = new Date(d.created_at).toLocaleString(locale(), { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      const fubTag = d.fub_status === 'sent' ? `<span class="tag listo">FUB ✓</span>` : d.fub_status === 'error' ? `<span class="tag prep">${t('FUB pendiente', 'FUB pending')}</span>` : '';
      el.innerHTML = `<div><div class="who"><span class="tag ${d.lane}">${esc(LN(d.lane) ? LN(d.lane).name : '—')}</span>${d.status === 'revisada' ? `<span class="tag done">${t('Revisada', 'Reviewed')}</span>` : ''}${fubTag}${esc(d.client_name || t('Sin nombre', 'No name'))}</div><div class="meta">${esc(when)} · ${esc(d.screener || t('equipo', 'team'))}${d.phone ? ' · ' + esc(d.phone) : ''}</div></div><div class="acts"></div><div class="why"></div>`;
      el.querySelector('.why').textContent = d.answers ? evaluate(d.answers).sig.filter(x => x.lvl !== 'ok').slice(0, 3).map(x => x.t).join(' · ') : '';
      const open = document.createElement('button'); open.className = 'chip'; open.type = 'button'; open.textContent = t('Abrir', 'Open');
      open.onclick = () => openRow(d.id);
      const mark = document.createElement('button'); mark.className = 'chip'; mark.type = 'button'; mark.textContent = d.status === 'revisada' ? t('Marcar pendiente', 'Mark pending') : t('Marcar revisada', 'Mark reviewed');
      mark.onclick = async () => {
        mark.disabled = true;
        const nv = d.status === 'revisada' ? 'nueva' : 'revisada';
        const res = await api('/rest/v1/jag_screenings?id=eq.' + encodeURIComponent(d.id), { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ status: nv, reviewed_at: nv === 'revisada' ? new Date().toISOString() : null }) });
        if (res.ok) renderSent(); else { mark.textContent = t('Sin permiso', 'No permission'); }
      };
      el.querySelector('.acts').append(open, mark); box.append(el);
    });
  }
  async function openRow(id) {
    const res = await api('/rest/v1/jag_screenings?select=*&id=eq.' + encodeURIComponent(id));
    const rows = res.ok ? await res.json() : [];
    if (!rows.length) { renderStart(); return; }
    current = rows[0]; s = Object.assign({}, current.answers || {}); mode = 'view';
    try { history.replaceState(null, '', '#s=' + id); } catch (e) {}
    renderResult();
  }
  $('#go-sent').onclick = renderSent;

  // ===== Draft (this browser only) =====
  const DKEY = 'jag-screener-draft-v2';
  function saveDraft() { if (mode !== 'live' || !s.c_name) return; try { localStorage.setItem(DKEY, JSON.stringify(s)); } catch (e) {} }
  function loadDraft() { try { const v = localStorage.getItem(DKEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function clearDraft() { try { localStorage.removeItem(DKEY); } catch (e) {} }

  const EXAMPLE = { c_name: 'Cliente de ejemplo', c_phone: '(281) 555-0142', screener: 'Adriana Pereyra', source: 'TikTok', intent: 'Comprar casa', first: 'Sí, primera casa', when: '3 a 6 meses', area: 'Humble / Atascocita', who: 'Con pareja', p2_rel: 'Esposa',
    p1_id: 'Seguro social', p1_status: 'Residente', p1_inc: 'W-2', p1_tax: '2 años o más', p1_tenure: '2 años o más', p1_pay: 'Por hora', p1_rate: '22', p1_hours: '40', p1_credit: '580 a 599', p1_issues: ['Colecciones'],
    p2_id: 'ITIN', p2_inc: '1099 / negocio propio', p2_tax: '2 años o más', p2_tenure: '2 años o más', p2_pay: 'Al año', p2_amount: '38000', p2_gross: 'Antes de gastos', p2_credit: 'No sabe', p2_issues: [], p2_issues__done: true,
    d_car: '450', d_cards: '60', savings: '9000', price: '240000', other_home: 'No', link: 'Enviado y recibido', notes: 'Quieren 4 recámaras, patio grande, cerca de la escuela de los niños.' };

  // ===== Start =====
  function defaultCaller() { try { return localStorage.getItem('jag-screener-caller') || ''; } catch (e) { return ''; } }
  function boot() {
    $('#signout').hidden = false;
    loadSent().catch(() => {});
    const m = (location.hash || '').match(/^#s=([0-9a-f-]{36})$/i);
    if (m) { openRow(m[1]); return; }
    renderStart();
  }
  s = { screener: defaultCaller() || 'Adriana Pereyra' };
  chrome();
  if (!BASE || !CRM.anonKey) { stage.innerHTML = '<p class="lead">Supabase is not configured.</p>'; return; }
  let saved = null; try { saved = JSON.parse(sessionStorage.getItem('jag_admin') || 'null'); } catch (e) {}
  if (saved && saved.t) { sess.token = saved.t; sess.email = saved.e; sess.refresh = saved.r || null; sess.exp = saved.x || 0; if (sess.refresh && sess.exp) refreshTimer = setTimeout(refreshSession, Math.max(5000, sess.exp - Date.now() - 300000)); boot(); }
  else renderLogin();
})();
</script>
</body>
</html>
