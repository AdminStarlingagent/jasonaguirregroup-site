.chip{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);white-space:nowrap}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 0;max-width:520px}

.st{background:var(--card);border-radius:14px;padding:12px 10px;text-align:center}

.btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:var(--buy);border-color:var(--buy);color:#fff}
.btn.pri:hover{background:var(--buy-d)}
.btn.wa{border-color:#1f8f4e;color:#1f8f4e}

.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}

section.pane{padding:18px 0 30px}

.sub{color:var(--muted);font-size:14px;margin:0 0 14px}

.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

.vc .vo b{font-size:12.5px;line-height:1.25;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vc .vo span{font-size:11px;font-weight:700;opacity:.85;display:flex;align-items:center;gap:4px;margin-top:3px}
.vc .vo span svg{width:12px;height:12px;fill:#fff}
.vc .kd{position:absolute;top:7px;left:7px;font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff}

.sc{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;animation:cin .35s ease both}
@keyframes cin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.sc .tag{position:absolute;top:8px;left:8px;background:var(--ink);color:#fff;font-size:11px;font-weight:800;padding:4px 8px;border-radius:6px;letter-spacing:.02em}
.sc .bd{padding:10px 11px 12px}
.sc .ci{font-weight:800;font-size:14.5px;line-height:1.25}
.sc .sb{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc .sp{font-size:12.5px;font-weight:700;margin-top:4px}
.sc .sd{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;color:var(--ok);background:#e9f5ec;padding:3px 7px;border-radius:6px}

.fine{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.5}

.dock.on{transform:none}

.vr{position:relative;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000;display:flex;justify-content:center}

.vr .go{display:flex;margin-top:12px;height:46px;border-radius:12px;background:var(--buy);color:#fff;font-weight:800;align-items:center;justify-content:center;text-decoration:none;text-shadow:none}
.vr .rail{position:absolute;right:8px;bottom:calc(env(safe-area-inset-bottom) + 130px);display:flex;flex-direction:column;gap:16px;align-items:center;color:#fff}
.vr .rb{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700}
.vr .rb span.ic{width:46px;height:46px;border-radius:99px;display:grid;place-items:center;background:rgba(23,22,28,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

.vr .pz{position:absolute;left:50%;top:45%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:99px;background:rgba(0,0,0,.45);display:none;place-items:center;pointer-events:none}
.vr .pz svg{width:30px;height:30px;fill:#fff}
.vr.paused .pz{display:grid}
.vr .bad{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:#fff;font-weight:600}
.vr.err .bad{display:flex}
.vx{position:fixed;z-index:101;top:calc(env(safe-area-inset-top) + 10px);left:10px;width:42px;height:42px;border-radius:99px;background:rgba(23,22,28,.6);display:grid;place-items:center}
.vx svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round}
.nf{padding:80px 16px;text-align:center}
.sk{background:linear-gradient(90deg,#eee,#f6f6f6,#eee);background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:12px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){ .sc,.vw.on{animation:none} html{scroll-behavior:auto} }

 en:{nav_homes:'Search homes',nav_reels:'Reels',org:'Jason Aguirre Group · eXp Realty',

var lang='es'; try{ var sl=localStorage.getItem('jag_lang'); if(sl==='en'||sl==='es') lang=sl; }catch(e){}
var qs=new URLSearchParams(location.search); if(qs.get('lang')==='en'||qs.get('lang')==='es') lang=qs.get('lang');
function t(k,n){ return String(T[lang][k]||k).replace('{n}',n||'').replace('{c}',n||''); }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function num(n){ return Number(n).toLocaleString('en-US'); }
function digits(p){ var d=String(p||'').replace(/\D/g,''); return d.length===11&&d[0]==='1'?d.slice(1):d.slice(-10); }
function fmtPhone(p){ var d=digits(p); return d.length===10?'('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6):''; }
function photoOk(u){ return /^https:\/\//.test(u||''); }
function avatar(a,cls){ var ok=photoOk(a.photo_url); return '<i class="'+(cls||'')+'"'+(ok?' style="background-image:url(\''+esc(a.photo_url)+'\')"':'')+'>'+(ok?'':esc(String(a.first_name||a.name||'J').charAt(0)))+'</i>'; }
function monthName(ym){ if(!ym) return ''; var p=ym.split('-'); try{ return new Date(+p[0],+p[1]-1,15).toLocaleDateString(lang==='es'?'es-MX':'en-US',{month:'short',year:'numeric'}); }catch(e){ return ym; } }
function rpc(name,args){ return fetch(API+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.status===204?null:r.json(); }); }
function track(k,x){ try{ if(window.JagTrack) JagTrack.ev(k,x||{}); }catch(e){} }

var P=null, tab='', soldShown=0, map=null;
function first(){ return P?P.agent.first_name||String(P.agent.name||'').split(' ')[0]:''; }
function title(a){ return lang==='en'?(a.title_en||a.title_es||''):(a.title_es||a.title_en||''); }
function joinUrl(){ return '/join?a='+encodeURIComponent(P.agent.code)+(lang==='en'?'&lang=en':''); }
function profileUrl(code){ return '/agente/'+encodeURIComponent(code||P.agent.code); }
function waUrl(){ var d=digits(P.agent.phone); return d.length===10?'https://wa.me/1'+d+'?text='+encodeURIComponent(lang==='en'?'Hi '+first()+', I saw your profile on jasonaguirregroup.company':'Hola '+first()+', vi su perfil en jasonaguirregroup.company'):''; }

function paint(){
  var a=P.agent, s=P.stats||{}, nm=first(), d=digits(a.phone);
  var yrs=a.licensed_year?Math.max(1,new Date().getFullYear()-a.licensed_year):null;
  var stats=[[s.closed||0,t('s_fam')]];
  if(yrs) stats.push([yrs,t('s_yrs')]);
  stats.push([P.videos.length,t('s_vid')]);
  if(!yrs) stats.push([(P.cities||[]).length||(a.areas||[]).length,t('s_areas')]);
  var langs=(a.langs||[]).map(function(l){ return '<span class="chip">'+esc(t('lang_'+l))+'</span>'; }).join('');
  var main=$('main');
  main.innerHTML='<div class="cover"></div><div class="wrap"><div class="hero">'+avatar(a,'av')+
    '<div class="who"><h1>'+esc(a.name)+'</h1><div class="tt">'+esc(title(a))+'</div><div class="org">'+esc(t('org'))+'</div></div></div>'+
    '<div class="chips">'+langs+((P.cities||[]).slice(0,3).map(function(c){ return '<span class="chip red">'+esc(c.city)+'</span>'; }).join(''))+'</div>'+
    '<div class="stats">'+stats.map(function(x){ return '<div class="st"><b>'+num(x[0])+'</b><span>'+esc(x[1])+'</span></div>'; }).join('')+'</div>'+
    '<div class="cta"><a class="btn pri" href="'+joinUrl()+'" data-k="work">'+IC.user+esc(t('work',nm))+'</a>'+
      (d.length===10?'<a class="btn" href="tel:+1'+d+'" data-k="call">'+IC.phone+esc(t('call'))+'</a><a class="btn wa" href="'+waUrl()+'" target="_blank" rel="noopener" data-k="wa">'+IC.wa+esc(t('wa'))+'</a>':'')+
      '<button class="btn" type="button" data-share>'+IC.share+esc(t('share'))+'</button></div></div>'+
    '<nav class="tabs" aria-label="Perfil"><div class="wrap">'+
      '<button class="tab" type="button" data-tab="vid">'+esc(t('t_vid'))+'<em>'+P.videos.length+'</em></button>'+
      '<button class="tab" type="button" data-tab="sold">'+esc(t('t_sold'))+'<em>'+(s.closed||0)+'</em></button>'+
      '<button class="tab" type="button" data-tab="areas">'+esc(t('t_areas'))+'</button>'+
      '<button class="tab" type="button" data-tab="about">'+esc(t('t_about'))+'</button></div></nav>'+
    '<div class="wrap"><section class="pane" id="p-vid" hidden></section><section class="pane" id="p-sold" hidden></section>'+
    '<section class="pane" id="p-areas" hidden></section><section class="pane" id="p-about" hidden></section>'+
    (P.team.length?'<div class="team"><h2 class="ph2">'+esc(t('team_h'))+'</h2><div class="trow">'+P.team.map(function(m){
      return '<a class="tc" href="'+profileUrl(m.code)+'">'+avatar(m)+'<b>'+esc(m.name)+'</b><small>'+esc(title(m))+'</small></a>'; }).join('')+'</div></div>':'')+
    '</div>';
  $('dock').innerHTML='<a class="btn pri" href="'+joinUrl()+'" data-k="work">'+esc(t('work',nm))+'</a>'+(d.length===10?'<a class="btn" href="tel:+1'+d+'" data-k="call" aria-label="'+esc(t('call'))+'">'+IC.phone+'</a><a class="btn wa" href="'+waUrl()+'" target="_blank" rel="noopener" data-k="wa" aria-label="WhatsApp">'+IC.wa+'</a>':'');
  document.title=a.name+' — '+title(a)+' · Jason Aguirre Group';
  paintVideos(); soldShown=0; paintSold(); paintAbout(); if(tab==='areas') paintAreas();
  show(tab||(P.videos.length?'vid':'sold'));
}
function show(k){
  tab=k;
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on',b.getAttribute('data-tab')===k); });
  ['vid','sold','areas','about'].forEach(function(x){ var el=$('p-'+x); if(el) el.hidden=x!==k; });
  if(k==='areas') paintAreas();
}
function kindLabel(k){ return t('k_'+(k||'other')); }
function paintVideos(){
  var el=$('p-vid'), nm=first();
  if(!P.videos.length){ el.innerHTML='<div class="empty"><b>'+esc(t('v_none'))+'</b>'+esc(t('v_none2',nm))+'</div>'; return; }
  el.innerHTML='<h2 class="ph2">'+esc(t('v_h',nm))+'</h2><p class="sub">'+esc(t('v_sub'))+'</p><div class="vgrid">'+P.videos.map(function(v,i){
    var media=v.poster?'<img src="'+esc(v.poster)+'" alt="" loading="lazy">':'<video src="'+esc(v.url)+'#t=0.5" muted playsinline preload="metadata"></video>';
    return '<div class="vc" role="button" tabindex="0" data-v="'+i+'">'+media+'<span class="kd">'+esc(kindLabel(v.kind))+'</span>'+
      '<div class="vo"><b>'+esc(v.title||'')+'</b><span>'+IC.play.replace('<svg','<svg style="width:11px;height:11px;fill:#fff"')+(v.views?num(v.views):'')+(v.area?' · '+esc(v.area):'')+'</span></div></div>';
  }).join('')+'</div>';
}
function paintSold(){
  var el=$('p-sold'), nm=first(), all=P.sold||[];
  if(!all.length){ el.innerHTML='<div class="empty"><b>'+esc(t('s_none'))+'</b>'+esc(t('s_none2',nm))+'</div>'; return; }
  var upto=Math.min(all.length,soldShown+24);
  if(!soldShown) el.innerHTML='<h2 class="ph2">'+esc(t('s_h',nm))+'</h2><p class="sub">'+esc(t('s_sub'))+'</p><div class="sgrid" id="sgrid"></div><button class="more" type="button" id="smore">'+esc(t('more'))+'</button>';
  var g=$('sgrid'), html='';
  for(var i=soldShown;i<upto;i++){ var h=all[i];
    var sp=[h.beds!=null?h.beds+' '+t('bd'):'',h.baths!=null?h.baths+' '+t('ba'):'',h.sqft?num(h.sqft)+' '+t('sqft'):''].filter(Boolean).join(' · ');
    html+='<div class="sc"><div class="im" style="'+(h.photo?'background-image:url(\''+CDN+esc(h.photo)+'?class=small\')':'')+'"><span class="tag">'+esc(t('sold'))+' · '+esc(monthName(h.date))+'</span></div>'+
      '<div class="bd"><div class="ci">'+esc(h.city||'')+(h.zip?' '+esc(h.zip):'')+'</div>'+(h.sub?'<div class="sb">'+esc(h.sub)+'</div>':'')+
      (sp?'<div class="sp">'+esc(sp)+'</div>':'')+'<span class="sd'+(h.side==='list'?' ls':'')+'">'+esc(t(h.side==='list'?'seller':'buyer'))+'</span></div></div>';
  }
  g.insertAdjacentHTML('beforeend',html); soldShown=upto;
  $('smore').hidden=soldShown>=all.length;
}
function paintAreas(){
  var el=$('p-areas'), nm=first(), cs=P.cities||[], extra=(P.agent.areas||[]).filter(function(x){ return !cs.some(function(c){ return c.city.toLowerCase()===String(x).toLowerCase(); }); });
  if(!el.innerHTML){
    el.innerHTML='<h2 class="ph2">'+esc(t('a_h',nm))+'</h2><p class="sub">'+esc(t('a_sub'))+'</p>'+(cs.length?'<div id="map"></div>':'')+
      '<div class="alist">'+cs.map(function(c){ return '<a href="/homes?q='+encodeURIComponent(c.city)+'" title="'+esc(t('search_here',c.city))+'"><span class="chip">'+esc(c.city)+' · <b>'+c.n+'</b> '+esc(t('homes'))+'</span></a>'; }).join('')+'</div>'+
      (extra.length?'<p class="sub" style="margin-top:16px">'+esc(t('a_also'))+'</p><div class="alist">'+extra.map(function(x){ return '<a href="/homes?q='+encodeURIComponent(x)+'"><span class="chip">'+esc(x)+'</span></a>'; }).join('')+'</div>':'');
    if(!cs.length&&!extra.length) el.innerHTML='<div class="empty"><b>'+esc(t('t_areas'))+'</b>'+esc(t('s_none2',nm))+'</div>';
  }
  if(cs.length&&window.L&&!map){
    setTimeout(function(){
      map=L.map('map',{scrollWheelZoom:false,attributionControl:true});
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(map);
      var b=[], mx=Math.max.apply(null,cs.map(function(c){ return c.n; }));
      cs.forEach(function(c){ if(!c.lat||!c.lng) return; b.push([c.lat,c.lng]);
        L.circleMarker([c.lat,c.lng],{radius:8+16*Math.sqrt(c.n/mx),color:'#c8102e',weight:2,fillColor:'#c8102e',fillOpacity:.35})
          .bindTooltip(esc(c.city)+' · '+c.n+' '+esc(t('homes'))).addTo(map); });
      (P.sold||[]).forEach(function(h){ if(h.lat&&h.lng) L.circleMarker([h.lat,h.lng],{radius:3,color:'#17161c',weight:0,fillColor:'#17161c',fillOpacity:.55}).addTo(map); });
      if(b.length) map.fitBounds(b,{padding:[30,30],maxZoom:11}); else map.setView([29.76,-95.37],9);
    },60);
  }
}
function paintAbout(){
  var a=P.agent, el=$('p-about'), nm=first(), bio=lang==='en'?(a.bio_en||a.bio_es):(a.bio_es||a.bio_en), d=digits(a.phone);
  var f=[[t('f_lang'),(a.langs||[]).map(function(l){ return t('lang_'+l); }).join(', ')],[t('f_broker'),'eXp Realty, LLC']];
  if(a.license_no) f.push([t('f_lic'),'#'+a.license_no]);
  if(a.licensed_year) f.push([t('f_since'),String(a.licensed_year)]);
  if(d.length===10) f.push([t('f_phone'),fmtPhone(d)]);
  el.innerHTML='<div class="about"><div><h2 class="ph2">'+esc(t('b_h',nm))+'</h2><p class="bio">'+esc(bio||'')+'</p></div>'+
    '<div class="facts">'+f.filter(function(x){ return x[1]; }).map(function(x){ return '<div><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>'; }).join('')+'</div></div>';
}

/* ---------- full-screen player ---------- */
var muted=true, curV=null, vio=null;
function openViewer(i){
  var a=P.agent, f=$('vfeed');
  f.innerHTML=P.videos.map(function(v,k){
    return '<div class="vr" data-k="'+k+'"><div class="box"><video playsinline loop muted preload="'+(k===i?'auto':'metadata')+'" src="'+esc(v.url)+'"'+(v.poster?' poster="'+esc(v.poster)+'"':'')+'></video>'+
      '<div class="shade"></div><div class="pz">'+IC.play.replace('<svg','<svg style="fill:#fff;stroke:none"')+'</div><div class="bad">'+esc(t('bad'))+'</div>'+
      '<div class="info"><div class="ag">'+avatar(a)+'<div><b>'+esc(a.name)+'</b><small>'+esc(title(a))+'</small></div></div>'+
        (v.title?'<div class="ti">'+esc(v.title)+'</div>':'')+(v.area?'<span class="ar">📍 '+esc(v.area)+'</span>':'')+
        '<a class="go" href="'+joinUrl()+'" data-k="work_video">'+esc(t('go',first()))+'</a></div>'+
      '<div class="rail"><button class="rb" type="button" data-snd><span class="ic">'+(muted?IC.mute:IC.snd)+'</span><span class="lb">'+esc(t(muted?'muted':'sound'))+'</span></button>'+
        '<button class="rb" type="button" data-vshare><span class="ic">'+IC.share+'</span><span>'+esc(t('share'))+'</span></button></div></div></div>';
  }).join('');
  $('vw').classList.add('on'); document.body.style.overflow='hidden';
  if(vio) vio.disconnect();
  vio=new IntersectionObserver(function(es){ es.forEach(function(e){ var v=e.target.querySelector('video'); if(e.isIntersecting&&e.intersectionRatio>=.6){ playOne(e.target); } else { v.pause(); } }); },{root:f,threshold:[.6]});
  f.querySelectorAll('.vr').forEach(function(r){ vio.observe(r); var v=r.querySelector('video'); v.addEventListener('error',function(){ r.classList.add('err'); }); });
  var tgt=f.querySelector('.vr[data-k="'+i+'"]'); f.scrollTop=tgt?tgt.offsetTop:0;
  try{ history.pushState({v:1},'',location.pathname+location.search+'#video'); }catch(e){}
}
function playOne(r){
  curV=r; var v=r.querySelector('video'); v.muted=muted; r.classList.remove('paused');
  var p=v.play(); if(p&&p.catch) p.catch(function(){ r.classList.add('paused'); });
  var k=+r.getAttribute('data-k'), vid=P.videos[k];
  if(vid&&!vid._seen){ vid._seen=1; rpc('jag_video_view',{p_id:vid.id}).catch(function(){}); track('agent_video_view',{code:P.agent.code,id:vid.id}); }
}
function closeViewer(fromPop){
  $('vw').classList.remove('on'); document.body.style.overflow=''; $('vfeed').querySelectorAll('video').forEach(function(v){ v.pause(); v.removeAttribute('src'); v.load(); }); $('vfeed').innerHTML='';
  if(!fromPop&&location.hash==='#video') history.back();
}
$('vx').onclick=function(){ closeViewer(false); };
window.addEventListener('popstate',function(){ if($('vw').classList.contains('on')) closeViewer(true); });
$('vfeed').addEventListener('click',function(e){
  if(e.target.closest('a')) return;
  var s=e.target.closest('[data-snd]'); if(s){ muted=!muted; $('vfeed').querySelectorAll('video').forEach(function(v){ v.muted=muted; });
    $('vfeed').querySelectorAll('[data-snd]').forEach(function(b){ b.querySelector('.ic').innerHTML=muted?IC.mute:IC.snd; b.querySelector('.lb').textContent=t(muted?'muted':'sound'); }); return; }
  if(e.target.closest('[data-vshare]')){ share(); return; }
  var r=e.target.closest('.vr'); if(!r) return; var v=r.querySelector('video');
  if(v.paused){ v.play(); r.classList.remove('paused'); } else { v.pause(); r.classList.add('paused'); }
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&$('vw').classList.contains('on')) closeViewer(false); });

/* ---------- clicks ---------- */
function share(){
  var url=location.origin+profileUrl()+(lang==='en'?'?lang=en':''), txt=t('sh_txt',P.agent.name);
  track('agent_profile_share',{code:P.agent.code});
  if(navigator.share){ navigator.share({title:P.agent.name,text:txt,url:url}).catch(function(){}); return; }
  (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(function(){ alert(t('copied')); }).catch(function(){ prompt(t('copied'),url); });
}
document.addEventListener('click',function(e){
  var tb=e.target.closest('[data-tab]'); if(tb){ show(tb.getAttribute('data-tab')); var tabs=document.querySelector('.tabs'); if(tabs&&window.scrollY>tabs.offsetTop) window.scrollTo({top:tabs.offsetTop-56}); return; }
  if(e.target.closest('[data-share]')){ share(); return; }
  if(e.target.id==='smore'){ paintSold(); return; }
  var vc=e.target.closest('.vc'); if(vc){ openViewer(+vc.getAttribute('data-v')); return; }
  var k=e.target.closest('a[data-k]'); if(k&&P) track('agent_profile_'+k.getAttribute('data-k'),{code:P.agent.code});
});
document.addEventListener('keydown',function(e){ if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('vc')){ e.preventDefault(); openViewer(+e.target.getAttribute('data-v')); } });
/* the contact bar slides up once the big buttons scroll away */
window.addEventListener('scroll',function(){ var c=document.querySelector('.cta'); if(c) $('dock').classList.toggle('on',c.getBoundingClientRect().bottom<0); },{passive:true});

/* ---------- language ---------- */
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent=t(el.getAttribute('data-t')); });
  document.querySelectorAll('.langs button').forEach(function(b){ b.classList.toggle('on',b.getAttribute('data-lang')===lang); });
  if(window.JagAccount&&JagAccount.relabel) JagAccount.relabel();
  if(P){ var keep=tab; map=null; paint(); show(keep); }
}
document.querySelectorAll('.langs button').forEach(function(b){ b.addEventListener('click',function(){ lang=b.getAttribute('data-lang'); try{ localStorage.setItem('jag_lang',lang); }catch(e){} applyLang(); }); });

/* ---------- go ---------- */
if(window.JagAccount&&JagAccount.mountButton) JagAccount.mountButton($('acct'));
applyLang();
function notFound(){ $('main').innerHTML='<div class="nf"><h1 class="ph2">'+esc(t('nf'))+'</h1><p><a class="btn pri" href="/homes">'+esc(t('nf_go'))+'</a></p></div>'; }
if(!/^[a-z0-9]{2,30}$/.test(CODE)) notFound();
else rpc('jag_agent_profile',{p_code:CODE}).then(function(j){
  if(!j||!j.ok){ notFound(); return; }
  P=j; P.videos=P.videos||[]; P.team=P.team||[];
  var h=location.hash.replace('#',''); if(['vid','sold','areas','about'].indexOf(h)>=0) tab=h;
  paint(); track('agent_profile_view',{code:CODE});
  if(location.hash==='#video'&&P.videos.length) try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  var vq=qs.get('v'); if(vq){ var vi=P.videos.findIndex(function(v){ return v.id===vq; }); if(vi>=0) openViewer(vi); }
}).catch(notFound);
</script>
