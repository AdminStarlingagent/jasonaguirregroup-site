<style>
:root{
  --ink:#17161c; --paper:#fff; --card:#f5f5f7; --line:#dddde3;
  --accent:#c8102e; --accent-d:#a30d26; --accent-t:#fdecef;
  --loan:#2653d9; --loan-d:#1d43b8;
  --muted:#5f5e68; --soft:#85848d; --ok:#1a5c31; --ok-bg:#e9f5ec;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--card);color:var(--ink);font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
header{background:var(--paper);border-bottom:1px solid var(--line)}
.hwrap{max-width:1120px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.lock{display:flex;flex-direction:column;line-height:1}
.lock small{font-size:7.5px;letter-spacing:.32em;font-weight:700;color:var(--muted);text-transform:uppercase}
.lock b{font-size:25px;font-weight:800;letter-spacing:-.045em;margin:1px 0}
.lock i{font-style:normal;font-size:8px;letter-spacing:.4em;font-weight:700;text-transform:uppercase;border-top:2px solid var(--accent);padding-top:3px}
.brok{font-size:12px;font-weight:600;color:var(--muted);border-left:1px solid var(--line);padding-left:12px}
.langs{display:flex;border:2px solid var(--ink);border-radius:99px;overflow:hidden;margin-left:auto}
.langs button{border:0;background:transparent;font-size:13px;font-weight:800;padding:7px 13px;color:var(--ink)}
.langs button.on{background:var(--ink);color:#fff}
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:clamp(24px,7vh,72px) 16px 40px}
.card{background:var(--paper);border-radius:22px;width:100%;max-width:440px;padding:30px 26px 26px;box-shadow:0 10px 40px rgba(23,22,28,.07)}
h1{font-size:clamp(25px,6vw,30px);font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 20px}
.who{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}
.who span,.who button{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid transparent;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--muted)}
.who button[aria-pressed="true"]{background:#fff;border-color:var(--ink);color:var(--ink)}
.pw{position:relative}.pw input{padding-right:64px}.pw .eye{position:absolute;right:8px;top:8px;border:0;background:var(--card);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:700}
.who svg{width:14px;height:14px}
label{display:block;font-weight:700;font-size:13px;margin:0 0 6px}
input{width:100%;border:1.5px solid #c9c8d0;border-radius:12px;padding:13px 14px;font-size:16px;margin:0 0 14px;background:#fff}
input:focus{outline:none;border-color:var(--ink)}
input.code{letter-spacing:.4em;text-align:center;font-size:24px;font-weight:800}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:99px;background:var(--ink);color:#fff;font-weight:800;font-size:15.5px;padding:15px;text-decoration:none}
.btn:hover{background:#000}.btn[disabled]{opacity:.6;cursor:default}
.btn.red{background:var(--accent)}.btn.red:hover{background:var(--accent-d)}
.btn.ghost{background:var(--card);color:var(--ink)}.btn.ghost:hover{background:#ebebef}
.stack{display:grid;gap:10px}
.row{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
.link{border:0;background:none;color:var(--loan);font-weight:700;padding:8px 0;font-size:13.5px}
.err{color:var(--accent-d);font-weight:700;font-size:13px;margin:-6px 0 12px;display:none}.err.on{display:block}
.ok{color:var(--ok);font-weight:700;font-size:13px;margin:-6px 0 12px}
.fine{font-size:12px;color:var(--soft);margin:14px 0 0}
.tile{display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:var(--ink);background:#fff;transition:border-color .12s}
.tile:hover{border-color:var(--ink)}
.tile .ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--card);display:grid;place-items:center}
.tile .ic svg{width:22px;height:22px}
.tile b{display:block;font-size:15.5px}.tile small{color:var(--muted);font-size:13px}
.tile .ar{margin-left:auto;color:var(--soft)}
.hello{display:flex;align-items:center;gap:12px;margin:0 0 18px}
.hello img,.hello .ph{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--card);flex:none}
.hello .ph{display:grid;place-items:center;font-weight:800;font-size:19px;background:var(--ink);color:#fff}
.foot{text-align:center;font-size:12px;color:var(--soft);padding:0 16px 24px}
@media (max-width:420px){.brok{display:none}.card{padding:26px 20px 22px}}
</style>

  // After the code: team member (their FUB email is on the team) → team screen; anyone else → client account.
  function route(j, how){
    session = j;
    return post('/rest/v1/rpc/jag_agent_me', {}, j.access_token).then(function(r){ return r.json(); }).catch(function(){ return null; }).then(function(a){
      if(a && a.ok && a.agent){
        var ag = a.agent;
        ls(AGENT, { t: j.access_token, r: j.refresh_token, x: Date.now() + (j.expires_in || 3600) * 1000, e: email,
          code: ag.code, name: ag.name, first_name: ag.first_name, phone: ag.phone, photo_url: ag.photo_url, staff: !!a.staff, how: how || 'code' });
        try{ localStorage.setItem('jag_last_team_email', email); localStorage.setItem('jag_signin_tab', 'agent'); }catch(e){}
        if(TEAMPAGE.test(next)){ location.href = next; return; }
        screenTeam();
        return;
      }
      ls(CLIENT, { access_token: j.access_token, refresh_token: j.refresh_token,
        expires_at: j.expires_at ? j.expires_at * 1000 : Date.now() + (j.expires_in || 3600) * 1000,
        user: { id: (j.user || {}).id, email: (j.user || {}).email || email } });
      return post('/rest/v1/rpc/jag_client_init', { p_name: null, p_phone: null, p_lang: lang(), p_terms: true }, j.access_token)
        .then(function(r){ return r.json(); }).catch(function(){ return null; })
        .then(function(x){ if(x && x['new']) screenName(); else goClient(); });
    });
  }
  function screenName(){
    card.innerHTML = '<h1>' + t('h3') + '</h1><p class="lead">' + t('p3') + '</p><form id="f" novalidate>' +
      '<label for="n">' + t('name') + '</label><input id="n" autocomplete="name"><label for="p">' + t('phone') + '</label><input id="p" type="tel" autocomplete="tel" inputmode="tel">' +
      '<button class="btn red" type="submit" id="go">' + t('done') + '</button><div class="row"><span></span><button type="button" class="link" id="sk">' + t('skip') + '</button></div></form>';
    setTimeout(function(){ $('n').focus(); }, 60);
    $('f').onsubmit = function(ev){ ev.preventDefault();
      var n = $('n').value.trim(), p = $('p').value.trim(); $('go').disabled = true;
      (n || p ? post('/rest/v1/rpc/jag_client_init', { p_name: n || null, p_phone: p || null, p_lang: lang(), p_terms: true }, session.access_token) : Promise.resolve())
        .catch(function(){}).then(goClient);
    };
    $('sk').onclick = goClient;
  }
  function goClient(){ location.href = next || 'account'; }

  function screenTeam(){
    var a = ls(AGENT) || {};
    card.innerHTML = '<div class="hello">' + (a.photo_url ? '<img src="' + esc(a.photo_url) + '" alt="">' : '<span class="ph"></span>') +
      '<div><h1 style="margin:0">' + t('team_hi') + esc(a.first_name || '') + '</h1></div></div>' +
      '<p class="lead">' + t('team_p') + '</p><div class="stack">' +
      tile('agent.html', 'hub', t('hub'), t('hub_s')) + tile('matrix.html', 'home', t('mx'), t('mx_s')) + tile('screener.html', 'scr', t('scr'), t('scr_s')) +
      (a.staff ? tile('admin.html', 'adm', t('adm'), t('adm_s')) : '') +
      '</div><div class="row" style="margin-top:14px"><span class="fine" style="margin:0">' + esc(a.e || '') + '</span><button type="button" class="link" id="out">' + t('out') + '</button></div>';
    $('out').onclick = function(){ signOut(AGENT, a.t); };
  }
  function screenClient(){
    var c = ls(CLIENT) || {};
    card.innerHTML = '<h1>' + t('client_hi') + '</h1><p class="lead">' + t('client_p') + '<b>' + esc((c.user || {}).email || '') + '</b></p><div class="stack">' +
      tile(next || 'account', 'acct', t('acct'), '') + tile('homes', 'home', t('homes'), '') + tile('apply.html', 'doc', t('apply'), '') +
      '</div><div class="row" style="margin-top:14px"><span></span><button type="button" class="link" id="out">' + t('wrong') + '</button></div>';
    $('out').onclick = function(){ signOut(CLIENT, c.access_token); };
  }
  function signOut(k, tok){
    if(tok) fetch(BASE + '/auth/v1/logout?scope=local', { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + tok } }).catch(function(){});
    ls(k, null); start();
  }

  function start(){
    var a = ls(AGENT), c = ls(CLIENT);
    if(a && a.r){ if(TEAMPAGE.test(next)){ location.replace(next); return; } screenTeam(); }
    else if(c && c.refresh_token) screenClient();
    else screenEmail();
  }
  function paintLang(){
    document.documentElement.lang = lang();
    document.querySelectorAll('[data-lang]').forEach(function(b){ var on = b.dataset.lang === lang(); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  }
  document.querySelectorAll('[data-lang]').forEach(function(b){ b.onclick = function(){
    try{ localStorage.setItem('jag_lang', b.dataset.lang); }catch(e){}
    paintLang();
    var onCode = !!$('c'), onName = !!$('n');
    if(onCode) screenCode(); else if(onName) screenName(); else start();
  }; });
  paintLang(); start();
})();
</script>
</body>
</html>
