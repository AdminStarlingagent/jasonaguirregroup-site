:root{--ink:#17161c;--paper:#fff;--soft:#f6f5f3;--line:#e7e5e1;--muted:#5b5a62;--red:#c8102e;--red-d:#a30d26;--red-t:#fdecef}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;line-height:1.5}
a{color:var(--red)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:760px;margin:0 auto;padding:16px 18px}
.lock{display:flex;flex-direction:column;line-height:1;text-decoration:none;color:var(--ink)}
.lock small{font-size:7px;letter-spacing:.32em;font-weight:700;color:var(--muted);text-transform:uppercase}
.lock b{font-size:24px;font-weight:800;letter-spacing:-.03em;border-bottom:3px solid var(--red);padding-bottom:1px}
.lock i{font-style:normal;font-size:7.5px;letter-spacing:.32em;font-weight:700;text-transform:uppercase;margin-top:3px}
.tr{display:flex;align-items:center;gap:10px}
.langs{display:flex;border:2px solid var(--red);border-radius:99px;overflow:hidden}
.langs button{border:0;background:#fff;color:var(--red);font-size:12px;font-weight:800;padding:7px 11px;min-height:36px}
.langs button.on{background:var(--red);color:#fff}
main{max-width:760px;margin:0 auto;padding:0 18px 120px}
.prog{display:flex;gap:4px;margin:4px 0 22px}
.prog i{flex:1;height:5px;border-radius:99px;background:var(--line)}
.prog i.on{background:var(--ink)}
.k{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(30px,6vw,44px);line-height:1.02;letter-spacing:-.045em;margin:8px 0 10px;font-weight:800}
.lead{font-size:15px;color:#45444c;margin:0 0 22px;max-width:560px}
/* the property card: big price behind, photo, floating details */
.home{position:relative;margin:0 0 26px}
.home .bg{font-size:clamp(64px,15vw,128px);font-weight:800;letter-spacing:-.065em;line-height:.85;color:#efedea;white-space:nowrap;overflow:hidden;user-select:none}
.home .ph{margin:-28px 0 0 22%;height:210px;border-radius:24px;background:var(--soft) center/cover no-repeat;position:relative;z-index:1}
.home .cd{position:relative;z-index:2;margin:-70px 0 0;width:min(360px,92%);background:#fff;border-radius:20px;padding:16px 18px;box-shadow:0 18px 44px rgba(23,22,28,.16)}
.home .cd b{display:block;font-size:30px;letter-spacing:-.04em;line-height:1}
.home .cd span{display:block;font-size:13px;color:#45444c;margin-top:6px}
.home .cd small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-top:8px}
.home.noimg .ph{display:none}.home.noimg .cd{margin-top:-24px}
/* fields */
.f{margin:0 0 18px}
.f label,.lbl{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.f input,.f select,.f textarea{width:100%;min-height:52px;border:1px solid #d9d6d1;border-radius:14px;background:var(--soft);padding:0 16px;font-size:16px}
.f textarea{padding:12px 16px;min-height:96px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:3px solid var(--red-t);border-color:var(--red)}
.f .hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.f.bad input,.f.bad select{border-color:var(--red)}
.f .err{display:none;color:var(--red);font-size:12.5px;font-weight:700;margin-top:6px}
.f.bad .err{display:block}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.money{position:relative}
.money::before{content:"$";position:absolute;left:16px;top:50%;transform:translateY(-50%);font-weight:800;color:var(--muted)}
.money input{padding-left:30px}
.bigin input{font-size:clamp(32px,8vw,46px);font-weight:800;letter-spacing:-.04em;min-height:84px;padding-left:40px}
.bigin.money::before{font-size:28px;left:16px}
.ratio{font-size:13px;color:var(--muted);margin-top:8px}
.ratio b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:99px;border:2px solid var(--red);background:#fff;color:var(--red);font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--red);color:#fff}
.chips.sm .chip{min-height:38px;padding:0 13px;font-size:13px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:58px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:#fff;text-align:left;font-weight:700;font-size:15px;width:100%}
.opt small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.opt i{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--red)}
.opt[aria-pressed="true"]{border-color:var(--red);background:var(--red-t)}
.opt[aria-pressed="true"] i{background:var(--red);box-shadow:inset 0 0 0 4px #fff}
.ack{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--soft);font-size:14px;cursor:pointer}
.ack input{width:22px;height:22px;flex:none;accent-color:var(--red);margin-top:1px}
.panel{background:var(--soft);border-radius:22px;padding:20px;margin:0 0 18px}
.tip{border:2px dashed #d9d6d1;border-radius:18px;padding:16px;margin:14px 0 0;font-size:14px;color:#2c2b31}
.tip b{display:block;margin-bottom:6px}
.rev{display:grid;gap:0;border-radius:18px;border:1px solid var(--line);overflow:hidden;margin:0 0 18px}
.rev div{display:flex;justify-content:space-between;gap:14px;padding:12px 16px;border-top:1px solid var(--line);font-size:14px}
.rev div:first-child{border-top:0}
.rev span{color:var(--muted)}
.rev b{text-align:right}
.fine{font-size:11.5px;color:var(--muted);line-height:1.5;margin:10px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -8px 30px rgba(23,22,28,.08);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));z-index:20}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;min-height:56px;border:0;border-radius:16px;background:var(--red);color:#fff;font-weight:800;font-size:16px}
.btn:hover{background:var(--red-d)}
.btn:disabled{opacity:.6;cursor:default}
.btn.alt{flex:0 0 auto;padding:0 20px;background:#fff;color:var(--red);border:2px solid var(--red)}
.done{text-align:center;padding-top:10px}
.done .ok{width:64px;height:64px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;margin:0 auto 16px}
.done .ok svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.actions{display:grid;gap:10px;max-width:440px;margin:22px auto 0}
.actions a,.actions button{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:16px;font-weight:800;font-size:15px;text-decoration:none;border:2px solid var(--red)}
.actions .p{background:var(--red);color:#fff}
.actions .s{background:#fff;color:var(--red)}
.actions .l{border:0;background:none;color:var(--red);min-height:44px}
footer{max-width:760px;margin:0 auto;padding:18px 18px 130px;font-size:11.5px;color:var(--muted);line-height:1.7;border-top:1px solid var(--line)}
footer a{color:var(--muted)}
@media(max-width:560px){.two{grid-template-columns:minmax(0,1fr)}.home .ph{margin-left:0;height:180px}.home .cd{margin:-56px auto 0}}

function freqTxt(f){ var k=String(f||'').toLowerCase(); return /month/.test(k)?t('f_mo'):/quarter/.test(k)?t('f_q'):/ann|year/.test(k)?t('f_yr'):''; }
function factsHtml(){
  if(!H) return '';
  var d=H.details||{}, o=H.offer||{}, tx=H.taxes||{}, lot=H.lot||{}, rows=[];
  var lp=num(H.listPrice), op=num(H.originalPrice), cut=op&&lp&&op>lp?op-lp:0;
  if(lp) rows.push([t('f_list'),money(lp)+(cut?' ('+t('f_cut')+money(cut)+')':'')]);
  if(H.daysOnMarket!=null) rows.push([t('f_dom'),String(H.daysOnMarket)]);
  if(d.yearBuilt) rows.push([t('f_year'),String(d.yearBuilt)]);
  var fee=num(o.hoaFee!=null?o.hoaFee:d.HOAFee);
  if(o.hoa===false&&!fee) rows.push([t('f_hoa'),t('f_hoa_no')]);
  else if(fee) rows.push([t('f_hoa'),money(fee)+(freqTxt(o.hoaFreq)||'')]);
  if(num(tx.annualAmount)) rows.push([t('f_tax'),money(num(tx.annualAmount))+t('f_yr')+(tx.assessmentYear?' ('+tx.assessmentYear+')':'')]);
  if((o.disclosures||[]).some(function(x){ return /mud|pid|district/i.test(x); })) rows.push([t('f_mud'),t('f_mud_y')]);
  if(num(lot.acres)) rows.push([t('f_lot'),num(lot.acres)+t('f_acres')]);
  if(o.subdivision) rows.push([t('f_sub'),o.subdivision]);
  if(!rows.length) return '';
  return '<div class="lbl" style="margin-top:4px">'+t('facts')+'</div><div class="rev" id="facts">'+rows.map(function(r){ return '<div><span>'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>'; }).join('')+'</div>';
}
function note(txt){ return '<p class="hint" style="font-size:13px;color:var(--muted);margin:-8px 0 18px">'+esc(txt)+'</p>'; }
function opt(name,val,label,sub){ return '<button type="button" class="opt" data-o="'+name+'" data-v="'+val+'" aria-pressed="'+(D[name]===val)+'"><i></i><span>'+label+(sub?'<small>'+sub+'</small>':'')+'</span></button>'; }
function field(id,label,html,hint,err){ return '<div class="f" id="f_'+id+'"><label for="'+id+'">'+label+'</label>'+html+(hint?'<div class="hint">'+hint+'</div>':'')+(err?'<div class="err">'+err+'</div>':'')+'</div>'; }

function render(){
  var m=$('main'), h='';
  if(step===0){
    h=prog()+'<h1>'+t('s0h')+'</h1><p class="lead">'+t('s0p')+'</p>'+homeCard()+factsHtml();
    if(!D.mls) h+=field('address',t('addr'),'<input id="address" autocomplete="street-address" placeholder="'+t('addr_ph')+'" value="'+esc(D.address)+'">','',t('need'))+
      field('list_price',t('list')+(lang==='es'?' (si lo sabe)':' (if you know it)'),'<div class="money"><input id="list_price" inputmode="numeric" value="'+esc(D.list_price)+'"></div>');
    h+='<div class="f" id="f_ack"><label class="ack"><input type="checkbox" id="ack"'+(D.ack?' checked':'')+'><span>'+t('ack')+'</span></label><div class="err">'+t('ack_err')+'</div></div>';
  }else if(step===1){
    var r=D.list_price&&num(D.offer_price)?num(D.offer_price)/num(D.list_price):0;
    h=prog()+'<h1>'+t('s1h')+'</h1>'+
      field('offer_price',t('offer'),'<div class="money bigin"><input id="offer_price" inputmode="numeric" value="'+esc(D.offer_price?Number(num(D.offer_price)).toLocaleString('en-US'):'')+'"></div>'+
        (D.list_price?'<div class="ratio" id="ratio">'+(r?'<b>'+(r*100).toFixed(1)+'%</b>'+t('of_list'):'')+'</div>':'')+
        (H&&H.daysOnMarket!=null?'<div class="ratio">'+esc(t('dom_tip')(H.daysOnMarket,num(H.originalPrice)>num(H.listPrice)&&num(H.listPrice)?money(num(H.originalPrice)-num(H.listPrice)):''))+'</div>':''),'',t('bad_price'))+
      (D.list_price?'<div class="chips sm" style="margin:-6px 0 22px">'+[[1,t('c_list')],[0.98,'−2%'],[0.95,'−5%'],[1.01,'+1%']].map(function(c){
        var v=Math.round(num(D.list_price)*c[0]/500)*500; return '<button type="button" class="chip" data-price="'+v+'" aria-pressed="'+(num(D.offer_price)===v)+'">'+c[1]+'</button>'; }).join('')+'</div>':'')+
      field('earnest',t('earnest'),'<div class="money"><input id="earnest" inputmode="numeric" value="'+esc(D.earnest?Number(num(D.earnest)).toLocaleString('en-US'):'')+'"></div>',t('earnest_h'));
  }else if(step===2){
    var cash=D.financing==='cash';
    h=prog()+'<h1>'+t('s2h')+'</h1>'+(filled.fin?note(t('from_acct2')):'')+
      (P&&P.proof_verified?'<p class="tip" style="margin:0 0 18px"><b style="display:inline">'+(P.proof_verified==='pof'?t('pof_ok'):t('pv_ok'))+'</b></p>':P&&P.proof_pending?note(t('pf_wait')):'')+
      '<div class="f" id="f_financing"><div class="opts">'+opt('financing','financed',t('fin'),t('fin_s'))+opt('financing','cash',t('cash'),t('cash_s'))+'</div><div class="err">'+t('pick')+'</div></div>';
    if(D.financing==='financed') h+='<div class="f"><span class="lbl">'+t('loan')+'</span><div class="chips">'+['fha','conv','va','itin','dk'].map(function(k){
        return '<button type="button" class="chip" data-loan="'+k+'" aria-pressed="'+(D.loan_type===k)+'">'+T[lang].ln[k]+'</button>'; }).join('')+'</div></div>'+
      '<div class="two">'+field('down_payment',t('down'),'<input id="down_payment" value="'+esc(D.down_payment)+'" placeholder="'+t('down_ph')+'">')+
        field('lender',t('lender'),'<input id="lender" value="'+esc(D.lender)+'">')+'</div>';
    if(D.financing) h+='<div class="f" id="f_proof"><span class="lbl">'+(cash?t('pof_q'):t('pre_q'))+'</span><div class="opts">'+
      opt('proof','yes',t('p_yes'))+opt('proof','working',t('p_work'))+opt('proof','no',t('p_no'))+'</div><div class="err">'+t('pick')+'</div></div>';
  }else if(step===3){
    var cs=D.financing==='cash'?['insp','appr','sale']:['insp','appr','fin','sale'];
    h=prog()+'<h1>'+t('s3h')+'</h1><div class="f"><span class="lbl">'+t('cont')+'</span><div class="chips">'+cs.map(function(k){
      return '<button type="button" class="chip" data-cont="'+k+'" aria-pressed="'+(D.contingencies.indexOf(k)>=0)+'">'+T[lang].ct[k]+'</button>'; }).join('')+'</div></div>'+
      '<div class="two">'+field('option_days',t('opt'),'<input id="option_days" inputmode="numeric" value="'+esc(D.option_days)+'">',t('opt_h'))+
      field('close_date',t('close'),'<input id="close_date" type="date" value="'+esc(D.close_date)+'" min="'+iso(new Date())+'">')+'</div>'+
      field('notes',t('notes'),'<textarea id="notes" placeholder="'+t('notes_ph')+'">'+esc(D.notes)+'</textarea>');
  }else if(step===4){
    var so=strengthObj(), st=JagOffer.strength(so), cmp=JagOffer.compare(so), L=JagOffer.text();
    var proofTxt={yes:t('p_yes'),working:t('p_work'),no:t('p_no')}[D.proof]||'—';
    h=prog()+'<h1>'+t('s4h')+'</h1>'+homeCard()+
      '<div class="panel">'+JagOffer.meter(st.level,{big:true})+
      (D.proof!=='yes'&&cmp.better?'<div class="tip"><b>'+t('tip_h')+'</b>'+(D.financing==='cash'?t('tip_f')(L.lv[cmp.with.level]):t('tip_p')(L.lv[cmp.with.level]))+
        '<div style="margin-top:10px">'+JagOffer.meter(cmp.with.level,{title:cmp.label})+'</div></div>':'')+
      '<p class="fine">'+L.fine+'</p></div>'+
      '<div class="rev">'+[[t('r_home'),D.address||'—'],[t('r_price'),D.offer_price?money(num(D.offer_price)):'—'],[t('r_earn'),D.earnest?money(num(D.earnest)):'—'],
        [t('r_pay'),D.financing==='cash'?t('cash_lbl'):(t('fin_lbl')+(D.loan_type?' · '+T[lang].ln[D.loan_type]:''))],[t('r_proof'),proofTxt],
        [t('r_opt'),D.option_days?D.option_days+t('days'):'—'],[t('r_close'),D.close_date||'—'],[t('r_cont'),contText().join(', ')||'—']]
        .map(function(r){ return '<div><span>'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>'; }).join('')+'</div>';
  }else if(step===5){
    h=prog()+'<h1>'+t('s5h')+'</h1><p class="lead">'+t('s5p')+'</p>'+(filled.contact?note(t('from_acct')):'')+
      field('name',t('name'),'<input id="name" autocomplete="name" value="'+esc(D.name)+'">','',t('bad_name'))+
      '<div class="two">'+field('phone',t('phone'),'<input id="phone" type="tel" autocomplete="tel" inputmode="tel" value="'+esc(D.phone)+'">','',t('bad_phone'))+
      field('email',t('email'),'<input id="email" type="email" autocomplete="email" inputmode="email" value="'+esc(D.email)+'">','',t('bad_email'))+'</div>'+
      field('co_buyer',t('co'),'<input id="co_buyer" value="'+esc(D.co_buyer)+'">',t('co_h'))+'<p class="fine">'+t('consent')+'</p>';
  }else{ return renderDone(); }
  m.innerHTML=h;
  $('bar').hidden=false;
  $('back').textContent=t('back'); $('back').style.display=step?'':'none';
  $('next').textContent=step===N-1?t('send'):t('next'); $('next').disabled=false;
  wire();
}
function renderDone(){
  $('bar').hidden=true;
  var signed=!!(window.JagAccount&&JagAccount.user());
  var preUrl='apply.html?'+new URLSearchParams({lang:lang,home:D.address||'',mls:D.mls||'',price:String(Math.round(num(D.offer_price))||'')}).toString();
  $('main').innerHTML='<div class="done"><div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>'+
    '<div class="k">'+t('dk')+'</div><h1>'+t('dh')+'</h1><p class="lead" style="margin:0 auto">'+t('dp')+'</p>'+
    '<div class="actions"><button type="button" class="p" id="portal">'+t('d_portal')+'</button>'+
    (D.proof!=='yes'&&D.financing==='financed'?'<a class="s" href="'+esc(preUrl)+'">'+t('d_pre')+'</a>':'')+
    (D.proof==='yes'&&!(P&&P.proof_verified)?'<a class="s" href="account.html#offers">'+t('d_up')+'</a>':'')+
    '<a class="l" href="homes">'+t('d_homes')+'</a></div></div>';
  $('portal').onclick=function(){
    if(signed){ location.href='account.html#offers'; return; }
    JagAccount.requireSignIn('why_offer',D.email).then(function(){ location.href='account.html#offers'; }).catch(function(){});
  };
}
function wire(){
  var m=$('main');
  m.querySelectorAll('input,textarea,select').forEach(function(el){
    el.addEventListener('input',function(){
      var k=el.id; if(k==='ack') return;
      D[k]=el.value; var fg=el.closest('.f'); if(fg) fg.classList.remove('bad');
      if(k==='offer_price'||k==='earnest'||k==='list_price'){ var v=num(el.value); if(k!=='list_price'){ el.value=v?v.toLocaleString('en-US'):''; } D[k]=v||''; }
      if(k==='offer_price'&&$('ratio')){ var r=num(D.list_price)?num(D.offer_price)/num(D.list_price):0; $('ratio').innerHTML=r?'<b>'+(r*100).toFixed(1)+'%</b>'+t('of_list'):'';
        m.querySelectorAll('[data-price]').forEach(function(b){ b.setAttribute('aria-pressed',String(+b.dataset.price===num(D.offer_price))); }); }
    });
  });
  var ack=$('ack'); if(ack) ack.onchange=function(){ D.ack=ack.checked; $('f_ack').classList.remove('bad'); };
  m.querySelectorAll('[data-price]').forEach(function(b){ b.onclick=function(){ D.offer_price=+b.dataset.price; render(); }; });
  m.querySelectorAll('[data-o]').forEach(function(b){ b.onclick=function(){
    var k=b.dataset.o; D[k]=b.dataset.v;
    if(k==='financing'){ D.contingencies=D.contingencies.filter(function(c){ return D.financing==='cash'?c!=='fin':true; });
      if(D.financing==='financed'&&D.contingencies.indexOf('fin')<0) D.contingencies.push('fin'); }
    render(); }; });
  m.querySelectorAll('[data-loan]').forEach(function(b){ b.onclick=function(){ D.loan_type=b.dataset.loan; render(); }; });
  m.querySelectorAll('[data-cont]').forEach(function(b){ b.onclick=function(){ var k=b.dataset.cont, i=D.contingencies.indexOf(k);
    if(i>=0) D.contingencies.splice(i,1); else D.contingencies.push(k); b.setAttribute('aria-pressed',String(i<0)); }; });
}
function bad(id){ var f=$('f_'+id); if(f){ f.classList.add('bad'); var i=f.querySelector('input,select,textarea'); if(i) i.focus(); } return false; }
function valid(){
  if(step===0){ if(!D.mls&&!String(D.address).trim()) return bad('address'); if(!D.ack) return bad('ack'); }
  if(step===1&&!(num(D.offer_price)>0)) return bad('offer_price');
  if(step===2){ if(!D.financing) return bad('financing'); if(!D.proof) return bad('proof'); }
  if(step===5){
    if(!String(D.name).trim()) return bad('name');
    if(String(D.phone).replace(/\D/g,'').length<10) return bad('phone');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(D.email).trim())) return bad('email');
  }
  return true;
}
$('next').onclick=function(){ if(busy||!valid()) return; if(step<N-1){ step++; render(); window.scrollTo({top:0,behavior:'smooth'}); } else submit(); };
$('back').onclick=function(){ if(step>0){ step--; render(); window.scrollTo({top:0,behavior:'smooth'}); } };

function submit(){
  busy=true; $('next').disabled=true; $('next').textContent=t('sending');
  var p={ name:String(D.name).trim(), phone:String(D.phone).replace(/\D/g,''), email:String(D.email).trim().toLowerCase(), co_buyer:D.co_buyer, lang:lang,
    mls:D.mls, address:D.address, list_price:D.list_price, property_type:D.property_type, offer_price:num(D.offer_price), earnest:num(D.earnest),
    financing:D.financing, loan_type:D.loan_type?T.en.ln[D.loan_type]:'', down_payment:D.down_payment, lender:D.lender, proof:D.proof,
    contingencies:D.contingencies.map(function(k){ return T.es.ct[k]; }), option_days:D.option_days, close_date:D.close_date, notes:D.notes,
    agent_code:ref(), source:location.pathname+location.search };
  var tok=window.JagAccount&&JagAccount.user()?JagAccount.token():Promise.resolve(null);
  Promise.resolve(tok).then(function(tk){
    return fetch(SB+'/rest/v1/rpc/jag_offer_submit',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+(tk||KEY),'Content-Type':'application/json'},body:JSON.stringify({p:p})});
  }).then(function(r){ return r.json(); }).then(function(j){
    if(!j||!j.ok){ busy=false; $('next').disabled=false; $('next').textContent=t('send'); alert(j&&j.reason==='too_many'?t('many'):t('fail')); return; }
    try{ var so=strengthObj(); emailTeam(p, JagOffer.text().lv[JagOffer.strength(so).level]); }catch(e){}
    try{ if(window.JagAccount&&JagAccount.user()) JagAccount.logActivity({kind:'inquiry',mls:D.mls||null,price:num(D.offer_price)||null}); }catch(e){}
    step=N; render(); window.scrollTo({top:0,behavior:'smooth'});
  }).catch(function(){ busy=false; $('next').disabled=false; $('next').textContent=t('send'); alert(t('fail')); });
}
function emailTeam(p, lvl){
  function l(k,v){ return v?k+': '+v+'\n':''; }
  var msg='NEW BUYER OFFER (website worksheet, not a binding offer)\n\n'+l('Buyer',p.name)+l('Phone',p.phone)+l('Email',p.email)+l('Co-buyer',p.co_buyer)+l('Language',p.lang)+
    '\n'+l('Home',p.address)+l('MLS',p.mls)+l('List price',p.list_price?money(p.list_price):'')+l('Offer price',money(p.offer_price))+l('Earnest money',p.earnest?money(p.earnest):'')+
    '\n'+l('Paying',p.financing)+l('Loan type',p.loan_type)+l('Down payment',p.down_payment)+l('Lender',p.lender)+l('Pre-approval / proof of funds',p.proof)+
    '\n'+l('Conditions',p.contingencies.join(', '))+l('Option days',p.option_days)+l('Target closing',p.close_date)+l('Notes',p.notes)+l('Agent link',p.agent_code)+
    '\nOffer strength shown to the buyer: '+lvl+'\nUpdate its status in the admin Offers tab.';
  fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
    body:JSON.stringify({access_key:W3,subject:'New Buyer Offer: '+p.name+(p.address?' — '+p.address:''),from_name:'Jason Aguirre Group — eXp Realty',replyto:p.email,botcheck:false,message:msg})}).catch(function(){});
}

/* ---------- language + signed-in prefill ---------- */
function paintLang(){ document.documentElement.lang=lang; document.querySelectorAll('[data-lang]').forEach(function(b){ b.classList.toggle('on',b.dataset.lang===lang); }); }
document.querySelectorAll('[data-lang]').forEach(function(b){ b.onclick=function(){ lang=b.dataset.lang; try{ localStorage.setItem('jag_lang',lang); }catch(e){} paintLang(); if(window.JagAccount&&JagAccount.relabel) JagAccount.relabel(); render(); }; });
paintLang();
/* the listing's basic facts (HAR) for the buyer */
if(D.mls) fetch(API_HOME+'?detail=1&mlsNumber='+encodeURIComponent(D.mls)).then(function(r){ return r.ok?r.json():null; }).then(function(j){
  var l=j&&j.listings&&j.listings[0]; if(!l) return; H=l;
  if(!D.list_price&&num(l.listPrice)){ D.list_price=num(l.listPrice); if(!D.offer_price) D.offer_price=D.list_price; }
  if(!D.photo&&l.images&&l.images[0]) D.photo=l.images[0];
  if(!D.year_built&&(l.details||{}).yearBuilt) D.year_built=l.details.yearBuilt;
  if(step<=1) rerender();
}).catch(function(){});
/* signed in: everything we already know comes filled in (they can still change it) */
var LOAN_BACK={'fha':'fha','conventional':'conv','conv':'conv','va':'va','itin':'itin','not sure yet':'dk','no sé todavía':'dk'};
function rerender(){ var a=document.activeElement; if(a&&$('main').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; if(step<N) render(); }
function applyPrefill(p){
  if(!p||!p.ok) return; P=p;
  var c=false, f=false;
  if(!D.name&&p.name){ D.name=p.name; c=true; }
  if(!D.email&&p.email){ D.email=String(p.email).toLowerCase(); c=true; }
  if(!D.phone&&p.phone){ var d=String(p.phone).replace(/\D/g,'').replace(/^1(?=\d{10}$)/,''); D.phone=d.length===10?'('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6):p.phone; c=true; }
  if(!D.co_buyer&&p.co_buyer){ D.co_buyer=p.co_buyer; c=true; }
  if(!D.financing){
    var fin=p.financing||(p.proof_verified==='pof'?'cash':p.proof_verified==='preapproval'?'financed':'');
    if(fin){ D.financing=fin; f=true;
      if(fin==='financed'&&D.contingencies.indexOf('fin')<0) D.contingencies.push('fin'); }
  }
  if(D.financing==='financed'){
    if(!D.loan_type&&p.loan_type&&LOAN_BACK[String(p.loan_type).toLowerCase()]){ D.loan_type=LOAN_BACK[String(p.loan_type).toLowerCase()]; f=true; }
    if(!D.down_payment&&p.down_payment){ D.down_payment=p.down_payment; f=true; }
    if(!D.lender&&p.lender){ D.lender=p.lender; f=true; }
  }
  if(!D.proof){
    var ok=p.proof_verified&&((D.financing==='cash'&&p.proof_verified==='pof')||(D.financing==='financed'&&p.proof_verified==='preapproval'));
    if(ok){ D.proof='yes'; f=true; } else if(p.proof_pending){ D.proof='working'; f=true; } else if(p.proof_last){ D.proof=p.proof_last; f=true; }
  }
  if(c) filled.contact=true; if(f) filled.fin=true;
  if(step===2||step===5) rerender();
}
if(window.JagAccount){
  JagAccount.mountButton($('acct'));
  var fill=function(){ var u=JagAccount.user(), pr=JagAccount.profile(); if(!u) return;
    var had=!!(D.name&&D.email&&D.phone);
    if(!D.email&&u.email){ D.email=u.email; } if(pr){ if(!D.name&&pr.name) D.name=pr.name; if(!D.phone&&pr.phone) D.phone=pr.phone; }
    if(!had&&D.name&&D.email) filled.contact=true;
    if(!P&&JagAccount.rpc) JagAccount.rpc('jag_offer_prefill').then(applyPrefill).catch(function(){});
    if(step===5) rerender(); };
  fill(); if(JagAccount.user()&&JagAccount.getProfile) JagAccount.getProfile().then(fill).catch(function(){});
  JagAccount.onChange(fill);
}
render();
})();
</script>
