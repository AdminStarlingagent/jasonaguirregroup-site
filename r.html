<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#17161c">
<title>Meeting recap · Jason Aguirre Group</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="jag-capture.js?v=3"></script>
<style>
/* Lola's Breakfast Club recap, opened from the text after the team Zoom: jasonaguirregroup.company/r#<code>
   (r#<code>.<person> opens on that teammate's to-dos). Same family as /m: ink, white cards, red for Lola and what's urgent. */
:root{
  --canvas:#eef0f3; --paper:#ffffff; --ink:#17161c; --graphite:#5d5c66; --soft:#8b8a94; --hair:#dfe1e6;
  --red:#c8102e; --red-t:#fdecef; --green:#0f8a4d; --green-t:#e6f4ec; --amber:#8a5a00; --amber-t:#fff3d9;
  --r-lg:20px; --r-md:14px; --top:58px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:500 15px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.top{position:sticky;top:0;z-index:10;height:var(--top);background:rgba(238,240,243,.94);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--hair)}
.top .in{max-width:760px;margin:0 auto;height:100%;padding:0 16px;display:flex;align-items:center;gap:12px}
.mark{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.02em}
.top h1{margin:0;font-size:15px;line-height:1.25;font-weight:800;min-width:0;flex:1}
.top h1 small{display:block;font-size:12.5px;font-weight:600;color:var(--graphite);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

main{max-width:760px;margin:0 auto;padding:18px 16px 64px}

.lola{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:end}
.ava{width:38px;height:38px;border-radius:99px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px}
.bubble{background:var(--paper);border:1px solid var(--hair);border-radius:20px 20px 20px 6px;padding:12px 15px 13px;font-size:16px;line-height:1.45;font-weight:600;max-width:560px;margin:0}
.bubble .by{display:block;font-size:12px;font-weight:800;color:var(--red);margin-bottom:2px}

/* who is looking: one tab per teammate */
.tabs{position:sticky;top:var(--top);z-index:5;margin:18px -16px 0;padding:10px 16px;background:rgba(238,240,243,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--hair);background:var(--paper);color:var(--ink);border-radius:99px;padding:7px 13px;font:800 13.5px/1.2 inherit;cursor:pointer;min-height:36px}
.tab .n{margin-left:6px;font-weight:700;color:var(--graphite)}
.tab .u{margin-left:5px;background:var(--red);color:#fff;border-radius:99px;padding:1px 7px;font-size:11.5px}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab[aria-pressed="true"] .n{color:#c9c8d0}

.tally{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.tally span{background:var(--paper);border:1px solid var(--hair);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--graphite)}
.tally b{color:var(--ink);font-weight:800}
.tally .warm{background:var(--red-t);border-color:transparent;color:var(--red)}
.tally .warm b{color:var(--red)}

section{margin-top:26px}
section > h2{margin:0 4px 10px;font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.25;display:flex;align-items:center;gap:8px}
section > h2 .dot{width:10px;height:10px;border-radius:99px;flex:0 0 auto}
section > h2 small{font-size:13.5px;font-weight:600;color:var(--graphite)}
.d-today{background:var(--red)} .d-week{background:#e0a100} .d-warm{background:#9a99a3} .d-hold{background:#cfd2d8}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;font-size:12px;font-weight:800;border-radius:99px;padding:3px 9px;white-space:nowrap;line-height:1.5}
.c-due{background:var(--canvas);color:var(--ink)}
.c-due.late{background:var(--red);color:#fff}
.c-owner{background:var(--ink);color:#fff}
.c-owner.me{background:var(--red)}
.c-with{background:var(--canvas);color:var(--graphite)}

a.who{color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:rgba(200,16,46,.55);display:inline-flex;align-items:baseline;gap:5px}
a.who:hover{text-decoration-color:var(--red)}
a.who svg{flex:0 0 auto;align-self:center;color:var(--red)}

.card{background:var(--paper);border:1px solid var(--hair);border-radius:var(--r-lg);padding:14px 16px 14px;margin-top:10px}
.card.today{border-left:5px solid var(--red)}
.card h3{margin:0;font-size:19px;line-height:1.25;font-weight:800;letter-spacing:-.015em}
.card .todo{margin:8px 0 0;font-size:15.5px;line-height:1.45;font-weight:700;display:flex;gap:8px}
.card .todo svg{flex:0 0 auto;margin-top:3px;color:var(--red)}
.card .status{margin:6px 0 0;font-size:14px;line-height:1.5;color:var(--graphite);font-weight:600}
.card .chips{margin-top:10px}
@media(min-width:640px){ .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px} .grid .card{margin-top:0} }

.panel{background:var(--paper);border:1px solid var(--hair);border-radius:var(--r-lg);padding:4px 16px}
.panel ul{list-style:none;margin:0;padding:0}
.row{padding:12px 0;border-top:1px solid var(--hair)}
.row:first-child{border-top:0}
.row .r1{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.row .name{font-size:16px;font-weight:800}
.row .todo{margin:3px 0 0;font-size:14.5px;font-weight:700}
.row .status{margin:2px 0 0;font-size:13.5px;color:var(--graphite);font-weight:600}

.recs{counter-reset:rec;list-style:none;margin:0;padding:0}
.recs li{counter-increment:rec;background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:14px 16px 14px 56px;position:relative;margin-top:10px}
.recs li::before{content:counter(rec);position:absolute;left:16px;top:14px;width:28px;height:28px;border-radius:99px;background:var(--red);display:grid;place-items:center;font-weight:800;font-size:14px}
.recs b{display:block;font-size:16px;line-height:1.35}
.recs p{margin:4px 0 0;color:#c9c8d0;font-size:14px;font-weight:600}
.recs .chip{margin-top:8px;background:rgba(255,255,255,.12);color:#fff}

.sys{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:12px 0;border-top:1px solid var(--hair)}
.sys:first-child{border-top:0}
.sys .ic{grid-row:span 2;width:28px;height:28px;border-radius:8px;background:var(--amber-t);color:var(--amber);display:grid;place-items:center}
.sys b{font-size:15px}
.sys span{font-size:14px;color:var(--graphite);font-weight:600}

.mine-none{background:var(--paper);border:1px solid var(--hair);border-radius:var(--r-lg);padding:16px;color:var(--graphite);font-weight:600}
.sign{margin-top:30px}
.fine{font-size:12.5px;color:var(--soft);line-height:1.55;margin:22px 4px 0}
.empty{background:var(--paper);border-radius:var(--r-lg);padding:24px 20px;border:1px solid var(--hair)}
.empty h2{margin:0;font-size:19px}
.empty p{color:var(--graphite);margin:8px 0 0}
@media print{ .top,.tabs{position:static} body{background:#fff} }
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <div class="mark" aria-hidden="true">JAG</div>
    <h1 id="title">Breakfast Club recap<small id="sub">Loading…</small></h1>
  </div>
</header>
<main id="app" aria-live="polite">
  <div class="empty"><h2>Loading the recap…</h2></div>
</main>
<script>
/* Saved by the JAG Ops meeting recap workflow (n8n) after the morning team Zoom; read here with the short code.
   r#<code> shows everyone, r#<code>.<name> opens on that teammate. Client names link to Follow Up Boss. Expires after 14 days. */
(function(){
  'use strict';
  var CRM = window.JAG_CRM || {};
  var app = document.getElementById('app');
  var ARROW = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M5 3h8v8M13 3 3 13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var CHECK = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3 8.5 6.5 12 13 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var GEAR = '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M5.5 18.5l2.1-2.1M16.4 7.6l2.1-2.1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
  var GROUPS = [['today', 'Do today', 'd-today'], ['week', 'This week', 'd-week'], ['warm', 'Keep them warm', 'd-warm'], ['hold', 'On hold', 'd-hold']];
  var data = null, me = 'all';

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fubUrl(u){ return /^https:\/\/[a-z0-9-]+\.followupboss\.com\/2\/people\/view\/\d+$/.test(String(u || '')) ? u : null; }
  function rpc(name, body){
    return fetch(String(CRM.url || '').replace(/\/+$/, '') + '/rest/v1/rpc/' + name, {
      method: 'POST', headers: { apikey: CRM.anonKey, Authorization: 'Bearer ' + CRM.anonKey, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function(r){ if(!r.ok) throw new Error('http ' + r.status); return r.json(); });
  }
  function readHash(){
    var h = ''; try { h = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim(); } catch(e) {}
    var p = h.split('.');
    return { code: p[0] || '', who: (p[1] || '').toLowerCase() };
  }
  function person(name, url){
    var u = fubUrl(url);
    if(!u) return esc(name);
    return '<a class="who" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer" title="Open ' + esc(name) + ' in Follow Up Boss">' +
      esc(name) + ARROW + '<span class="sr"> (opens Follow Up Boss)</span></a>';
  }
  function mine(owners){ return me === 'all' || (owners || []).some(function(o){ return String(o).toLowerCase() === me; }); }
  function ownerChips(owners){
    return (owners || []).map(function(o){
      var isMe = me !== 'all' && String(o).toLowerCase() === me;
      return '<span class="chip c-owner' + (isMe ? ' me' : '') + '">' + esc(o) + '</span>';
    }).join('');
  }
  function dueChip(it){ return it.due_label ? '<span class="chip c-due' + (it.overdue ? ' late' : '') + ' num">' + esc(it.due_label) + '</span>' : ''; }

  function card(it){
    return '<article class="card' + (it.group === 'today' ? ' today' : '') + '">' +
      '<h3>' + person(it.client, it.fub_url) + '</h3>' +
      '<p class="todo">' + CHECK + '<span>' + esc(it.action) + '</span></p>' +
      (it.status ? '<p class="status">' + esc(it.status) + '</p>' : '') +
      '<div class="chips">' + ownerChips(it.owners) + dueChip(it) + '</div></article>';
  }
  function row(it){
    return '<li class="row"><div class="r1"><span class="name">' + person(it.client, it.fub_url) + '</span>' + ownerChips(it.owners) + dueChip(it) + '</div>' +
      '<p class="todo">' + esc(it.action) + '</p>' + (it.status ? '<p class="status">' + esc(it.status) + '</p>' : '') + '</li>';
  }

  function render(){
    var b = data.board || {}, items = b.items || [], people = b.people || [];
    var html = '';
    if(b.intro) html += '<div class="lola"><div class="ava" aria-hidden="true">L</div><p class="bubble"><span class="by">Lola</span>' + esc(b.intro) + '</p></div>';

    html += '<nav class="tabs" aria-label="Show to-dos for">' +
      '<button class="tab" type="button" data-who="all" aria-pressed="' + (me === 'all') + '">Everyone<span class="n num">' + items.length + '</span></button>' +
      people.map(function(p){
        return '<button class="tab" type="button" data-who="' + esc(p.key) + '" aria-pressed="' + (me === p.key) + '">' + esc(p.name) +
          '<span class="n num">' + p.count + '</span>' + (p.urgent ? '<span class="u num">' + p.urgent + '</span>' : '') + '</button>';
      }).join('') + '</nav>';

    var list = items.filter(function(i){ return mine(i.owners); });
    var urgent = list.filter(function(i){ return i.group === 'today'; }).length;
    var t = [];
    if(urgent) t.push('<span class="warm"><b>' + urgent + '</b> to do today</span>');
    t.push('<span><b>' + list.length + '</b> client' + (list.length === 1 ? '' : 's') + (me === 'all' ? '' : ' on your plate') + '</span>');
    if(b.counts && b.counts.applications) t.push('<span><b>' + esc(b.counts.applications) + '</b> new applications this week</span>');
    html += '<div class="tally num">' + t.join('') + '</div>';

    var recs = (b.recommendations || []).filter(function(r){ return me === 'all' || !r.owners || !r.owners.length || mine(r.owners); });
    if(recs.length){
      html += '<section aria-labelledby="h-rec"><h2 id="h-rec">Lola’s game plan</h2><ol class="recs">' + recs.map(function(r){
        return '<li><b>' + esc(r.title) + '</b>' + (r.why ? '<p>' + esc(r.why) + '</p>' : '') +
          (r.owners && r.owners.length ? '<span class="chip">' + esc(r.owners.join(', ')) + '</span>' : '') + '</li>';
      }).join('') + '</ol></section>';
    }

    if(!list.length) html += '<section><p class="mine-none">Nothing on you from this meeting. Help a teammate out.</p></section>';
    GROUPS.forEach(function(g){
      var gl = list.filter(function(i){ return i.group === g[0]; });
      if(!gl.length) return;
      html += '<section aria-labelledby="h-' + g[0] + '"><h2 id="h-' + g[0] + '"><span class="dot ' + g[2] + '"></span>' + esc(g[1]) + ' <small class="num">' + gl.length + '</small></h2>';
      if(g[0] === 'today' || g[0] === 'week') html += '<div class="grid">' + gl.map(card).join('') + '</div>';
      else html += '<div class="panel"><ul>' + gl.map(row).join('') + '</ul></div>';
      html += '</section>';
    });

    var sys = (b.system || []).filter(function(s){ return mine(s.owners) || (s.owners || []).some(function(o){ return /^all$/i.test(o); }); });
    var team = (b.team || []).filter(function(s){ return mine(s.owners) || (s.owners || []).some(function(o){ return /^all$/i.test(o); }); });
    if(sys.length || team.length){
      html += '<section aria-labelledby="h-sys"><h2 id="h-sys">Systems &amp; team</h2><div class="panel">' +
        sys.concat(team).map(function(s){
          return '<div class="sys"><span class="ic">' + GEAR + '</span><b>' + esc(s.action || s.item) + '</b>' +
            '<span>' + esc(s.issue || '') + (s.owners && s.owners.length ? (s.issue ? ' · ' : '') + esc(s.owners.join(', ')) : '') + '</span></div>';
        }).join('') + '</div></section>';
    }

    if(b.closer) html += '<div class="sign lola"><div class="ava" aria-hidden="true">L</div><p class="bubble"><span class="by">Lola</span>' + esc(b.closer) + '</p></div>';
    html += '<p class="fine">Tap a client’s name to open their profile in Follow Up Boss (you need to be logged in); names without a link didn’t have a clear match. Pulled from this morning’s team Zoom, so double-check anything that sounds off. Team only: please don’t forward the link. It expires after 14 days.</p>';
    app.innerHTML = html;
    Array.prototype.forEach.call(app.querySelectorAll('.tab'), function(btn){
      btn.addEventListener('click', function(){
        me = btn.getAttribute('data-who');
        var h = readHash();
        history.replaceState(null, '', '#' + h.code + (me === 'all' ? '' : '.' + me));
        render();
        var t = app.querySelector('.tab[aria-pressed="true"]'); if(t && t.scrollIntoView) t.scrollIntoView({ inline: 'center', block: 'nearest' });
      });
    });
  }
  function fail(head, msg){
    document.getElementById('sub').textContent = '';
    app.innerHTML = '<div class="empty"><h2>' + esc(head) + '</h2><p>' + esc(msg) + '</p></div>';
  }
  function start(){
    var h = readHash();
    if(!/^[A-Za-z0-9]{8,16}$/.test(h.code) || !CRM.url || !CRM.anonKey){ fail('This link is not complete', 'Open the recap from Lola’s text after the morning Zoom.'); return; }
    rpc('ops_meeting_recap_peek', { p_code: h.code }).then(function(r){
      if(!(r && r.ok)){
        if(r && r.expired) fail('This recap has expired', 'Lola sends a new one after every morning Zoom.');
        else fail('This recap was not found', 'Check that the whole link came through.');
        return;
      }
      data = r;
      var b = r.board || {};
      var keys = (b.people || []).map(function(p){ return p.key; });
      me = keys.indexOf(h.who) >= 0 ? h.who : 'all';
      document.getElementById('sub').textContent = b.date_label || '';
      document.title = 'Meeting recap' + (b.date_label ? ', ' + b.date_label : '') + ' · JAG';
      render();
    }).catch(function(){ fail('No connection', 'Check your signal and reload the page.'); });
  }
  window.addEventListener('hashchange', function(){ if(!data || readHash().code !== (location.hash || '').slice(1).split('.')[0]) { data = null; } start(); });
  start();
})();
</script>
</body>
</html>
