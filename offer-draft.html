<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>JAG · Offer draft</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="jag-capture.js?v=3"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js" integrity="sha512-z8IYLHO8bTgFqj+yrPyIJnzBDf7DDhWwiEsk4sY+Oe6J2M+WQequeGS7qioI5vT6rXgVRb4K1UVQC5ER7MKzKQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="offer-fill.js?v=3"></script>
<style>
:root{ --ink:#17161c; --card:#f5f5f7; --line:#e8e8ec; --red:#c8102e; --red-t:#fbe9ec; --green:#0f8a4d; --green-t:#e7f5ee; --muted:#6a6972; --soft:#8a8992; --amber:#9a6200; --amber-t:#fff4de; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--card);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:20px 16px 120px}
.brand{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--soft);margin:4px 0 14px}
.brand b{color:var(--ink)}
h1{font-size:22px;line-height:1.25;letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);font-size:14px;margin:6px 0 0}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 16px;margin-top:14px}
.panel h2{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1 / -1}
@media (max-width:560px){ .grid{grid-template-columns:1fr} }
label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid #d9d9df;border-radius:11px;padding:10px 12px;min-height:44px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:var(--ink)}
.need input,.need select,.need textarea{border-color:var(--red);background:var(--red-t)}
.hint{font-size:12px;color:var(--soft);margin-top:4px}
.missing{background:var(--amber-t);border:1px solid #f1d39b;border-radius:14px;padding:12px 14px;margin-top:14px;font-size:14px}
.missing b{display:block;margin-bottom:4px}
.missing ul{margin:4px 0 0;padding-left:18px}
.allset{background:var(--green-t);border-color:#bfe3cf}
.calc{font-size:14px;color:var(--muted);margin-top:2px}
.check{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;color:var(--ink)}
.check input{width:22px;min-height:22px;height:22px;flex:0 0 22px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{border:0;border-radius:12px;background:var(--ink);color:#fff;font:inherit;font-weight:800;font-size:15px;padding:12px 16px;cursor:pointer;min-height:44px}
button.ghost{background:#fff;color:var(--ink);border:1px solid #d9d9df}
button[disabled]{opacity:.5;cursor:default}
.status{font-size:13px;color:var(--muted);flex:1 1 100%}
.err{color:var(--red)}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin-top:14px}
.hidden{display:none}
.warn{background:var(--red-t);border:1px solid #f1bcc5;border-radius:14px;padding:12px 14px;margin-top:10px;font-size:14px}
.warn b{display:block;margin-bottom:4px}
.warn ul{margin:4px 0 0;padding-left:18px}
.pkg .doc{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.pkg .doc:first-of-type{border-top:0}
.pkg .doc span{font-size:14.5px;font-weight:700}
.pkg .doc small{display:block;font-size:12px;color:var(--soft);font-weight:600}
.pkg .doc button{padding:10px 14px;font-size:14px;min-height:40px;flex:0 0 auto}
.pkg h3{font-size:12.5px;font-weight:800;color:var(--muted);margin:16px 0 6px;letter-spacing:.04em;text-transform:uppercase}
.pkg .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pkg .row button{flex:1 1 160px}
.pkg label.check{margin:8px 0;font-weight:600}
.btnlink{flex:1 1 160px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;background:var(--ink);color:#fff;font-weight:800;font-size:15px;padding:12px 16px;min-height:44px;text-decoration:none}
</style>
</head>
<body>
<main>
  <p class="brand"><b>JAG</b> · OFFER DRAFT</p>
  <div id="app" aria-live="polite"><h1>Loading…</h1></div>
</main>
<div class="bar hidden" id="bar"><div class="in">
  <button type="button" id="goPkg">Get the PDFs</button>
  <button type="button" id="save" class="ghost">Save</button>
  <div class="status" id="status"></div>
</div></div>
<script>
/* Offer draft review. The text link carries ?t=<token>; the token is the only key to this offer.
   Edits save to Supabase; the PDFs are filled right here in the browser from TREC's own forms. */
(function(){
  'use strict';
  var CRM = window.JAG_CRM || {}, Fill = window.JAGOfferFill;
  var token = (new URLSearchParams(location.search).get('t') || '').toLowerCase();
  var app = document.getElementById('app'), bar = document.getElementById('bar'), statusEl = document.getElementById('status');
  var offer = null, defaults = {}, dirty = false;

  var SECTIONS = [
    ['Parties', [
      ['buyer_names', 'Buyer full legal names', 'text', {full:1, hint:'Exactly as they will sign.'}],
      ['seller_names', 'Seller names', 'text', {full:1, hint:'From the tax record or listing.'}]]],
    ['Property', [
      ['address', 'Street address', 'text', {full:1}],
      ['city', 'City', 'text'], ['zip', 'ZIP', 'text', {mode:'numeric'}],
      ['county', 'County', 'text'], ['year_built', 'Year built', 'number', {hint:'Before 1978 adds the lead-based paint addendum.'}],
      ['lot', 'Lot', 'text'], ['block', 'Block', 'text'],
      ['addition', 'Subdivision (addition)', 'text', {full:1}],
      ['hoa', 'Mandatory HOA?', 'select', {opts:[['',''],['true','Yes (adds HOA addendum)'],['false','No']]}],
      ['exclusions', 'Items the seller keeps (exclusions)', 'text', {full:1}]]],
    ['Price and financing', [
      ['sales_price', 'Sales price ($)', 'money'],
      ['loan_type', 'Loan type', 'select', {opts:[['',''],['fha','FHA'],['conventional','Conventional'],['va','VA'],['usda','USDA'],['cash','Cash']]}],
      ['loan_amount', 'Loan amount ($)', 'money', {hint:'Base loan, without financed MIP or funding fee.'}],
      ['down_payment', 'or down payment (% or $)', 'text', {hint:'Used only when loan amount is blank.'}],
      ['seller_concession', "Seller pays toward buyer's costs ($)", 'money', {full:1}]]],
    ['Earnest money and option', [
      ['earnest_money', 'Earnest money ($)', 'money'], ['option_fee', 'Option fee ($)', 'money'],
      ['option_days', 'Option days', 'number'], ['title_company', 'Title company (escrow agent)', 'text'],
      ['title_company_address', 'Title company address', 'text', {full:1}],
      ['escrow_officer', 'Escrow officer (name, email, phone)', 'text', {full:1, hint:'For your records and the title order; not printed on the contract.'}]]],
    ['Title and survey', [
      ['title_paid_by', 'Owner title policy paid by', 'select', {opts:[['seller','Seller'],['buyer','Buyer']]}],
      ['objection_days', 'Title objection days (6D)', 'number'],
      ['survey', 'Survey', 'select', {opts:[['',''],['existing','Seller gives existing survey + T-47'],['new_buyer','New survey, buyer pays'],['new_seller','New survey, seller pays']]}],
      ['survey_days', 'Survey days', 'number'],
      ['survey_new_paid_by', 'If existing survey not accepted, new one paid by', 'select', {opts:[['buyer','Buyer'],['seller','Seller']]}],
      ['shortages', '6A(8) shortages in area', 'select', {opts:[['','Leave blank'],['none','(i) Not amended'],['buyer','(ii) Amended, buyer pays'],['seller','(ii) Amended, seller pays']]}]]],
    ['Condition and disclosures', [
      ['sd_status', "Seller's Disclosure Notice", 'select', {opts:[['',''],['received','Buyer has received it'],['not_received','Not received yet'],['not_required','Seller not required']]}],
      ['sd_days', 'Days to deliver it', 'number'],
      ['water_status', "Seller's Water Disclosure (7I)", 'select', {opts:[['',''],['received','Buyer has received it'],['not_received','Not received yet'],['not_required','Seller not required']]}],
      ['water_days', 'Days to deliver it', 'number'],
      ['water_provider', 'Water provider (only if not required)', 'text', {full:1}],
      ['repairs', 'Specific repairs seller completes (blank = As Is)', 'textarea', {full:1, hint:'Name each repair. No general phrases like "subject to inspections".'}],
      ['service_contract', 'Home warranty reimbursement up to ($)', 'money', {full:1}]]],
    ['HOA addendum (TREC 36-11)', [
      ['hoa_name', 'HOA name', 'text'], ['hoa_phone', 'HOA phone', 'tel'],
      ['hoa_option', 'Subdivision information (resale certificate, rules)', 'select', {full:1, opts:[['',''],['seller_delivers','Seller gets it and delivers it within ___ days'],['buyer_obtains','Buyer gets it within ___ days'],['received','Buyer already received and approved it'],['not_required','Buyer does not need it']]}],
      ['hoa_days', 'Days', 'number'],
      ['hoa_resale_cert', 'Updated resale certificate (only if already received)', 'select', {opts:[['',''],['false','Not required'],['true','Required']]}],
      ['hoa_fee_cap', 'Buyer pays HOA transfer fees up to ($)', 'money'],
      ['hoa_info_paid_by', 'Cost of getting the HOA information paid by', 'select', {opts:[['',''],['seller','Seller'],['buyer','Buyer']]}]], 'hoaSec'],
    ['Lead-based paint addendum (TREC 56-0)', [
      ['lead_inspection', 'Lead paint inspection', 'select', {full:1, opts:[['',''],['waive','Buyer waives the inspection'],['inspect','Buyer may inspect within 10 days']]}],
      ['lead_info_received', 'Buyer received the lead records listed by seller', 'select', {opts:[['',''],['true','Yes'],['false','No']]}],
      ['lead_pamphlet', 'Buyer received the EPA lead pamphlet', 'select', {opts:[['true','Yes'],['false','No']]}]], 'leadSec'],
    ['Closing', [
      ['closing_date', 'Closing on or before', 'date'],
      ['possession', 'Possession', 'select', {opts:[['closing','At closing and funding'],['lease','Per temporary lease']]}],
      ['special_provisions', 'Special provisions', 'textarea', {full:1, hint:'Facts and instructions only; TREC does not allow new legal terms here.'}],
      ['district_notices', 'MUD / PID / district notices given', 'text', {full:1}],
      ['appraisal_addendum', "Add Right to Terminate Due to Lender's Appraisal", 'select', {opts:[['',''],['true','Yes'],['false','No']]}]]],
    ["Buyer's agent compensation (12B)", [
      ['comp_payer', 'Who contributes', 'select', {opts:[['',''],['seller','Seller pays'],['buyer','Buyer pays']]}],
      ['comp_type', 'As', 'select', {opts:[['pct','% of sales price'],['amount','Dollar amount']]}],
      ['comp_value', 'Amount (% or $)', 'text', {mode:'decimal'}]]],
    ['Financing addendum (TREC 40-11)', [
      ['loan_years', 'Loan term (years)', 'number'], ['rate_cap', 'Interest rate not to exceed (%)', 'text', {mode:'decimal'}],
      ['rate_years', 'Rate cap applies for first (years)', 'number'], ['orig_cap', 'Origination charges not to exceed (%)', 'text', {mode:'decimal'}],
      ['fha_section', 'FHA section', 'text'], ['approval_days', 'Buyer Approval days', 'text', {hint:'Type none if the offer is not subject to Buyer Approval.'}]], 'financed'],
    ['Buyer contact for notices', [
      ['buyer_notice_address', 'Buyer mailing address', 'text', {full:1}],
      ['buyer_phone', 'Buyer phone', 'tel'], ['buyer_email', 'Buyer email', 'email']]],
    ['Listing side', [
      ['listing_firm', 'Listing broker firm', 'text'], ['listing_agent', 'Listing agent', 'text'],
      ['listing_agent_phone', 'Listing agent phone', 'tel'], ['listing_agent_email', 'Listing agent email', 'email'],
      ['listing_agent_address', 'Listing agent address (notices)', 'text', {full:1}]]],
    ['Our agent and broker', [
      ['buyer_agent', 'Agent name', 'text'], ['buyer_agent_license', 'Agent license no.', 'text'],
      ['buyer_agent_phone', 'Agent phone', 'tel'], ['buyer_agent_email', 'Agent email', 'email'],
      ['buyer_team', 'Team name', 'text'], ['buyer_firm', 'Broker firm', 'text'],
      ['buyer_firm_license', 'Broker firm license no.', 'text'], ['buyer_firm_address', 'Broker firm address', 'text'],
      ['buyer_supervisor', 'Licensed supervisor', 'text'], ['buyer_supervisor_license', 'Supervisor license no.', 'text'],
      ['buyer_supervisor_phone', 'Supervisor phone', 'tel']]]
  ];
  /* Keys whose current value can be remembered as the team default (matches the server list). */
  var DEFAULT_KEYS = ['title_company','title_company_address','title_paid_by','survey','survey_days','survey_new_paid_by','objection_days',
    'option_days','possession','loan_years','rate_years','rate_cap','orig_cap','fha_section','approval_days','comp_payer','comp_type',
    'comp_value','buyer_firm','buyer_firm_license','buyer_firm_address','buyer_team','buyer_agent','buyer_agent_license',
    'buyer_agent_phone','buyer_agent_email','buyer_supervisor','buyer_supervisor_license','buyer_supervisor_phone','sd_days','water_days',
    'hoa_option','hoa_days','hoa_fee_cap','hoa_info_paid_by','service_contract'];
  /* Which inputs a missing-list label points at, so the field turns red. */
  var NEED_KEYS = {
    'Buyer full legal names':['buyer_names'], 'Seller names':['seller_names'], 'Property address, city and ZIP':['address','city','zip'],
    'County':['county'], 'Legal description (lot, block, subdivision)':['lot','block','addition'], 'Sales price':['sales_price'],
    'Loan type':['loan_type'], 'Loan amount or down payment':['loan_amount'], 'Earnest money':['earnest_money'], 'Option fee':['option_fee'],
    'Option days':['option_days'], 'Title company':['title_company'], 'Closing date':['closing_date'], 'Survey choice':['survey'],
    'Title objection days (6D)':['objection_days'], "Seller's Disclosure (received or not)":['sd_status'],
    "Seller's Water Disclosure (7I)":['water_status'], 'HOA yes or no':['hoa'], 'Year built (lead-based paint addendum)':['year_built'],
    "Buyer's agent compensation (12B)":['comp_payer','comp_value'], "Agent's license number":['buyer_agent_license'],
    'Broker firm license number':['buyer_firm_license'], 'Interest rate cap (financing addendum)':['rate_cap'],
    'Origination charges cap (financing addendum)':['orig_cap'], 'Buyer Approval days, or "none" (financing addendum)':['approval_days'],
    'HOA name (HOA addendum)':['hoa_name'], 'Subdivision information choice and days (HOA addendum)':['hoa_option','hoa_days'],
    'HOA transfer fees cap (HOA addendum)':['hoa_fee_cap'], 'Lead-based paint inspection: waive or inspect (lead addendum)':['lead_inspection']
  };
  /* Blank TREC forms served next to this page. */
  var BLANKS = { contract:'forms/trec-20-19.pdf', tpfa:'forms/trec-40-11.pdf', hoa:'forms/trec-36-11.pdf', lead:'forms/trec-56-0.pdf' };
  /* Documents that come from the listing, the lender or DigiSign, not from this page.
     From the team's past offer emails: the pre-approval is what listing agents ask for most. */
  function attachList(c){
    var d = c.d, list = [];
    list.push(['pkg_preapproval', c.type === 'cash' ? 'Proof of funds' : 'Pre-approval letter', 'Listing agents asked for it on 6 past offers. Check it is really attached.']);
    list.push(['pkg_sd', "Seller's Disclosure, signed by seller", 'From the listing; buyer signs it too.']);
    list.push(['pkg_mud', 'MUD / water district notice', 'From the listing, if the home is in a MUD, WCID or PID.']);
    if(d.survey === 'existing') list.push(['pkg_survey', "Seller's survey and T-47.1", 'From the listing.']);
    if(c.leadPaint) list.push(['pkg_pamphlet', 'Lead paint pamphlet receipt (TXR 2511)', 'From DigiSign.']);
    list.push(['pkg_txr', 'Buyer notices from DigiSign (TXR 1414 flood, 1506, 2517 wire fraud)', 'Optional; included on some past offers.']);
    return list;
  }
  var ATTACH_NAMES = { pkg_preapproval:'pre-approval letter', pkg_sd:"signed Seller's Disclosure", pkg_mud:'MUD notice',
    pkg_survey:'survey and T-47.1', pkg_pamphlet:'lead paint pamphlet receipt', pkg_txr:'buyer notices' };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function rpc(name, body){
    return fetch(String(CRM.url||'').replace(/\/+$/,'') + '/rest/v1/rpc/' + name, {
      method:'POST', headers:{ apikey:CRM.anonKey, Authorization:'Bearer '+CRM.anonKey, 'Content-Type':'application/json' },
      body:JSON.stringify(body)
    }).then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); });
  }
  function setStatus(msg, bad){ statusEl.textContent = msg || ''; statusEl.className = 'status' + (bad ? ' err' : ''); }

  function current(){
    var t = {};
    app.querySelectorAll('[data-k]').forEach(function(el){
      var k = el.getAttribute('data-k');
      if(el.type === 'checkbox'){ if(el.checked) t[k] = 'true'; return; }
      var v = el.value.trim();
      if(v !== '') t[k] = v;
    });
    return t;
  }

  function included(c, t){
    var names = Fill.forms(c).map(function(f){ return f.label === 'Resale contract' ? null : f.label; }).filter(Boolean);
    attachList(c).forEach(function(a){ if(t[a[0]] === 'true') names.push(ATTACH_NAMES[a[0]]); });
    return names;
  }

  var pkgSig = '', prepared = null;
  function renderPackage(c, t){
    /* Re-draw only when the list changes: a blur 'change' event must not swap out a button mid-click. */
    var sig = Fill.forms(c).map(function(f){ return f.key; }).join(',') + '|' +
      attachList(c).map(function(a){ return a[0] + (t[a[0]] === 'true' ? '+' : ''); }).join(',');
    if(sig === pkgSig) return;
    pkgSig = sig;
    var html = '<h2>Offer package</h2>';
    Fill.forms(c).forEach(function(f){
      html += '<div class="doc"><span>' + esc(f.label) + '<small>' + esc(f.form) + ' · filled from this page</small></span>' +
        '<button type="button" data-dl="' + f.key + '">Download</button></div>';
    });
    html += '<h3>Also attach</h3>';
    attachList(c).forEach(function(a){
      html += '<label class="check"><input type="checkbox" data-k="' + a[0] + '"' + (t[a[0]] === 'true' ? ' checked' : '') + '> <span>' + esc(a[1]) +
        '<small class="hint" style="display:block">' + esc(a[2]) + '</small></span></label>';
    });
    html += '<h3>Send it</h3><div class="row"><button type="button" id="sendGmail">Email it with the PDFs attached</button>' +
      '<button type="button" class="ghost" id="copyEmail">Copy email text only</button></div>' +
      '<div id="sendBox"></div>';
    document.getElementById('pkg').innerHTML = html;
    prepared = null;
  }

  function refresh(){
    var t = current(), c = Fill.compute({}, t);
    var miss = Fill.missing(c), warn = Fill.warnings(c);
    var box = document.getElementById('missing');
    box.className = 'missing' + (miss.length ? '' : ' allset');
    box.innerHTML = miss.length
      ? '<b>Still needed before signatures (' + miss.length + ')</b><ul>' + miss.map(function(m){ return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>'
      : '<b>Every blank we track is filled.</b>Read the whole draft before sending it for signatures.';
    var wb = document.getElementById('warnings');
    wb.className = warn.length ? 'warn' : 'hidden';
    wb.innerHTML = warn.length ? '<b>Double-check</b><ul>' + warn.map(function(m){ return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>' : '';
    var needed = {};
    miss.forEach(function(m){ (NEED_KEYS[m] || []).forEach(function(k){ needed[k] = 1; }); });
    app.querySelectorAll('.panel [data-k]').forEach(function(el){
      if(el.type === 'checkbox') return;
      el.parentNode.classList.toggle('need', !!needed[el.getAttribute('data-k')] && el.value.trim() === '');
    });
    var calc = document.getElementById('calc');
    calc.textContent = c.price !== null && c.loan !== null
      ? 'Cash at closing (3A): $' + Fill.money(c.cash) + (c.financed ? ' · Loan (3B): $' + Fill.money(c.loan) : '') + ' · Sales price: $' + Fill.money(c.price)
      : '';
    document.querySelectorAll('.financed').forEach(function(el){ el.classList.toggle('hidden', !c.financed); });
    document.querySelectorAll('.hoaSec').forEach(function(el){ el.classList.toggle('hidden', !c.hoa); });
    document.querySelectorAll('.leadSec').forEach(function(el){ el.classList.toggle('hidden', !c.leadPaint); });
    renderPackage(c, t);
  }

  function field(f, val){
    var k = f[0], label = f[1], type = f[2], o = f[3] || {};
    var html = '<div class="' + (o.full ? 'full' : '') + '"><label for="f_' + k + '">' + esc(label) + '</label>';
    if(type === 'select'){
      html += '<select id="f_' + k + '" data-k="' + k + '">' + o.opts.map(function(p){
        return '<option value="' + esc(p[0]) + '"' + (String(val) === p[0] ? ' selected' : '') + '>' + esc(p[1]) + '</option>';
      }).join('') + '</select>';
    } else if(type === 'textarea'){
      html += '<textarea id="f_' + k + '" data-k="' + k + '">' + esc(val) + '</textarea>';
    } else {
      var t = type === 'money' || type === 'number' ? 'text' : type;
      var mode = type === 'money' ? 'decimal' : type === 'number' ? 'numeric' : (o.mode || '');
      html += '<input id="f_' + k + '" data-k="' + k + '" type="' + t + '"' + (mode ? ' inputmode="' + mode + '"' : '') + ' value="' + esc(val) + '" autocomplete="off">';
    }
    if(o.hint) html += '<div class="hint">' + esc(o.hint) + '</div>';
    return html + '</div>';
  }

  function render(){
    var t = offer.terms || {};
    var html = '<h1>' + esc(offer.property || 'Offer draft') + '</h1>' +
      '<p class="sub">' + esc([offer.client, offer.requested_by ? 'requested by ' + offer.requested_by : ''].filter(Boolean).join(' · ')) + '</p>' +
      '<div id="missing" class="missing"></div><div id="warnings" class="hidden"></div>' +
      '<div class="calc" id="calc" style="margin-top:10px"></div>' +
      '<section class="panel pkg" id="pkg"></section>';
    SECTIONS.forEach(function(s){
      html += '<section class="panel' + (s[2] ? ' ' + s[2] : '') + '"><h2>' + esc(s[0]) + '</h2><div class="grid">' +
        s[1].map(function(f){ var v = t[f[0]] != null ? t[f[0]] : (defaults[f[0]] != null ? defaults[f[0]] : ''); return field(f, v); }).join('') +
        '</div></section>';
    });
    html += '<section class="panel"><label class="check"><input type="checkbox" id="remember"> Remember title company, agent, broker, HOA and financing answers as the team default for new offers</label></section>' +
      '<p class="note">This is a draft built from the team\'s texts. It is not a signed contract and nothing has been sent to the seller. ' +
      'The licensed agent reviews every blank, then uploads the PDFs to SkySlope or DigiSign for signatures. ' +
      'The PDFs stay fillable, so a small fix can also be made there.</p>';
    app.innerHTML = html;
    /* Seed the checklist from saved terms before the first refresh reads it. */
    var pkgSeed = document.getElementById('pkg');
    pkgSeed.innerHTML = Object.keys(ATTACH_NAMES).map(function(k){ return t[k] === 'true' ? '<input type="checkbox" data-k="' + k + '" checked>' : ''; }).join('');
    app.addEventListener('input', function(e){ if(e.target.id === 'remember') return; dirty = true; dropPrepared(); setStatus('Unsaved changes'); refresh(); });
    app.addEventListener('change', function(e){ if(e.target.id === 'remember') return; dirty = true; dropPrepared(); refresh(); });
    app.addEventListener('click', function(e){
      var b = e.target.closest('button'); if(!b) return;
      if(b.getAttribute('data-dl')) make(b.getAttribute('data-dl'));
      else if(b.id === 'copyEmail') copyEmail();
      else if(b.id === 'sendGmail') sendGmail();
      else if(b.id === 'shareNow') shareNow();
      else if(b.id === 'copyTo') copyText(b.getAttribute('data-to'), 'Address copied. Paste it in the To line.');
      else if(b.id === 'dlAll') downloadAll();
    });
    bar.classList.remove('hidden');
    refresh();
  }

  function save(){
    var terms = current(), body = { p_token: token, p_terms: terms, p_defaults: null };
    if(document.getElementById('remember').checked){
      var d = {}; DEFAULT_KEYS.forEach(function(k){ if(terms[k] != null) d[k] = terms[k]; }); body.p_defaults = d;
    }
    setStatus('Saving…');
    return rpc('ops_offer_save', body).then(function(r){
      if(!r || !r.ok) throw new Error('not saved');
      dirty = false; setStatus('Saved ' + new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}));
    }).catch(function(){ setStatus('Could not save. Check your signal and try again.', true); throw new Error('save failed'); });
  }

  var blankCache = {};
  function blank(key){
    if(!blankCache[key]) blankCache[key] = fetch(BLANKS[key]).then(function(r){ if(!r.ok) throw new Error('form ' + r.status); return r.arrayBuffer(); });
    return blankCache[key];
  }
  function download(bytes, name){
    var url = URL.createObjectURL(new Blob([bytes], {type:'application/pdf'}));
    var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 60000);
  }
  function fileBase(){ return (offer.property || 'offer').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60); }

  function busy(on){ document.querySelectorAll('#bar button, #pkg button').forEach(function(b){ b.disabled = on; }); }

  function make(key){
    busy(true);
    var savedFirst = dirty ? save() : Promise.resolve();
    savedFirst.catch(function(){}).then(function(){
      setStatus('Filling the TREC form…');
      return blank(key);
    }).then(function(bytes){
      var blanks = {}; blanks[key] = bytes;
      return Fill.build(window.PDFLib, blanks, {}, current(), key);
    }).then(function(r){
      var f = (r.forms || []).filter(function(x){ return x.key === key; })[0];
      if(r[key]) download(r[key], fileBase() + '-' + (f ? f.form.replace(/\s+/g, '-') : key) + '-draft.pdf');
      setStatus(r.notes.length ? 'Done. Note: ' + r.notes.join(' ') : 'Done. Check your downloads.');
    }).catch(function(e){ setStatus('Could not build the PDF (' + e.message + '). Try again on Wi-Fi.', true); })
      .then(function(){ busy(false); });
  }

  function emailParts(){
    var t = current(), c = Fill.compute({}, t);
    return Fill.offerEmail(c, included(c, t));
  }
  function copyText(text, okMsg){
    var done = function(){ setStatus(okMsg); };
    if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
    function fallback(){
      var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch(err) { setStatus('Could not copy on this device.', true); }
      ta.remove();
    }
  }
  function copyEmail(){
    var e = emailParts();
    copyText('Subject: ' + e.subject + '\n\n' + e.body, 'Email copied. Paste it, attach the PDFs, and send.');
  }

  /* Email with the PDFs attached.
     Phone: build every PDF, then the share sheet (Gmail) opens with the files attached and the email text filled in.
     That takes two taps because phones only open the share sheet straight from a tap, not after a wait.
     Computer: download the PDFs and open a Gmail compose window with To, Cc, subject and text filled in. */
  function dropPrepared(){
    prepared = null;
    var box = document.getElementById('sendBox'); if(box) box.innerHTML = '';
    var b = document.getElementById('sendGmail'); if(b) b.classList.remove('hidden');
  }
  function sendGmail(){
    busy(true);
    var t = current(), c = Fill.compute({}, t), keys = Fill.forms(c).map(function(f){ return f.key; });
    var savedFirst = dirty ? save() : Promise.resolve();
    savedFirst.catch(function(){}).then(function(){
      setStatus('Filling ' + keys.length + ' TREC forms…');
      return Promise.all(keys.map(blank));
    }).then(function(list){
      var blanks = {}; keys.forEach(function(k, i){ blanks[k] = list[i]; });
      return Fill.build(window.PDFLib, blanks, {}, t);
    }).then(function(r){
      var e = Fill.offerEmail(r.computed, included(r.computed, t));
      var files = r.forms.filter(function(f){ return r[f.key]; }).map(function(f){
        return new File([r[f.key]], fileBase() + '-' + f.form.replace(/\s+/g, '-') + '.pdf', { type: 'application/pdf' });
      });
      prepared = { files: files, subject: e.subject, body: e.body, to: t.listing_agent_email || '' };
      var canShare = navigator.canShare && navigator.share && navigator.canShare({ files: files });
      var box = document.getElementById('sendBox'), html = '';
      document.getElementById('sendGmail').classList.add('hidden');
      if(canShare){
        html += '<div class="row"><button type="button" id="shareNow">Open Gmail with ' + files.length + ' PDFs</button></div>' +
          '<p class="hint">Pick Gmail in the share menu. The PDFs and the email text go in; add the To address' +
          (prepared.to ? ' (tap below to copy it)' : '') + ', check the subject, and Cc closings@jasonhoustonrealty.com.</p>';
      } else {
        html += '<div class="row"><button type="button" id="dlAll">1. Download the ' + files.length + ' PDFs</button>' +
          '<a class="btnlink" target="_blank" rel="noopener" href="' + gmailUrl(prepared) + '">2. Open Gmail</a></div>' +
          '<p class="hint">Gmail opens with To, Cc, subject and text filled in. Drag the downloaded PDFs into the email.</p>';
      }
      if(prepared.to) html += '<div class="row"><button type="button" class="ghost" id="copyTo" data-to="' + esc(prepared.to) + '">Copy ' + esc(prepared.to) + '</button></div>';
      box.innerHTML = html;
      setStatus(r.notes.length ? 'Ready. Note: ' + r.notes.join(' ') : 'PDFs ready.');
    }).catch(function(err){ setStatus('Could not build the PDFs (' + err.message + '). Try again on Wi-Fi.', true); })
      .then(function(){ busy(false); });
  }
  function shareNow(){
    if(!prepared) return;
    navigator.share({ files: prepared.files, title: prepared.subject, text: prepared.body })
      .then(function(){ setStatus('Sent to the share menu. Check the email in Gmail before you send it.'); })
      .catch(function(err){ if(err && err.name !== 'AbortError') setStatus('Could not open the share menu (' + err.message + ').', true); });
  }
  function downloadAll(){
    if(!prepared) return;
    prepared.files.forEach(function(f, i){ setTimeout(function(){ download(f, f.name); }, i * 400); });
    setStatus('Downloading ' + prepared.files.length + ' PDFs. If the browser asks, allow multiple downloads.');
  }
  function gmailUrl(p){
    return 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(p.to) +
      '&cc=' + encodeURIComponent('closings@jasonhoustonrealty.com') +
      '&su=' + encodeURIComponent(p.subject) + '&body=' + encodeURIComponent(p.body);
  }

  function bad(msg){ app.innerHTML = '<h1>' + esc(msg) + '</h1><p class="sub">Ask the JAG text line for a fresh link.</p>'; }

  function start(){
    if(!/^[0-9a-f]{32}$/.test(token) || !CRM.url || !CRM.anonKey){ bad('This link is not valid.'); return; }
    if(!Fill || !window.PDFLib){ bad('Could not load the form tools. Check your signal and reload.'); return; }
    rpc('ops_offer_peek', { p_token: token }).then(function(r){
      if(!r || !r.ok){ bad('This link is not valid or has expired.'); return; }
      offer = r; defaults = r.defaults || {}; render();
    }).catch(function(){ bad('Could not connect. Check your signal and reload.'); });
  }

  document.getElementById('save').addEventListener('click', function(){ save().catch(function(){}); });
  document.getElementById('goPkg').addEventListener('click', function(){
    var p = document.getElementById('pkg'); if(p) p.scrollIntoView({behavior:'smooth', block:'start'});
  });
  window.addEventListener('beforeunload', function(e){ if(dirty){ e.preventDefault(); e.returnValue = ''; } });
  start();
})();
</script>
</body>
