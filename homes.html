<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buscar casas — JAG Real Estate</title>
<meta name="description" content="Busca casas en venta con el Jason Aguirre Group. Pago mensual estimado, ITIN OK. Search homes for sale — English y español.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JAG Casas">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#17161c; --paper:#fff; --card:#f5f5f7; --line:#dddde3;
  --buy:#c8102e; --buy-d:#a30d26; --buy-t:#fdecef;
  --loan:#2653d9; --loan-t:#eaf0ff;
  --ok:#1a5c31; --ok-bg:#e9f5ec;
  --muted:#5f5e68; --soft:#85848d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--loan);outline-offset:2px}

/* ---------- top nav ---------- */
header{flex:none;background:#fff;border-bottom:1px solid var(--line)}
.hin{height:60px;padding:0 20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.hl,.hr{display:flex;align-items:center;gap:4px}
.hr{justify-content:flex-end}
.hin a.n{font-size:14px;font-weight:600;text-decoration:none;padding:8px 10px;border-radius:6px}
.hin a.n:hover{color:var(--buy)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;justify-self:center}
.lock{display:flex;flex-direction:column;line-height:1;align-items:center}
.lock small{font-size:7px;letter-spacing:.32em;font-weight:700;color:var(--muted);text-transform:uppercase}
.lock b{font-size:25px;font-weight:800;letter-spacing:-.02em;color:var(--buy)}
.lock i{font-style:normal;font-size:8px;letter-spacing:.3em;font-weight:700;text-transform:uppercase}
.brok{font-size:10.5px;font-weight:700;color:var(--muted);border-left:1px solid var(--line);padding-left:10px}
.hr #acct{margin-left:10px}
@media(max-width:600px){.hphone{display:none}}
.langs{display:flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden;margin-left:8px}
.langs button{border:0;background:transparent;font-size:12px;font-weight:800;padding:6px 10px}
.langs button.on{background:var(--ink);color:#fff}

.demo{flex:none;background:#fff7e0;border-bottom:1px solid #f0dfa8;color:#5c4700;font-size:12px;font-weight:600;padding:5px 16px;text-align:center}

/* ---------- filter bar ---------- */
.bar{flex:none;position:relative;z-index:600;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;align-items:center;background:#fff}
.q{flex:0 1 330px;min-width:150px;position:relative}
.q input{width:100%;height:42px;border:1px solid #a7a6b0;border-radius:6px;padding:0 42px 0 12px;font-weight:500;background:#fff}
.q input:focus{border-color:var(--buy);outline:2px solid var(--buy-t)}
.q button{position:absolute;right:2px;top:2px;width:38px;height:38px;border:0;background:none;border-radius:6px}
.q svg{width:18px;height:18px;stroke:var(--buy);fill:none;stroke-width:2.4;stroke-linecap:round;vertical-align:middle}
.pills{display:flex;gap:8px;align-items:center;min-width:0}
.near{flex:none;height:42px;border:2px solid var(--buy);border-radius:99px;background:#fff;color:var(--buy);font-weight:800;font-size:14px;padding:0 14px 0 11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}
.near svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.near.on{background:var(--buy);color:#fff}.near.busy{opacity:.6;cursor:progress}
.near.busy svg{animation:nearspin 1s linear infinite}@keyframes nearspin{to{transform:rotate(360deg)}}
.leaflet-control.mebtn a{display:grid;place-items:center;width:34px;height:34px;background:#fff;color:var(--buy);cursor:pointer}
.leaflet-control.mebtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dd{position:relative;flex:none}
.pill{height:42px;border:1px solid #a7a6b0;border-radius:6px;background:#fff;padding:0 12px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.pill:hover{background:var(--card)}
.pill.set{border-color:var(--buy);background:var(--buy-t);color:var(--buy-d)}
.pill::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--buy);flex:none}
.pop{display:none;position:absolute;left:0;top:48px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(23,22,28,.2);padding:16px;min-width:260px;z-index:700}
.dd.open .pop{display:block}
.pop h4{margin:0 0 10px;font-size:13px;font-weight:800}
.pop h4+*{margin-bottom:14px}
.pop label.r{display:flex;align-items:center;gap:10px;padding:7px 0;font-weight:600;font-size:14px;cursor:pointer}
.pop input[type=radio],.pop input[type=checkbox]{width:18px;height:18px;accent-color:var(--buy)}
.rng{display:flex;align-items:center;gap:8px}
.rng select{flex:1;height:40px;border:1px solid #a7a6b0;border-radius:6px;padding:0 8px;background:#fff;min-width:0}
.seg{display:flex;border:1px solid #a7a6b0;border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;border-right:1px solid #a7a6b0;background:#fff;padding:9px 0;font-weight:700;min-width:40px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--buy);color:#fff}
.apply{width:100%;height:40px;border:0;border-radius:6px;background:var(--buy);color:#fff;font-weight:800}
.savebtn{margin-left:auto;flex:none;height:42px;border:0;border-radius:6px;background:var(--buy);color:#fff;font-weight:800;padding:0 16px;white-space:nowrap}
.savebtn:hover,.apply:hover{background:var(--buy-d)}

/* ---------- split: map left, results right ---------- */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,760px)}
#map{height:100%;min-height:0;background:var(--card);z-index:1}
.mapwrap{position:relative;min-width:0;min-height:0}
.mapnote{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:500;background:#fff;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:12.5px;font-weight:700;padding:7px 12px;white-space:nowrap;display:none}
.mapnote.on{display:block}
.list{overflow-y:auto;padding:14px 16px 26px;box-shadow:-2px 0 8px rgba(23,22,28,.08);position:relative;z-index:2;background:#fff}
.list h1{font-size:20px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em}
.sub{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sub b{font-weight:700}
.sub label{font-weight:600;color:var(--muted);display:flex;align-items:center;gap:4px}
.sub select{border:0;background:none;color:var(--buy);font-weight:800;padding:4px 0;cursor:pointer;max-width:170px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.c{border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 1px 4px rgba(23,22,28,.22);cursor:pointer;position:relative;transition:box-shadow .15s}
.c:hover,.c.hot{box-shadow:0 0 0 2px var(--buy),0 6px 18px rgba(23,22,28,.2)}
.c .ph{aspect-ratio:16/10;background:var(--card) center/cover no-repeat;position:relative}
.c .tag{position:absolute;left:8px;top:8px;background:rgba(23,22,28,.82);color:#fff;border-radius:4px;font-size:11.5px;font-weight:700;padding:3px 8px}
.heart{position:absolute;right:6px;top:6px;width:36px;height:36px;border:0;background:none;padding:0}
.heart svg{width:26px;height:26px;fill:rgba(23,22,28,.45);stroke:#fff;stroke-width:2;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.heart.on svg{fill:var(--buy)}
.c .nav{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-weight:800;font-size:15px;line-height:1;opacity:0;transition:opacity .15s}
.c:hover .nav,.c .nav:focus-visible{opacity:1}
.c .nav.p{left:6px}.c .nav.x{right:6px}
.c .bd{padding:9px 12px 11px}
.c .pr{font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.c .pm{font-size:12px;font-weight:700;color:var(--loan)}
.c .sp{font-size:14px;margin-top:1px}
.c .sp b{font-weight:800}
.c .sp i{font-style:normal;color:var(--line);margin:0 5px}
.c .sp em{font-style:normal;color:var(--muted)}
.c .ad{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c .br{font-size:14px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.credit{font-size:15px;color:var(--muted);margin:16px 0 0;line-height:1.6}
.credit b{color:var(--ink);font-weight:700}
.credit a{color:var(--ink)}
.foot{border-top:1px solid var(--line);margin-top:22px;padding-top:16px;font-size:13px;color:var(--muted);line-height:1.6}
.foot b{color:var(--ink)}
.foot nav{display:flex;flex-wrap:wrap;gap:4px 16px;margin:8px 0}
.foot nav a{color:var(--ink);font-weight:700}
.foot p{margin:8px 0 0;font-size:12px}
.empty{grid-column:1/-1;padding:50px 10px;text-align:center;color:var(--muted);font-weight:600}
.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin:20px 0 6px;font-weight:700;font-size:13px}
.pager button{border:1px solid #a7a6b0;background:#fff;border-radius:6px;padding:8px 14px;font-weight:800;color:var(--buy)}
.pager button:disabled{opacity:.35;cursor:default}
.idx{font-size:11px;color:var(--soft);margin-top:16px;line-height:1.5}
.pin{background:var(--buy);color:#fff;font:800 11.5px 'Plus Jakarta Sans',sans-serif;padding:2px 6px;border-radius:4px;border:1px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);white-space:nowrap;display:inline-block;transform:translate(-50%,-50%)}
.pin.hot,.pin.seen.hot{background:var(--ink);transform:translate(-50%,-50%) scale(1.15)}
.pin.seen{background:#e6909e}
.viewtog{display:none}

/* ---------- home detail ---------- */
.ov{position:fixed;inset:0;background:rgba(23,22,28,.6);z-index:1000;display:none;overflow-y:auto}
.ov.on{display:block}
.sheet{background:#fff;max-width:1180px;margin:0 auto;min-height:100%;position:relative}
.sheet.sm{max-width:460px;min-height:0;margin:8vh auto;border-radius:10px}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);height:54px;padding:0 16px;display:flex;align-items:center;gap:10px}
.top .back{border:0;background:none;font-weight:800;color:var(--buy);padding:8px 4px;white-space:nowrap}
.top .lock{margin:0 auto}
.top .lock b{font-size:20px}
.top .act{border:0;background:none;font-weight:700;display:flex;align-items:center;gap:6px;padding:8px}
.top .act svg{width:20px;height:20px;fill:none;stroke:var(--buy);stroke-width:2}
.top .act.on svg{fill:var(--buy)}
.x{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--card);font-size:19px;font-weight:800}
.mos{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;padding:6px;height:min(52vh,470px);position:relative}
.mos button{border:0;padding:0;background:var(--card) center/cover no-repeat;border-radius:4px;min-width:0;min-height:0}
.mos button:first-child{grid-row:1/3}
.mos .all{position:absolute;right:16px;bottom:16px;background:#fff;border:1px solid var(--ink);border-radius:6px;font-weight:800;font-size:13px;padding:7px 12px;height:auto}
.dw{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:28px;padding:20px 24px 40px}
.hero{display:flex;align-items:baseline;gap:24px;flex-wrap:wrap}
.hero h2{font-size:34px;margin:0;font-weight:800;letter-spacing:-.02em}
.hero .f{font-size:15px;color:var(--muted)}
.hero .f b{font-size:22px;color:var(--ink);font-weight:800;margin-right:4px}
.ad2{font-size:16px;margin-top:2px}
.estl{display:inline-block;margin-top:8px;font-weight:700}
.estl a{color:var(--loan);font-weight:800;text-decoration:none;margin-left:6px}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:18px 0}
.chips div{background:var(--card);border-radius:6px;padding:10px 12px;font-weight:700;display:flex;gap:8px;align-items:center;min-width:0}
.chips small{display:block;font-weight:600;color:var(--muted);font-size:11.5px}
.dw h3{font-size:19px;font-weight:800;margin:22px 0 8px}
.desc{font-size:15px;color:#33323a;white-space:pre-line}
.desc.clip{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.more{border:0;background:none;color:var(--loan);font-weight:800;padding:6px 0}
.side{position:sticky;top:124px;align-self:start}
.box{border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(23,22,28,.07)}
.box h4{margin:0 0 10px;font-size:15px;font-weight:800}
.pay{background:var(--loan-t);border-color:#d3defc;box-shadow:none}
.pay .big{font-size:30px;font-weight:800;color:var(--loan);letter-spacing:-.02em}
.pay .big small{font-size:13px;font-weight:700}
.pay label{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;margin-top:8px;gap:8px}
.pay select,.pay input{height:36px;border:1px solid #c9d6fb;border-radius:6px;padding:0 8px;background:#fff;width:118px;font-weight:700}
.pay p{font-size:11px;color:#4a5a8c;margin:9px 0 0}
.lead input{width:100%;height:44px;border:1px solid #a7a6b0;border-radius:6px;padding:0 12px;margin-bottom:8px;background:#fff}
.lead .btn{width:100%;height:48px;border:0;border-radius:6px;background:var(--buy);color:#fff;font-weight:800;font-size:15px}
.lead .btn:hover{background:var(--buy-d)}
.lead .btn.alt{background:#fff;color:var(--buy);border:1px solid var(--buy);margin-top:8px}
.lead .fine{font-size:10.5px;color:var(--soft);margin:9px 0 0;line-height:1.45}
.ok{background:var(--ok-bg);color:var(--ok);border-radius:6px;padding:14px;font-weight:700;text-align:center}
.err{color:var(--buy);font-size:12.5px;font-weight:700;margin:0 0 8px;display:none}
.tabs{position:sticky;top:54px;z-index:4;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:14px 14px;font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent}
.tabs button:hover{color:var(--ink);border-bottom-color:var(--buy)}
.dw section{padding-bottom:6px}
.dw section+section{border-top:1px solid var(--line);margin-top:22px}
.mvp{color:#33323a;font-size:15px;margin:0 0 12px}
.mvf{font-size:11.5px;color:var(--soft);margin:8px 0 0}
.days{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:0 0 112px;border:1px solid #a7a6b0;border-radius:6px;background:#fff;padding:12px 6px;font-size:15px;text-transform:capitalize}
.days button b{display:block;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.days button.on{border:2px solid var(--buy);background:var(--buy-t)}
.trsel{width:100%;height:46px;border:1px solid #a7a6b0;border-radius:6px;padding:0 12px;background:#fff;margin-bottom:12px}
.bigbtn{display:block;width:100%;border:0;border-radius:6px;background:var(--buy);color:#fff;font-weight:800;font-size:16px;padding:13px 12px}
.bigbtn:hover{background:var(--buy-d)}
.bigbtn small{display:block;font-size:12px;font-weight:600;opacity:.92}
.outbtn{display:block;width:100%;border:1px solid var(--buy);border-radius:6px;background:#fff;color:var(--buy);font-weight:800;font-size:16px;padding:12px}
.outbtn:hover{background:var(--buy-t)}
.ghostbtn{border:1px solid var(--ink);border-radius:6px;background:#fff;font-weight:800;padding:11px 18px}
.ghostbtn:hover{background:var(--card)}
.linkbtn{border:0;background:none;color:var(--loan);font-weight:800;padding:4px 0;display:block;margin:0 auto}
.actbox{display:grid;gap:10px}
.actnote{margin:0;font-size:11.5px;color:var(--soft);text-align:center}
.fxg{margin-bottom:6px}
.fxg h4{margin:0;background:var(--card);padding:10px 14px;font-size:15px;font-weight:800;border-radius:4px}
.fxg ul{list-style:disc;margin:12px 0 14px;padding:0 0 0 34px;columns:2;column-gap:40px;font-size:15px}
.fxg li{margin-bottom:7px;break-inside:avoid}
.fxg li span{color:var(--muted)}
.mvt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.mvt div{background:var(--card);border-radius:6px;padding:14px}
.mvt small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.mvt b{font-size:21px;font-weight:800;letter-spacing:-.02em}
table.ph{width:100%;border-collapse:collapse;font-size:15px;margin-bottom:8px}
table.ph th{text-align:left;font-weight:800;padding:10px 12px;border-bottom:1px solid var(--line)}
table.ph td{padding:12px;border-bottom:1px solid var(--line)}
.payw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;background:var(--card);border-radius:8px;padding:18px;margin-bottom:18px}
.payl small{color:var(--muted);font-weight:700;font-size:13px}
.payl .big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.payl .big small{font-size:14px;color:var(--ink)}
.pbar{display:flex;gap:3px;height:9px;margin:12px 0 14px}
.pbar i{border-radius:99px;min-width:4px}
.pleg{list-style:none;margin:0;padding:0}
.pleg li{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:15px}
.pleg li i{width:10px;height:10px;border-radius:50%;flex:none}
.pleg li b{margin-left:auto;font-weight:800}
.payr{background:#fff;border-radius:8px;padding:16px}
.payr h4{margin:0 0 4px;font-size:16px;font-weight:800}
.payr p{margin:0 0 12px;font-size:13.5px;color:#33323a}
.payr label,.pgrid label{display:block;font-size:13px;font-weight:700;margin-bottom:10px}
.payr small{display:block;margin-top:8px;font-size:11.5px;color:var(--muted)}
.dol{display:block;position:relative}
.dol::before{content:"$";position:absolute;left:11px;top:11px;color:var(--muted);font-weight:700}
.dol input{padding-left:24px!important}
.payr input,.pgrid input,.pgrid select{display:block;width:100%;height:42px;border:1px solid #a7a6b0;border-radius:6px;padding:0 10px;background:#fff;font-weight:700;margin-top:4px}
.pbh{margin:0 0 2px;font-size:16px;font-weight:800}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 14px}
.pgrid em{display:block;font-style:normal;font-weight:600;font-size:11.5px;color:var(--muted);margin-top:3px;min-height:15px}
.mbar{display:none}
.fm{position:fixed;inset:0;z-index:1150;background:rgba(23,22,28,.6);display:none;align-items:center;justify-content:center;padding:14px;overflow-y:auto}
.fm.on{display:flex}
.fmbox{background:#fff;border-radius:10px;width:100%;max-width:400px;padding:22px 20px 18px;position:relative;max-height:calc(100vh - 28px);overflow-y:auto}
.fmbox h3{margin:0 40px 14px 0;font-size:20px;font-weight:800}
.fmrow{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-bottom:8px}

var KINDS=[['Residential','k_Residential'],['Land','k_Land'],['Residential Income','k_Income'],['Farm','k_Farm']];
var lang='es', favs={};
try{ var sv=localStorage.getItem('jag_lang'); if(sv==='en'||sv==='es') lang=sv; favs=JSON.parse(localStorage.getItem('jag_favs')||'{}')||{}; }catch(e){}
function t(k){ return T[lang][k]; }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function money(n){ return '$'+Math.round(n).toLocaleString('en-US'); }
function short(n){ return n>=1e6 ? '$'+(n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M' : n>=1e4 ? '$'+Math.round(n/1000)+'K' : money(n); }
function num(n){ return Number(n).toLocaleString('en-US'); }
/* Default assumptions for payment estimates (all editable on the listing page). */
var TAXRATE=2.1, INSRATE=1.0, MIRATE=0.55;
function payParts(price,downPct,rate,years,taxYr,insYr,hoaMo){
  var loan=price*(1-downPct/100), r=rate/1200, n=(years||30)*12;
  var pi=r? loan*r/(1-Math.pow(1+r,-n)) : loan/n;
  return {pi:pi, tax:(taxYr||0)/12, ins:(insYr||0)/12, mi:downPct<20? loan*MIRATE/100/12 : 0, hoa:hoaMo||0};
}
function sumParts(o){ return o.pi+o.tax+o.ins+o.mi+o.hoa; }
function estTotal(price){ return sumParts(payParts(price,3.5,RATE,30,price*TAXRATE/100,price*INSRATE/100,0)); }
function pmt(price,downPct,rate){ var P=price*(1-downPct/100), r=rate/1200, n=360; return r? P*r/(1-Math.pow(1+r,-n)) : P/n; }
function addr(a){ return [a.streetNumber,a.streetDirectionPrefix,a.streetName,a.streetSuffix,a.streetDirection].filter(Boolean).join(' ')+(a.unitNumber&&a.unitNumber!=='0'?' #'+a.unitNumber:''); }
function agentOf(l){ var a=(l.agents||[])[0]||{}; return a.name?String(a.name).trim():''; }
function credit(l){ var b=(l.office||{}).brokerageName||((((l.agents||[])[0]||{}).brokerage||{}).name)||'', a=agentOf(l); return [a,b].filter(Boolean).join(', ')||'—'; }
function agentContact(l){
  var a=(l.agents||[])[0]||{}, out=[], ph=(a.phones||[])[0], em=a.email;
  if(ph) out.push('<a href="tel:'+esc(String(ph).replace(/[^0-9+]/g,''))+'">'+esc(ph)+'</a>');
  if(em&&/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) out.push('<a href="mailto:'+esc(em)+'">'+esc(em)+'</a>');
  return out.join(' · ');
}
function updated(l){
  if(!l.updatedOn) return ''; var d=new Date(l.updatedOn); if(isNaN(d)) return '';
  return d.toLocaleDateString(lang==='es'?'es-MX':'en-US',{year:'numeric',month:'long',day:'numeric'});
}
function img(p,cls){ return CDN+p+'?class='+cls; }

function priceOpts(){
  var ps=F.type==='lease'?[800,1200,1500,1800,2200,2800,3500,5000]:[100000,150000,200000,250000,300000,350000,400000,500000,650000,800000,1000000,1500000];
  var o=function(first,sel){ return '<option value="">'+first+'</option>'+ps.map(function(p){return '<option value="'+p+'"'+(String(p)===sel?' selected':'')+'>'+(F.type==='lease'?money(p):short(p))+'</option>';}).join(''); };
  $('minp').innerHTML=o(t('nomin'),F.minp); $('maxp').innerHTML=o(t('nomax'),F.maxp);
}
function segs(){
  $('s_beds').innerHTML=['',1,2,3,4,5].map(function(n){return '<button type="button" data-v="'+n+'" class="'+(String(n)===F.beds?'on':'')+'">'+(n?n+'+':t('any'))+'</button>';}).join('');
  $('s_baths').innerHTML=['',1,2,3,4].map(function(n){return '<button type="button" data-v="'+n+'" class="'+(String(n)===F.baths?'on':'')+'">'+(n?n+'+':t('any'))+'</button>';}).join('');
  $('kinds').innerHTML=KINDS.map(function(k){return '<label class="r"><input type="checkbox" value="'+k[0]+'"'+(F.kinds.indexOf(k[0])>-1?' checked':'')+'>'+t(k[1])+'</label>';}).join('');
}
function pills(){
  $('p_type').innerHTML='<span class="dot"></span>'+t(F.type==='sale'?'t_sale':'t_lease');
  var sp=F.type==='lease'?money:short, pl=t('price');
  if(F.minp&&F.maxp) pl=sp(+F.minp)+' – '+sp(+F.maxp); else if(F.minp) pl=sp(+F.minp)+'+'; else if(F.maxp) pl=t('upto')+sp(+F.maxp);
  $('p_price').textContent=pl; $('p_price').classList.toggle('set',!!(F.minp||F.maxp));
  var bl=[F.beds?F.beds+'+'+t('bdS'):'',F.baths?F.baths+'+'+t('baS'):''].filter(Boolean).join(', ');
  $('p_beds').textContent=bl||t('bb'); $('p_beds').classList.toggle('set',!!bl);
  var only=F.kinds.length===1&&F.kinds[0]==='Residential';
  $('p_kind').textContent=only?t('kind'):t('kind')+' ('+F.kinds.length+')'; $('p_kind').classList.toggle('set',!only);
  var nb=$('p_new'); nb.hidden=F.type!=='sale'; nb.classList.toggle('set',!!F.newc&&F.type==='sale'); nb.setAttribute('aria-pressed',String(!!F.newc));
}

document.querySelectorAll('.dd > .pill').forEach(function(b){

});

['s_beds','s_baths'].forEach(function(id){ $(id).addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; F[id==='s_beds'?'beds':'baths']=b.getAttribute('data-v'); segs(); }); });
document.querySelectorAll('.apply').forEach(function(b){ b.addEventListener('click',function(){
  F.minp=$('minp').value; F.maxp=$('maxp').value;
  if(F.minp&&F.maxp&&+F.minp>+F.maxp){ var x=F.minp; F.minp=F.maxp; F.maxp=x; priceOpts(); }
  var ks=[].map.call(document.querySelectorAll('#kinds input:checked'),function(i){return i.value;}); F.kinds=ks.length?ks:['Residential']; segs();
  commit();
}); });
$('qf').addEventListener('submit',function(e){ e.preventDefault();
  var qv=$('q').value.trim();
  if(qv&&window.JagAccount&&JagAccount.user()) JagAccount.logActivity(/^\d{5}$/.test(qv)?{kind:'search',zip:qv,beds:F.beds||null,baths:F.baths||null,price:F.maxp||null}:{kind:'search',city:qv.slice(0,60),beds:F.beds||null,baths:F.baths||null,price:F.maxp||null});
  state.bounds=null; setNear(false); $('mapnote').classList.remove('on'); state.page=1; load(); });

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent=t(el.getAttribute('data-t')); });
  document.querySelectorAll('[data-ph]').forEach(function(el){ el.placeholder=t(el.getAttribute('data-ph')); });
  document.querySelectorAll('.langs button').forEach(function(b){ b.classList.toggle('on',b.getAttribute('data-lang')===lang); });
  priceOpts(); segs(); pills(); setTog(); render();
  if(window.JagAccount) JagAccount.relabel();
}
document.querySelectorAll('.langs button').forEach(function(b){
  b.addEventListener('click',function(){ lang=b.getAttribute('data-lang'); try{localStorage.setItem('jag_lang',lang);}catch(e){} applyLang(); });
});

/* ---------- data ---------- */
function query(){
  var p=new URLSearchParams({type:F.type,resultsPerPage:PER,pageNum:state.page,sortBy:$('sort').value});
  var q=$('q').value.trim();
  if(state.bounds){ var b=state.bounds; p.set('map',JSON.stringify([[[b.getWest(),b.getSouth()],[b.getEast(),b.getSouth()],[b.getEast(),b.getNorth()],[b.getWest(),b.getNorth()]]])); }
  else{ p.set('state',STATE); if(/^\d{5}$/.test(q)) p.set('zip',q); else if(q&&!/\d/.test(q)&&state.qkind[q.toLowerCase()]!=='search') p.set('city',q); else if(q) p.set('search',q); }
  if(F.newc&&F.type==='sale') p.set('newc','1');
  if(F.minp) p.set('minPrice',F.minp); if(F.maxp) p.set('maxPrice',F.maxp);
  if(F.beds) p.set('minBedrooms',F.beds); if(F.baths) p.set('minBaths',F.baths);
  if(F.type==='sale') F.kinds.forEach(function(k){ p.append('propertyType',k); });
  return p;
}
function load(fit){
  /* a word like "Willis" is a city first; if HAR has no city by that name it's a keyword (street, subdivision…) */
  var qq=$('q').value.trim(), qk=qq.toLowerCase();
  if(!state.bounds&&qq&&!/\d/.test(qq)&&!state.qkind[qk]){
    var chk=++state.req; $('grid').style.opacity=.45;
    fetch(API+'?'+new URLSearchParams({state:STATE,city:qq,resultsPerPage:1})).then(function(r){ return r.ok?r.json():null; })
      .then(function(d){ state.qkind[qk]=d&&d.count>0?'city':'search'; }).catch(function(){ state.qkind[qk]='search'; })
      .then(function(){ if(chk===state.req) load(fit); });
    return;
  }
  var mine=++state.req; $('grid').style.opacity=.45;
  fetch(API+'?'+query())
   .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
   .then(function(d){ if(mine!==state.req) return;
     state.items=d.listings||[]; state.pages=d.numPages||1; state.count=d.count||0;
     if(state.near&&state.near.miles<10&&state.count<6){ nearSearch(state.near.lat,state.near.lng,10); ssToast(t('near_wide'),false); return; }
     render(fit!==false&&!state.bounds); })
   .catch(function(){ if(mine!==state.req) return; state.items=[]; state.count=null; render(); });
}
state.req=0;
function specs(l){
  var d=l.details||{};
  return [d.numBedrooms!=null?'<b>'+d.numBedrooms+'</b> '+t('bd'):'',d.numBathrooms!=null?'<b>'+d.numBathrooms+'</b> '+t('ba'):'',d.sqft?'<b>'+num(d.sqft)+'</b> '+t('sqft'):''].filter(Boolean).join('<i>|</i>');
}
function render(fit){
  if(state.count===undefined) return;
  var g=$('grid'), lease=F.type==='lease'; g.style.opacity=1;
  var q=$('q').value.trim();
  $('title').textContent=t(lease?'ttl_lease':'ttl_sale')+t('ttl_in')+(state.near&&state.bounds?t('near_t'):state.bounds?t('area'):(q||t('tx')));
  if(state.count===null){ $('count').textContent=''; g.innerHTML='<div class="empty">'+t('fail')+'</div>'; $('pager').innerHTML=''; return; }
  $('count').textContent=num(state.count)+(state.count===1?t('res1'):t('res'));
  if(!state.items.length){ g.innerHTML='<div class="empty">'+t('none')+'</div>'; $('pager').innerHTML=''; drawPins(false); return; }
  g.innerHTML=state.items.map(function(l,i){
    var a=l.address||{}, n=l.daysOnMarket;
    return '<article class="c" data-i="'+i+'" tabindex="0">'+
      '<div class="ph" style="background-image:url(\''+img(l.images[0],'small')+'\')">'+
        (l.newConstruction?'<span class="tag nc">'+t('nc_tag')+'</span>':n!=null?'<span class="tag">'+(n<=3?t('new_'):n+t('dom'))+'</span>':'')+
        '<button type="button" class="heart'+(favs[l.mlsNumber]?' on':'')+'" aria-label="'+t('savehome')+'">'+HEART+'</button>'+
        (l.images.length>1?'<button type="button" class="nav p" aria-label="‹">‹</button><button type="button" class="nav x" aria-label="›">›</button>':'')+'</div>'+
      '<div class="bd"><div class="pr">'+money(l.listPrice)+(lease?'<span class="pm" style="color:inherit">'+t('mo')+'</span>':'<span class="pm">'+t('est')+money(estTotal(l.listPrice))+t('mo')+'</span>')+'</div>'+
      '<div class="sp">'+specs(l)+' <em>- '+t(lease?'forrent':'forsale')+'</em></div>'+
      '<div class="ad">'+esc(addr(a))+', '+esc(a.city)+', '+esc(a.state||'TX')+' '+esc(a.zip)+'</div>'+

  var s=$('sheet');

  if(!lease){
    var P=l.listPrice, touched={}, dpct=3.5;

      var o=payParts(P,dpct,Math.max(0,+$('rt').value||0),+$('tm').value,Math.max(0,+$('tx').value||0),Math.max(0,+$('ins').value||0),Math.max(0,+$('hoa').value||0));
      var tot=sumParts(o), v=money(tot); $('pb').textContent=v; $('pb2').textContent=v;
      var rows=[['pb_pi',o.pi,'#17161c'],['pb_tax',o.tax,'#c8102e'],['pb_ins',o.ins,'#2653d9'],['pb_mi',o.mi,'#b07a00'],['pb_hoa',o.hoa,'#0f8a4d']];
      $('pbar').innerHTML=rows.filter(function(r){return r[1]>0;}).map(function(r){ return '<i style="flex:'+(r[1]/tot).toFixed(4)+';background:'+r[2]+'"></i>'; }).join('');
      $('pleg').innerHTML=rows.map(function(r){ return '<li><i style="background:'+r[2]+'"></i><span>'+t(r[0]+'_l')+'</span><b>'+(r[1]>0?money(r[1]):'$0')+'</b></li>'; }).join('');
    };
    $('ins').value=Math.round(P*INSRATE/100); $('dnamt').value=Math.round(P*dpct/100); setFeed(l);
    $('dn').onchange=function(){ act('calc',l); if(this.value==='c') return; dpct=+this.value; $('dnamt').value=Math.round(P*dpct/100); calc(); };
    $('dnamt').oninput=function(){ act('calc',l); var a=Math.min(Math.max(0,+this.value||0),P); dpct=a/P*100; var m=[3.5,5,10,15,20].filter(function(x){return Math.abs(x-dpct)<0.05;})[0]; $('dn').value=m?String(m):'c'; if(!m) $('dn').options[5].textContent=dpct.toFixed(1)+'%'; calc(); };
    ['rt','tm'].forEach(function(id){ $(id).oninput=$(id).onchange=function(){ act('calc',l); calc(); }; });
    ['tx','ins','hoa'].forEach(function(id){ $(id).oninput=function(){ act('calc',l); touched[id]=1; if(id==='tx') $('txsrc').textContent=''; if(id==='hoa') $('hoasrc').textContent=''; calc(); }; });

  }

function searchLabel(){

  if(F.beds) parts.push(F.beds+t('ss_bd')); if(F.baths) parts.push(F.baths+t('ss_ba'));
  var sp=F.type==='lease'?money:short;
  if(F.minp&&F.maxp) parts.push(sp(+F.minp)+'–'+sp(+F.maxp)); else if(F.maxp) parts.push(t('ss_upto')+sp(+F.maxp)); else if(F.minp) parts.push(t('ss_from')+sp(+F.minp));
  return parts.join(' · ');
}
function currentSearch(){
  var p=query(), apiP={};
  ['pageNum','resultsPerPage','sortBy'].forEach(function(k){ p.delete(k); });

  return { api:apiP, ui:{ q:$('q').value.trim(), type:F.type, minp:F.minp, maxp:F.maxp, beds:F.beds, baths:F.baths, kinds:F.kinds.slice(), newc:!!F.newc,

/* ---------- "Cerca de mí": search around the visitor's location (asks the browser; nothing is stored) ---------- */
var meLayer=null;
function setNear(on){ if(!on) state.near=null; $('nearBtn').classList.toggle('on',!!on); }
function nearBox(lat,lng,miles){ var dLat=miles/69, dLng=miles/(69*Math.cos(lat*Math.PI/180)); return [[lat-dLat,lng-dLng],[lat+dLat,lng+dLng]]; }
function nearSearch(lat,lng,miles){
  state.near={lat:lat,lng:lng,miles:miles}; setNear(true);
  var bx=nearBox(lat,lng,miles);
  state.bounds=L.latLngBounds(bx[0],bx[1]); $('q').value=''; $('mapnote').classList.add('on'); state.page=1;
  if(map){
    quiet++; map.fitBounds(state.bounds,{animate:false}); setTimeout(function(){ quiet--; },500);
    if(!meLayer) meLayer=L.layerGroup().addTo(map); meLayer.clearLayers();
    L.circleMarker([lat,lng],{radius:8,color:'#fff',weight:3,fillColor:'#2563eb',fillOpacity:1}).bindTooltip(t('near_me')).addTo(meLayer);
  }
  load(false);
}
function findMe(){
  var b=$('nearBtn'); closeDD();
  if(!navigator.geolocation){ ssToast(t('near_fail'),false); return; }
  b.classList.add('busy');
  navigator.geolocation.getCurrentPosition(function(pos){
    b.classList.remove('busy');
    var lat=pos.coords.latitude, lng=pos.coords.longitude;
    if(!(lat>25.8&&lat<36.6&&lng>-106.7&&lng<-93.4)){ ssToast(t('near_out'),false); return; }   // Texas only for now
    nearSearch(lat,lng,5);
    if(window.JagAccount&&JagAccount.user()) JagAccount.logActivity({kind:'search',city:'Cerca de mí',beds:F.beds||null,baths:F.baths||null,price:F.maxp||null});
  },function(err){
    b.classList.remove('busy'); ssToast(t(err&&err.code===1?'near_denied':'near_fail'),false);
  },{enableHighAccuracy:false,timeout:12000,maximumAge:300000});
}
$('nearBtn').addEventListener('click',function(){ if(state.near){ state.bounds=null; setNear(false); if(meLayer) meLayer.clearLayers(); $('mapnote').classList.remove('on'); state.page=1; load(); } else findMe(); });

    var d=L.DomUtil.create('div','leaflet-bar leaflet-control mebtn'), a=L.DomUtil.create('a','',d);

    L.DomEvent.on(a,'click',function(e){ L.DomEvent.preventDefault(e); L.DomEvent.stopPropagation(e); findMe(); });
    return d; }});
  new MeCtl().addTo(map);
}
