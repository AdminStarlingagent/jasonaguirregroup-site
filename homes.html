<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buscar casas — JAG Real Estate</title>
<meta name="description" content="Busca casas en venta con el Jason Aguirre Group. Pago mensual estimado, ITIN OK. Search homes for sale — English y español.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#17161c; --paper:#fff; --card:#f5f5f7; --line:#dddde3;
  --buy:#c8102e; --buy-d:#a30d26; --buy-t:#fdecef;
  --loan:#2653d9; --loan-t:#eaf0ff;
  --ok:#1a5c31; --ok-bg:#e9f5ec;
  --muted:#5f5e68; --soft:#85848d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--loan);outline-offset:2px}

/* ---------- top nav ---------- */
header{flex:none;background:#fff;border-bottom:1px solid var(--line)}
.hin{height:60px;padding:0 20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.hl,.hr{display:flex;align-items:center;gap:4px}
.hr{justify-content:flex-end}
.hin a.n{font-size:14px;font-weight:600;text-decoration:none;padding:8px 10px;border-radius:6px}
.hin a.n:hover{color:var(--buy)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;justify-self:center}
.lock{display:flex;flex-direction:column;line-height:1;align-items:center}
.lock small{font-size:7px;letter-spacing:.32em;font-weight:700;color:var(--muted);text-transform:uppercase}
.lock b{font-size:25px;font-weight:800;letter-spacing:-.02em;color:var(--buy)}
.lock i{font-style:normal;font-size:8px;letter-spacing:.3em;font-weight:700;text-transform:uppercase}
.brok{font-size:10.5px;font-weight:700;color:var(--muted);border-left:1px solid var(--line);padding-left:10px}
.langs{display:flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden;margin-left:8px}
.langs button{border:0;background:transparent;font-size:12px;font-weight:800;padding:6px 10px}
.langs button.on{background:var(--ink);color:#fff}

.demo{flex:none;background:#fff7e0;border-bottom:1px solid #f0dfa8;color:#5c4700;font-size:12px;font-weight:600;padding:5px 16px;text-align:center}

/* ---------- filter bar ---------- */
.bar{flex:none;position:relative;z-index:600;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;align-items:center;background:#fff}
.q{flex:0 1 330px;min-width:150px;position:relative}
.q input{width:100%;height:42px;border:1px solid #a7a6b0;border-radius:6px;padding:0 42px 0 12px;font-weight:500;background:#fff}
.q input:focus{border-color:var(--buy);outline:2px solid var(--buy-t)}
.q button{position:absolute;right:2px;top:2px;width:38px;height:38px;border:0;background:none;border-radius:6px}
.q svg{width:18px;height:18px;stroke:var(--buy);fill:none;stroke-width:2.4;stroke-linecap:round;vertical-align:middle}
.pills{display:flex;gap:8px;align-items:center;min-width:0}
.dd{position:relative;flex:none}
.pill{height:42px;border:1px solid #a7a6b0;border-radius:6px;background:#fff;padding:0 12px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.pill:hover{background:var(--card)}
.pill.set{border-color:var(--buy);background:var(--buy-t);color:var(--buy-d)}
.pill::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--buy);flex:none}
.pop{display:none;position:absolute;left:0;top:48px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(23,22,28,.2);padding:16px;min-width:260px;z-index:700}
.dd.open .pop{display:block}
.pop h4{margin:0 0 10px;font-size:13px;font-weight:800}
.pop h4+*{margin-bottom:14px}
.pop label.r{display:flex;align-items:center;gap:10px;padding:7px 0;font-weight:600;font-size:14px;cursor:pointer}
.pop input[type=radio],.pop input[type=checkbox]{width:18px;height:18px;accent-color:var(--buy)}
.rng{display:flex;align-items:center;gap:8px}
.rng select{flex:1;height:40px;border:1px solid #a7a6b0;border-radius:6px;padding:0 8px;background:#fff;min-width:0}
.seg{display:flex;border:1px solid #a7a6b0;border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;border-right:1px solid #a7a6b0;background:#fff;padding:9px 0;font-weight:700;min-width:40px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--buy);color:#fff}
.apply{width:100%;height:40px;border:0;border-radius:6px;background:var(--buy);color:#fff;font-weight:800}
.savebtn{margin-left:auto;flex:none;height:42px;border:0;border-radius:6px;background:var(--buy);color:#fff;font-weight:800;padding:0 16px;white-space:nowrap}
.savebtn:hover,.apply:hover{background:var(--buy-d)}

/* ---------- split: map left, results right ---------- */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,760px)}
#map{height:100%;min-height:0;background:var(--card);z-index:1}
.mapwrap{position:relative;min-width:0;min-height:0}
.mapnote{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:500;background:#fff;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:12.5px;font-weight:700;padding:7px 12px;white-space:nowrap;display:none}
.mapnote.on{display:block}
.list{overflow-y:auto;padding:14px 16px 26px;box-shadow:-2px 0 8px rgba(23,22,28,.08);position:relative;z-index:2;background:#fff}
.list h1{font-size:20px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em}
.sub{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sub b{font-weight:700}
.sub label{font-weight:600;color:var(--muted);display:flex;align-items:center;gap:4px}
.sub select{border:0;background:none;color:var(--buy);font-weight:800;padding:4px 0;cursor:pointer;max-width:170px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.c{border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 1px 4px rgba(23,22,28,.22);cursor:pointer;position:relative;transition:box-shadow .15s}
.c:hover,.c.hot{box-shadow:0 0 0 2px var(--buy),0 6px 18px rgba(23,22,28,.2)}
.c .ph{aspect-ratio:16/10;background:var(--card) center/cover no-repeat;position:relative}
.c .tag{position:absolute;left:8px;top:8px;background:rgba(23,22,28,.82);color:#fff;border-radius:4px;font-size:11.5px;font-weight:700;padding:3px 8px}
.heart{position:absolute;right:6px;top:6px;width:36px;height:36px;border:0;background:none;padding:0}
.heart svg{width:26px;height:26px;fill:rgba(23,22,28,.45);stroke:#fff;stroke-width:2;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.heart.on svg{fill:var(--buy)}
.c .nav{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-weight:800;font-size:15px;line-height:1;opacity:0;transition:opacity .15s}
.c:hover .nav,.c .nav:focus-visible{opacity:1}
.c .nav.p{left:6px}.c .nav.x{right:6px}
.c .bd{padding:9px 12px 11px}
.c .pr{font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.c .pm{font-size:12px;font-weight:700;color:var(--loan)}
.c .sp{font-size:14px;margin-top:1px}
.c .sp b{font-weight:800}
.c .sp i{font-style:normal;color:var(--line);margin:0 5px}
.c .sp em{font-style:normal;color:var(--muted)}
.c .ad{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c .br{font-size:14px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.credit{font-size:15px;color:var(--muted);margin:16px 0 0}
.foot{border-top:1px solid var(--line);margin-top:22px;padding-top:16px;font-size:13px;color:var(--muted);line-height:1.6}
.foot b{color:var(--ink)}
.foot nav{display:flex;flex-wrap:wrap;gap:4px 16px;margin:8px 0}
.foot nav a{color:var(--ink);font-weight:700}
.foot p{margin:8px 0 0;font-size:12px}
.empty{grid-column:1/-1;padding:50px 10px;text-align:center;color:var(--muted);font-weight:600}
.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin:20px 0 6px;font-weight:700;font-size:13px}
.pager button{border:1px solid #a7a6b0;background:#fff;border-radius:6px;padding:8px 14px;font-weight:800;color:var(--buy)}
.pager button:disabled{opacity:.35;cursor:default}
.idx{font-size:11px;color:var(--soft);margin-top:16px;line-height:1.5}
.pin{background:var(--buy);color:#fff;font:800 11.5px 'Plus Jakarta Sans',sans-serif;padding:2px 6px;border-radius:4px;border:1px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);white-space:nowrap;display:inline-block;transform:translate(-50%,-50%)}
.pin.hot,.pin.seen.hot{background:var(--ink);transform:translate(-50%,-50%) scale(1.15)}
.pin.seen{background:#e6909e}
.viewtog{display:none}

/* ---------- home detail ---------- */
.ov{position:fixed;inset:0;background:rgba(23,22,28,.6);z-index:1000;display:none;overflow-y:auto}
.ov.on{display:block}
.sheet{background:#fff;max-width:1180px;margin:0 auto;min-height:100%;position:relative}
.sheet.sm{max-width:460px;min-height:0;margin:8vh auto;border-radius:10px}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);height:54px;padding:0 16px;display:flex;align-items:center;gap:10px}
.top .back{border:0;background:none;font-weight:800;color:var(--buy);padding:8px 4px}
.top .lock{margin:0 auto}
.top .lock b{font-size:20px}
.top .act{border:0;background:none;font-weight:700;display:flex;align-items:center;gap:6px;padding:8px}
.top .act svg{width:20px;height:20px;fill:none;stroke:var(--buy);stroke-width:2}
.top .act.on svg{fill:var(--buy)}
.x{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--card);font-size:19px;font-weight:800}
.mos{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;padding:6px;height:min(52vh,470px);position:relative}
.mos button{border:0;padding:0;background:var(--card) center/cover no-repeat;border-radius:4px;min-width:0;min-height:0}
.mos button:first-child{grid-row:1/3}
.mos .all{position:absolute;right:16px;bottom:16px;background:#fff;border:1px solid var(--ink);border-radius:6px;font-weight:800;font-size:13px;padding:7px 12px;height:auto}
.dw{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:28px;padding:20px 24px 40px}
.hero{display:flex;align-items:baseline;gap:24px;flex-wrap:wrap}
.hero h2{font-size:34px;margin:0;font-weight:800;letter-spacing:-.02em}
.hero .f{font-size:15px;color:var(--muted)}
.hero .f b{font-size:22px;color:var(--ink);font-weight:800;margin-right:4px}
.ad2{font-size:16px;margin-top:2px}
.estl{display:inline-block;margin-top:8px;font-weight:700}
.estl a{color:var(--loan);font-weight:800;text-decoration:none;margin-left:6px}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:18px 0}
.chips div{background:var(--card);border-radius:6px;padding:10px 12px;font-weight:700;display:flex;gap:8px;align-items:center;min-width:0}
.chips small{display:block;font-weight:600;color:var(--muted);font-size:11.5px}
.dw h3{font-size:19px;font-weight:800;margin:22px 0 8px}
.desc{font-size:15px;color:#33323a;white-space:pre-line}
.desc.clip{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.more{border:0;background:none;color:var(--loan);font-weight:800;padding:6px 0}
.side{position:sticky;top:70px;align-self:start}
.box{border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(23,22,28,.07)}
.box h4{margin:0 0 10px;font-size:15px;font-weight:800}
.pay{background:var(--loan-t);border-color:#d3defc;box-shadow:none}
.pay .big{font-size:30px;font-weight:800;color:var(--loan);letter-spacing:-.02em}
.pay .big small{font-size:13px;font-weight:700}
.pay label{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;margin-top:8px;gap:8px}
.pay select,.pay input{height:36px;border:1px solid #c9d6fb;border-radius:6px;padding:0 8px;background:#fff;width:118px;font-weight:700}
.pay p{font-size:11px;color:#4a5a8c;margin:9px 0 0}
.lead input{width:100%;height:44px;border:1px solid #a7a6b0;border-radius:6px;padding:0 12px;margin-bottom:8px;background:#fff}
.lead .btn{width:100%;height:48px;border:0;border-radius:6px;background:var(--buy);color:#fff;font-weight:800;font-size:15px}
.lead .btn:hover{background:var(--buy-d)}
.lead .btn.alt{background:#fff;color:var(--buy);border:1px solid var(--buy);margin-top:8px}
.lead .fine{font-size:10.5px;color:var(--soft);margin:9px 0 0;line-height:1.45}
.ok{background:var(--ok-bg);color:var(--ok);border-radius:6px;padding:14px;font-weight:700;text-align:center}
.err{color:var(--buy);font-size:12.5px;font-weight:700;margin:0 0 8px;display:none}
.evalbox{background:var(--loan-t);border:1px solid #d3defc;border-radius:8px;padding:16px;margin-bottom:14px}
.evalbox h4{margin:0 0 4px;font-size:17px;font-weight:800;letter-spacing:-.01em}
.evalbox p{margin:0 0 12px;font-size:13.5px;color:#34406b}
.evalbtn{display:block;text-align:center;text-decoration:none;background:var(--loan);color:#fff;font-weight:800;font-size:15px;border-radius:6px;padding:14px 12px}
.evalbtn:hover{background:#1c41b3}
.evalbox small{display:block;margin-top:8px;font-size:11.5px;color:#4a5a8c}
.oklink{display:block;margin-top:10px;color:var(--loan);font-weight:800}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:1200;background:var(--ink);color:#fff;border-radius:10px;padding:12px 14px;display:none;align-items:center;gap:12px;box-shadow:0 8px 26px rgba(0,0,0,.35);max-width:calc(100vw - 24px);font-size:14px;font-weight:600}
.toast.on{display:flex}
.toast a{color:#fff;background:var(--loan);border-radius:6px;padding:8px 12px;font-weight:800;text-decoration:none;white-space:nowrap}
.toast button{border:0;background:none;color:#bbb;font-size:18px;padding:0 2px}
@media (max-width:860px){ .toast{bottom:76px} }
.lb{position:fixed;inset:0;z-index:1100;background:#0d0c10;display:none;align-items:center;justify-content:center}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb button{position:absolute;border:0;background:rgba(255,255,255,.92);border-radius:50%;width:42px;height:42px;font-size:19px;font-weight:800}
.lb .lp{left:12px;top:50%}.lb .ln{right:12px;top:50%}.lb .lx{right:12px;top:12px}
.lb span{position:absolute;left:14px;top:18px;color:#fff;font-weight:700}

@media (max-width:1100px){ .bar{flex-wrap:wrap} .q{flex:1 1 200px} .pill,.savebtn{padding:0 10px;font-size:13.5px} .hr a.n{display:none} .hin a.n{padding:8px 7px;font-size:13.5px} }
@media (max-width:1180px){ .main{grid-template-columns:minmax(0,1fr) minmax(0,400px)} .grid{grid-template-columns:minmax(0,1fr)} }
@media (max-width:860px){
  .hin{grid-template-columns:auto 1fr;height:54px;padding:0 14px}
  .hl,.hr a.n{display:none}
  .logo{justify-self:start}
  .bar{flex-wrap:wrap;padding:8px 12px}
  .q{flex:1 1 100%}
  .pills{flex:1 1 100%;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .pills::-webkit-scrollbar{display:none}
  .pill,.savebtn{height:36px;font-size:13px}
  .savebtn{margin-left:0}
  .pop{position:fixed;left:12px;right:12px;top:auto;bottom:12px;min-width:0}
  .main{grid-template-columns:minmax(0,1fr)}
  .main.mapview .list{display:none}
  .main:not(.mapview) .mapwrap{display:none}
  .list{box-shadow:none;padding:12px 12px 86px}
  .viewtog{display:block;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:550;background:var(--ink);color:#fff;border:0;border-radius:99px;padding:12px 24px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.3)}
  .c .nav{opacity:1}
  .mos{grid-template-columns:minmax(0,1fr);grid-template-rows:1fr;height:auto;aspect-ratio:4/3;padding:0}
  .mos button:not(:first-child):not(.all){display:none}
  .mos button:first-child{border-radius:0}
  .dw{grid-template-columns:minmax(0,1fr);padding:16px 14px 30px;gap:8px}
  .hero{gap:14px}.hero h2{font-size:28px;flex:1 1 100%}
  .chips{grid-template-columns:repeat(2,minmax(0,1fr))}
  .side{position:static}
  .sheet.sm{margin:0;border-radius:0;min-height:100%}
}
</style>
</head>
<body>

<header>
  <div class="hin">
    <nav class="hl">
      <a class="n" href="homes" data-t="nav_buy"></a>
      <a class="n" href="homes?type=lease" data-t="nav_rent"></a>
      <a class="n" href="value.html" data-t="nav_sell"></a>
      <a class="n" href="apply.html" data-t="nav_loan"></a>
      <a class="n" href="team" data-t="nav_team"></a>
    </nav>
    <a class="logo" href="index.html" aria-label="JAG Real Estate">
      <span class="lock"><small>Est. 2018</small><b>JAG</b><i>Real Estate</i></span>
      <span class="brok">eXp Realty</span>
    </a>
    <div class="hr">
      <a class="n" href="tel:+18327023574">(832) 702-3574</a>
      <span class="langs" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button>
      </span>
    </div>
  </div>
</header>

<div class="demo" data-t="demo"></div>

<div class="bar" id="bar">
  <form class="q" id="qf">
    <input id="q" type="search" autocomplete="off" data-ph="q_ph" aria-label="Buscar">
    <button type="submit" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
  </form>
  <div class="pills">
    <div class="dd" data-dd="type"><button type="button" class="pill" id="p_type"></button>
      <div class="pop"><label class="r"><input type="radio" name="type" value="sale" checked><span data-t="t_sale"></span></label><label class="r"><input type="radio" name="type" value="lease"><span data-t="t_lease"></span></label></div></div>
    <div class="dd" data-dd="price"><button type="button" class="pill" id="p_price"></button>
      <div class="pop"><h4 data-t="h_price"></h4><div class="rng"><select id="minp" aria-label="Min"></select><span>–</span><select id="maxp" aria-label="Max"></select></div><button type="button" class="apply" data-t="apply"></button></div></div>
    <div class="dd" data-dd="beds"><button type="button" class="pill" id="p_beds"></button>
      <div class="pop"><h4 data-t="h_beds"></h4><div class="seg" id="s_beds"></div><h4 data-t="h_baths"></h4><div class="seg" id="s_baths"></div><button type="button" class="apply" data-t="apply"></button></div></div>
    <div class="dd" data-dd="kind"><button type="button" class="pill" id="p_kind"></button>
      <div class="pop"><h4 data-t="h_kind"></h4><div id="kinds"></div><button type="button" class="apply" data-t="apply"></button></div></div>
    <button class="savebtn" type="button" id="saveBtn" data-t="save"></button>
  </div>
</div>

<div class="main" id="main">
  <div class="mapwrap"><div class="mapnote" id="mapnote" data-t="mapnote"></div><div id="map" aria-label="Mapa"></div></div>
  <section class="list" id="list">
    <h1 id="title">&nbsp;</h1>
    <div class="sub"><b id="count">&nbsp;</b>
      <label><span data-t="sortl"></span>
        <select id="sort" aria-label="Orden">

$('grid').addEventListener('mouseout',function(e){ var c=e.target.closest('.c'); if(c) hot(+c.getAttribute('data-i'),false); });
$('pager').addEventListener('click',function(e){
  if(e.target.id==='pv'&&state.page>1) state.page--; else if(e.target.id==='nx'&&state.page<state.pages) state.page++; else return;
  load(false); $('list').scrollTop=0;
});

/* ---------- leads ---------- */
function leadForm(kind){
  return '<p class="err">'+t('need')+'</p>'+
    '<input name="name" autocomplete="name" placeholder="'+t('name')+'" aria-label="'+t('name')+'">'+
    '<input name="phone" type="tel" autocomplete="tel" placeholder="'+t('phone')+'" aria-label="'+t('phone')+'">'+
    '<input name="email" type="email" autocomplete="email" placeholder="'+t('email')+'" aria-label="'+t('email')+'">'+
    (kind==='save'?'<button class="btn" type="submit" data-a="Saved search">'+t('savebtn')+'</button>'
      :'<button class="btn" type="submit" data-a="Tour request">'+t('tour')+'</button><button class="btn alt" type="submit" data-a="Offer request">'+t('offer')+'</button>')+
    '<p class="fine">'+t('fine')+'</p>';
}
function wireLead(form,extra){
  var action='';
  form.querySelectorAll('button[data-a]').forEach(function(b){ b.addEventListener('click',function(){ action=b.getAttribute('data-a'); }); });
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var n=form.name.value.trim(), ph=form.phone.value.replace(/\D/g,'');
    if(n.length<2||ph.length<10){ form.querySelector('.err').style.display='block'; return; }
    var data={__name:n,Phone:form.phone.value.trim(),Email:form.email.value.trim()||null,'Preferred Language':lang==='es'?'Spanish':'English',Request:action||'Inquiry'};
    Object.keys(extra).forEach(function(k){ data[k]=extra[k]; });
    if(window.jagCapture) window.jagCapture('home-search',data);
    if(extra['MLS #']) logEvent(extra['MLS #'],'inquiry');
    form.innerHTML='<div class="ok">'+t('thanks')+'<a class="oklink" href="'+esc(evalUrl(extra['MLS #']?findListing(extra['MLS #']):null))+'">'+t('ev_after')+'</a></div>';
  });
}

/* ---------- home detail ---------- */
var cur=null, lbn=0;
function showLB(n){ lbn=(n+cur.images.length)%cur.images.length; $('lbi').src=img(cur.images[lbn],'large'); $('lbc').textContent=(lbn+1)+' / '+cur.images.length; $('lb').classList.add('on'); }
$('lb').querySelector('.lp').onclick=function(){ showLB(lbn-1); };
$('lb').querySelector('.ln').onclick=function(){ showLB(lbn+1); };
$('lb').querySelector('.lx').onclick=function(){ $('lb').classList.remove('on'); };
function openDetail(i){
  var l=(typeof i==='object')?i:state.items[i]; if(!l) return; cur=l;
  if(typeof i==='object') i=state.items.indexOf(l);
  logEvent(l.mlsNumber,'view');
  state.seen[l.mlsNumber]=1; var pn=document.querySelector('.pin[data-i="'+i+'"]'); if(pn) pn.classList.add('seen');
  var d=l.details||{}, a=l.address||{}, lease=String(l.type||'').toLowerCase()==='lease', full=addr(a)+', '+a.city+', '+(a.state||'TX')+' '+a.zip;
  var desc=String(d.description||'').replace(/\*+\s*SAMPLE DATA\s*\*+/gi,'').trim();
  var chips=[[d.style||d.propertyType,'f_type'],[d.yearBuilt,'f_year'],[(l.lot||{}).acres?Number(l.lot.acres).toFixed(2)+t('acres'):null,'f_lot'],
    [d.sqft&&!lease?money(l.listPrice/d.sqft):null,'f_ppsf'],[l.daysOnMarket,'f_dom'],[l.mlsNumber,'f_mls']];
  $('sheet').className='sheet';
  $('sheet').innerHTML='<div class="top"><button class="back" type="button">'+t('back')+'</button>'+
      '<span class="lock"><b>JAG</b><i>Real Estate</i></span>'+
      '<button class="act'+(favs[l.mlsNumber]?' on':'')+'" type="button" id="dfav">'+HEART+'<span>'+t(favs[l.mlsNumber]?'saved':'savehome')+'</span></button>'+
      '<button class="act" type="button" id="dshare"><svg viewBox="0 0 24 24"><path d="M12 15V4m0 0l-4 4m4-4l4 4M5 13v6h14v-6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>'+t('share')+'</span></button></div>'+
    '<div class="mos">'+l.images.slice(0,5).map(function(p,k){ return '<button type="button" data-k="'+k+'" aria-label="'+(k+1)+'" style="background-image:url(\''+img(p,k?'small':'medium')+'\')"></button>'; }).join('')+
      (l.images.length>1?'<button type="button" class="all" data-k="0">'+t('allph')+l.images.length+t('photos')+'</button>':'')+'</div>'+
    '<div class="dw"><div>'+
      '<div class="hero"><h2>'+money(l.listPrice)+(lease?'<small style="font-size:16px">'+t('mo')+'</small>':'')+'</h2>'+
        (d.numBedrooms!=null?'<span class="f"><b>'+d.numBedrooms+'</b>'+t('bd')+'</span>':'')+(d.numBathrooms!=null?'<span class="f"><b>'+d.numBathrooms+'</b>'+t('ba')+'</span>':'')+(d.sqft?'<span class="f"><b>'+num(d.sqft)+'</b>'+t('sqft')+'</span>':'')+'</div>'+
      '<div class="ad2">'+esc(full)+'</div>'+
      (lease?'':'<span class="estl">'+t('estpay')+'<span id="pb2"></span>'+t('mo')+'<a href="'+esc(evalUrl(l))+'">'+t('ev_link')+' ›</a></span>')+
      '<div class="chips">'+chips.filter(function(c){return c[0]!=null&&c[0]!=='';}).map(function(c){return '<div><span><small>'+t(c[1])+'</small>'+esc(c[0])+'</span></div>';}).join('')+'</div>'+
      (desc?'<h3>'+t('about')+'</h3><div class="desc clip" id="ds">'+esc(desc)+'</div><button class="more" type="button" id="mr">'+t('more')+'</button>':'')+
      '<p class="credit">'+t('listed')+esc((l.office||{}).brokerageName||'—')+' · MLS# '+esc(l.mlsNumber)+'</p>'+
      '<div class="foot"><b>Jason Aguirre Group · eXp Realty</b><nav><a href="iabs.html">TREC Information About Brokerage Services</a><a href="https://www.trec.texas.gov/forms/consumer-protection-notice" target="_blank" rel="noopener">TREC Consumer Protection Notice</a></nav><p>'+t('use')+'</p><p>'+t('idx')+'</p></div>'+
    '</div><aside class="side">'+
      (lease?'':'<div class="evalbox"><h4>'+t('ev_h')+'</h4><p>'+t('ev_p')+'</p><a class="evalbtn" href="'+esc(evalUrl(l))+'">'+t('ev_btn')+'</a><small>'+t('ev_fine')+'</small></div>')+
      '<form class="box lead" id="lf" novalidate>'+leadForm('home')+'</form>'+
      (lease?'':'<div class="box pay"><h4>'+t('pay_h')+'</h4><div class="big"><span id="pb"></span><small>'+t('mo')+'</small></div>'+
        '<label>'+t('down')+'<select id="dn"><option value="3.5">3.5% (FHA)</option><option value="5">5%</option><option value="10">10%</option><option value="15">15%</option><option value="20">20%</option></select></label>'+
        '<label>'+t('rate')+'<input id="rt" type="number" inputmode="decimal" step="0.125" min="0" max="20" value="'+RATE+'"></label>'+
        '<p>'+t('pay_fine')+'</p></div>')+
    '</aside></div>';
  var s=$('sheet');
  s.querySelector('.back').onclick=closeDetail;
  s.querySelector('.mos').addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) showLB(+b.getAttribute('data-k')); });
  $('dfav').onclick=function(){ var on=toggleFav(l.mlsNumber); this.classList.toggle('on',on); this.querySelector('span').textContent=t(on?'saved':'savehome'); var h=document.querySelector('.c[data-i="'+i+'"] .heart'); if(h) h.classList.toggle('on',on); };
  $('dshare').onclick=function(){ var sp=this.querySelector('span'), u=location.href.split('#')[0]+'#'+l.mlsNumber;
    if(navigator.share) navigator.share({title:full,url:u}).catch(function(){});
    else if(navigator.clipboard) navigator.clipboard.writeText(u).then(function(){ sp.textContent=t('copied'); }).catch(function(){}); };
  if($('mr')) $('mr').onclick=function(){ var c=$('ds').classList.toggle('clip'); this.textContent=c?t('more'):t('less'); };
  if(!lease){
    var calc=function(){ var v=money(pmt(l.listPrice,+$('dn').value,Math.max(0,+$('rt').value||0))); $('pb').textContent=v; $('pb2').textContent=v; };
    $('dn').onchange=calc; $('rt').oninput=calc; calc();
  }
  wireLead($('lf'),{Property:full,'MLS #':l.mlsNumber,'List Price':l.listPrice,'Sample Data':SAMPLE});
  $('ov').classList.add('on'); $('ov').scrollTop=0; document.body.style.overflow='hidden';
}
function closeDetail(){ $('ov').classList.remove('on'); $('lb').classList.remove('on'); document.body.style.overflow=''; }
$('ov').addEventListener('click',function(e){ if(e.target===$('ov')) closeDetail(); });
document.addEventListener('keydown',function(e){
  if($('lb').classList.contains('on')){ if(e.key==='Escape') $('lb').classList.remove('on'); else if(e.key==='ArrowLeft') showLB(lbn-1); else if(e.key==='ArrowRight') showLB(lbn+1); return; }
  if(e.key==='Escape'){ closeDetail(); closeDD(); }
});

$('toastx').onclick=function(){ $('toast').classList.remove('on'); };
$('saveBtn').addEventListener('click',function(){
  closeDD(); $('sheet').className='sheet sm';
  $('sheet').innerHTML='<button class="x" type="button" aria-label="Cerrar">×</button><div style="padding:26px 22px"><form class="lead" id="lf" novalidate><h3 style="font-size:21px;margin:0 0 4px;font-weight:800">'+t('saveh')+'</h3><p style="color:var(--muted);margin:0 0 14px">'+t('savep')+'</p>'+leadForm('save')+'</form></div>';
  $('sheet').querySelector('.x').onclick=closeDetail;
  wireLead($('lf'),{Search:state.bounds?'Map area '+state.bounds.toBBoxString():($('q').value.trim()||'Texas'),Type:F.type,'Min Price':F.minp||null,'Max Price':F.maxp||null,'Min Beds':F.beds||null,'Min Baths':F.baths||null,'Home Types':F.kinds.join(', ')});
  $('ov').classList.add('on'); document.body.style.overflow='hidden';
});

/* ---------- map: results follow the map, like the big portals ---------- */
function setTog(){ $('viewtog').textContent=$('main').classList.contains('mapview')?t('listv'):t('map'); }
$('viewtog').addEventListener('click',function(){ $('main').classList.toggle('mapview'); setTog(); if(map){ quiet++; map.invalidateSize(); drawPins(!state.bounds); setTimeout(function(){ quiet--; },400); } });
try{
  map=L.map('map',{scrollWheelZoom:true}).setView([30.27,-97.74],10);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
  layer=L.layerGroup().addTo(map);
  var mt;
  map.on('moveend',function(){
    if(quiet>0) return;
    clearTimeout(mt); mt=setTimeout(function(){ state.bounds=map.getBounds(); $('mapnote').classList.add('on'); state.page=1; load(false); },350);
  });
}catch(e){ map=null; }

try{
  var qs=new URLSearchParams(location.search), q0=(qs.get('q')||'').trim().slice(0,80), t0=qs.get('type');
  if(q0) $('q').value=q0;
  if(t0==='lease'){ F.type='lease'; var r=document.querySelector('input[name=type][value=lease]'); if(r) r.checked=true; }
}catch(e){}
applyLang(); load();
/* /homes#MLS123 opens that listing directly (featured homes, shared links) */
(function(){
  var m=/^#([A-Za-z0-9-]{3,24})$/.exec(location.hash); if(!m) return;
  fetch(API+'?mlsNumber='+encodeURIComponent(m[1])).then(function(r){ return r.ok?r.json():null; })
   .then(function(d){ if(d&&d.listings&&d.listings[0]) openDetail(d.listings[0]); }).catch(function(){});
})();
</script>
