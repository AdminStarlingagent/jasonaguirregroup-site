<html lang="es">

<title>JAG Reels — Casas en video</title>
<meta name="description" content="Desliza y descubre casas en venta en Houston, estilo TikTok. Jason Aguirre Group · eXp Realty.">

<style>
:root{--buy:#c8102e;--buy-d:#a30d26;--ink:#17161c;--loan:#2653d9;--w:#fff;--wt:rgba(255,255,255,.78);--glass:rgba(23,22,28,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden;
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
svg{display:block}

/* the phone-shaped column; full screen on phones, centered on desktop */
.app{position:relative;height:100dvh;width:min(100vw,calc(100dvh * 9 / 16));margin:0 auto;background:#111;overflow:hidden}
@media (min-width:700px){ body{background:radial-gradient(circle at 50% 40%,#2a2a33,#000 70%)} .app{box-shadow:0 0 60px rgba(0,0,0,.6)} }

/* top bar */
.top{position:absolute;z-index:30;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;align-items:center;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.ib{width:40px;height:40px;border-radius:99px;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ib svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand{display:flex;align-items:baseline;gap:6px;margin-right:auto;text-decoration:none;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.brand b{font-size:22px;font-weight:800;letter-spacing:-.02em;color:#fff}
.brand span{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;background:var(--buy);padding:3px 7px;border-radius:4px}
.area{max-width:38%;height:40px;padding:0 12px;border-radius:99px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.area svg{width:16px;height:16px;flex:none;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round}
.area em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.langs{display:flex;border-radius:99px;overflow:hidden;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.langs button{font-size:11.5px;font-weight:800;padding:0 9px;height:40px;opacity:.7}
.langs button.on{opacity:1;background:#fff;color:var(--ink);border-radius:99px}

/* feed */
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.reel{position:relative;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#111}
.media,.frames,.vid,.bg{position:absolute;inset:0}
.bg{background:#222 center/cover no-repeat;filter:blur(24px) brightness(.55);transform:scale(1.2)}
.fr{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease}
.fr.on{opacity:1}
.reel.act .fr.on{animation:kb1 4.2s ease-out both}
.reel.act .fr.on.k2{animation-name:kb2}
.reel.act .fr.on.k3{animation-name:kb3}
@keyframes kb1{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.16) translate(-3%,-2%)}}
@keyframes kb2{from{transform:scale(1.16) translate(3%,1%)}to{transform:scale(1.03) translate(0,0)}}
@keyframes kb3{from{transform:scale(1.04) translate(-2%,2%)}to{transform:scale(1.15) translate(2%,-1%)}}
.reel.paused .fr.on,.reel.paused .bars i.cur b{animation-play-state:paused!important}
.vid{display:flex;align-items:center;justify-content:center}
.vid iframe{width:100%;aspect-ratio:16/9;border:0;background:#000}
.reel.vmode .frames,.reel.vmode .bars{display:none}
.reel:not(.vmode) .vid{display:none}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.45) 0,rgba(0,0,0,0) 18%,rgba(0,0,0,0) 48%,rgba(0,0,0,.82) 100%)}

/* story-style progress bars, one per photo */
.bars{position:absolute;z-index:6;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 60px);display:flex;gap:3px}
.bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.32);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:#fff}
.bars i.done b{width:100%}
.reel.act .bars i.cur b{animation:fill var(--d,4.2s) linear forwards}
@keyframes fill{to{width:100%}}

/* tap zones: left = previous photo, right = next photo, hold = pause */
.tap{position:absolute;z-index:4;top:15%;bottom:38%;width:34%}
.tap.l{left:0}.tap.r{right:0}

/* listing info */
.info{position:absolute;z-index:8;left:0;right:76px;bottom:0;padding:0 14px calc(env(safe-area-inset-bottom) + 16px);text-shadow:0 1px 8px rgba(0,0,0,.55)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-shadow:none}
.tag.new{background:var(--buy)}
.tag.vd{background:#fff;color:var(--ink)}
.pr{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.pm{display:inline-block;margin-top:4px;font-size:13.5px;font-weight:700;color:#fff;background:rgba(38,83,217,.92);padding:3px 9px;border-radius:6px;text-shadow:none}
.sp{margin-top:8px;font-size:15px;font-weight:600}
.sp b{font-weight:800}
.sp i{font-style:normal;opacity:.6;margin:0 6px}
.ad{margin-top:4px;font-size:14px;color:var(--wt);line-height:1.35}
.cr{margin-top:6px;font-size:11px;color:rgba(255,255,255,.66)}
.cta{display:flex;gap:8px;margin-top:12px}
.cta a,.cta button{flex:1;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;text-decoration:none;text-shadow:none;white-space:nowrap}
.cta .go{background:var(--buy)}
.cta .go:active{background:var(--buy-d)}
.cta .de{background:rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ttour{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* right rail */
.rail{position:absolute;z-index:9;right:8px;bottom:calc(env(safe-area-inset-bottom) + 120px);display:flex;flex-direction:column;align-items:center;gap:16px}
.rb{text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.rb .ic{width:48px;height:48px;border-radius:99px;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.rb svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rb.fav.on .ic{background:#fff}
.rb.fav.on svg{fill:var(--buy);stroke:var(--buy)}
.rb.fav.pop .ic{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.25)}}
.burst{position:absolute;z-index:12;left:50%;top:42%;width:110px;height:110px;margin:-55px 0 0 -55px;pointer-events:none;animation:burst .8s ease forwards}
.burst svg{width:100%;height:100%;fill:var(--buy);filter:drop-shadow(0 4px 14px rgba(0,0,0,.4))}
@keyframes burst{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.1);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1.3) translateY(-30px);opacity:0}}
.pausei{position:absolute;z-index:11;left:50%;top:45%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:99px;background:rgba(0,0,0,.45);display:none;place-items:center;pointer-events:none}
.pausei svg{width:30px;height:30px;fill:#fff}
.reel.paused .pausei{display:grid}

/* "can I buy one of these?" card that appears every few homes */
.reel.ev{display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#c8102e 0%,#6b0818 55%,#17161c 100%)}
.evb{padding:0 28px;text-align:center;max-width:420px}
.evb .big{font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.evb p{font-size:16px;line-height:1.5;color:rgba(255,255,255,.88);margin:14px 0 22px}
.evb a{display:flex;height:52px;border-radius:12px;background:#fff;color:var(--buy);font-weight:800;font-size:16px;align-items:center;justify-content:center;text-decoration:none}
.evb small{display:block;margin-top:12px;font-size:12.5px;color:rgba(255,255,255,.75)}
.evb .sk{margin-top:26px;font-size:13px;font-weight:700;opacity:.8}

/* end, empty, loading */
.msg{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px;gap:14px;scroll-snap-align:start;color:var(--wt);font-size:15px;line-height:1.5}
.msg a,.msg button{color:#fff;background:var(--buy);padding:12px 20px;border-radius:10px;font-weight:800;text-decoration:none}
.spin{width:38px;height:38px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:99px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* swipe hint (first visit only) */
.hint{position:absolute;z-index:40;left:50%;bottom:34%;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:14px;text-shadow:0 1px 8px rgba(0,0,0,.6);pointer-events:none}
.hint.on{display:flex;animation:hint 1.6s ease-in-out 3}
.hint svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes hint{0%,100%{transform:translate(-50%,0);opacity:.4}50%{transform:translate(-50%,-26px);opacity:1}}

/* filter sheet */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.5);display:none}
.scrim.on{display:block}
.sheet{position:absolute;z-index:51;left:0;right:0;bottom:0;background:#fff;color:var(--ink);border-radius:18px 18px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(105%);transition:transform .28s ease}
.sheet.on{transform:none}
.sheet h3{margin:0 0 14px;font-size:18px;font-weight:800}
.sheet label{display:block;font-size:12.5px;font-weight:800;color:#5f5e68;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.sheet input,.sheet select{width:100%;height:46px;border:1.5px solid #c9c8d0;border-radius:10px;padding:0 12px;font-size:16px;background:#fff;color:var(--ink)}
.row{display:flex;gap:10px}.row>div{flex:1}
.seg{display:flex;border:1.5px solid #c9c8d0;border-radius:10px;overflow:hidden}
.seg button{flex:1;height:44px;font-weight:700;font-size:14px;color:var(--ink)}
.seg button+button{border-left:1.5px solid #c9c8d0}
.seg button.on{background:var(--ink);color:#fff}
.sheet .apply{margin-top:18px;width:100%;height:50px;border-radius:12px;background:var(--buy);color:#fff;font-weight:800;font-size:16px}

.toast{position:absolute;z-index:60;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 62px);background:#fff;color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;display:none;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.toast.on{display:flex}
.toast a{margin-left:auto;color:var(--buy);font-weight:800;white-space:nowrap}
.legal{font-size:10.5px;line-height:1.45;color:rgba(255,255,255,.6);max-width:420px}
@media (prefers-reduced-motion:reduce){ .reel.act .fr.on{animation:none} .hint.on{animation:none} }
</style>
<script src="jag-track.js?v=1"></script>
</head>

function estTotal(p){ var P=p*.965, r=RATE/1200, n=360, pi=P*r/(1-Math.pow(1+r,-n)); return pi+p*TAXRATE/1200+p*INSRATE/1200+P*MIRATE/1200; }

/* ---------- search (same URL params as /homes, so filters carry over both ways) ---------- */
var qs=new URLSearchParams(location.search);
var F={q:(qs.get('q')||'').trim().slice(0,80),type:qs.get('type')==='lease'?'lease':'sale',maxp:/^\d{1,9}$/.test(qs.get('maxp')||'')?qs.get('maxp'):'',
  minp:/^\d{1,9}$/.test(qs.get('minp')||'')?qs.get('minp'):'',beds:/^\d$/.test(qs.get('beds')||'')?qs.get('beds'):'',baths:/^\d$/.test(qs.get('baths')||'')?qs.get('baths'):'',
  newc:qs.get('newc')==='1',kinds:(qs.get('kinds')||'Residential').split(',').filter(function(k){ return /^(Residential|Land|Residential Income|Farm)$/.test(k); }),
  b:(qs.get('b')||'').split(',').map(Number)};
if(!F.kinds.length) F.kinds=['Residential'];
if(!(F.b.length===4&&F.b.every(isFinite))) F.b=null;
var START=/^[A-Za-z0-9-]{3,24}$/.test(qs.get('start')||'')?qs.get('start'):null;
var S={page:0,pages:1,items:[],busy:false,done:false,asSearch:false,req:0};

function query(page){
  var p=new URLSearchParams({type:F.type,resultsPerPage:PER,pageNum:page,sortBy:'createdOnDesc'});
  if(F.b){ var b=F.b; p.set('map',JSON.stringify([[[b[0],b[1]],[b[2],b[1]],[b[2],b[3]],[b[0],b[3]]]])); }
  else{ p.set('state',STATE); var q=F.q; if(/^\d{5}$/.test(q)) p.set('zip',q); else if(q&&!/\d/.test(q)&&!S.asSearch) p.set('city',q); else if(q) p.set('search',q); }
  if(F.newc&&F.type==='sale') p.set('newc','1');
  if(F.minp) p.set('minPrice',F.minp); if(F.maxp) p.set('maxPrice',F.maxp);
  if(F.beds) p.set('minBedrooms',F.beds); if(F.baths) p.set('minBaths',F.baths);
  if(F.type==='sale') F.kinds.forEach(function(k){ p.append('propertyType',k); });
  return p;
}
function homesUrl(){
  var u=new URLSearchParams();
  if(F.q) u.set('q',F.q); if(F.type==='lease') u.set('type','lease');
  ['minp','maxp','beds','baths'].forEach(function(k){ if(F[k]) u.set(k,F[k]); });
  if(F.newc) u.set('newc','1'); if(F.kinds.join(',')!=='Residential') u.set('kinds',F.kinds.join(','));
  if(F.b) u.set('b',F.b.join(','));
  var s=u.toString(); return 'homes'+(s?'?'+s:'');
}
function getJSON(u){ return fetch(u).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }); }

function loadMore(){
  if(S.busy||S.done) return; S.busy=true; var mine=S.req, page=S.page+1;
  getJSON(API+'?'+query(page)).then(function(d){
    if(mine!==S.req) return;
    var L=(d.listings||[]).filter(function(l){ return l.images&&l.images.length; });
    /* a word like "Willis" is a city first; if HAR has no city by that name, try it as a keyword */
    if(page===1&&!L.length&&F.q&&!/\d/.test(F.q)&&!S.asSearch&&!F.b){ S.asSearch=true; S.busy=false; loadMore(); return; }
    S.page=page; S.pages=d.numPages||1;
    if(page===1&&START){ var k=L.findIndex(function(l){ return l.mlsNumber===START; }); if(k>0) L.unshift(L.splice(k,1)[0]); }
    var seen={}; S.items.forEach(function(l){ seen[l.mlsNumber]=1; });
    L=L.filter(function(l){ return !seen[l.mlsNumber]; });
    var from=S.items.length; S.items=S.items.concat(L);
    if(page>=S.pages||!L.length) S.done=true;
    appendReels(from); S.busy=false;
  }).catch(function(){ if(mine!==S.req) return; S.busy=false; if(!S.items.length) showMsg('fail'); });
}
/* /reels?start=MLS: open on one home (shared link, or "▶ Video" on a /homes card), then keep going with the search */
function loadStart(){
  if(!START) return loadMore();
  getJSON(API+'?mlsNumber='+encodeURIComponent(START)).then(function(d){
    var l=d&&d.listings&&d.listings[0];
    if(l&&l.images&&l.images.length){ S.items=[l]; appendReels(0); }
  }).catch(function(){}).then(loadMore);
}

/* ---------- one reel at a time: photos cycle, video plays, the rest sleep ---------- */
function frames(el,l){
  var fr=el.querySelector('.frames'); if(fr.childNodes.length) return;
  var pics=l.images.slice(0,MAXPH);
  fr.innerHTML=pics.map(function(p,k){ return '<img class="fr'+(k===0?' on':'')+' k'+(k%3+1)+'" alt="" decoding="async" '+(k<2?'src':'data-src')+'="'+img(p,'large')+'">'; }).join('');
}
function warm(i){ /* build photos for the next couple of reels so swiping never shows a blank */
  for(var k=i;k<=i+2;k++){ var el=feed.querySelector('.reel[data-i="'+k+'"]'); if(el&&S.items[k]) frames(el,S.items[k]); }
}
function showPhoto(el,n){
  var imgs=el.querySelectorAll('.fr'), bars=el.querySelectorAll('.bars i'); if(!imgs.length) return;
  n=(n+imgs.length)%imgs.length; el._n=n;
  imgs.forEach(function(im,k){ if(k===n||k===(n+1)%imgs.length){ if(im.dataset.src){ im.src=im.dataset.src; delete im.dataset.src; } } im.classList.toggle('on',k===n); });
  /* restart the Ken Burns move on the shown photo */
  var on=imgs[n]; on.style.animation='none'; void on.offsetWidth; on.style.animation='';
  bars.forEach(function(b,k){ b.classList.toggle('done',k<n); b.classList.remove('cur'); var f=b.firstChild; f.style.animation='none'; void f.offsetWidth; f.style.animation=''; if(k===n) b.classList.add('cur'); });
}
function nextPhoto(el,dir){ showPhoto(el,(el._n||0)+dir); var l=S.items[+el.getAttribute('data-i')]; if(dir&&l) act('photos',l); }
var muted=true;
function videoSrc(v){
  if(v.kind==='youtube') return 'https://www.youtube-nocookie.com/embed/'+encodeURIComponent(v.id)+'?autoplay=1&mute=1&playsinline=1&loop=1&playlist='+encodeURIComponent(v.id)+'&controls=0&rel=0&modestbranding=1&enablejsapi=1&origin='+encodeURIComponent(location.origin);
  return 'https://player.vimeo.com/video/'+encodeURIComponent(v.id)+'?autoplay=1&muted=1&loop=1&playsinline=1&title=0&byline=0&portrait=0';
}
function ytCmd(el,fn){ var f=el.querySelector('.vid iframe'); if(f&&f.contentWindow) try{ f.contentWindow.postMessage(JSON.stringify({event:'command',func:fn,args:[]}),'*'); }catch(e){} }
function startVideo(el,l){
  var box=el.querySelector('.vid'); if(box.firstChild) return;
  box.innerHTML='<iframe src="'+videoSrc(l.video)+'" title="Video" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
  if(!muted&&l.video.kind==='youtube'){ var f=box.firstChild; f.addEventListener('load',function(){ setTimeout(function(){ ytCmd(el,'unMute'); },400); }); }
}
function stopVideo(el){ var box=el.querySelector('.vid'); if(box) box.innerHTML=''; }
function activate(el){
  if(active===el) return;
  if(active){ active.classList.remove('act','paused'); stopVideo(active); clearTimeout(active._vt); }
  active=el; el.classList.add('act');
  if(el.classList.contains('ev')){ track('reel_eval_card'); maybeMore(); return; }
  var i=+el.getAttribute('data-i'), l=S.items[i]; if(!l) return;
  frames(el,l); warm(i+1);
  if(el.classList.contains('vmode')) startVideo(el,l); else showPhoto(el,el._n||0);
  /* counts as a view after 3 seconds on screen (feeds the active buyer score + homepage featured homes) */
  el._vt=setTimeout(function(){ if(active===el){ logEvent(l.mlsNumber,'view'); act('view',l); track('reel_view',{mls:l.mlsNumber,video:playable(l)?1:0}); } },3000);
  try{ history.replaceState(null,'',location.pathname+'?'+withStart(l.mlsNumber)); }catch(e){}
  maybeMore();
}
function withStart(m){ var u=new URLSearchParams(location.search); u.set('start',m); return u.toString(); }
function maybeMore(){ var i=+(active&&active.getAttribute('data-i')); if(!isNaN(i)&&i>=S.items.length-4) loadMore(); else if(active&&active.classList.contains('ev')&&S.items.length) loadMore(); }

/* ---------- taps ---------- */
var holdT=null, held=false, lastTap=0;
feed.addEventListener('pointerdown',function(e){
  var z=e.target.closest('.tap'); if(!z) return; held=false;
  holdT=setTimeout(function(){ held=true; var el=z.closest('.reel'); if(el===active){ el.classList.add('paused'); ytCmd(el,'pauseVideo'); } },260);
});
function endHold(){ clearTimeout(holdT); if(held&&active){ active.classList.remove('paused'); ytCmd(active,'playVideo'); } }
feed.addEventListener('pointerup',endHold); feed.addEventListener('pointercancel',endHold); feed.addEventListener('pointerleave',endHold);
feed.addEventListener('click',function(e){
  var el=e.target.closest('.reel');
  var r=e.target.closest('[data-retry]'); if(r){ restart(); return; }
  if(e.target.closest('[data-open="filters"]')){ openSheet(); return; }
  var lk=e.target.closest('a[data-k]'); if(lk&&el){ var l0=S.items[+el.getAttribute('data-i')]; if(l0&&lk.getAttribute('data-k')==='tour') act('form_open',l0); track('reel_'+lk.getAttribute('data-k'),{mls:l0&&l0.mlsNumber}); return; }
  if(!el||el.classList.contains('ev')) return;
  var l=S.items[+el.getAttribute('data-i')]; if(!l) return;
  var z=e.target.closest('.tap');
  if(z){
    if(held){ held=false; return; }
    var now=Date.now();
    if(now-lastTap<300){ lastTap=0; if(!favs[l.mlsNumber]) doFav(el,l,true); return; }   /* double-tap = save, like TikTok */
    lastTap=now;
    var dir=+z.getAttribute('data-tap');
    setTimeout(function(){ if(lastTap===now&&!el.classList.contains('vmode')) nextPhoto(el,dir); },280);
    return;
  }
  var b=e.target.closest('[data-a]'); if(!b) return;
  var a=b.getAttribute('data-a');
  if(a==='fav') doFav(el,l,false);
  else if(a==='share') share(l);
  else if(a==='mode'){
    var v=el.classList.toggle('vmode'), lb=b.querySelector('.lb');
    if(v){ lb.textContent=t('photos'); b.querySelector('.ic').innerHTML=IC.pics; startVideo(el,l); }
    else{ lb.textContent=t('video'); b.querySelector('.ic').innerHTML=IC.play; stopVideo(el); frames(el,l); showPhoto(el,el._n||0); act('photos',l); }
  }
  else if(a==='snd'){
    muted=!muted; ytCmd(el,muted?'mute':'unMute'); if(!muted) ytCmd(el,'playVideo');
    feed.querySelectorAll('[data-a="snd"]').forEach(function(s){ s.querySelector('.ic').innerHTML=muted?IC.mute:IC.snd; s.querySelector('.lb').textContent=t(muted?'muted':'sound'); });
  }
});
document.addEventListener('keydown',function(e){
  if($('sheet').classList.contains('on')||!active) return;
  if(e.key==='ArrowRight'&&!active.classList.contains('vmode')) nextPhoto(active,1);
  else if(e.key==='ArrowLeft'&&!active.classList.contains('vmode')) nextPhoto(active,-1);
  else if(e.key===' '){ e.preventDefault(); active.classList.toggle('paused'); }
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); feed.scrollBy({top:(e.key==='ArrowDown'?1:-1)*feed.clientHeight,behavior:'smooth'}); }
});

  feed.querySelectorAll('.reel[data-i]').forEach(function(el){ var l=S.items[+el.getAttribute('data-i')]; if(!l||(m&&l.mlsNumber!==m)) return;

function addFav(el,l,burst){

  if(PA()) toast(t('pa_saved'),t('pa_go'),offerUrl(l)); else toast(t('ev_saved'),t('ev_go'),evalUrl(l));
  var A=window.JagAccount; if(A&&A.user()) A.addFavorite(l).catch(function(){});

  var A=window.JagAccount, m=l.mlsNumber;

  if(A&&!A.user()){ if(active) active.classList.add('paused'); A.requireSignIn('why_fav').then(function(){ addFav(el,l,burst); }).catch(function(){}).then(function(){ if(active) active.classList.remove('paused'); }); return; }
  addFav(el,l,burst);

  A.favorites().then(function(rows){ var s={}; (rows||[]).forEach(function(r){ s[r.mls]=1; }); Object.keys(favs).forEach(function(k){ s[k]=1; }); favs=s; storeFavs(); paintFav(); }).catch(function(){});

/* ---------- tracking (same signals /homes sends) ---------- */
var acted={}, logged={};
function act(kind,l){
  try{ if(!window.JagAccount||!JagAccount.user()) return;
    var m=l&&l.mlsNumber?String(l.mlsNumber):'', k=kind+':'+m; if(acted[k]) return; acted[k]=1; var la=(l&&l.address)||{};
    JagAccount.logActivity({kind:kind,mls:m||null,zip:la.zip||null,city:la.city?String(la.city).slice(0,60):null,price:(l&&l.listPrice)||null});
  }catch(e){}
}
function logEvent(mls,kind){
  try{
    var c=window.JAG_CRM||{}; if(!c.url||!c.anonKey||!mls) return;
    var k=kind+':'+mls; if(logged[k]) return; logged[k]=1;
    if(kind==='view'){ try{ if(sessionStorage.getItem('jv:'+mls)) return; sessionStorage.setItem('jv:'+mls,'1'); }catch(e){} }
    fetch(c.url.replace(/\/+$/,'')+'/rest/v1/rpc/jag_log_listing_event',{method:'POST',keepalive:true,
      headers:{apikey:c.anonKey,Authorization:'Bearer '+c.anonKey,'Content-Type':'application/json'},
      body:JSON.stringify({p_mls:mls,p_kind:kind})}).catch(function(){});
  }catch(e){}
}
function track(kind,extra){ try{ if(window.JagTrack) JagTrack.ev(kind,extra||{}); }catch(e){} }

/* ---------- filters ---------- */
function areaLabel(){ return F.b?(lang==='es'?'Área del mapa':'Map area'):(F.q||t('area_all')); }
function fillSheet(){
  $('fq').value=F.q;
  [].forEach.call($('ftype').children,function(b){ b.classList.toggle('on',b.getAttribute('data-v')===F.type); });
  var steps=F.type==='lease'?[1000,1500,2000,2500,3000,4000,5000]:[150000,200000,250000,300000,350000,400000,500000,750000,1000000];
  var sp=F.type==='lease'?money:short;
  $('fmax').innerHTML='<option value="">'+t('nomax')+'</option>'+steps.map(function(v){ return '<option value="'+v+'"'+(String(v)===F.maxp?' selected':'')+'>'+sp(v)+'</option>'; }).join('');
  $('fbeds').innerHTML='<option value="">'+t('any')+'</option>'+[1,2,3,4,5].map(function(v){ return '<option value="'+v+'"'+(String(v)===F.beds?' selected':'')+'>'+v+'+</option>'; }).join('');
}
function openSheet(){ fillSheet(); $('scrim').classList.add('on'); $('sheet').classList.add('on'); if(active) active.classList.add('paused'); setTimeout(function(){ $('fq').focus(); },250); }
function closeSheet(){ $('scrim').classList.remove('on'); $('sheet').classList.remove('on'); if(active) active.classList.remove('paused'); }
$('areaBtn').addEventListener('click',openSheet);
$('scrim').addEventListener('click',closeSheet);
$('ftype').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; F.type=b.getAttribute('data-v'); F.maxp=''; fillSheet(); });
$('sheet').addEventListener('submit',function(e){
  e.preventDefault(); F.q=$('fq').value.trim().slice(0,80); F.maxp=$('fmax').value; F.beds=$('fbeds').value; F.b=null; F.minp=''; START=null;
  var u=new URLSearchParams(); if(F.q) u.set('q',F.q); if(F.type==='lease') u.set('type','lease'); if(F.maxp) u.set('maxp',F.maxp); if(F.beds) u.set('beds',F.beds);
  try{ history.replaceState(null,'',location.pathname+(u.toString()?'?'+u.toString():'')); }catch(e2){}
  closeSheet(); restart(); track('reel_search');
});
function restart(){
  S={page:0,pages:1,items:[],busy:false,done:false,asSearch:false,req:S.req+1};
  if(active){ stopVideo(active); active=null; }
  showMsg('loading'); feed.scrollTop=0; paintTop(); loadStart();
}

/* ---------- language ---------- */
function paintTop(){ $('areaTx').textContent=areaLabel(); $('back').href=homesUrl(); }
function applyLang(rerender){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent=t(el.getAttribute('data-t')); });
  document.querySelectorAll('[data-ph]').forEach(function(el){ el.placeholder=t(el.getAttribute('data-ph')); });
  document.querySelectorAll('.langs button').forEach(function(b){ b.classList.toggle('on',b.getAttribute('data-lang')===lang); });
  paintTop(); if(window.JagAccount&&JagAccount.relabel) JagAccount.relabel();
  if(rerender) feed.querySelectorAll('.reel[data-i]').forEach(function(el){
    var i=+el.getAttribute('data-i'), l=S.items[i], wasV=el.classList.contains('vmode'), n=el._n||0, isAct=el===active;
    el.innerHTML=reelHtml(l,i); if(isAct){ active=null; el.classList.remove('act'); activate(el); if(!wasV) showPhoto(el,n); }
  });
  feed.querySelectorAll('.reel.ev').forEach(function(el){ el.innerHTML=evHtml(); });
}
document.querySelectorAll('.langs button').forEach(function(b){
  b.addEventListener('click',function(){ lang=b.getAttribute('data-lang'); try{ localStorage.setItem('jag_lang',lang); }catch(e){} applyLang(true); });
});
if(qs.get('lang')==='en'||qs.get('lang')==='es') lang=qs.get('lang');

function firstHint(){
  try{ if(localStorage.getItem('jag_reels_hint')) return; localStorage.setItem('jag_reels_hint','1'); }catch(e){ return; }
  var h=$('hint'); h.classList.add('on'); var off=function(){ h.classList.remove('on'); feed.removeEventListener('scroll',off); };
  feed.addEventListener('scroll',off); setTimeout(off,5200);
}

/* ---------- go ---------- */
io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting&&e.intersectionRatio>=.6) activate(e.target); }); },{root:feed,threshold:[.6]});
document.addEventListener('visibilitychange',function(){ if(!active) return; if(document.hidden){ active.classList.add('paused'); ytCmd(active,'pauseVideo'); } else { active.classList.remove('paused'); ytCmd(active,'playVideo'); } });
if(window.JagAccount){ if(JagAccount.onChange) JagAccount.onChange(syncFavs); if(JagAccount.user()) syncFavs();
  var paChk=function(){ if(JagAccount.user()&&JagAccount.loanStatus) JagAccount.loanStatus(); }; paChk(); if(JagAccount.onChange) JagAccount.onChange(paChk); }
applyLang(false); showMsg('loading'); loadStart(); track('reels_open');
</script>
</body>
</html>
