<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Apply Online | Home Loan Application</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<script src="jag-capture.js"></script>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   THEME — change these 4 lines to re-brand for any loan officer
   ============================================================ */
:root{
  --accent:#c8102e;        /* progress bar + logo mark */
  --ink:#17161c;           /* headings, buttons, selected states */
  --card:#f5f5f7;          /* option cards + input fields */
  --card-hov:#ededf1;

  --paper:#ffffff;
  --line:#e7e7ec;
  --mut:#5b5a63;
  --warn:#8a6a12;
  --warn-bd:#c9a13f;
  --ok:#1d7a3f;
  --r:16px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
input,select{font-family:inherit}

/* ---------- Header ---------- */
header.site{
  display:flex;align-items:center;justify-content:space-between;
  padding:26px 48px;
}
.logo{display:flex;align-items:center;gap:11px;font-weight:700;font-size:20px;letter-spacing:-.02em;line-height:1.05}
.lock{display:flex;flex-direction:column;line-height:1}
.lock small{font-size:7.5px;letter-spacing:.32em;font-weight:700;color:#6a6972;text-transform:uppercase}
.lock b{font-size:24px;font-weight:800;letter-spacing:-.045em;margin:1px 0}
.lock i{font-style:normal;font-size:8px;letter-spacing:.4em;font-weight:700;text-transform:uppercase;border-top:2px solid var(--accent);padding-top:3px}
.logo svg{color:var(--accent);width:34px;height:34px;flex:0 0 34px}
.logo small{display:block;font-weight:500;font-size:11px;color:#8a8992;letter-spacing:.04em;text-transform:uppercase}
.hbadge{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--ok);background:#e9f5ec;padding:9px 16px;border-radius:99px}
.hbadge svg{width:18px;height:18px}

/* reassurance note under option cards (ITIN / work permit) */
.notecard{display:none;align-items:flex-start;gap:10px;background:#e9f5ec;color:#1a5c31;border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.5;margin:2px 0 14px;animation:up .3s ease}
.notecard.show{display:flex}
.notecard svg{width:20px;height:20px;flex:0 0 20px;margin-top:1px}

/* buying-power calculator */
.calc{align-self:stretch;border:1px solid var(--line);border-radius:16px;padding:20px;margin:4px 0 8px;animation:up .4s ease}
.calc h4{margin:0 0 3px;font-size:17px;font-weight:600}
.calc .csub{margin:0 0 16px;font-size:13px;color:#6a6972}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cgrid .field{margin-bottom:0;padding:10px 14px 8px}
.cgrid .field input{font-size:15.5px}
.rate-row{display:flex;align-items:center;gap:14px;margin:16px 2px 6px;font-size:14px;font-weight:500;color:#37363e}
.rate-row output{font-weight:700;color:var(--ink);min-width:52px}
.rate-row input[type=range]{flex:1;accent-color:var(--ink);height:4px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.pcard{background:var(--card);border-radius:14px;padding:16px 18px}
.pcard .pname{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.pcard .ptag{font-size:11.5px;font-weight:600;color:#1a5c31;background:#e9f5ec;padding:4px 9px;border-radius:99px;white-space:nowrap}
.pcard .pamt{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:9px 0 3px}
.pcard .ppay{font-size:13px;color:#5b5a63}
.pcard .plim{font-size:12.5px;color:var(--warn);margin-top:8px;line-height:1.45}
.cnote{font-size:12px;color:#8a8992;margin:14px 2px 0;line-height:1.6}

/* ---------- Progress ---------- */
.progress-wrap{max-width:780px;margin:30px auto 0;padding:0 24px}
.track{height:4px;background:#e9e9ee;border-radius:99px;overflow:hidden}
.fill{height:100%;width:3%;background:var(--accent);border-radius:99px;transition:width .5s cubic-bezier(.3,.7,.3,1)}
.prog-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;min-height:38px}
.backbtn{width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:#2a2930;display:grid;place-items:center;cursor:pointer;transition:background .15s}
.backbtn:hover{background:#f1f1f4}
.backbtn svg{width:22px;height:22px}
.pct{font-size:14px;font-weight:500;color:#3f3e46}
.hiddenv{visibility:hidden}

/* ---------- Stage ---------- */
main{min-height:60vh}
#stage{max-width:562px;margin:52px auto 90px;padding:0 24px}
#stage.chat-mode{max-width:760px;margin-top:34px}

.step{animation:up .4s cubic-bezier(.2,.7,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.badges{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.badge{display:inline-flex;align-items:center;gap:8px;background:#eef0fb;color:#3b3f58;padding:8px 14px;border-radius:99px;font-size:14px;font-weight:500}
.badge.ok{background:#e9f5ec;color:#1a5c31}
.badge svg{width:16px;height:16px}

h1.title{font-size:clamp(28px,4.8vw,36px);font-weight:600;letter-spacing:-.015em;line-height:1.22;margin:0 0 12px}
.question{font-size:17px;font-weight:600;color:#2b2a31;margin:26px 0 22px}
.hint{font-size:16px;font-weight:400;color:#4a4952;margin:-2px 0 24px}

/* ---------- Option cards ---------- */
.opt{
  display:flex;align-items:center;gap:16px;
  background:var(--card);border:1.5px solid transparent;border-radius:var(--r);
  padding:19px 22px;margin-bottom:14px;cursor:pointer;user-select:none;
  transition:background .15s,border-color .15s,transform .06s;
}
.opt:hover{background:var(--card-hov)}
.opt:active{transform:scale(.995)}
.opt .ic{width:24px;height:24px;flex:0 0 24px;color:var(--ink)}
.opt .lb{font-size:16.5px;font-weight:500}
.opt .circ{margin-left:auto;width:26px;height:26px;flex:0 0 26px;border-radius:50%;border:1.5px solid #b7b6c0;background:#fff;display:grid;place-items:center;transition:border-color .15s}
.opt.sel{background:#fff;border-color:var(--ink)}
.opt.sel .circ{border-color:var(--ink)}
.opt.sel .circ::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--ink)}
.opt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- Fields ---------- */
.field{
  background:var(--card);border-radius:14px;padding:13px 18px 11px;margin-bottom:16px;
  box-shadow:inset 0 0 0 1.5px transparent;transition:background .15s,box-shadow .15s;position:relative;
}
.field label{display:block;font-size:13px;font-weight:500;color:#5b5a63;margin-bottom:2px}
.inrow{display:flex;align-items:center;gap:6px}
.inrow .pre{font-size:17px;font-weight:500;color:var(--ink)}
.field input,.field select{width:100%;border:0;outline:0;background:transparent;font-size:17px;font-weight:500;color:var(--ink);padding:2px 0}
.field input::placeholder{color:#a3a2ac;font-weight:400}
.field:focus-within{background:#fff;box-shadow:inset 0 0 0 1.5px var(--ink)}
.field.err{background:#fff;box-shadow:inset 0 0 0 1.5px var(--warn-bd)}
.field select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:26px}
.field .chev{position:absolute;right:16px;top:50%;transform:translateY(-25%);pointer-events:none;color:#6a6972;width:18px;height:18px}
.dobrow{display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:10px}
.dobrow .field{margin-bottom:0}
.skipbtn{display:block;margin:14px auto 0;background:none;border:none;color:#6a6972;font-weight:700;font-size:14px;cursor:pointer;text-decoration:underline;font-family:inherit}
.skipbtn:hover{color:#17161c}
.done-card{text-align:center;padding-top:26px}
.done-check{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:#e7f5ee;display:grid;place-items:center;color:#0f8a4d}
.done-check svg{width:30px;height:30px}
.call-btn{display:flex;align-items:center;justify-content:center;text-decoration:none;max-width:420px;margin-left:auto;margin-right:auto}
.msg{display:none;color:var(--warn);font-size:14.5px;font-weight:500;margin:-6px 0 16px 20px}
.msg.show{display:block}
.helper{font-size:14px;color:#5b5a63;margin:-6px 0 16px 20px;min-height:18px}

/* ---------- Buttons ---------- */
.next{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-width:200px;height:62px;padding:0 36px;margin-top:30px;
  border:0;border-radius:999px;background:var(--ink);color:#fff;
  font-size:16.5px;font-weight:600;cursor:pointer;
  transition:background .15s,transform .06s;
}
.next:hover{background:#000}
.next:active{transform:scale(.98)}
.next[disabled]{opacity:.7;cursor:default}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- Fine print / consent ---------- */
.fineprint{font-size:13px;color:#4c4b53;line-height:1.6;margin-top:22px}
.fineprint p{margin:0 0 14px}
.fineprint a{color:inherit}
.consent{display:flex;align-items:flex-start;gap:10px;margin-top:4px;font-size:14px;color:#37363e;line-height:1.45;cursor:pointer;user-select:none}
.consent input{width:18px;height:18px;margin-top:1px;accent-color:var(--ink);flex:0 0 18px;cursor:pointer}

/* ---------- Chat phase ---------- */
.chatcard{
  background:#fff;border-radius:22px;
  box-shadow:0 12px 44px rgba(20,20,30,.10),0 2px 8px rgba(20,20,30,.05);
  padding:24px 24px 0;display:flex;flex-direction:column;height:min(74vh,700px);
  animation:up .4s cubic-bezier(.2,.7,.3,1);
}
.chatscroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:6px 8px 16px;scroll-behavior:smooth}
.greet{text-align:center;padding:6px 0 10px}
.greet h2{font-size:24px;font-weight:600;margin:14px 0 7px;letter-spacing:-.01em}
.greet p{font-size:13px;color:#6a6972;line-height:1.55;max-width:430px;margin:0 auto}
.greet p a{color:inherit}

.bub{max-width:78%;padding:14px 18px;border-radius:16px;font-size:15.5px;line-height:1.55;margin:9px 0;white-space:pre-line}
.bub.bot{background:var(--card);color:#26252c;border-top-left-radius:6px;align-self:flex-start}
.bub.user{background:var(--ink);color:#fff;font-weight:600;border-top-right-radius:6px;align-self:flex-end}

.chips{display:flex;flex-direction:column;align-items:flex-end;gap:10px;margin:8px 0;align-self:flex-end}
.chip{border:1.5px solid #d6d5dd;background:#fff;border-radius:999px;padding:11px 20px;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--ink)}

.task{align-self:flex-start;max-width:82%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin:11px 0}
.task h4{margin:0 0 10px;font-size:14.5px;font-weight:600}
.task h4 span{color:#7a7982;font-weight:500}
.trow{display:flex;align-items:center;gap:9px;font-size:14px;color:#4c4b53;padding:3px 0}
.trow svg{width:16px;height:16px;flex:0 0 16px}
.trow.done{color:var(--ok)}
.trow.dim{color:#a9a8b1}

.typing{align-self:flex-start;display:inline-flex;gap:5px;background:var(--card);padding:15px 17px;border-radius:16px;border-top-left-radius:6px;margin:9px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:#a7a6b0;animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

.chatbar{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:15px 6px 17px;margin-top:auto}
.chatbar input{flex:1;border:0;outline:0;background:transparent;font-size:16px;font-weight:500;color:var(--ink)}
.chatbar input::placeholder{color:#a3a2ac;font-weight:400}
.send{width:46px;height:46px;border:0;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;cursor:pointer;transition:opacity .15s,background .15s}
.send:hover{background:#000}
.send[disabled]{opacity:.3;cursor:default}
.send svg{width:19px;height:19px}

.success{align-self:stretch;border:1px solid var(--line);border-radius:16px;padding:24px 22px;margin:12px 0 20px;text-align:center;animation:up .4s ease}
.success .ok-ic{width:56px;height:56px;color:var(--ok);margin:0 auto 8px}
.success h3{margin:4px 0 6px;font-size:20px;font-weight:600}
.success p{margin:0 auto;font-size:14.5px;color:#4c4b53;max-width:420px;line-height:1.55}
.recap{margin:18px auto 6px;max-width:430px;text-align:left;font-size:14.5px}
.recap div{display:flex;justify-content:space-between;gap:18px;padding:7px 2px;border-bottom:1px dashed #e7e7ec}
.recap div span{color:#6a6972}
.recap div b{font-weight:600;text-align:right}
.restart{margin-top:20px;height:52px;min-width:0;padding:0 28px;font-size:15px}

/* ---------- Footer ---------- */
footer.legal{max-width:900px;margin:24px auto 46px;padding:0 24px;text-align:center;font-size:12.5px;color:#8a8992;line-height:1.65}

/* ---------- Mobile ---------- */
@media (max-width:640px){
  header.site{padding:18px 20px}
  .hbadge{padding:8px 12px;font-size:12.5px}
  #stage{margin-top:36px}
  .next{width:100%}
  .bub{max-width:88%}
  .chatcard{height:72vh;padding:16px 14px 0}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="site">
  <a class="logo" id="logoBox" href="index.html" style="text-decoration:none;color:inherit" aria-label="JAG Real Estate home">
    <span class="lock"><small>Est. 2018</small><b>JAG</b><i>Home Loans</i></span>
  </a>
  <div class="hbadge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 4.5 5.5v6c0 4.6 3.2 8.3 7.5 9.5 4.3-1.2 7.5-4.9 7.5-9.5v-6z"/><path d="m8.8 12 2.2 2.2 4.2-4.4"/></svg>
    <span>No credit check</span>
  </div>
</header>

<div class="progress-wrap hiddenv" id="progWrap">
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="prog-row">
    <button class="backbtn" id="backBtn" aria-label="Go back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </button>
    <div class="pct" id="pct">3%</div>
  </div>
</div>

<main><div id="stage"></div></main>

<footer class="legal" id="legalFoot"></footer>

<script>
/* ================================================================
   CONFIG — everything a loan officer needs to change lives here
   ================================================================ */
const CONFIG = {
  companyName : "JAG Home Loans",             // shown in header, consent copy, chat
  tagline     : "Jason Aguirre Group",
  nmls        : "NMLS #000000",               // footer license line
  accessKey   : "b54619e1-0734-4f77-a6f6-c192aa348fe4", // Web3Forms access key
  subjectPrefix: "New Mortgage Application",  // email subject prefix
  privacyUrl  : "privacy-terms.html",         // site privacy & terms page
  termsUrl    : "privacy-terms.html#terms",   // site privacy & terms page
  webhookUrl  : "",                           // OPTIONAL: n8n / GHL inbound-webhook URL for a JSON copy of the lead
  phoneTel    : "8327023574",                 // click-to-call number on the success screen
  phoneDisplay: "(832) 702-3574",

  /* Buying-power calculator assumptions (Texas defaults — tune per market) */
  CALC : {
    rateDefault : 6.75,   // starting interest rate on the slider (%)
    taxPct      : 2.2,    // annual property tax, % of home value
    insPct      : 0.6,    // annual homeowners insurance, % of home value
    itinRateAdd : 1.0     // ITIN portfolio loans priced this much above the slider rate (%)
  }
};

/* ---------------- boot header from config (footer + badge text are set by applyChrome, per language) ---------------- */
document.title = "Apply Online | " + CONFIG.companyName;

/* ================================================================
   ICONS
   ================================================================ */
function svg(inner, vb){
  return '<svg viewBox="' + (vb||'0 0 24 24') + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
}
const IC = {
  clock: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  percent: svg('<circle cx="12" cy="12" r="9"/><path d="m9 15 6-6"/><circle cx="9.3" cy="9.3" r=".9" fill="currentColor"/><circle cx="14.7" cy="14.7" r=".9" fill="currentColor"/>'),
  house: svg('<path d="M3.5 11.5 12 4.5l8.5 7"/><path d="M5.8 10v9.5h12.4V10"/><path d="M10 19.5v-5h4v5"/>'),
  coins: svg('<ellipse cx="12" cy="6.5" rx="6.5" ry="2.6"/><path d="M5.5 6.5v5c0 1.4 2.9 2.6 6.5 2.6s6.5-1.2 6.5-2.6v-5"/><path d="M5.5 11.5v5c0 1.4 2.9 2.6 6.5 2.6s6.5-1.2 6.5-2.6v-5"/>'),
  multi: svg('<path d="M2.5 20V10l4.5-3.5L11.5 10v10"/><path d="M11.5 20V10l4.5-3.5L20.5 10v10"/><path d="M2 20h20"/>'),
  condo: svg('<rect x="6" y="3.5" width="12" height="17" rx="1"/><path d="M9.5 7.5h.01M14.5 7.5h.01M9.5 11h.01M14.5 11h.01M9.5 14.5h.01M14.5 14.5h.01"/><path d="M10.5 20.5v-3h3v3"/>'),
  mfg: svg('<path d="M4 15.5V9.8L12 5l8 4.8v5.7"/><path d="M3 15.5h18"/><circle cx="8" cy="18.3" r="1.7"/><circle cx="16" cy="18.3" r="1.7"/>'),
  primary: svg('<path d="M4 11.5 12 5l8 6.5"/><path d="M6.2 10.2V20h11.6v-9.8"/><path d="M12 5V2.5h3.5V5"/><path d="M10 20v-4.5h4V20"/>'),
  vacay: svg('<circle cx="12" cy="10" r="3.6"/><path d="M12 3v1.6M17 5l-1.1 1.1M7 5l1.1 1.1M19.4 10h-1.6M6.2 10H4.6"/><path d="M3 16.5h18M6 20h12"/>'),
  invest: svg('<rect x="2.5" y="6.5" width="19" height="11" rx="1.5"/><circle cx="12" cy="12" r="2.7"/><path d="M6 10h.01M18 14h.01"/>'),
  doc: svg('<path d="M7 3.5h7l4 4v13H7z"/><path d="M14 3.5v4h4"/><path d="M10 12.5h5M10 15.5h3"/>'),
  search: svg('<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/>'),
  photos: svg('<rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m4.5 17 4.5-4.5 3 3 3.5-3.5 4 4"/>'),
  key: svg('<circle cx="8" cy="14.5" r="4.5"/><path d="m11.3 11.2 8.2-8.2"/><path d="M16.5 6l2.5 2.5M14 8.5l2 2"/>'),
  brief: svg('<rect x="3" y="7.5" width="18" height="12.5" rx="2"/><path d="M9 7.5V5.8A1.8 1.8 0 0 1 10.8 4h2.4A1.8 1.8 0 0 1 15 5.8v1.7"/><path d="M3 12.5h18"/>'),
  person: svg('<circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.5 3.6-5.4 7-5.4s6.2 1.9 7 5.4"/>'),
  chair: svg('<path d="M6 12V6.5A2.5 2.5 0 0 1 8.5 4h7A2.5 2.5 0 0 1 18 6.5V12"/><path d="M4.5 12a1.8 1.8 0 0 1 1.8 1.8V16h11.4v-2.2A1.8 1.8 0 0 1 21 12"/><path d="M5.5 16v4M18.5 16v4"/>'),
  clip: svg('<rect x="5.5" y="4.5" width="13" height="16" rx="1.6"/><path d="M9 4.5V3h6v1.5"/><path d="M9 10h6M9 13.5h6M9 17h3.5"/>'),
  shield: svg('<path d="M12 2.5 4.5 5.5v6c0 4.6 3.2 8.3 7.5 9.5 4.3-1.2 7.5-4.9 7.5-9.5v-6z"/><path d="m8.8 12 2.2 2.2 4.2-4.4"/>'),

const sleep = ms => new Promise(r=>setTimeout(r,ms));
const digits = s => String(s||'').replace(/\D/g,'');
const money  = n => '$' + Number(n||0).toLocaleString('en-US');
const fmtNum = n => Number(n||0).toLocaleString('en-US');
function fmtPhone(d){
  d = digits(d).slice(0,10);
  if(d.length<4) return d;
  if(d.length<7) return '(' + d.slice(0,3) + ') ' + d.slice(3);
  return '(' + d.slice(0,3) + ') ' + d.slice(3,6) + '-' + d.slice(6);
}
function el(tag, cls, html){
  const e=document.createElement(tag);
  if(cls) e.className=cls;
  if(html!=null) e.innerHTML=html;
  return e;
}
function visibleSteps(){ return STEPS.filter(s=>!s.when || s.when(A)); }

/* ================================================================
   i18n — UI language follows the applicant's choice on screen 1.
   Stored answers stay in ENGLISH so the CRM/email data is uniform.
   ================================================================ */
function LANG(){ return A.language==='Español' ? 'es' : 'en'; }
function tx(v){ return (v && typeof v==='object' && (v.en!=null||v.es!=null)) ? (v[LANG()]!=null?v[LANG()]:v.en) : v; }
function ui(k){ const L=UI[LANG()]; return (k in L) ? L[k] : UI.en[k]; }
function optLabel(key,val){
  const st = STEPS.find(s=>s.key===key);
  const o = st && st.options && st.options.find(o=>o.v===val);
  return o ? tx(o.lb||o.v) : val;
}

/* ================================================================
   WIZARD RENDERER
   ================================================================ */
function renderStep(){
  const steps = visibleSteps();
  if(idx >= steps.length) idx = steps.length-1;
  const s = steps[idx];

  // progress
  if(idx===0){ progWrap.classList.add('hiddenv'); }
  else{
    progWrap.classList.remove('hiddenv');
    const pct = Math.max(3, Math.round(idx/steps.length*90));
    fill.style.width = pct+'%'; pctEl.textContent = pct+'%';
    backBtn.style.visibility='visible';
  }

  const wrap = el('div','step');
  if(s.badge){
    const row = el('div','badges');
    row.appendChild(el('div','badge', IC.clock + '<span>'+ui('badge3')+'</span>'));
    row.appendChild(el('div','badge ok', IC.shield + '<span>'+ui('badgeNC')+'</span>'));
    wrap.appendChild(row);
  }
  wrap.appendChild(el('h1','title', tx(s.titleFn ? s.titleFn(A) : s.title)));
  if(s.question) wrap.appendChild(el('p','question', tx(s.question)));
  if(s.hint) wrap.appendChild(el('p','hint', tx(s.hint)));

  let validate = ()=>true;

  /* ---------- single / multi choice ---------- */
  if(s.type==='single' || s.type==='multi'){
    const list = el('div');
    const msg = el('p','msg', ui('selectOne'));
    const note = el('div','notecard', IC.shield + '<span></span>');
    function refreshNote(){
      const t = s.notes && s.notes[A[s.key]];
      if(t){ note.querySelector('span').textContent = tx(t); note.classList.add('show'); }
      else note.classList.remove('show');
    }
    s.options.forEach(o=>{
      const card = el('div','opt');
      card.tabIndex = 0;
      card.setAttribute('role', s.type==='single'?'radio':'checkbox');
      card.innerHTML = (o.icon?'<span class="ic">'+o.icon+'</span>':'') +
                       '<span class="lb">'+tx(o.lb||o.v)+'</span><span class="circ"></span>';
      const selNow = s.type==='single'
        ? A[s.key]===o.v
        : Array.isArray(A[s.key]) && A[s.key].indexOf(o.v)>-1;
      if(selNow) card.classList.add('sel');
      function toggle(){
        if(s.type==='single'){
          A[s.key]=o.v;
          list.querySelectorAll('.opt').forEach(c=>c.classList.remove('sel'));
          card.classList.add('sel');
        }else{
          A[s.key]=Array.isArray(A[s.key])?A[s.key]:[];
          const i=A[s.key].indexOf(o.v);
          i>-1 ? A[s.key].splice(i,1) : A[s.key].push(o.v);
          card.classList.toggle('sel');
        }
        msg.classList.remove('show');
        card.setAttribute('aria-checked', card.classList.contains('sel'));
        refreshNote();
        if(s.key==='language') applyChrome();
      }
      card.addEventListener('click',toggle);
      card.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();e.stopPropagation();toggle();} });
      list.appendChild(card);
    });
    wrap.appendChild(list); wrap.appendChild(note); wrap.appendChild(msg);
    refreshNote();
    validate = ()=>{
      if(s.type==='multi') return true;                 // multi-select is optional
      if(!A[s.key]){ msg.classList.add('show'); return false; }
      return true;
    };
  }

  /* ---------- currency ---------- */
  if(s.type==='currency'){
    const f = el('div','field');
    f.innerHTML = '<label>'+tx(s.label)+'</label><div class="inrow">'+(s.noDollar?'':'<span class="pre">$</span>')+
                  '<input inputmode="'+(s.decimal?'decimal':'numeric')+'" autocomplete="off" placeholder="'+tx(s.ph)+'"></div>';
    const inp = f.querySelector('input');
    const msg = el('p','msg', tx(s.err));
    const help = el('p','helper','');
    if(A[s.key]!=null && A[s.key]!=='') inp.value = s.decimal ? A[s.key] : fmtNum(A[s.key]);
    function refreshHelp(){ if(s.helper) help.textContent = s.helper(A)||''; }
    inp.addEventListener('input',()=>{
      if(s.decimal){
        let v = inp.value.replace(/[^0-9.]/g,'');
        const dot = v.indexOf('.');
        if(dot>-1) v = v.slice(0,dot+1) + v.slice(dot+1).replace(/\./g,'').slice(0,2);
        v = v.slice(0,7);
        A[s.key] = v; inp.value = v;
      }else{
        const d = digits(inp.value).slice(0,9);
        A[s.key] = d===''?'':d;
        inp.value = d===''?'':fmtNum(d);
      }
      f.classList.remove('err'); msg.classList.remove('show');
      refreshHelp();
    });
    refreshHelp();
    wrap.appendChild(f); wrap.appendChild(msg); wrap.appendChild(help);
    validate = ()=>{
      let bad=false, text=tx(s.err);
      if(s.validate){
        const r=s.validate(A);
        if(r!==true){ bad=true; text=tx(r); }
      }else{
        const v = A[s.key];
        const ok = s.allowZero ? (v!=='' && v!=null && +v>=0) : (+v>0);
        if(!ok) bad=true;
      }
      if(bad){ msg.textContent=text; msg.classList.add('show'); f.classList.add('err'); inp.focus(); return false; }
      return true;
    };
  }

  /* ---------- name group ---------- */
  if(s.type==='group'){
    const parts = s.fields.map(fd=>{
      const f = el('div','field');
      f.innerHTML = '<label>'+tx(fd.label)+'</label><input autocomplete="off" placeholder="'+tx(fd.ph)+'">';
      const inp=f.querySelector('input');
      inp.value = A[fd.key]||'';
      const msg = el('p','msg', tx(fd.err));
      inp.addEventListener('input',()=>{
        A[fd.key]=inp.value;
        f.classList.remove('err'); msg.classList.remove('show');
      });
      wrap.appendChild(f); wrap.appendChild(msg);
      return {f,msg,inp,fd};
    });
    validate = ()=>{
      for(const p of parts){
        if(p.fd.optional) continue;
        if(!String(A[p.fd.key]||'').trim()){
          p.msg.classList.add('show'); p.f.classList.add('err'); p.inp.focus(); return false;
        }
      }
      return true;
    };
  }

  /* ---------- date of birth: 3 dropdowns, no format confusion ---------- */
  if(s.type==='dob'){
    const months = ui('months');
    function sel(opts, cur, phTxt){
      const f = el('div','field');
      f.innerHTML = '<select><option value="" disabled '+(cur?'':'selected')+'>'+phTxt+'</option>'+
        opts.map(o=>'<option value="'+o.v+'"'+(String(cur)===String(o.v)?' selected':'')+'>'+o.lb+'</option>').join('')+
        '</select><span class="chev">'+IC.chev+'</span>';
      return f;
    }
    const now = new Date().getFullYear();
    const mF = sel(months.map((m,i)=>({v:i+1,lb:m})), A[s.key+'M'], ui('dobMonth'));
    const dF = sel(Array.from({length:31},(_,i)=>({v:i+1,lb:i+1})), A[s.key+'D'], ui('dobDay'));
    const yF = sel(Array.from({length:now-17-1929},(_,i)=>({v:now-18-i,lb:now-18-i})), A[s.key+'Y'], ui('dobYear'));
    const row = el('div','dobrow');
    [mF,dF,yF].forEach(f=>row.appendChild(f));
    const msg = el('p','msg', ui('dobErr'));
    [mF,dF,yF].forEach((f,ix)=>{
      f.querySelector('select').addEventListener('change',e=>{
        A[s.key+(['M','D','Y'][ix])] = e.target.value;
        f.classList.remove('err'); msg.classList.remove('show');
      });
    });
    wrap.appendChild(row); wrap.appendChild(msg);
    validate = ()=>{
      const m=+A[s.key+'M'], d=+A[s.key+'D'], y=+A[s.key+'Y'];
      let ok = m>=1&&m<=12&&d>=1&&d<=31&&y>1900;
      if(ok){
        const dt = new Date(y, m-1, d);
        ok = dt.getMonth()===m-1 && dt.getDate()===d;
      }
      if(!ok){
        [mF,dF,yF].forEach((f,ix)=>{ if(!A[s.key+(['M','D','Y'][ix])]) f.classList.add('err'); });
        msg.classList.add('show'); return false;
      }
      A[s.key] = UI.en.months[m-1].slice(0,3)+' '+d+', '+y;
      return true;
    };
  }

  /* ---------- year select (job start year) ---------- */
  if(s.type==='yearsel'){
    const now = new Date().getFullYear();
    const f = el('div','field');
    f.innerHTML = '<select><option value="" disabled '+(A[s.key]?'':'selected')+'>'+ui('yearPH')+'</option>'+
      Array.from({length:now-1984},(_,i)=>{ const y=now-i; return '<option'+(String(A[s.key])===String(y)?' selected':'')+'>'+y+'</option>'; }).join('')+
      '<option'+(A[s.key]==='Before 1985'?' selected':'')+' value="Before 1985">'+ui('before1985')+'</option>'+
      '</select><span class="chev">'+IC.chev+'</span>';
    const msg = el('p','msg', ui('yearErr'));
    f.querySelector('select').addEventListener('change',e=>{ A[s.key]=e.target.value; f.classList.remove('err'); msg.classList.remove('show'); });
    wrap.appendChild(f); wrap.appendChild(msg);
    validate = ()=>{
      if(!A[s.key]){ f.classList.add('err'); msg.classList.add('show'); return false; }
      return true;
    };
  }

  /* ---------- simple tel (no consent block) ---------- */
  if(s.type==='tel'){
    const f = el('div','field');
    f.innerHTML = '<label>'+tx(s.label)+'</label><input inputmode="tel" autocomplete="off" placeholder="'+tx(s.ph)+'">';
    const inp=f.querySelector('input');
    inp.value = fmtPhone(A[s.key]||'');
    const msg = el('p','msg', tx(s.err));
    inp.addEventListener('input',()=>{
      inp.value = fmtPhone(inp.value);
      A[s.key] = digits(inp.value);
      f.classList.remove('err'); msg.classList.remove('show');
    });
    wrap.appendChild(f); wrap.appendChild(msg);
    validate = ()=>{
      if(digits(A[s.key]||'').length!==10){ msg.classList.add('show'); f.classList.add('err'); inp.focus(); return false; }
      return true;
    };
  }

  /* ---------- SSN / ITIN: encrypted, skippable ---------- */
  if(s.type==='taxid'){
    const f = el('div','field');
    f.innerHTML = '<label>'+ui('taxLabel')+'</label><input inputmode="numeric" autocomplete="off" placeholder="000-00-0000">';
    const inp=f.querySelector('input');
    function fmtTax(d){ d=digits(d).slice(0,9);
      if(d.length<4) return d;
      if(d.length<6) return d.slice(0,3)+'-'+d.slice(3);
      return d.slice(0,3)+'-'+d.slice(3,5)+'-'+d.slice(5); }
    inp.value = fmtTax(A[s.key]||'');
    const msg = el('p','msg', ui('taxErr'));
    inp.addEventListener('input',()=>{
      inp.value = fmtTax(inp.value);
      A[s.key] = digits(inp.value);
      A[s.key+'Skipped'] = false;
      f.classList.remove('err'); msg.classList.remove('show');
    });
    const lock = el('p','helper', '\uD83D\uDD12 '+ui('taxLock'));
    wrap.appendChild(f); wrap.appendChild(msg); wrap.appendChild(lock);

    const skip = el('button','skipbtn', ui('taxSkip'));
    skip.type='button';
    skip.addEventListener('click',()=>{
      A[s.key]=''; A[s.key+'Skipped']=true;
      const steps2 = visibleSteps();
      if(idx >= steps2.length-1){ finishAll(); }
      else{ idx++; renderStep(); window.scrollTo({top:0,behavior:'smooth'}); }
    });
    wrap.appendChild(skip);

    validate = ()=>{
      if(digits(A[s.key]||'').length!==9){ msg.classList.add('show'); f.classList.add('err'); inp.focus(); return false; }
      return true;
    };
  }

  /* ---------- phone (with consent) ---------- */
  if(s.type==='phone'){
    const f = el('div','field');
    f.innerHTML = '<label>'+tx(s.label)+'</label><input inputmode="tel" autocomplete="tel" placeholder="'+tx(s.ph)+'">';
    const inp=f.querySelector('input');
    inp.value = fmtPhone(A.phone||'');
    const msg = el('p','msg', tx(s.err));
    inp.addEventListener('input',()=>{
      inp.value = fmtPhone(inp.value);
      A.phone = digits(inp.value);
      f.classList.remove('err'); msg.classList.remove('show');
    });
    wrap.appendChild(f); wrap.appendChild(msg);

    const fine = el('div','fineprint');
    fine.innerHTML = '<p>'+ui('fine1')+'</p><p>'+ui('fine2')(CONFIG.companyName)+'</p>';
    const consent = el('label','consent',
      '<input type="checkbox" id="smsOK"'+(A.smsConsent?' checked':'')+'>'+
      '<span>'+ui('smsOK')+'</span>');
    fine.appendChild(consent);
    wrap.appendChild(fine);
    consent.querySelector('input').addEventListener('change',e=>{ A.smsConsent = e.target.checked; });

    validate = ()=>{
      if(digits(A.phone||'').length!==10){ msg.classList.add('show'); f.classList.add('err'); inp.focus(); return false; }
      return true;
    };
  }

  /* ---------- email ---------- */
  if(s.type==='email'){
    const f = el('div','field');
    f.innerHTML = '<label>'+tx(s.label)+'</label><input type="email" autocomplete="email" placeholder="'+tx(s.ph)+'">';
    const inp=f.querySelector('input');
    inp.value = A.email||'';
    const msg = el('p','msg', tx(s.err));
    inp.addEventListener('input',()=>{ A.email=inp.value.trim(); f.classList.remove('err'); msg.classList.remove('show'); });
    wrap.appendChild(f); wrap.appendChild(msg);
    validate = ()=>{
      const ok = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(A.email||'');
      if(!ok){ msg.classList.add('show'); f.classList.add('err'); inp.focus(); return false; }
      return true;
    };
  }

  /* ---------- address ---------- */
  if(s.type==='address'){
    function mkField(key,label,ph,autoc){
      const f = el('div','field');
      f.innerHTML = '<label>'+tx(label)+'</label><input autocomplete="'+(autoc||'off')+'" placeholder="'+tx(ph)+'">';
      const inp=f.querySelector('input');
      inp.value = A[key]||'';
      inp.addEventListener('input',()=>{ A[key]=inp.value; f.classList.remove('err'); });
      return {f,inp};
    }
    const street = mkField('street',{en:'Address',es:'Direcci\u00f3n'},{en:'Street Address',es:'Calle y n\u00famero'},'address-line1');
    const streetMsg = el('p','msg', ui('errStreet'));
    street.inp.addEventListener('input',()=>streetMsg.classList.remove('show'));
    const apt = mkField('apt',{en:'Apt. suite unit (optional)',es:'Apto., unidad (opcional)'},{en:'Apt. suite, unit',es:'Apto., unidad'},'address-line2');
    const city = mkField('city',{en:'City',es:'Ciudad'},{en:'City',es:'Ciudad'},'address-level2');
    const cityMsg = el('p','msg', ui('errCity'));
    city.inp.addEventListener('input',()=>cityMsg.classList.remove('show'));

    const stField = el('div','field');
    stField.innerHTML = '<label>'+ui('statePH')+'</label><select><option value="" disabled '+(A.state?'':'selected')+'>'+ui('statePH')+'</option>'+
      US_STATES.map(st=>'<option'+(A.state===st?' selected':'')+'>'+st+'</option>').join('')+
      '</select><span class="chev">'+IC.chev+'</span>';
    const stSel = stField.querySelector('select');
    const stMsg = el('p','msg', ui('errState'));
    stSel.addEventListener('change',()=>{ A.state=stSel.value; stField.classList.remove('err'); stMsg.classList.remove('show'); });

    const zip = mkField('zip',{en:'Zip code',es:'C\u00f3digo postal'},{en:'Zip code',es:'C\u00f3digo postal'},'postal-code');
    zip.inp.inputMode='numeric';
    const zipMsg = el('p','msg', ui('errZip'));
    zip.inp.addEventListener('input',()=>{
      zip.inp.value = digits(zip.inp.value).slice(0,5);
      A.zip = zip.inp.value; zipMsg.classList.remove('show');
    });

    [street.f,streetMsg,apt.f,city.f,cityMsg,stField,stMsg,zip.f,zipMsg].forEach(n=>wrap.appendChild(n));

    validate = ()=>{
      let ok=true;
      if(String(A.street||'').trim().length<4){ street.f.classList.add('err'); streetMsg.classList.add('show'); ok=false; }
      if(!String(A.city||'').trim()){ city.f.classList.add('err'); cityMsg.classList.add('show'); ok=false; }
      if(!A.state){ stField.classList.add('err'); stMsg.classList.add('show'); ok=false; }
      if(digits(A.zip||'').length!==5){ zip.f.classList.add('err'); zipMsg.classList.add('show'); ok=false; }
      return ok;
    };
  }

  /* ---------- next ---------- */
  const btn = el('button','next', s.button==='confirm' ? ui('confirm') : ui('next'));
  btn.id='nextBtn';
  btn.addEventListener('click',()=>{
    if(!validate()) return;
    try{ if(s.onNext) s.onNext(A); }catch(e){}
    const steps2 = visibleSteps();
    if(idx >= steps2.length-1){ finishAll(); }
    else{ idx++; renderStep(); window.scrollTo({top:0,behavior:'smooth'}); }
  });
  wrap.appendChild(btn);

  stage.classList.remove('chat-mode');
  stage.replaceChildren(wrap);
  const firstInput = wrap.querySelector('input,select');
  if(firstInput && window.innerWidth>640) firstInput.focus();
}

backBtn.addEventListener('click',()=>{
  if(stage.classList.contains('chat-mode')){   // leaving the chat hand-off → back to last wizard screen
    idx = visibleSteps().length-1;
    renderStep();
    return;
  }
  if(idx>0){ idx--; renderStep(); }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  const nb = document.getElementById('nextBtn');
  if(nb && !nb.disabled && document.activeElement.tagName!=='BUTTON') { e.preventDefault(); nb.click(); }
});

/* ================================================================
   CHAT PHASE  (mimics the guided assistant hand-off)
   ================================================================ */
let scrollBox=null, barInput=null, barSend=null;

function startChat(){
  progWrap.classList.remove('hiddenv');
  fill.style.width='93%'; pctEl.textContent='93%';
  backBtn.style.visibility='visible';

  stage.classList.add('chat-mode');
  const card = el('div','chatcard');
  scrollBox = el('div','chatscroll');
  const greet = el('div','greet',
    HOUSE_ART +
    '<h2>'+timeGreeting()+', '+esc(A.first)+'</h2>'+
    '<p>'+ui('chatPrivacy')(CONFIG.privacyUrl)+'</p>');
  scrollBox.appendChild(greet);

  const bar = el('div','chatbar');
  barInput = document.createElement('input');
  barInput.placeholder=ui('writeMsg');
  barInput.disabled=true;
  barSend = el('button','send', IC.sendUp);
  barSend.disabled=true;
  bar.appendChild(barInput); bar.appendChild(barSend);

  card.appendChild(scrollBox); card.appendChild(bar);
  stage.replaceChildren(card);

  chatFlow().catch(console.error);
}

function esc(s){ return String(s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toBottom(){ scrollBox.scrollTop = scrollBox.scrollHeight; }
function addBot(text){ scrollBox.appendChild(el('div','bub bot',esc(text))); toBottom(); }
function addUser(text){ scrollBox.appendChild(el('div','bub user',esc(text))); toBottom(); }
async function typing(ms){
  const t = el('div','typing','<i></i><i></i><i></i>');
  scrollBox.appendChild(t); toBottom();
  await sleep(ms); t.remove();
}
function addTask(n, doneCount){
  const items=[ui('tBasic'),ui('tProp'),ui('tInc')];
  const rows = items.map((it,i)=>{
    const done = i<doneCount;
    return '<div class="trow '+(done?'done':'dim')+'">'+(done?IC.check:IC.spinC)+'<span>'+it+'</span></div>';
  }).join('');
  scrollBox.appendChild(el('div','task','<h4>'+ui('preapproval')+' <span>'+ui('taskOf')(n)+'</span></h4>'+rows));
  toBottom();
}
function askChips(opts){
  // opts: array of strings or {v, lb} — lb is shown, v is stored (canonical English)
  return new Promise(res=>{
    const box = el('div','chips');
    opts.forEach(o=>{
      const val = (typeof o==='object') ? o.v : o;
      const lab = (typeof o==='object') ? (o.lb!=null?o.lb:o.v) : o;
      const c = el('button','chip', esc(lab));
      c.addEventListener('click',()=>{ box.remove(); addUser(lab); res(val); });
      box.appendChild(c);
    });
    scrollBox.appendChild(box); toBottom();
  });
}
const YN = ()=>[{v:'Yes',lb:ui('chipYes')},{v:'No',lb:ui('chipNo')}];
function askInput(placeholder, validator){
  return new Promise(res=>{
    barInput.disabled=false; barSend.disabled=false;
    barInput.placeholder=placeholder; barInput.value='';
    barInput.focus();
    function done(){
      const v = barInput.value.trim();
      if(!v) return;
      if(validator && !validator(v)) { barInput.select(); return; }
      barInput.value=''; barInput.placeholder=ui('writeMsg');
      barInput.disabled=true; barSend.disabled=true;
      barInput.removeEventListener('keydown',onKey);
      barSend.removeEventListener('click',done);
      addUser(v); res(v);
    }
    function onKey(e){ if(e.key==='Enter'){ e.preventDefault(); done(); } }
    barInput.addEventListener('keydown',onKey);
    barSend.addEventListener('click',done);
  });
}

async function chatFlow(){
  const fullName = (A.first+' '+A.last).trim();
  const mail = A.street + (A.apt?', '+A.apt:'') + ', ' + A.city + ', ' + A.state + ' ' + A.zip;

  await typing(900);
  addBot(ui('intro'));
  const proceed = await askChips([
    {v:'Do it myself', lb:ui('chipSelf')},
    {v:"I'm all set",  lb:ui('chipAllSet')}
  ]);

  if(proceed==="I'm all set"){
    CHAT.completedChat='No — submitted early';
    await typing(700);
    addBot(ui('allSetSend')(CONFIG.companyName));
    await submitAll();
    return;
  }
  CHAT.completedChat='Yes';

  addTask(1,0);
  await typing(800);
  addBot(ui('qLegal')(fullName));
  const nameOk = await askChips([{v:'Yes',lb:ui('chipYes')},{v:'No',lb:ui('chipNoType')}]);
  if(nameOk==='Yes'){ CHAT.legalName=fullName; }
  else{
    await typing(500);
    addBot(ui('qLegal2'));
    CHAT.legalName = await askInput(ui('phLegal'));
  }

  await typing(700);
  addBot(ui('qMail')(mail));
  CHAT.mailingSame = await askChips(YN());
  if(CHAT.mailingSame==='No'){
    await typing(500);
    addBot(ui('qMail2'));
    CHAT.livingAddress = await askInput(ui('phAddr'));
  }

  await typing(700);
  addBot(ui('qOwn'));
  CHAT.ownRent = await askChips([{v:'Own',lb:ui('chipOwnLb')},{v:'Renting',lb:ui('chipRentLb')}]);

  if(CHAT.ownRent==='Renting'){
    await typing(550);
    addBot(ui('qRent'));
    const r = await askInput(ui('phRent'));
    const rd = digits(r);
    CHAT.rent = rd ? money(rd) : r;
  }

  await typing(650);
  addBot(ui('qMarital'));
  CHAT.marital = await askChips([
    {v:'Single',lb:ui('mSingle')},{v:'Married',lb:ui('mMarried')},
    {v:'Divorced',lb:ui('mDiv')},{v:'Widowed',lb:ui('mWid')}
  ]);

  if(CHAT.marital==='Married'){
    if(A.hasCoBorrower==='Yes' && A.coRelation==='Spouse/Partner'){
      CHAT.spouseOnLoan = 'Yes';
    }else{
      await typing(600);
      addBot(ui('qSpouse'));
      CHAT.spouseOnLoan = await askChips(YN());
    }
  }

  addTask(2,1);
  await typing(750);
  if(isBuy(A)){
    addBot(ui('qArea'));
    CHAT.propertyArea = await askInput(ui('phArea'));
  }else{
    addBot(ui('qSameProp'));
    const same = await askChips(YN());
    if(same==='Yes'){ CHAT.propertyAddress = 'Same as mailing address'; }
    else{
      await typing(500);
      addBot(ui('qPropAddr'));
      CHAT.propertyAddress = await askInput(ui('phAddr'));
    }
  }

  await typing(650);
  addBot(ui('qBest'));
  CHAT.bestTime = await askChips([
    {v:'Morning',lb:ui('bMorning')},{v:'Afternoon',lb:ui('bAfternoon')},
    {v:'Evening',lb:ui('bEvening')},{v:'Anytime',lb:ui('bAny')}
  ]);

  await typing(900);
  addBot(ui('finalSend')(CONFIG.companyName));
  await submitAll();
}

/* ================================================================
   SUBMISSION  (Web3Forms + optional webhook)
   ================================================================ */
function buildPayload(){
  const p = {
    access_key: CONFIG.accessKey,
    subject: CONFIG.subjectPrefix + ' — ' + A.first + ' ' + A.last + ' (' + (A.goal||'') + ')',
    from_name: CONFIG.companyName + ' Application',
    botcheck: '',

    'Loan Goal': A.goal || '',
    'Qualifying With': A.status || '',
    'Preferred Language': A.language || '',
    'First Name': A.first || '',
    'Middle Name': A.middle || '',
    'Last Name': A.last || '',
    'Date of Birth': A.dob || '',
    'Phone': fmtPhone(A.phone||''),
    'Email': A.email || '',
    'Mailing Address': [A.street, A.apt, A.city, A.state, A.zip].filter(Boolean).join(', '),
    'Years at Current Address': A.addrYears || '',
    'Own or Rent': A.ownRent || '',
    'Work Status': A.work || '',
    'Gross Monthly Income': money(A.income),
    'SMS Consent': A.smsConsent ? 'Yes' : 'No',
    'Submitted At': new Date().toLocaleString('en-US'),
    'Source Page': location.href
  };
  if(A.addrYears==='Less than 2 years' && A.prevAddress) p['Previous Address'] = A.prevAddress;
  if(A.ownRent==='Renting') p['Monthly Rent'] = money(A.rentAmt);
  if(A.marital) p['Legally Married'] = A.marital;
  if(A.status==='Work Permit (EAD)' && A.permitValid) p['Work Permit Status'] = A.permitValid;
  // tax id: NEVER the full number here — email + CRM payload get a mask only
  var tShape = A.status==='ITIN (Tax ID number)' ? 'ITIN' : 'SSN';
  p[tShape] = digits(A.taxId||'').length===9 ? ('\u2022\u2022\u2022-\u2022\u2022-'+digits(A.taxId).slice(5)+' (encrypted on file)')
             : (A.taxIdSkipped ? 'Will provide by phone' : 'Not provided');
  // work history
  if(A.work==='Employed'){
    p['Employer'] = A.employer||''; p['Job Title'] = A.jobTitle||'';
    p['Employer City'] = A.employerCity||'';
    if(A.startYear) p['Job Start Year'] = A.startYear;
    if(A.prevEmployer) p['Previous Employer'] = A.prevEmployer;
    if(A.payType){
      p['Pay Type'] = A.payType;
      if(A.payType==='By the hour'){ p['Pay Rate'] = '$'+(A.payRate||'')+'/hr'; p['Hours per Week'] = A.hoursWeek||''; }
      if(A.payType==='Salary'){ p['Salary'] = money(A.salaryAmt) + ' ' + (A.salaryPer||'').toLowerCase(); }
    }
  }
  if(A.work==='Self-employed'){ p['Business Name'] = A.businessName||''; p['Business Type'] = A.businessType||''; }
  if(A.tenure) p['Time at Job/Business'] = A.tenure;
  // co-borrower
  p['Co-borrower'] = A.hasCoBorrower || '';
  if(A.hasCoBorrower==='Yes'){
    p['Co-borrower Name'] = ((A.coFirst||'')+' '+(A.coLast||'')).trim();
    p['Co-borrower DOB'] = A.coDob || '';
    p['Co-borrower Phone'] = fmtPhone(A.coPhone||'');
    p['Co-borrower Relationship'] = A.coRelation || '';
    p['Co-borrower Qualifying With'] = A.coStatus || '';
    p['Co-borrower Work Status'] = A.coWork || '';
    if(A.coWork==='Employed'){
      p['Co-borrower Employer'] = A.coEmployer||'';
      if(A.coStartYear) p['Co-borrower Job Start Year'] = A.coStartYear;
      if(A.coPayType==='By the hour'){ p['Co-borrower Pay Rate'] = '$'+(A.coPayRate||'')+'/hr'; p['Co-borrower Hours per Week'] = A.coHoursWeek||''; }
    }
    var cShape = A.coStatus==='ITIN (Tax ID number)' ? 'Co-borrower ITIN' : 'Co-borrower SSN';
    p[cShape] = digits(A.coTaxId||'').length===9 ? ('\u2022\u2022\u2022-\u2022\u2022-'+digits(A.coTaxId).slice(5)+' (encrypted on file)')
               : (A.coTaxIdSkipped ? 'Will provide by phone' : 'Not provided');
    p['Co-borrower Monthly Income'] = money(A.coIncome);
    p['Combined Monthly Income'] = money(totalIncome());
  }

  return p;
}

let SUBMITTED = false;
async function finishAll(){
  if(SUBMITTED) return;
  SUBMITTED = true;
  progWrap.classList.remove('hiddenv');
  fill.style.width='100%'; pctEl.textContent='100%';
  backBtn.style.visibility='hidden';

  const sending = el('div','step');
  sending.appendChild(el('h1','title', ui('sendingTitle')));
  sending.appendChild(el('p','hint', ui('sendingHint')));
  stage.replaceChildren(sending);

  const payload = buildPayload();
  try{
    var secure = {};
    if(digits(A.taxId||'').length===9) secure.borrower = digits(A.taxId);
    if(digits(A.coTaxId||'').length===9) secure.coborrower = digits(A.coTaxId);
    if(Object.keys(secure).length && window.jagCaptureSecure){
      window.jagCaptureSecure('Mortgage Application', payload, secure);
    }else if(window.jagCapture){
      window.jagCapture('Mortgage Application', payload);
    }
  }catch(e){}
  try{
    await fetch('https://api.web3forms.com/submit', {
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify(payload)
    });
  }catch(e){}

  const done = el('div','step done-card');
  done.innerHTML = '<div class="done-check">'+IC.shield+'</div>'
    + '<h1 class="title" style="text-align:center">'+ui('doneTitle')+'</h1>'
    + '<p class="hint" style="text-align:center">'+ui('doneBody')(A.first||'')+'</p>';
  const call = el('a','next call-btn', ui('doneCall'));
  call.href = 'tel:' + CONFIG.phoneTel;
  done.appendChild(call);
  stage.replaceChildren(done);
  window.scrollTo({top:0,behavior:'smooth'});
}

async function submitAll(){
  await typing(1200);
  const payload = buildPayload();

  // log a copy to the JAG admin CRM (fire-and-forget; never blocks the email)
  try{
    var secure = {};
    if(digits(A.taxId||'').length===9) secure.borrower = digits(A.taxId);
    if(digits(A.coTaxId||'').length===9) secure.coborrower = digits(A.coTaxId);
    if(Object.keys(secure).length && window.jagCaptureSecure){
      window.jagCaptureSecure('Mortgage Application', payload, secure);
    }else if(window.jagCapture){
      window.jagCapture('Mortgage Application', payload);
    }
  }catch(e){}

  // optional side-channel copy (n8n / GHL inbound webhook)
  if(CONFIG.webhookUrl){
    try{ fetch(CONFIG.webhookUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); }catch(e){}
  }

  let ok=false;
  try{
    const res = await fetch('https://api.web3forms.com/submit',{
      method:'POST',
      headers:{'Content-Type':'application/json',Accept:'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    ok = !!data.success;
  }catch(e){ ok=false; }

  if(!ok){
    addBot(ui('fail'));
    const retry = await askChips([{v:'retry',lb:ui('chipRetry')}]);
    if(retry) return submitAll();
    return;
  }

  fill.style.width='100%'; pctEl.textContent='100%';
  addBot(ui('allSet')(A.first));

  const rows = [];
  rows.push([ui('rGoal'), optLabel('goal', A.goal)]);
  if(isBuy(A)){
    rows.push([ui('rPrice'), money(A.price)]);
    rows.push([ui('rDown'), money(A.down)]);
  }else{
    rows.push([ui('rVal'), money(A.homeValue)]);
    rows.push([ui('rBal'), money(A.balance)]);
    if(isEquity(A)) rows.push([ui('rCash'), money(A.cashOut)]);
  }
  if(A.hasCoBorrower==='Yes'){
    rows.push([ui('rCoB'), ((A.coFirst||'')+' '+(A.coLast||'')).trim()]);
    rows.push([ui('rIncC'), money(totalIncome())]);
  }else{
    rows.push([ui('rInc'), money(A.income)]);
  }
  rows.push([ui('rCredit'), optLabel('credit', A.credit)]);
  rows.push([ui('rPhone'), fmtPhone(A.phone)]);
  rows.push([ui('rEmail'), A.email]);

  const box = el('div','success',
    '<div class="ok-ic">'+IC.check+'</div>'+
    '<h3>'+ui('sTitle')+'</h3>'+
    '<p>'+esc(ui('sBody')(CONFIG.companyName))+'</p>'+
    '<div class="recap">'+rows.map(r=>'<div><span>'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>').join('')+'</div>');
  scrollBox.appendChild(box);

  if(isBuy(A)) scrollBox.appendChild(buildCalculator());

  const again = el('button','next restart', ui('restart'));
  again.style.alignSelf='center';
  again.addEventListener('click',()=>location.reload());
  scrollBox.appendChild(again); toBottom();
}

/* ================================================================
   BUYING-POWER CALCULATOR (FHA / Conventional / ITIN)
   ================================================================ */
function totalIncome(){ return (+A.income||0) + (A.hasCoBorrower==='Yes' ? (+A.coIncome||0) : 0); }
function totalDebts(){ return (+A.debts||0) + (A.hasCoBorrower==='Yes' ? (+A.coDebts||0) : 0); }

function programsFor(status){
  if(status==='ITIN (Tax ID number)'){
    return [{id:'itin', name:'ITIN Home Loan', tag:'As low as 3% down',
             minDown:0.03, dti:0.45, mi:0, ufmip:0, rateAdd:CONFIG.CALC.itinRateAdd}];
  }
  return [
    {id:'fha',  name:'FHA',          tag:'3.5% min down',    minDown:0.035, dti:0.55, mi:0.0055, ufmip:0.0175, rateAdd:0},
    {id:'conv', name:'Conventional', tag:'As low as 3% down', minDown:0.03,  dti:0.50, mi:0.006,  ufmip:0,      rateAdd:0}
  ];
}

/* Solve max price P where  (P−D)·(1+ufmip)·pf + (P−D)·mi/12 + P·carry = DTI·income − debts */
function calcProgram(pr, income, debts, down, ratePct){
  const carry = (CONFIG.CALC.taxPct + CONFIG.CALC.insPct)/100/12;   // taxes + insurance per $1 of price, monthly
  const budget = pr.dti*income - debts;
  if(budget<=0 || income<=0) return {price:0, pay:0, limited:false, dpa:false};

  function solve(mi){
    const r = (ratePct + pr.rateAdd)/100/12;
    const pf = r/(1-Math.pow(1+r,-360));                            // P&I per $1 of loan
    const k  = (1+pr.ufmip)*pf + mi/12;
    return (budget + down*k)/(k + carry);
  }
  let mi = pr.mi;
  let priceInc = solve(mi);
  if(pr.id==='conv' && down>0 && down/priceInc>=0.20){ mi=0; priceInc=solve(0); }  // 20%+ down → no PMI

  const cashCap = down>0 ? down/pr.minDown : Infinity;
  let price = Math.min(priceInc, cashCap);
  const limited = down>0 && cashCap < priceInc;
  const dpa = down<=0;
  price = Math.max(0, Math.floor(price/1000)*1000);

  // estimated all-in payment at that price
  const r = (ratePct + pr.rateAdd)/100/12;
  const pf = r/(1-Math.pow(1+r,-360));
  const loan = Math.max(0, price-down);
  const pay = Math.round(loan*(1+pr.ufmip)*pf + loan*mi/12 + price*carry);
  return {price, pay, limited, dpa};
}

function buildCalculator(){
  const c = el('div','calc');
  c.innerHTML =
    '<h4>'+ui('cTitle')+'</h4>'+
    '<p class="csub">'+ui('cSub')+'</p>'+
    '<div class="cgrid">'+
      '<div class="field"><label>'+ui('cInc')+'</label><div class="inrow"><span class="pre">$</span><input inputmode="numeric" data-k="income"></div></div>'+
      '<div class="field"><label>'+ui('cDebt')+'</label><div class="inrow"><span class="pre">$</span><input inputmode="numeric" data-k="debts"></div></div>'+
      '<div class="field"><label>'+ui('cDown')+'</label><div class="inrow"><span class="pre">$</span><input inputmode="numeric" data-k="down"></div></div>'+
    '</div>'+
    '<div class="rate-row"><span>'+ui('cRate')+'</span><input type="range" min="5" max="9" step="0.125" value="'+CONFIG.CALC.rateDefault+'"><output>'+CONFIG.CALC.rateDefault.toFixed(2)+'%</output></div>'+
    '<div class="pgrid"></div>'+
    '<p class="cnote">'+ui('cNote')(CONFIG.CALC.taxPct, CONFIG.CALC.insPct)+'</p>';

  const vals = { income:totalIncome(), debts:totalDebts(), down:+A.down||0 };
  if(A.hasCoBorrower==='Yes'){
    const sub = c.querySelector('.csub');
    sub.textContent = sub.textContent + ' ' + ui('cbInc');
  }
  const inputs = c.querySelectorAll('.cgrid input');
  const slider = c.querySelector('input[type=range]');
  const out = c.querySelector('output');
  const grid = c.querySelector('.pgrid');
  const progs = programsFor(A.status);

  function paint(){
    const rate = +slider.value;
    out.textContent = rate.toFixed(2)+'%';
    grid.innerHTML = progs.map(pr=>{
      const r = calcProgram(pr, vals.income, vals.debts, vals.down, rate);
      let sub = r.price>0 ? ui('cPay')(money(r.pay)) : ui('cZero');
      let lim = '';
      if(r.dpa) lim = ui('cDPA');
      else if(r.limited) lim = ui('cLim');
      if(pr.id==='itin') lim = (lim?lim+' ':'')+ui('cITIN')(CONFIG.CALC.itinRateAdd);
      return '<div class="pcard"><div class="pname"><span>'+ui('pName')[pr.id]+'</span><span class="ptag">'+ui('pTag')[pr.id]+'</span></div>'+
             '<div class="pamt">'+(r.price>0?money(r.price):'\u2014')+'</div>'+
             '<div class="ppay">'+sub+'</div>'+(lim?'<div class="plim">'+lim+'</div>':'')+'</div>';
    }).join('');
  }
  inputs.forEach(inp=>{
    inp.value = fmtNum(vals[inp.dataset.k]);
    inp.addEventListener('input',()=>{
      const d = digits(inp.value).slice(0,9);
      vals[inp.dataset.k] = +d||0;
      inp.value = d===''?'':fmtNum(d);
      paint();
    });
  });
  slider.addEventListener('input',paint);
  paint();
  return c;
}
