<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jason Aguirre Group — Make an Offer on Any Home | Houston Real Estate</title>
<meta name="description" content="Make an offer on any home — even before you're prequalified. Get an instant home value. Get qualified with JAG Home Loans: no credit check, ITIN OK. English y español.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17161c; --paper:#ffffff; --card:#f5f5f7; --line:#e8e8ec;
  --accent:#c8102e; --accent-d:#a30d26;
  --ok:#1a5c31; --ok-bg:#e9f5ec;
  --muted:#6a6972; --soft:#8a8992;
  --r:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1060px;margin:0 auto;padding:0 22px}

/* ---------------- header ---------------- */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hin{max-width:1060px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:18px}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none}
.jmark{width:36px;height:36px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:-.02em}
.jmark span{color:var(--accent)}
.lname{font-weight:700;font-size:15.5px;letter-spacing:-.01em;line-height:1.15}
.lname small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.02em}
nav{display:flex;gap:22px;margin-left:auto;align-items:center}
nav a{font-size:14px;font-weight:600;color:#37363e;text-decoration:none}
nav a:hover{color:var(--ink)}
nav a.jag{color:var(--accent-d)}
.langs{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-left:6px}
.langs button{border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:700;padding:7px 12px;cursor:pointer;color:var(--muted)}
.langs button.on{background:var(--ink);color:#fff}
.applybtn{background:var(--ink);color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:11px 22px;border-radius:99px;transition:transform .12s ease, background .12s}
.applybtn:hover{background:#000;transform:translateY(-1px)}
.burger{display:none;margin-left:auto;background:none;border:0;padding:6px;cursor:pointer}
.burger svg{width:26px;height:26px;stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round}
.mnav{display:none}
@media(max-width:860px){
  nav{display:none}
  .burger{display:block}
  .applybtn.hdr{display:none}
  .mnav.open{display:flex;flex-direction:column;gap:4px;padding:10px 22px 18px;border-bottom:1px solid var(--line);background:#fff}
  .mnav a{padding:11px 4px;font-weight:600;text-decoration:none;font-size:15.5px;border-bottom:1px solid var(--card)}
  .mnav .rowend{display:flex;align-items:center;justify-content:space-between;padding-top:12px}
}

/* ---------------- hero ---------------- */
.hero{padding:58px 0 30px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:16px}
.eyebrow i{width:7px;height:7px;border-radius:99px;background:var(--accent);display:inline-block}
h1{font-size:clamp(34px,5.4vw,58px);line-height:1.04;letter-spacing:-.035em;font-weight:800;margin:0 0 16px;max-width:760px}
h1 em{font-style:normal;position:relative;white-space:nowrap}
h1 em::after{content:"";position:absolute;left:0;right:0;bottom:.04em;height:.16em;background:var(--accent);opacity:.22;border-radius:3px}
.sub{font-size:18px;color:#44434b;max-width:560px;margin:0 0 26px}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 30px}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--card);color:#3b3a44;padding:8px 14px;border-radius:99px;font-size:13.5px;font-weight:600}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* the path picker — homepage opens like step 0 of the application */
.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 12px}
@media(max-width:860px){.paths{grid-template-columns:1fr}}
.path{position:relative;display:block;text-decoration:none;background:var(--card);border:2px solid var(--card);border-radius:var(--r);padding:22px 20px 20px;transition:border-color .14s, transform .14s, background .14s;cursor:pointer}
.path:hover{border-color:var(--ink);background:#f0f0f3;transform:translateY(-2px)}
.path .tag{position:absolute;top:16px;right:16px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-d);background:#fdecef;padding:4px 9px;border-radius:99px}
.path .ic{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.path .ic svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.path b{display:block;font-size:18.5px;letter-spacing:-.015em;margin-bottom:5px}
.path p{margin:0;font-size:14px;color:var(--muted);line-height:1.5;padding-right:8px}
.path .go{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:14px;font-weight:700;color:var(--ink)}
.path .go svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .14s}
.path:hover .go svg{transform:translateX(3px)}
.heronote{font-size:12.5px;color:var(--soft);margin:14px 2px 0}

/* ---------------- sections ---------------- */
section{padding:64px 0}
.sechead{max-width:620px;margin-bottom:34px}
h2{font-size:clamp(26px,3.4vw,36px);letter-spacing:-.03em;line-height:1.1;font-weight:800;margin:0 0 12px}
.sechead p{color:var(--muted);font-size:16.5px;margin:0}

/* how it works */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:860px){.steps{grid-template-columns:1fr}}
.stepc{background:var(--card);border-radius:var(--r);padding:24px 22px}
.stepc .n{width:34px;height:34px;border-radius:99px;background:var(--ink);color:#fff;font-weight:800;font-size:14.5px;display:grid;place-items:center;margin-bottom:16px}
.stepc b{display:block;font-size:17px;letter-spacing:-.01em;margin-bottom:6px}
.stepc p{margin:0;font-size:14.5px;color:var(--muted)}

/* JAG Home Loans band */
.jagband{background:var(--ink);color:#fff;border-radius:22px;padding:52px 46px;display:grid;grid-template-columns:1.15fr .85fr;gap:44px;align-items:center}
@media(max-width:860px){.jagband{grid-template-columns:1fr;padding:36px 26px}}
.jagband .kick{display:inline-flex;align-items:center;gap:9px;font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#f1b3bd;margin-bottom:14px}
.jagband h2{color:#fff;margin-bottom:14px}
.jagband .jl{margin:0 0 22px;font-size:16px;color:#c9c8d1;max-width:460px}
.jchecks{list-style:none;margin:0 0 26px;padding:0;display:grid;gap:11px}
.jchecks li{display:flex;gap:11px;align-items:flex-start;font-size:15.5px;font-weight:600}
.jchecks svg{width:20px;height:20px;flex:0 0 20px;stroke:#5fd68a;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.jcta{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.wpill{background:#fff;color:var(--ink);text-decoration:none;font-weight:800;font-size:15.5px;padding:15px 30px;border-radius:99px;transition:transform .12s}
.wpill:hover{transform:translateY(-1px)}
.jmin{font-size:13px;color:#a9a8b3;font-weight:600}
.notecard{background:var(--ok-bg);color:var(--ok);border-radius:16px;padding:20px 22px;font-size:15.5px;line-height:1.55;font-weight:600;display:flex;gap:12px;align-items:flex-start}
.notecard svg{width:22px;height:22px;flex:0 0 22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.jagstats{display:grid;gap:12px}
.jstat{background:#22212a;border-radius:16px;padding:18px 20px}
.jstat b{display:block;font-size:26px;letter-spacing:-.02em}
.jstat span{font-size:13px;color:#a9a8b3;font-weight:600}

/* sell band */
.sellband{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}
@media(max-width:860px){.sellband{grid-template-columns:1fr;gap:24px}}
.sellcard{background:var(--card);border-radius:22px;padding:34px 30px}
.sellcard .row{display:flex;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:600}
.sellcard .row:last-child{border-bottom:0}
.sellcard .row span{color:var(--muted);font-weight:500}
.inkpill{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:14px 28px;border-radius:99px;margin-top:8px;transition:transform .12s}
.inkpill:hover{transform:translateY(-1px)}

/* about */
.about{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;background:var(--card);border-radius:22px;padding:36px 34px}
@media(max-width:700px){.about{grid-template-columns:1fr;text-align:left}}
.jaava{width:86px;height:86px;border-radius:24px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:26px}
.jaava span{color:var(--accent)}
.about h3{margin:0 0 6px;font-size:21px;letter-spacing:-.02em}
.about .role{font-size:13.5px;font-weight:700;color:var(--accent-d);margin-bottom:10px}
.about p{margin:0;color:#44434b;font-size:15.5px;max-width:640px}

/* faq */
.faq{max-width:760px}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 2px;font-weight:700;font-size:16.5px;letter-spacing:-.01em}
summary::-webkit-details-marker{display:none}
summary svg{width:20px;height:20px;flex:0 0 20px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
details[open] summary svg{transform:rotate(45deg)}
details p{margin:0;padding:0 34px 20px 2px;color:var(--muted);font-size:15px}

/* final cta */
.final{text-align:center;padding:70px 0 84px}
.final h2{margin-bottom:10px}
.final p{color:var(--muted);margin:0 0 26px}
.finalbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.ghost{display:inline-block;border:2px solid var(--ink);color:var(--ink);text-decoration:none;font-weight:700;font-size:15px;padding:13px 26px;border-radius:99px}
.ghost:hover{background:var(--ink);color:#fff}

/* footer */
footer{border-top:1px solid var(--line);padding:34px 0 44px;font-size:13px;color:var(--soft)}
.fgrid{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:flex-start}
.fgrid a{color:#4a4952;text-decoration:none;font-weight:600}
.fgrid a:hover{color:var(--ink)}
.flinks{display:flex;gap:18px;flex-wrap:wrap}
.legal{margin-top:18px;line-height:1.7;max-width:840px}

/* motion */
.rev{opacity:0;transform:translateY(14px);transition:opacity .5s ease, transform .5s ease}
.rev.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  .rev{opacity:1;transform:none;transition:none}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<header>
  <div class="hin">
    <a class="logo" href="index.html" aria-label="Jason Aguirre Group home">
      <span class="jmark">JA<span>G</span></span>
      <span class="lname">Jason Aguirre Group<small>eXp Realty &middot; Houston, TX</small></span>
    </a>
    <nav>
      <a href="#how" data-t="nav_how"></a>
      <a href="offer-listing-intake.html" data-t="nav_buy"></a>
      <a href="value.html" data-t="nav_sell"></a>
      <a class="jag" href="#jag">JAG Home Loans</a>
      <a href="#faq" data-t="nav_faq"></a>
      <span class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button>
      </span>
      <a class="applybtn hdr" href="apply.html" data-t="nav_apply"></a>
    </nav>
    <button class="burger" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
  <div class="mnav" id="mnav">
    <a href="#how" data-t="nav_how"></a>
    <a href="offer-listing-intake.html" data-t="nav_buy"></a>
    <a href="value.html" data-t="nav_sell"></a>
    <a href="#jag">JAG Home Loans</a>
    <a href="#faq" data-t="nav_faq"></a>
    <div class="rowend">
      <span class="langs"><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button></span>
      <a class="applybtn" href="apply.html" data-t="nav_apply"></a>
    </div>
  </div>
</header>

<main>
  <!-- ================= HERO ================= -->
  <div class="wrap hero">
    <div class="eyebrow"><i></i><span data-t="eyebrow"></span></div>
    <h1><span data-t="h1a"></span> <em data-t="h1b"></em><span data-t="h1c"></span></h1>
    <p class="sub" data-t="sub"></p>

    <div class="badges">
      <span class="badge ok"><svg viewBox="0 0 24 24"><path d="M12 2.5 4.5 5.5v6c0 4.6 3.2 8.3 7.5 9.5 4.3-1.2 7.5-4.9 7.5-9.5v-6z"/><path d="m8.8 12 2.2 2.2 4.2-4.4"/></svg><span data-t="b_credit"></span></span>
      <span class="badge ok"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.2 12.3 2.5 2.5 5.1-5.4"/></svg><span data-t="b_itin"></span></span>
      <span class="badge"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span data-t="b_lang"></span></span>
    </div>

    <div class="paths">
      <a class="path rev" href="offer-listing-intake.html">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M3.5 11.5 12 4.5l8.5 7"/><path d="M5.8 10v9.5h12.4V10"/><path d="M10 19.5v-5h4v5"/></svg></span>
        <b data-t="p1_t"></b>
        <p data-t="p1_s"></p>
        <span class="go"><span data-t="p1_go"></span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
      <a class="path rev" href="value.html">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M6 16.5 10.5 12l3 3L20 8.5"/><path d="M15.5 8.5H20V13"/></svg></span>
        <b data-t="p2_t"></b>
        <p data-t="p2_s"></p>
        <span class="go"><span data-t="p2_go"></span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
      <a class="path rev" href="apply.html">
        <span class="tag">JAG Home Loans</span>
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M7 3.5h7l4 4v13H7z"/><path d="M14 3.5v4h4"/><path d="M10 12.5h5M10 15.5h3"/></svg></span>
        <b data-t="p3_t"></b>
        <p data-t="p3_s"></p>
        <span class="go"><span data-t="p3_go"></span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
    </div>
    <p class="heronote" data-t="heronote"></p>
  </div>

  <!-- ================= HOW IT WORKS ================= -->
  <section id="how">
    <div class="wrap">
      <div class="sechead rev">
        <h2 data-t="how_h"></h2>
        <p data-t="how_s"></p>
      </div>
      <div class="steps">
        <div class="stepc rev"><span class="n">1</span><b data-t="s1_t"></b><p data-t="s1_s"></p></div>
        <div class="stepc rev"><span class="n">2</span><b data-t="s2_t"></b><p data-t="s2_s"></p></div>
        <div class="stepc rev"><span class="n">3</span><b data-t="s3_t"></b><p data-t="s3_s"></p></div>
      </div>
    </div>
  </section>

  <!-- ================= JAG HOME LOANS ================= -->
  <section id="jag" style="padding-top:10px">
    <div class="wrap">
      <div class="jagband rev">
        <div>
          <span class="kick"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 4.5 5.5v6c0 4.6 3.2 8.3 7.5 9.5 4.3-1.2 7.5-4.9 7.5-9.5v-6z"/></svg> JAG HOME LOANS</span>
          <h2 data-t="jag_h"></h2>
          <p class="jl" data-t="jag_s"></p>
          <ul class="jchecks">
            <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.2 12.3 2.5 2.5 5.1-5.4"/></svg><span data-t="jc1"></span></li>
            <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.2 12.3 2.5 2.5 5.1-5.4"/></svg><span data-t="jc2"></span></li>
            <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.2 12.3 2.5 2.5 5.1-5.4"/></svg><span data-t="jc3"></span></li>
            <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.2 12.3 2.5 2.5 5.1-5.4"/></svg><span data-t="jc4"></span></li>
          </ul>
          <div class="jcta">
            <a class="wpill" href="apply.html" data-t="jag_cta"></a>
            <span class="jmin" data-t="jag_min"></span>
          </div>
        </div>
        <div class="jagstats">
          <div class="jstat"><b data-t="js1_b"></b><span data-t="js1_s"></span></div>
          <div class="jstat"><b data-t="js2_b"></b><span data-t="js2_s"></span></div>
          <div class="notecard"><svg viewBox="0 0 24 24"><path d="M12 2.5 4.5 5.5v6c0 4.6 3.2 8.3 7.5 9.5 4.3-1.2 7.5-4.9 7.5-9.5v-6z"/><path d="m8.8 12 2.2 2.2 4.2-4.4"/></svg><span data-t="jag_note"></span></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= SELL ================= -->
  <section id="sell" style="padding-top:14px">
    <div class="wrap sellband">
      <div class="rev">
        <div class="sechead" style="margin-bottom:18px">
          <h2 data-t="sell_h"></h2>
          <p data-t="sell_s"></p>
        </div>
        <a class="inkpill" href="value.html" data-t="sell_cta"></a>
      </div>
      <div class="sellcard rev">
        <div class="row"><span data-t="sr1"></span><b data-t="sr1v"></b></div>
        <div class="row"><span data-t="sr2"></span><b data-t="sr2v"></b></div>
        <div class="row"><span data-t="sr3"></span><b data-t="sr3v"></b></div>
      </div>
    </div>
  </section>

  <!-- ================= ABOUT ================= -->
  <section style="padding-top:14px">
    <div class="wrap">
      <div class="about rev">
        <div class="jaava">JA<span>G</span></div>
        <div>
          <h3>Jason Aguirre</h3>
          <div class="role" data-t="ab_role"></div>
          <p data-t="ab_p"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= FAQ ================= -->
  <section id="faq" style="padding-top:20px">
    <div class="wrap">
      <div class="sechead rev"><h2 data-t="faq_h"></h2></div>
      <div class="faq">
        <details class="rev"><summary><span data-t="q1"></span><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></summary><p data-t="a1"></p></details>
        <details class="rev"><summary><span data-t="q2"></span><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></summary><p data-t="a2"></p></details>
        <details class="rev"><summary><span data-t="q3"></span><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></summary><p data-t="a3"></p></details>
        <details class="rev"><summary><span data-t="q4"></span><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></summary><p data-t="a4"></p></details>
        <details class="rev"><summary><span data-t="q5"></span><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></summary><p data-t="a5"></p></details>
      </div>
    </div>
  </section>

var lang = 'en';
try{
  var saved = localStorage.getItem('jag_lang');
  if(saved==='es' || saved==='en') lang = saved;
  else if((navigator.language||'').toLowerCase().indexOf('es')===0) lang = 'es';
}catch(e){}

function applyLang(){
  var d = T[lang];
  document.documentElement.lang = lang;
  var nodes = document.querySelectorAll('[data-t]');
  for(var i=0;i<nodes.length;i++){
    var k = nodes[i].getAttribute('data-t');
    if(d[k]!=null) nodes[i].textContent = d[k];
  }
  var bs = document.querySelectorAll('.langs button');
  for(var j=0;j<bs.length;j++) bs[j].classList.toggle('on', bs[j].getAttribute('data-lang')===lang);
  // apply page follows the same choice
  var links = document.querySelectorAll('a[href^="apply.html"]');
  for(var m=0;m<links.length;m++) links[m].setAttribute('href','apply.html'+(lang==='es'?'?lang=es':''));
}
document.addEventListener('click',function(e){
  var b = e.target.closest ? e.target.closest('.langs button') : null;
  if(b){ lang = b.getAttribute('data-lang'); try{localStorage.setItem('jag_lang',lang);}catch(err){} applyLang(); }
});
applyLang();

/* mobile menu */
var burger = document.querySelector('.burger'), mnav = document.getElementById('mnav');
burger.addEventListener('click',function(){
  var open = mnav.classList.toggle('open');
  burger.setAttribute('aria-expanded', open);
});
mnav.addEventListener('click',function(e){ if(e.target.tagName==='A') mnav.classList.remove('open'); });

/* scroll reveal */
var revs = document.querySelectorAll('.rev');
if('IntersectionObserver' in window){
  var io = new IntersectionObserver(function(es){
    es.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  },{threshold:.12});
  revs.forEach(function(r){ io.observe(r); });
}else{
  revs.forEach(function(r){ r.classList.add('in'); });
}
