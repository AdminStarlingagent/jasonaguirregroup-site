<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JAG Real Estate — Make an Offer on Any Home</title>
<meta name="description" content="Make an offer on any home — even before you're prequalified. Get an instant home value. Get qualified with JAG Home Loans: no credit check, ITIN OK.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jasonaguirregroup.company/">
<meta property="og:title" content="JAG Real Estate — Make an offer on any home">
<meta property="og:description" content="Even before you're prequalified. Instant home values. Get qualified in 3 minutes — no credit check. English y español.">
<meta property="og:image" content="https://jasonaguirregroup.company/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17161c; --paper:#ffffff; --card:#f5f5f7; --line:#e8e8ec;
  --accent:#c8102e;
  --buy:#c8102e;  --buy-d:#a30d26;  --buy-t:#fdecef;
  --sell:#0f8a4d; --sell-d:#0b6b3b; --sell-t:#e7f5ee;
  --loan:#2653d9; --loan-d:#1c41b3; --loan-t:#eaf0ff;
  --ok:#1a5c31; --ok-bg:#e9f5ec;
  --muted:#6a6972; --soft:#8a8992;
  --r:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1060px;margin:0 auto;padding:0 22px}

/* ---------------- header ---------------- */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hin{max-width:1060px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.lock{display:flex;flex-direction:column;line-height:1}
.lock small{font-size:7.5px;letter-spacing:.32em;font-weight:700;color:var(--muted);text-transform:uppercase}
.lock b{font-size:25px;font-weight:800;letter-spacing:-.045em;margin:1px 0}
.lock i{font-style:normal;font-size:8px;letter-spacing:.4em;font-weight:700;text-transform:uppercase;border-top:2px solid var(--accent);padding-top:3px}
.brok{font-size:11px;color:var(--muted);font-weight:600;border-left:1px solid var(--line);padding-left:12px}
nav{display:flex;gap:20px;margin-left:auto;align-items:center}
nav a{font-size:14px;font-weight:600;color:#37363e;text-decoration:none}
nav a:hover{color:var(--ink)}
nav a.jag{color:var(--loan-d)}
.langs{display:flex;border:2px solid var(--ink);border-radius:99px;overflow:hidden;margin-left:auto}
nav ~ .langs, nav .langs{margin-left:6px}
.langs button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:800;padding:8px 14px;cursor:pointer;color:var(--ink);letter-spacing:.02em}
.langs button.on{background:var(--ink);color:#fff}
.applybtn{background:var(--loan);color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:11px 22px;border-radius:99px;transition:transform .12s ease, background .12s;box-shadow:0 4px 14px rgba(38,83,217,.25)}
.applybtn:hover{background:var(--loan-d);transform:translateY(-1px)}
.burger{display:none;background:none;border:0;padding:6px;cursor:pointer}
.burger svg{width:26px;height:26px;stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round}
.mnav{display:none}
@media(max-width:900px){
  nav{display:none}
  .brok{display:none}
  .burger{display:block}
  .langs{margin-left:auto}
  .mnav.open{display:flex;flex-direction:column;gap:4px;padding:10px 22px 18px;border-bottom:1px solid var(--line);background:#fff}
  .mnav a{padding:12px 4px;font-weight:600;text-decoration:none;font-size:15.5px;border-bottom:1px solid var(--card)}
  .mnav .applybtn{border-bottom:0;text-align:center;margin-top:10px}
}

/* ---------------- hero ---------------- */
.hero{padding:34px 0 30px}
.langhero{display:inline-flex;align-items:center;gap:9px;background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:10px 18px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:26px;transition:background .12s,transform .12s}
.langhero:hover{background:#ec022e0d;transform:translateY(-1px)}
.langhero svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
h1{font-size:clamp(34px,5.4vw,58px);line-height:1.04;letter-spacing:-.035em;font-weight:800;margin:0 0 16px;max-width:760px}
h1 em{font-style:normal;position:relative;white-space:nowrap}
h1 em::after{content:"";position:absolute;left:0;right:0;bottom:.04em;height:.16em;background:var(--accent);opacity:.22;border-radius:3px}
.sub{font-size:18px;color:#3d3c45;max-width:600px;margin:0 0 24px;font-weight:500}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 30px}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--ok-bg);color:var(--ok);padding:8px 14px;border-radius:99px;font-size:13.5px;font-weight:700}
.badge svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* path picker — color-coded actions */
.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 12px}
@media(max-width:900px){.paths{grid-template-columns:1fr}}
.path{position:relative;display:flex;flex-direction:column;text-decoration:none;background:var(--card);border:2px solid var(--card);border-radius:var(--r);padding:22px 20px 20px;transition:border-color .14s, transform .14s;cursor:pointer}
.path:hover{transform:translateY(-3px)}
.path.buy:hover{border-color:var(--buy)} .path.sell:hover{border-color:var(--sell)} .path.loan:hover{border-color:var(--loan)}
.path .tag{position:absolute;top:16px;right:16px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:99px}
.path.loan .tag{color:var(--loan-d);background:var(--loan-t)}
.path .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:14px}
.path.buy .ic{background:var(--buy-t)} .path.sell .ic{background:var(--sell-t)} .path.loan .ic{background:var(--loan-t)}
.path .ic svg{width:24px;height:24px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.path.buy .ic svg{stroke:var(--buy)} .path.sell .ic svg{stroke:var(--sell)} .path.loan .ic svg{stroke:var(--loan)}
.path b{display:block;font-size:18.5px;letter-spacing:-.015em;margin-bottom:5px}
.path p{margin:0 0 16px;font-size:14px;color:var(--muted);line-height:1.5;padding-right:8px}
.pbtn{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:#fff;font-size:14.5px;font-weight:700;padding:13px 18px;border-radius:99px;transition:transform .12s,filter .12s}
.path.buy .pbtn{background:var(--buy);box-shadow:0 4px 14px rgba(200,16,46,.28)}
.path.sell .pbtn{background:var(--sell);box-shadow:0 4px 14px rgba(15,138,77,.28)}
.path.loan .pbtn{background:var(--loan);box-shadow:0 4px 14px rgba(38,83,217,.28)}
.path:hover .pbtn{filter:brightness(.92)}
.pbtn svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .14s}
.path:hover .pbtn svg{transform:translateX(3px)}
.heronote{font-size:12.5px;color:var(--soft);margin:14px 2px 0}

/* ---------------- sections ---------------- */
section{padding:64px 0}
.sechead{max-width:640px;margin-bottom:34px}
h2{font-size:clamp(26px,3.4vw,36px);letter-spacing:-.03em;line-height:1.1;font-weight:800;margin:0 0 12px}
.sechead p{color:var(--muted);font-size:16.5px;margin:0}

/* how it works */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:900px){.steps{grid-template-columns:1fr}}
.stepc{background:var(--card);border-radius:var(--r);padding:24px 22px}
.stepc .n{width:34px;height:34px;border-radius:99px;background:var(--ink);color:#fff;font-weight:800;font-size:14.5px;display:grid;place-items:center;margin-bottom:16px}
.stepc b{display:block;font-size:17px;letter-spacing:-.01em;margin-bottom:6px}
.stepc p{margin:0;font-size:14.5px;color:var(--muted)}

/* JAG Home Loans band */
.jagband{background:var(--ink);color:#fff;border-radius:22px;padding:52px 46px;display:grid;grid-template-columns:1.15fr .85fr;gap:44px;align-items:center}
@media(max-width:900px){.jagband{grid-template-columns:1fr;padding:36px 26px}}
.jagband .kick{display:inline-flex;align-items:center;gap:9px;font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9db4f5;margin-bottom:14px}
.jagband h2{color:#fff;margin-bottom:14px}
.jagband .jl{margin:0 0 22px;font-size:16px;color:#c9c8d1;max-width:470px}
.jchecks{list-style:none;margin:0 0 26px;padding:0;display:grid;gap:11px}
.jchecks li{display:flex;gap:11px;align-items:flex-start;font-size:15.5px;font-weight:600}
.jchecks svg{width:20px;height:20px;flex:0 0 20px;stroke:#5fd68a;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.jcta{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.wpill{background:var(--loan);color:#fff;text-decoration:none;font-weight:800;font-size:15.5px;padding:15px 30px;border-radius:99px;transition:transform .12s,background .12s;box-shadow:0 6px 18px rgba(38,83,217,.4)}
.wpill:hover{background:var(--loan-d);transform:translateY(-1px)}
.jmin{font-size:13px;color:#a9a8b3;font-weight:600}
.notecard{background:var(--ok-bg);color:var(--ok);border-radius:16px;padding:20px 22px;font-size:15.5px;line-height:1.55;font-weight:600;display:flex;gap:12px;align-items:flex-start}
.notecard svg{width:22px;height:22px;flex:0 0 22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.jagstats{display:grid;gap:12px}
.jstat{background:#22212a;border-radius:16px;padding:18px 20px}
.jstat b{display:block;font-size:26px;letter-spacing:-.02em}
.jstat span{font-size:13px;color:#a9a8b3;font-weight:600}

/* sell band */
.sellband{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}
@media(max-width:900px){.sellband{grid-template-columns:1fr;gap:24px}}
.sellcard{background:var(--card);border-radius:22px;padding:34px 30px}
.sellcard .row{display:flex;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:600}
.sellcard .row:last-child{border-bottom:0}
.sellcard .row span{color:var(--muted);font-weight:500}
.sellpill{display:inline-block;background:var(--sell);color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:14px 28px;border-radius:99px;margin-top:8px;transition:transform .12s,background .12s;box-shadow:0 4px 14px rgba(15,138,77,.3)}
.sellpill:hover{background:var(--sell-d);transform:translateY(-1px)}

/* about */
.about{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;background:var(--card);border-radius:22px;padding:36px 34px}
@media(max-width:700px){.about{grid-template-columns:1fr}}
.jaava{width:86px;height:86px;border-radius:24px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:26px;letter-spacing:-.03em}
.about h3{margin:0 0 6px;font-size:21px;letter-spacing:-.02em}
.about .role{font-size:13.5px;font-weight:700;color:var(--buy-d);margin-bottom:10px}
.about p{margin:0;color:#44434b;font-size:15.5px;max-width:640px}

/* faq */
.faq{max-width:760px}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 2px;font-weight:700;font-size:16.5px;letter-spacing:-.01em}
summary::-webkit-details-marker{display:none}
summary svg{width:20px;height:20px;flex:0 0 20px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
details[open] summary svg{transform:rotate(45deg)}
details p{margin:0;padding:0 34px 20px 2px;color:var(--muted);font-size:15px}

/* final cta */
.final{text-align:center;padding:70px 0 84px}
.final h2{margin-bottom:10px}
.final p{color:var(--muted);margin:0 0 26px}
.finalbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.redpill{display:inline-block;background:var(--buy);color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:14px 28px;border-radius:99px;transition:transform .12s,background .12s;box-shadow:0 4px 14px rgba(200,16,46,.28)}
.redpill:hover{background:var(--buy-d);transform:translateY(-1px)}

/* footer */
footer{border-top:1px solid var(--line);padding:34px 0 44px;font-size:13px;color:var(--soft)}
.fgrid{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:flex-start}
.fgrid a{color:#4a4952;text-decoration:none;font-weight:600}
.fgrid a:hover{color:var(--ink)}
.flinks{display:flex;gap:18px;flex-wrap:wrap}
.legal{margin-top:18px;line-height:1.7;max-width:840px}
.flock{margin-bottom:8px}
.flock .lock b{font-size:20px}

/* motion */
.rev{opacity:0;transform:translateY(14px);transition:opacity .5s ease, transform .5s ease}
.rev.in{opacity:1;transform:none}
:focus-visible{outline:3px solid var(--loan);outline-offset:2px;border-radius:6px}
@media(prefers-reduced-motion:reduce){
  .rev{opacity:1;transform:none;transition:none}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<header>
  <div class="hin">
    <a class="logo" href="index.html" aria-label="JAG Real Estate home">
      <span class="lock"><small>Est. 2018</small><b>JAG</b><i>Real Estate</i></span>
      <span class="brok">eXp Realty</span>
    </a>
    <nav>
      <a href="#how" data-t="nav_how"></a>
      <a href="offer-listing-intake.html" data-t="nav_buy"></a>
      <a href="value.html" data-t="nav_sell"></a>
      <a class="jag" href="#jag">JAG Home Loans</a>
      <a href="#faq" data-t="nav_faq"></a>
      <a class="applybtn" href="apply.html" data-t="nav_apply"></a>
    </nav>
    <span class="langs" role="group" aria-label="Language / Idioma">
      <button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button>
    </span>
    <button class="burger" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
  <div class="mnav" id="mnav">
    <a href="#how" data-t="nav_how"></a>
    <a href="offer-listing-intake.html" data-t="nav_buy"></a>
    <a href="value.html" data-t="nav_sell"></a>
    <a href="#jag">JAG Home Loans</a>
    <a href="#faq" data-t="nav_faq"></a>
    <a class="applybtn" href="apply.html" data-t="nav_apply"></a>
  </div>
</header>

<main>
  <!-- ================= HERO ================= -->
  <div class="wrap hero">
    <button type="button" class="langhero" data-switch>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      <span></span>
    </button>
    <h1><span data-t="h1a"></span> <em data-t="h1b"></em><span data-t="h1c"></span></h1>
    <p class="sub" data-t="sub"></p>

    <div class="badges">
      <span class="badge"><svg viewBox="0 0 24 24"><path d="M12 2.5 4.5 5.5v6c0 4.6 3.2 8.3 7.5 9.5 4.3-1.2 7.5-4.9 7.5-9.5v-6z"/><path d="m8.8 12 2.2 2.2 4.2-4.4"/></svg><span data-t="b_credit"></span></span>
      <span class="badge"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.2 12.3 2.5 2.5 5.1-5.4"/></svg><span data-t="b_itin"></span></span>
      <span class="badge"><svg viewBox="0 0 24 24"><circle cx="12" cy="6.5" r="0"/><ellipse cx="12" cy="6.5" rx="6.5" ry="2.6"/><path d="M5.5 6.5v5c0 1.4 2.9 2.6 6.5 2.6s6.5-1.2 6.5-2.6v-5"/><path d="M5.5 11.5v5c0 1.4 2.9 2.6 6.5 2.6s6.5-1.2 6.5-2.6v-5"/></svg><span data-t="b_down"></span></span>
    </div>

    <div class="paths">
      <a class="path buy rev" href="offer-listing-intake.html">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M3.5 11.5 12 4.5l8.5 7"/><path d="M5.8 10v9.5h12.4V10"/><path d="M10 19.5v-5h4v5"/></svg></span>
        <b data-t="p1_t"></b>
        <p data-t="p1_s"></p>
        <span class="pbtn"><span data-t="p1_go"></span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
      <a class="path sell rev" href="value.html">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M6 16.5 10.5 12l3 3L20 8.5"/><path d="M15.5 8.5H20V13"/></svg></span>
        <b data-t="p2_t"></b>
        <p data-t="p2_s"></p>
        <span class="pbtn"><span data-t="p2_go"></span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
      <a class="path loan rev" href="apply.html">
        <span class="tag">JAG Home Loans</span>
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M7 3.5h7l4 4v13H7z"/><path d="M14 3.5v4h4"/><path d="M10 12.5h5M10 15.5h3"/></svg></span>
        <b data-t="p3_t"></b>
        <p data-t="p3_s"></p>
        <span class="pbtn"><span data-t="p3_go"></span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
    </div>
    <p class="heronote" data-t="heronote"></p>
  </div>

  <!-- ================= HOW IT WORKS ================= -->
  <section id="how">
    <div class="wrap">
      <div class="sechead rev">
        <h2 data-t="how_h"></h2>
        <p data-t="how_s"></p>
      </div>
      <div class="steps">
        <div class="stepc rev"><span class="n">1</span><b data-t="s1_t"></b><p data-t="s1_s"></p></div>
        <div class="stepc rev"><span class="n">2</span><b data-t="s2_t"></b><p data-t="s2_s"></p></div>
        <div class="stepc rev"><span class="n">3</span><b data-t="s3_t"></b><p data-t="s3_s"></p></div>
      </div>
    </div>
  </section>

  <!-- ================= JAG HOME LOANS ================= -->
  <section id="jag" style="padding-top:10px">
    <div class="wrap">
      <div class="jagband rev">
        <div>
          <span class="kick"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 4.5 5.5v6c0 4.6 3.2 8.3 7.5 9.5 4.3-1.2 7.5-4.9 7.5-9.5v-6z"/></svg> JAG HOME LOANS</span>
          <h2 data-t="jag_h"></h2>
          <p class="jl" data-t="jag_s"></p>
          <ul class="jchecks">
            <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.2 12.3 2.5 2.5 5.1-5.4"/></svg><span data-t="jc1"></span></li>
            <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.2 12.3 2.5 2.5 5.1-5.4"/></svg><span data-t="jc2"></span></li>
            <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.2 12.3 2.5 2.5 5.1-5.4"/></svg><span data-t="jc3"></span></li>
            <li><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.2 12.3 2.5 2.5 5.1-5.4"/></svg><span data-t="jc4"></span></li>
          </ul>
          <div class="jcta">
            <a class="wpill" href="apply.html" data-t="jag_cta"></a>
            <span class="jmin" data-t="jag_min"></span>
          </div>
        </div>
        <div class="jagstats">

var lang = 'en';

  var saved = localStorage.getItem('jag_lang');
  if(saved==='es' || saved==='en') lang = saved;
  else if((navigator.language||'').toLowerCase().indexOf('es')===0) lang = 'es';
}catch(e){}

function applyLang(){
  var d = T[lang];
  document.documentElement.lang = lang;
  var nodes = document.querySelectorAll('[data-t]');
  for(var i=0;i<nodes.length;i++){
    var k = nodes[i].getAttribute('data-t');
    if(d[k]!=null) nodes[i].textContent = d[k];
  }
  var sw = document.querySelectorAll('[data-switch] span');
  for(var s=0;s<sw.length;s++) sw[s].textContent = d.switch_hint;
  var bs = document.querySelectorAll('.langs button');
  for(var j=0;j<bs.length;j++) bs[j].classList.toggle('on', bs[j].getAttribute('data-lang')===lang);
  var links = document.querySelectorAll('a[href^="apply.html"]');
  for(var m=0;m<links.length;m++) links[m].setAttribute('href','apply.html'+(lang==='es'?'?lang=es':''));
}
function setLang(l){
  lang = l;
  try{ localStorage.setItem('jag_lang', lang); }catch(err){}
  applyLang();
}
document.addEventListener('click',function(e){
  var b = e.target.closest ? e.target.closest('.langs button') : null;
  if(b){ setLang(b.getAttribute('data-lang')); return; }
  var sw = e.target.closest ? e.target.closest('[data-switch]') : null;
  if(sw){ setLang(lang==='es' ? 'en' : 'es'); }
});
applyLang();

/* scroll reveal */
var revs = document.querySelectorAll('.rev');
if('IntersectionObserver' in window){
  var io = new IntersectionObserver(function(es){
    es.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  },{threshold:.12});
  revs.forEach(function(r){ io.observe(r); });
}else{
  revs.forEach(function(r){ r.classList.add('in'); });
