<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avisos por correo — JAG Real Estate</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f5f5f7;color:#17161c;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.box{max-width:460px;margin:60px auto;background:#fff;border-radius:16px;padding:30px 24px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.lg{font-size:28px;font-weight:800;color:#c8102e;letter-spacing:-.02em}
h1{font-size:21px;margin:14px 0 6px}
p{color:#5f5e68;margin:0 0 18px}
button{border:0;border-radius:10px;background:#c8102e;color:#fff;font:inherit;font-weight:800;padding:13px 18px;cursor:pointer;width:100%}
button[disabled]{opacity:.6}
a{color:#2653d9;font-weight:600}
@media(max-width:500px){.box{margin:20px 16px}}
</style>
</head>
<body>
<div class="box">
  <div class="lg">JAG</div>
  <div id="ask">
    <h1>¿Dejar de recibir avisos de casas por correo?</h1>
    <p>Stop getting home alert emails?</p>
    <button type="button" id="go">Sí, dejar de recibir · Yes, unsubscribe</button>
  </div>
  <div id="done" hidden>
    <h1>Listo. Ya no le enviaremos avisos por correo.</h1>
    <p>Done. You will no longer get alert emails.</p>
  </div>
  <p id="err" hidden style="color:#a30d26;font-weight:700;margin-top:14px">Este enlace no es válido o ya venció. · This link is invalid or expired.</p>
  <p style="margin:22px 0 0"><a href="account#settings">Mi cuenta · My account</a></p>
</div>
<script>
(function(){
  var q=location.search, ok=/[?&]u=[0-9a-f-]{36}/.test(q)&&/[?&]s=[0-9a-f]{32}/.test(q);
  var go=document.getElementById('go');
  if(!ok){ go.disabled=true; document.getElementById('err').hidden=false; return; }
  go.onclick=function(){
    go.disabled=true;
    fetch('https://nyaxywghbpphjhwcmspd.supabase.co/functions/v1/listing-alerts'+q,{method:'POST'})
      .then(function(r){ return r.json(); })
      .then(function(j){ if(j&&j.ok){ document.getElementById('ask').hidden=true; document.getElementById('done').hidden=false; } else { document.getElementById('err').hidden=false; go.disabled=false; } })
      .catch(function(){ document.getElementById('err').hidden=false; go.disabled=false; });
  };
})();
</script>
</body>
</html>
